ISSP Domain 7 \\u2014 Security Operations\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"scanning\",\"frequency\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D7-025\",\"domain\":7,\"subdomain\":\"7.4 Change\",\"difficulty\":\"medium\",\"stem\":\"An emergency change is needed to mitigate active exploitation. What is the BEST process?\",\"choices\":[\"Bypass change management entirely\",\"Use the emergency change process\",\"Wait for the next scheduled CAB\",\"Implement silently\"],\"correct\":1,\"explanation\":\"Emergency change processes balance speed with accountability \\u2014 eCAB approval, simplified documentation, retroactive review. Bypassing entirely or implementing silently fails audit. Waiting prolongs exposure.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-7-security-operations/\",\"title\":\"DestCert: Insights into CISSP Domain 7 \\u2014 Security Operations\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"emergency-change\",\"ecab\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D7-026\",\"domain\":7,\"subdomain\":\"7.5 Logs\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST policy for protecting log integrity from a privileged user on the source system?\",\"choices\":[\"Privileged users administer the log destination too\",\"Forward logs to a system the privileged user CANNOT administer\",\"Encrypt logs locally\",\"Stop logging privileged actions\"],\"correct\":1,\"explanation\":\"SoD between source and log destination prevents tampering. Encrypting locally is bypassable by the admin. Skipping privileged-action logging is a serious gap. Choice A explicitly defeats SoD.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-7-security-operations/\",\"title\":\"DestCert: Insights into CISSP Domain 7 \\u2014 Security Operations\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"log-integrity\",\"sod\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D7-027\",\"domain\":7,\"subdomain\":\"7.4 Operational Security\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST mitigation for shoulder-surfing in open-plan offices?\",\"choices\":[\"Trust other employees across the relevant control set\",\"Privacy filters on screens, screen-lock policies, and physical workspace orientation\",\"Disable login altogether in standard practice\",\"Mandatory headphones when properly implemented\"],\"correct\":1,\"explanation\":\"Layered physical/visual privacy controls (privacy filters, screen-lock policies, workspace orientation away from windows/walkways, clean-desk rules) reduce shoulder-surfing exposure. Choice A ('trust') is a non-control. Choice C (disabling login) is impractical and breaks operations. Choice D (headphones) addresses audio leakage, not visual. The exam expects defence-in-depth even for low-tech threats.\",\"source\":\"guide\",\"guide_pages\":[2238,2243],\"guide_section\":\"Chapter 18 \\u2014 Operational Security\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-7-security-operations/\",\"title\":\"DestCert: Insights into CISSP Domain 7 \\u2014 Security Operations\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"shoulder-surfing\"],\"notes\":\"\",\"chapter\":17},{\"id\":\"D7-028\",\"domain\":7,\"subdomain\":\"7.6 BCP\",\"difficulty\":\"easy\",\"stem\":\"Who has the AUTHORITY to declare a disaster and trigger the DR plan?\",\"choices\":[\"The first responder on the scene in most enterprise deployments\",\"An executive or designated incident commander, per the documented BCP\",\"Any IT staff member in standard practice\",\"External media in standard practice\"],\"correct\":1,\"explanation\":\"Disaster declaration follows a defined chain of authority documented in the BCP \\u2014 typically an executive or BC manager. Ad-hoc declaration creates chaos. The exam consistently picks the documented authority.\",\"source\":\"guide\",\"guide_pages\":[2284,2289],\"guide_section\":\"Chapter 18 \\u2014 Disaster Declaration\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-7-security-operations/\",\"title\":\"DestCert: Insights into CISSP Domain 7 \\u2014 Security Operations\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"bcp\",\"declaration\"],\"notes\":\"\",\"chapter\":17},{\"id\":\"D7-029\",\"domain\":7,\"subdomain\":\"7.4 Operational Security\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST description of clipping levels in monitoring?\",\"choices\":[\"A maximum login retry threshold below which actions are tolerated\",\"A way to trim long log files\",\"A method for compressing data\",\"A backup retention policy across the relevant policy framework\"],\"correct\":0,\"explanation\":\"Clipping levels suppress alert noise \\u2014 e.g., ignore single failed logins but alert at 5+. They balance noise vs. signal. The other choices are unrelated. Modern UEBA replaces simple thresholds with adaptive baselines.\",\"source\":\"guide\",\"guide_pages\":[2245,2249],\"guide_section\":\"Chapter 18 \\u2014 Clipping\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-7-security-operations/\",\"title\":\"DestCert: Insights into CISSP Domain 7 \\u2014 Security Operations\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"clipping-level\"],\"notes\":\"\",\"chapter\":17},{\"id\":\"D7-030\",\"domain\":7,\"subdomain\":\"7.4 Investigations\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST description of an administrative investigation?\",\"choices\":[\"Performed by law enforcement only for the purposes of this question\",\"Internal investigation of policy violations or misconduct, governed by HR and legal\",\"Public-disclosure investigation given current best practices\",\"Vendor audit in standard practice\"],\"correct\":1,\"explanation\":\"Administrative investigations look at internal policy violations (acceptable use, harassment) \\u2014 typically led by HR/legal/internal investigators. Civil and criminal investigations have different standards. Vendor audits are separate.\",\"source\":\"guide\",\"guide_pages\":[2210,2215],\"guide_section\":\"Chapter 17 \\u2014 Investigation Types\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-7-security-operations/\",\"title\":\"DestCert: Insights into CISSP Domain 7 \\u2014 Security Operations\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"investigation\",\"administrative\"],\"notes\":\"\",\"chapter\":17},{\"id\":\"D7-031\",\"domain\":7,\"subdomain\":\"7.4 Investigations\",\"difficulty\":\"easy\",\"stem\":\"Which evidence standard typically applies to CIVIL litigation?\",\"choices\":[\"Beyond a reasonable doubt\",\"Preponderance of evidence\",\"Clear and convincing evidence\",\"Probable cause\"],\"correct\":1,\"explanation\":\"Civil litigation uses 'preponderance of evidence' (more likely than not, >50%). Choice A ('beyond a reasonable doubt') is the criminal standard \\u2014 much higher bar. Choice C ('clear and convincing') sits between, used in some administrative or termination cases. Choice D ('probable cause') is the threshold for warrants/arrests, not litigation outcomes. Memorise the ladder: probable cause < preponderance < clear and convincing < beyond reasonable doubt.\",\"source\":\"guide\",\"guide_pages\":[2230,2235],\"guide_section\":\"Chapter 17 \\u2014 Standards of Proof\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-7-security-operations/\",\"title\":\"DestCert: Insights into CISSP Domain 7 \\u2014 Security Operations\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"preponderance\",\"civil\"],\"notes\":\"\",\"chapter\":17},{\"id\":\"D7-032\",\"domain\":7,\"subdomain\":\"7.7 Patch Mgmt\",\"difficulty\":\"medium\",\"stem\":\"What is the PRIMARY risk of installing patches in production WITHOUT testing?\",\"choices\":[\"Compliance penalties for the purposes of this question\",\"Patches may break functionality or introduce regressions, causing outages\",\"Higher costs in standard practice\",\"User confusion for the purposes of this question\"],\"correct\":1,\"explanation\":\"Patches can break functionality, introduce regressions, or interact badly with custom configurations \\u2014 testing in lower environments and staged rollouts catch this before production impact. Choice A (compliance penalties) is downstream \\u2014 outage from a bad patch is the PRIMARY risk. Choice C (cost) is operational, not security. Choice D (user confusion) is minor. Manager-mindset: balance patch speed (security) against testing rigor (stability) per asset risk class.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-7-security-operations/\",\"title\":\"DestCert: Insights into CISSP Domain 7 \\u2014 Security Operations\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"patch-testing\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D7-033\",\"domain\":7,\"subdomain\":\"7.4 OPSEC\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST policy for handling removable media in high-security environments?\",\"choices\":[\"Allow all USB devices for convenience when applied to standard enterprise environments\",\"Block by default; allow specific approved devices via device control with encryption and DLP\",\"Disable USB ports physically only on legacy systems\",\"Trust users to use only personal devices\"],\"correct\":1,\"explanation\":\"Default-deny + device control + encryption + DLP defends against the BadUSB / wholesale exfil pattern. Allowing all USB or trusting users defeats security. Physical-port disabling alone is incomplete.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-7-security-operations/\",\"title\":\"DestCert: Insights into CISSP Domain 7 \\u2014 Security Operations\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"removable-media\",\"device-control\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D7-034\",\"domain\":7,\"subdomain\":\"7.7 Recovery\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST way to validate a backup is RESTORABLE?\",\"choices\":[\"Trust the backup software's success message\",\"Periodically perform a full restore in a test environment and verify integrity\",\"Check the backup tape weight when applied to standard enterprise environments\",\"Look at the backup completion log only\"],\"correct\":1,\"explanation\":\"Restoration tests are the only true validation. Many organisations have discovered backups were unrestorable AT the moment they needed them. Vendor success messages and completion logs are inputs but not proof.\",\"source\":\"guide\",\"guide_pages\":[2265,2270],\"guide_section\":\"Chapter 18 \\u2014 Backup Verification\",\"web_sources\":[{\"url\":\"https://cissprep.net/data-backup/\",\"title\":\"CISSPrep: Data Backup\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"backup-verification\",\"restore\"],\"notes\":\"\",\"chapter\":17},{\"id\":\"D7-035\",\"domain\":7,\"subdomain\":\"7.7 Privileged\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST control for privileged session management?\",\"choices\":[\"Allow privileged users unrestricted access\",\"Brokered sessions via a PAM gateway with recording, MFA, and time bounds\",\"Generic shared admin passwords in most operational contexts\",\"Local admin accounts on every system\"],\"correct\":1,\"explanation\":\"PAM session brokering provides credential vaulting, MFA enforcement, session recording, and time-bounded access \\u2014 the core controls that turn privileged access from a trust assumption into a verifiable, auditable operation. Choice A grants unbounded standing access \\u2014 exactly what PAM exists to prevent. Choices C (shared passwords) and D (local admins on every system) destroy attribution and rotation. PAM is the manager-mindset answer for any privileged-session question.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-7-security-operations/\",\"title\":\"DestCert: Insights into CISSP Domain 7 \\u2014 Security Operations\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"pam\",\"session-recording\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D7-036\",\"domain\":7,\"subdomain\":\"7.6 BCP Roles\",\"difficulty\":\"easy\",\"stem\":\"Who is ULTIMATELY accountable for the BCP program in an organisation?\",\"choices\":[\"IT operations\",\"Senior management / executive leadership\",\"BCP coordinator\",\"External vendor when properly implemented\"],\"correct\":1,\"explanation\":\"Like other governance functions, BCP accountability rests with senior leadership. The BCP coordinator is responsible for execution. IT and vendors are participants. Manager-mindset: accountability rests with the highest authority.\",\"source\":\"guide\",\"guide_pages\":[2278,2282],\"guide_section\":\"Chapter 18 \\u2014 BCP Governance\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-7-security-operations/\",\"title\":\"DestCert: Insights into CISSP Domain 7 \\u2014 Security Operations\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"bcp\",\"accountability\"],\"notes\":\"\",\"chapter\":17},{\"id\":\"D7-037\",\"domain\":7,\"subdomain\":\"7.5 Detection Engineering\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST way to ensure detections remain effective as the threat landscape evolves?\",\"choices\":[\"Set them up once and forget in most enterprise deployments\",\"Continuously tune detections based on threat intel, false-positive feedback, and ATT&CK coverage gaps\",\"Disable detections that produce alerts when properly implemented\",\"Outsource everything when properly implemented\"],\"correct\":1,\"explanation\":\"Detection rules rot \\u2014 environments change, attacker tradecraft evolves, false-positive ratios drift. Continuous tuning informed by threat intel, false-positive feedback, and ATT&CK coverage gap analysis keeps detections effective. Choice A ('set and forget') guarantees decay. Choice C (disabling noisy alerts) silently leaves blind spots. Choice D (outsourcing) doesn't address the core problem of rule maintenance \\u2014 it just moves who does it.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-7-security-operations/\",\"title\":\"DestCert: Insights into CISSP Domain 7 \\u2014 Security Operations\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"detection-engineering\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D7-038\",\"domain\":7,\"subdomain\":\"7.4 Resource Protection\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST control for protecting data in transit BETWEEN data centers across a public internet path?\",\"choices\":[\"MD5 over plain TCP in standard practice\",\"IPsec site-to-site VPN with strong AEAD ciphers\",\"FTP across the relevant control set\",\"Telnet for the purposes of this question\"],\"correct\":1,\"explanation\":\"Site-to-site IPsec with AEAD (e.g., AES-GCM) provides confidentiality, integrity, and authentication. MD5 + TCP, FTP, and Telnet are insecure. Modern alternatives include WireGuard and TLS-based mesh tunnels.\",\"source\":\"guide\",\"guide_pages\":[2330,2335],\"guide_section\":\"Chapter 19 \\u2014 Inter-DC\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-7-security-operations/\",\"title\":\"DestCert: Insights into CISSP Domain 7 \\u2014 Security Operations\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"ipsec\",\"site-to-site\"],\"notes\":\"\",\"chapter\":18},{\"id\":\"D7-039\",\"domain\":7,\"subdomain\":\"7.5 Detection\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST single source of the most-recent attacker tradecraft?\",\"choices\":[\"Vendor whitepapers from 5 years ago in standard practice\",\"Threat intelligence feeds curated for the organisation's sector and ATT&CK mapping\",\"General news media for general production deployments in standard practice\",\"Conference t-shirts when properly implemented\"],\"correct\":1,\"explanation\":\"Tailored, sector-specific threat intelligence mapped to MITRE ATT&CK delivers actionable indicators and TTPs that reflect today's adversaries. Choice A (5-year-old whitepapers) is multiple attacker generations stale. Choice C (general news media) reports incidents long after the IOCs matter. Choice D is a joke distractor. Pattern: when an exam asks for the 'best' source of threat intel, pick the one that's current and industry-relevant.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-7-security-operations/\",\"title\":\"DestCert: Insights into CISSP Domain 7 \\u2014 Security Operations\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"threat-intel\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D7-040\",\"domain\":7,\"subdomain\":\"7.6 DR Strategy\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST description of a 'cloud DR' strategy?\",\"choices\":[\"Storing backups on a personal cloud account given current best practices\",\"Provisioning DR capacity in a cloud provider with automated failover and data replication\",\"Hoping the cloud never fails in commonly cited frameworks\",\"Burning data to DVDs for general production deployments given current best practices\"],\"correct\":1,\"explanation\":\"Cloud DR uses elastic provider capacity (warm or cold replica) with replication, automated failover, and pay-as-you-go economics. The other choices are not strategies. Multi-region cloud architectures are a modern cloud-DR pattern.\",\"source\":\"guide\",\"guide_pages\":[2295,2300],\"guide_section\":\"Chapter 18 \\u2014 Cloud DR\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/recovery-strategies-mindmap-cissp-domain-7/\",\"title\":\"DestCert: Recovery Strategies Mindmap \\u2014 Domain 7\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"cloud-dr\"],\"notes\":\"\",\"chapter\":17},{\"id\":\"D7-041\",\"domain\":7,\"subdomain\":\"7.7 Patch\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST mitigation for a zero-day vulnerability with no available patch?\",\"choices\":[\"Wait for the patch across the relevant control set\",\"Apply compensating controls until vendor patch is available\",\"Disable monitoring in commonly cited frameworks\",\"Disclose publicly first for the purposes of this question\"],\"correct\":1,\"explanation\":\"Compensating controls (network segmentation, WAF rules, IPS signatures, virtual patching) limit exposure while a vendor patch is in development. Choice A ('wait') accumulates risk. Choice C (disabling monitoring) removes visibility right when an active exploit may strike. Choice D (public disclosure first) violates responsible-disclosure norms and may weaponise the vulnerability. Manager-mindset: defence-in-depth means a single missing patch isn't immediately catastrophic.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-7-security-operations/\",\"title\":\"DestCert: Insights into CISSP Domain 7 \\u2014 Security Operations\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"zero-day\",\"compensating\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D7-042\",\"domain\":7,\"subdomain\":\"7.5 SIEM Tuning\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST first step when a SIEM rule generates excessive false positives?\",\"choices\":[\"Disable the rule in most operational contexts in most enterprise deployments\",\"Investigate the trigger context, narrow the rule to specific patterns, and tune thresholds\",\"Increase the alert volume in most enterprise deployments\",\"Ignore all alerts from the rule in commonly cited frameworks\"],\"correct\":1,\"explanation\":\"Excessive false positives are a SIGNAL \\u2014 investigate the trigger context, narrow the rule to the patterns that matter, and tune thresholds. Choice A (disabling) silently leaves a detection gap. Choice C (raising volume) makes it worse. Choice D (ignoring) is alert-fatigue territory \\u2014 eventually a real attack hides in the noise. The discipline is investigate-and-tune, never disable-and-forget.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-7-security-operations/\",\"title\":\"DestCert: Insights into CISSP Domain 7 \\u2014 Security Operations\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"siem-tuning\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D7-043\",\"domain\":7,\"subdomain\":\"7.4 Asset Lifecycle\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST mitigation for the risk of assets being decommissioned WITHOUT proper sanitisation?\",\"choices\":[\"Trust each technician's discretion across the relevant policy framework in standard practice\",\"Tracked decommissioning workflow with sanitisation per NIST 800-88, certificate of destruction, and sign-off\",\"Skip sanitisation for old hardware given current best practices\",\"Use a single shared decommissioning bin given current best practices\"],\"correct\":1,\"explanation\":\"A documented decommissioning workflow with sanitisation per NIST 800-88, certificate of destruction, and dual sign-off is the audit-ready answer. Choice A ('trust technicians') is a non-control. Choice C (skipping sanitisation) is a textbook data-leakage event waiting to happen. Choice D (single shared bin) loses chain of custody. The pattern: any decommissioning question with a 'documented workflow + chain of custody' option will be the answer.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-7-security-operations/\",\"title\":\"DestCert: Insights into CISSP Domain 7 \\u2014 Security Operations\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"decommissioning\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D7-044\",\"domain\":7,\"subdomain\":\"7.6 BCP\",\"difficulty\":\"medium\",\"stem\":\"Which BCP plan element addresses keeping personnel safe and accounted for during a disaster?\",\"choices\":[\"IT recovery plan in standard practice\",\"Crisis management / occupant emergency plan\",\"Vendor management plan\",\"Audit plan given current best practices\"],\"correct\":1,\"explanation\":\"Crisis management/occupant emergency plans cover life safety \\u2014 evacuation, headcount, sheltering. IT recovery is separate. Life safety always comes BEFORE technology recovery (a recurring exam theme).\",\"source\":\"guide\",\"guide_pages\":[2300,2305],\"guide_section\":\"Chapter 18 \\u2014 Crisis Mgmt\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-7-security-operations/\",\"title\":\"DestCert: Insights into CISSP Domain 7 \\u2014 Security Operations\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"crisis-management\",\"life-safety\"],\"notes\":\"\",\"chapter\":18},{\"id\":\"D7-045\",\"domain\":7,\"subdomain\":\"7.4 Operations\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST principle for protecting against the insider-threat scenario of a single admin shutting down logging then exfiltrating data?\",\"choices\":[\"Trust admins fully across the relevant control set\",\"Separation of duties and dual-control for sensitive operations\",\"Allow admins to disable logging in most enterprise deployments\",\"Audit only annually when properly implemented\"],\"correct\":1,\"explanation\":\"Dual-control / SoD prevents single-point compromise. The other choices either explicitly enable or normalise the risk. Manager-mindset: design controls so single rogue actors cannot complete the kill chain alone.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-7-security-operations/\",\"title\":\"DestCert: Insights into CISSP Domain 7 \\u2014 Security Operations\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"sod\",\"dual-control\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D7-046\",\"domain\":7,\"subdomain\":\"7.5 Honeypots\",\"difficulty\":\"medium\",\"stem\":\"Which is the PRIMARY purpose of a honeypot in security operations?\",\"choices\":[\"A backup server when applied to standard enterprise environments\",\"A decoy system to attract, detect, and study attackers without exposing real assets\",\"A user training tool\",\"A network testing device\"],\"correct\":1,\"explanation\":\"Honeypots are decoys with no legitimate users \\u2014 any interaction is suspicious by definition. They provide high-quality, low-noise detection. Honeynets extend the concept to whole network segments. Legal considerations (entrapment) usually do not apply because attackers must initiate.\",\"source\":\"guide\",\"guide_pages\":[2335,2340],\"guide_section\":\"Chapter 19 \\u2014 Honeypots\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-7-security-operations/\",\"title\":\"DestCert: Insights into CISSP Domain 7 \\u2014 Security Operations\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"honeypot\"],\"notes\":\"\",\"chapter\":18},{\"id\":\"D7-047\",\"domain\":7,\"subdomain\":\"7.4 Privileged Access\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST way to enforce the principle of least privilege for system administrators?\",\"choices\":[\"Give admins root by default under typical operating conditions\",\"Standard accounts for daily work + named admin accounts for specific tasks + JIT elevation for privileged actions\",\"Shared root password in most operational contexts under typical operating conditions\",\"Disable user accounts in commonly cited frameworks\"],\"correct\":1,\"explanation\":\"The cleanest least-privilege pattern for admins: standard accounts for daily work (email, browsing) + named admin accounts for specific systems + JIT elevation through PAM for the actual privileged operation. Choice A ('root by default') is the antithesis of least privilege. Choice C (shared root) destroys attribution. Choice D (disabling user accounts) is operationally absurd. Three-tier separation + JIT is the modern best practice.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-7-security-operations/\",\"title\":\"DestCert: Insights into CISSP Domain 7 \\u2014 Security Operations\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"least-privilege\",\"jit\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D7-048\",\"domain\":7,\"subdomain\":\"7.6 RTO/RPO\",\"difficulty\":\"easy\",\"stem\":\"Which document should establish RTO and RPO for each business process?\",\"choices\":[\"Vendor contract\",\"Business Impact Analysis (BIA)\",\"Network diagram\",\"Code of Ethics as a baseline configuration\"],\"correct\":1,\"explanation\":\"The Business Impact Analysis (BIA) is the canonical document that enumerates critical processes and assigns RTO, RPO, MTD, WRT to each. Choice A (vendor contract) may reference SLAs but doesn't establish internal RTO/RPO. Choice C (network diagram) is technical inventory. Choice D (Code of Ethics) is unrelated. Any exam question about RTO/RPO documentation has BIA as the answer \\u2014 memorise this association.\",\"source\":\"guide\",\"guide_pages\":[2275,2278],\"guide_section\":\"Chapter 18 \\u2014 BIA\",\"web_sources\":[],\"references\":[],\"tags\":[\"bia\",\"rto\",\"rpo\"],\"notes\":\"\",\"chapter\":17},{\"id\":\"D7-049\",\"domain\":7,\"subdomain\":\"7.5 IR Tools\",\"difficulty\":\"easy\",\"stem\":\"Which capability does EDR provide beyond traditional antivirus?\",\"choices\":[\"Static signature scanning only under typical operating conditions\",\"Continuous endpoint telemetry, behavioural detection, response actions, and forensic data\",\"Email scanning only under typical operating conditions\",\"Web filtering only in most enterprise deployments\"],\"correct\":1,\"explanation\":\"EDR provides telemetry + detection + response + forensic capabilities \\u2014 far beyond signature AV. Many EDR products also support threat hunting via stored telemetry. Choices A, C, D describe other tool categories.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-7-security-operations/\",\"title\":\"DestCert: Insights into CISSP Domain 7 \\u2014 Security Operations\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"edr\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D7-050\",\"domain\":7,\"subdomain\":\"7.7 Resource Protection\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST control for protecting cryptographic keys at runtime?\",\"choices\":[\"Store keys in source code given current best practices\",\"Use a hardware security module (HSM) or platform key vault with strict access policy\",\"Email keys to administrators in commonly cited frameworks\",\"Print keys on paper as a baseline configuration across the relevant control set\"],\"correct\":1,\"explanation\":\"HSMs and platform key vaults (AWS KMS, Azure Key Vault, GCP KMS) protect keys with hardware-rooted security and policy-controlled access \\u2014 keys never leave the protected boundary. Choice A (keys in source) leaks them into git history, build artefacts, and developer machines. Choice C (email) is plaintext over a system designed to be archived. Choice D (paper) is a printed-out compromise \\u2014 possibly fine for break-glass key shares with proper handling, but disastrous for runtime.\",\"source\":\"guide\",\"guide_pages\":[2340,2345],\"guide_section\":\"Chapter 19 \\u2014 Key Protection\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-7-security-operations/\",\"title\":\"DestCert: Insights into CISSP Domain 7 \\u2014 Security Operations\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"hsm\",\"key-vault\"],\"notes\":\"\",\"chapter\":18},{\"id\":\"D7-051\",\"domain\":7,\"subdomain\":\"7.7 Patch Mgmt\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST first source for understanding the criticality of a newly disclosed vulnerability?\",\"choices\":[\"Twitter speculation in standard practice\",\"Vendor advisory + CVE entry + CVSS scoring + KEV status\",\"Internal helpdesk tickets only\",\"Marketing brochures in standard practice\"],\"correct\":1,\"explanation\":\"Authoritative sources stack: vendor advisory (the truth) + CVE entry (the identifier) + CVSS scoring (severity context) + CISA KEV (known exploitation in the wild). Choice A (Twitter) is noisy and often wrong in the first 24h of a CVE. Choice C (helpdesk tickets) reflect symptoms, not vulnerability data. Choice D (marketing) is sales material. The modern triage workflow: confirm with vendor + CVE, prioritise by CVSS + KEV status.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-7-security-operations/\",\"title\":\"DestCert: Insights into CISSP Domain 7 \\u2014 Security Operations\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"vulnerability-prioritisation\",\"kev\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D7-052\",\"domain\":7,\"subdomain\":\"7.4 Operations\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST description of 'need to know' in operational security?\",\"choices\":[\"Anyone who asks should be told as a baseline configuration in most enterprise deployments\",\"Access to information should be limited to those whose duties require it, even when general clearance allows broader access\",\"Need to know is a synonym for least privilege for the purposes of this question\",\"Need to know applies only to government when properly implemented\"],\"correct\":1,\"explanation\":\"Need-to-know restricts access by job-required justification \\u2014 narrower than clearance/role. Least privilege is related but broader (covering rights, not just information access). Need-to-know is widely applied in commercial contexts (M&A, HR, legal).\",\"source\":\"guide\",\"guide_pages\":[2238,2242],\"guide_section\":\"Chapter 18 \\u2014 Need-to-Know\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-7-security-operations/\",\"title\":\"DestCert: Insights into CISSP Domain 7 \\u2014 Security Operations\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"need-to-know\"],\"notes\":\"\",\"chapter\":17},{\"id\":\"D8-001\",\"domain\":8,\"subdomain\":\"8.1 SDLC\",\"difficulty\":\"medium\",\"stem\":\"Which SDLC model proceeds linearly through phases (requirements \\u2192 design \\u2192 implementation \\u2192 testing \\u2192 deployment) without revisiting earlier phases?\",\"choices\":[\"Agile\",\"Waterfall\",\"Spiral\",\"DevSecOps\"],\"correct\":1,\"explanation\":\"Waterfall is sequential \\u2014 each phase completes before the next begins. Agile is iterative. Spiral is risk-driven and iterative. DevSecOps is continuous. Waterfall remains common in safety-critical/regulated domains where rigor is required.\",\"source\":\"guide\",\"guide_pages\":[2400,2405],\"guide_section\":\"Chapter 20 \\u2014 SDLC Models\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-8-software-development-security/\",\"title\":\"DestCert: CISSP Domain 8 \\u2014 Software Development Security Guide 2025\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"waterfall\",\"sdlc\"],\"notes\":\"\",\"chapter\":19},{\"id\":\"D8-002\",\"domain\":8,\"subdomain\":\"8.1 SDLC\",\"difficulty\":\"medium\",\"stem\":\"Which SDLC approach delivers working software in short iterative cycles with continuous customer feedback?\",\"choices\":[\"Waterfall\",\"Big Bang\",\"Agile\",\"V-Model\"],\"correct\":2,\"explanation\":\"Agile (Scrum, Kanban, XP, SAFe) emphasises ITERATION (short sprints), CUSTOMER FEEDBACK (working software each iteration), and incremental delivery \\u2014 codified in the 2001 Agile Manifesto. Choice A (Waterfall) is sequential, no iteration. Choice B (Big Bang) means deploy everything at once \\u2014 opposite of incremental. Choice D (V-Model) is sequential with verification phases mirroring development phases \\u2014 also non-iterative.\",\"source\":\"guide\",\"guide_pages\":[2405,2410],\"guide_section\":\"Chapter 20 \\u2014 Agile\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-8-software-development-security/\",\"title\":\"DestCert: CISSP Domain 8 \\u2014 Software Development Security Guide 2025\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"agile\"],\"notes\":\"\",\"chapter\":19},{\"id\":\"D8-003\",\"domain\":8,\"subdomain\":\"8.1 SDLC\",\"difficulty\":\"medium\",\"stem\":\"Which approach INTEGRATES security throughout the development pipeline (planning, coding, building, testing, deployment, monitoring)?\",\"choices\":[\"Security as an afterthought\",\"DevSecOps with shift-left and continuous security testing\",\"Big-bang security review at release\",\"Outsourcing all security to external auditors\"],\"correct\":1,\"explanation\":\"DevSecOps embeds security into CI/CD with automation (SAST, DAST, SCA, IaC scanning, secrets detection) \\u2014 shifting left into design/code rather than waiting for release. The other choices reflect anti-patterns or partial solutions.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://www.aikido.dev/learn/compliance/compliance-frameworks/nist-ssdf\",\"title\":\"Aikido: NIST SSDF (SP 800-218) Secure Software Development Explained\",\"captured\":\"2026-04-26\"},{\"url\":\"https://github.com/OWASP/DevSecOpsGuideline\",\"title\":\"GitHub: OWASP DevSecOps Guideline\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"devsecops\",\"shift-left\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D8-004\",\"domain\":8,\"subdomain\":\"8.2 Maturity Models\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST description of OWASP SAMM?\",\"choices\":[\"A penetration testing tool in most enterprise deployments\",\"A prescriptive software-security maturity framework with five business functions and four maturity levels\",\"A web app firewall in commonly cited frameworks\",\"A coding language when applied to standard enterprise environments under typical operating conditions\"],\"correct\":1,\"explanation\":\"OWASP SAMM (Software Assurance Maturity Model) helps organisations measure and improve software security posture across Governance, Design, Implementation, Verification, and Operations. The other choices describe different artefacts entirely.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://owasp.org/www-project-samm/\",\"title\":\"OWASP: Software Assurance Maturity Model (SAMM)\",\"captured\":\"2026-04-26\"},{\"url\":\"https://info-savvy.com/cissp-maturity-models-bk1d8t1st2p2/\",\"title\":\"Info-Savvy: CISSP Maturity Models\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"samm\",\"maturity\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D8-005\",\"domain\":8,\"subdomain\":\"8.2 Maturity Models\",\"difficulty\":\"medium\",\"stem\":\"Which maturity model is descriptive \\u2014 based on observed practices in real software security programs at participating organisations?\",\"choices\":[\"CMMI\",\"OWASP SAMM\",\"BSIMM\",\"ITIL\"],\"correct\":2,\"explanation\":\"BSIMM (Building Security In Maturity Model) is descriptive \\u2014 observed activities at member firms. SAMM is prescriptive (recommendations). CMMI is process maturity (general). ITIL is service management. The exam differentiates BSIMM vs SAMM.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://info-savvy.com/cissp-maturity-models-bk1d8t1st2p2/\",\"title\":\"Info-Savvy: CISSP Maturity Models\",\"captured\":\"2026-04-26\"},{\"url\":\"https://www.infosecinstitute.com/resources/application-security/software-maturity-models-for-appsec-initiatives/\",\"title\":\"Infosec Institute: Software maturity models for AppSec\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"bsimm\",\"maturity\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D8-006\",\"domain\":8,\"subdomain\":\"8.2 Maturity Models\",\"difficulty\":\"easy\",\"stem\":\"Which model assesses PROCESS maturity from Initial (1) through Optimising (5)?\",\"choices\":[\"CMMI\",\"OWASP SAMM\",\"BSIMM\",\"ISO 27034\"],\"correct\":0,\"explanation\":\"CMMI uses five maturity levels: Initial (1) \\u2192 Managed (2) \\u2192 Defined (3) \\u2192 Quantitatively Managed (4) \\u2192 Optimising (5). Choice B (OWASP SAMM) uses FOUR maturity levels per practice (0\\u20133). Choice C (BSIMM) is descriptive (observed activities at member firms) \\u2014 not a numeric maturity scale. Choice D (ISO 27034) is application security guidance, not a maturity model. The 1-through-5 ladder is uniquely CMMI.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://info-savvy.com/cissp-maturity-models-bk1d8t1st2p2/\",\"title\":\"Info-Savvy: CISSP Maturity Models\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"cmmi\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D8-007\",\"domain\":8,\"subdomain\":\"8.4 OWASP Top 10\",\"difficulty\":\"medium\",\"stem\":\"Which OWASP Top 10:2021 category covers the FAILURE to enforce restrictions on what authenticated users can do (e.g., URL tampering to access another user's data)?\",\"choices\":[\"A01: Broken Access Control\",\"A02: Cryptographic Failures\",\"A03: Injection\",\"A04: Insecure Design\"],\"correct\":0,\"explanation\":\"A01 Broken Access Control became #1 in 2021. Examples: forced browsing to admin URLs, IDOR (insecure direct object reference), missing function-level checks. Cryptographic failures = data-protection issues. Injection = SQL, command. Insecure design is broader.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://owasp.org/Top10/A11_2021-Next_Steps/\",\"title\":\"OWASP Top 10:2021 \\u2014 Next Steps\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"owasp-top-10\",\"broken-access\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D8-008\",\"domain\":8,\"subdomain\":\"8.4 OWASP Top 10\",\"difficulty\":\"medium\",\"stem\":\"Which OWASP Top 10:2021 category specifically covers vulnerable third-party libraries used in applications?\",\"choices\":[\"A05: Security Misconfiguration\",\"A06: Vulnerable and Outdated Components\",\"A07: Identification and Authentication Failures\",\"A08: Software and Data Integrity Failures\"],\"correct\":1,\"explanation\":\"OWASP Top 10:2021 categorised vulnerable libraries as A06: Vulnerable and Outdated Components \\u2014 addressed by SCA tooling, SBOM hygiene, and dependency pinning. The 2025 release elevated Software Supply Chain Failures to a more comprehensive category. A05 Security Misconfiguration covers default creds, unnecessary features. A07 Identification and Authentication Failures covers session/auth flaws. A08 Software and Data Integrity Failures covers CI/CD compromise and unsigned updates.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://owasp.org/Top10/A11_2021-Next_Steps/\",\"title\":\"OWASP Top 10:2021 \\u2014 Next Steps\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"owasp-top-10\",\"vulnerable-components\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D8-009\",\"domain\":8,\"subdomain\":\"8.5 Secure Coding\",\"difficulty\":\"easy\",\"stem\":\"What is a TOCTOU (Time-of-Check to Time-of-Use) vulnerability?\",\"choices\":[\"A timing-channel attack given current best practices\",\"A race condition where a resource is checked then used, but its state can change between check and use\",\"A type-confusion bug under typical operating conditions\",\"A buffer overflow in most operational contexts in commonly cited frameworks\"],\"correct\":1,\"explanation\":\"TOCTOU exploits a window between an authorisation/state check and the operation. Example: check file ownership, then open file \\u2014 attacker swaps the path with a symlink in between. Mitigation: atomic operations, file descriptors instead of paths. CWE-367 captures this.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://cqr.company/web-vulnerabilities/time-of-check-to-time-of-use-tocttou-race-conditions/\",\"title\":\"CQR: TOCTTOU Race Conditions\",\"captured\":\"2026-04-26\"},{\"url\":\"https://cwe.mitre.org/data/definitions/367.html\",\"title\":\"CWE-367: Time-of-check Time-of-use (TOCTOU)\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"toctou\",\"race-condition\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D8-010\",\"domain\":8,\"subdomain\":\"8.5 Secure Coding\",\"difficulty\":\"medium\",\"stem\":\"Which is the MOST EFFECTIVE primary defence against buffer overflows in modern code?\",\"choices\":[\"Hope developers are careful when properly implemented\",\"Use memory-safe languages; for C/C++ use safe APIs, bounds checking, and OS mitigations (ASLR, DEP, stack canaries)\",\"Disable error messages given current best practices\",\"Increase stack size given current best practices\"],\"correct\":1,\"explanation\":\"Memory-safe languages eliminate whole classes of overflow. For unavoidable C/C++, defensive APIs (snprintf instead of strcpy), bounds checks, and OS mitigations layer defenses. Hoping is not a control. Disabling error messages hides issues. Larger stacks don't fix overflows.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://owasp.org/www-community/vulnerabilities/Buffer_Overflow\",\"title\":\"OWASP: Buffer Overflow\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"buffer-overflow\",\"memory-safety\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D8-011\",\"domain\":8,\"subdomain\":\"8.5 Secure Coding\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST defence against XSS (cross-site scripting)?\",\"choices\":[\"Strip 'script' as a substring under typical operating conditions\",\"Output encoding contextual to the destination plus a strict Content Security Policy\",\"Disable JavaScript on all clients in commonly cited frameworks\",\"Hope users never see the input in standard practice\"],\"correct\":1,\"explanation\":\"Context-aware output encoding (HTML body vs attribute vs JS context) is the canonical fix. CSP provides defense in depth. Substring stripping is bypassable. Disabling JS breaks apps. Manager-mindset: prevent at output, not just at input.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://owasp.org/Top10/A11_2021-Next_Steps/\",\"title\":\"OWASP Top 10:2021 \\u2014 Next Steps\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"xss\",\"encoding\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D8-012\",\"domain\":8,\"subdomain\":\"8.5 Secure Coding\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST defence against CSRF (Cross-Site Request Forgery)?\",\"choices\":[\"Trust the Referer header alone\",\"Anti-CSRF tokens plus SameSite cookies\",\"Check user-agent strings\",\"Use only HTTPS without other controls\"],\"correct\":1,\"explanation\":\"CSRF defence stack: anti-CSRF tokens (synchroniser pattern \\u2014 token in form, validated on POST) PLUS SameSite cookies (Lax or Strict \\u2014 browser blocks cross-site cookie attachment). Choice A (Referer alone) is unreliable \\u2014 proxies strip it, mobile apps don't send it. Choice C (user-agent) is trivially spoofable. Choice D (HTTPS alone) doesn't help \\u2014 CSRF works fine over HTTPS. Modern apps use both tokens AND SameSite for defence in depth.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://owasp.org/Top10/A11_2021-Next_Steps/\",\"title\":\"OWASP Top 10:2021 \\u2014 Next Steps\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"csrf\",\"samesite\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D8-013\",\"domain\":8,\"subdomain\":\"8.7 CI/CD\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST first step toward integrating security into a CI/CD pipeline?\",\"choices\":[\"Add a manual security review at the very end\",\"Embed automated SAST, dependency scanning, secret scanning, and IaC checks as gates earlier in the pipeline\",\"Disable failing tests to keep the pipeline green\",\"Skip security on hot-fix branches when applied to standard enterprise environments\"],\"correct\":1,\"explanation\":\"Shift-left automation is the pattern: SAST + dependency scanning + secret scanning + IaC checks run as gates in the pipeline before code ships, catching issues at low cost. Choice A (manual review at the end) creates rubber-stamp behaviour and doesn't scale. Choice C (disabling failing tests) is a textbook anti-pattern. Choice D (skipping security on hot-fixes) is exactly when attackers exploit rushed code. Modern DevSecOps teaches: gate early, gate often, never skip.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://www.practical-devsecops.com/wp-content/uploads/2024/06/eBook-Integrating-Security-into-CI_CD-Pipelines-through-DevSecOps-Approach-1.pdf\",\"title\":\"Practical DevSecOps: Integrating Security into CI/CD Pipelines\",\"captured\":\"2026-04-26\"},{\"url\":\"https://github.com/OWASP/DevSecOpsGuideline\",\"title\":\"GitHub: OWASP DevSecOps Guideline\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"cicd\",\"shift-left\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D8-014\",\"domain\":8,\"subdomain\":\"8.7 IaC\",\"difficulty\":\"medium\",\"stem\":\"Which is the PRIMARY security benefit of Infrastructure-as-Code (IaC)?\",\"choices\":[\"Faster developers for the purposes of this question\",\"Repeatable, reviewable, scannable definitions of infrastructure that enable policy-as-code and drift detection\",\"Eliminates the need for IAM given current best practices\",\"Removes the need for backups in standard practice\"],\"correct\":1,\"explanation\":\"IaC (Terraform, CloudFormation, ARM, Bicep, Pulumi) makes infrastructure auditable, reviewable, and scannable (Checkov, tfsec, KICS). Choices C, D are wrong. Drift detection is a major operational benefit.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://www.aikido.dev/learn/compliance/compliance-frameworks/nist-ssdf\",\"title\":\"Aikido: NIST SSDF (SP 800-218) Secure Software Development Explained\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"iac\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D8-015\",\"domain\":8,\"subdomain\":\"8.6 Supply Chain\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST mitigation for software supply-chain attacks (e.g., compromised dependency packages)?\",\"choices\":[\"Trust all packages from public registries when properly implemented\",\"SCA, SBOM, provenance verification, pinning to known-good versions, and private registry mirrors\",\"Disable package managers for the purposes of this question\",\"Use only one library when properly implemented\"],\"correct\":1,\"explanation\":\"Layered defence: SCA (find known-CVE deps), SBOM (machine-readable inventory), provenance verification (sigstore/SLSA), pinning to known-good versions, and private registry mirrors. Choice A (trust public registries) is exactly how SolarWinds and 3CX-style attacks succeed. Choice C (disable package managers) is operationally impossible. Choice D (one library) doesn't address the supply chain. SLSA framework (Supply-chain Levels for Software Artifacts) formalises this.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://www.aikido.dev/learn/compliance/compliance-frameworks/nist-ssdf\",\"title\":\"Aikido: NIST SSDF (SP 800-218) Secure Software Development Explained\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"supply-chain\",\"sbom\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D8-016\",\"domain\":8,\"subdomain\":\"8.4 OWASP\",\"difficulty\":\"medium\",\"stem\":\"Which OWASP project provides verifiable security requirements for web applications?\",\"choices\":[\"OWASP Top 10 in standard practice\",\"OWASP ASVS (Application Security Verification Standard)\",\"OWASP ZAP when properly implemented\",\"OWASP Cheat Sheet Series given current best practices\"],\"correct\":1,\"explanation\":\"OWASP ASVS provides three verification levels (1-3) of security requirements for web apps. Top 10 is awareness. ZAP is a DAST tool. Cheat sheets are reference docs. ASVS is the standard for assurance-driven secure development.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://owasp.org/www-project-application-security-verification-standard/\",\"title\":\"OWASP: Application Security Verification Standard (ASVS)\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"asvs\",\"owasp\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D8-017\",\"domain\":8,\"subdomain\":\"8.5 Secure Coding\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST description of an INFERENCE attack on a database?\",\"choices\":[\"A SQL injection in commonly cited frameworks\",\"Combining individually authorised queries to deduce information that the user is not authorised to see directly\",\"A brute-force attack in most enterprise deployments\",\"A SYN flood for general production deployments across the relevant control set\"],\"correct\":1,\"explanation\":\"Inference attacks combine individually-AUTHORISED queries to deduce information the user is NOT authorised to see directly \\u2014 e.g., averaging salaries by department to infer an individual's pay. Choice A (SQL injection) attacks query construction, not query result composition. Choice C (brute force) tries credentials. Choice D (SYN flood) is a network DoS. Mitigations for inference: query restriction, polyinstantiation, differential privacy, statistical noise.\",\"source\":\"guide\",\"guide_pages\":[2515,2520],\"guide_section\":\"Chapter 21 \\u2014 Inference\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-8-software-development-security/\",\"title\":\"DestCert: CISSP Domain 8 \\u2014 Software Development Security Guide 2025\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"inference\",\"database\"],\"notes\":\"\",\"chapter\":20},{\"id\":\"D8-018\",\"domain\":8,\"subdomain\":\"8.5 Database\",\"difficulty\":\"medium\",\"stem\":\"Which database technique stores DIFFERENT VALUES under the SAME primary key for different security levels?\",\"choices\":[\"Inference\",\"Aggregation\",\"Polyinstantiation\",\"Normalization\"],\"correct\":2,\"explanation\":\"Polyinstantiation stores multiple instances of the same logical record at different classification levels \\u2014 preventing covert channels via existence inference. Inference is the attack; aggregation combines authorized data; normalization is a relational design technique.\",\"source\":\"guide\",\"guide_pages\":[2520,2525],\"guide_section\":\"Chapter 21 \\u2014 Polyinstantiation\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-8-software-development-security/\",\"title\":\"DestCert: CISSP Domain 8 \\u2014 Software Development Security Guide 2025\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"polyinstantiation\"],\"notes\":\"\",\"chapter\":20},{\"id\":\"D8-019\",\"domain\":8,\"subdomain\":\"8.5 Database\",\"difficulty\":\"medium\",\"stem\":\"Which database property ensures that transactions are 'all or nothing' (a partially completed transaction is rolled back)?\",\"choices\":[\"Atomicity\",\"Consistency\",\"Isolation\",\"Durability\"],\"correct\":0,\"explanation\":\"ACID's Atomicity ensures transactions complete fully or not at all. Consistency: transitions valid states only. Isolation: concurrent transactions don't interfere. Durability: committed data survives failures. ACID is fundamental to relational databases.\",\"source\":\"guide\",\"guide_pages\":[2510,2515],\"guide_section\":\"Chapter 21 \\u2014 ACID\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-8-software-development-security/\",\"title\":\"DestCert: CISSP Domain 8 \\u2014 Software Development Security Guide 2025\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"acid\",\"atomicity\"],\"notes\":\"\",\"chapter\":20},{\"id\":\"D8-020\",\"domain\":8,\"subdomain\":\"8.7 API Security\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST description of API rate limiting?\",\"choices\":[\"A licensing tier for the purposes of this question\",\"Restricting the number of requests per identity/source per time window to defend against abuse and DoS\",\"An encryption mode in commonly cited frameworks\",\"A logging level under typical compliance requirements when properly implemented\"],\"correct\":1,\"explanation\":\"API rate limiting restricts the number of requests per identity/source per time window \\u2014 defending against brute force, scraping, abuse, and accidental DoS. Choice A confuses 'rate' with 'tier' (subscription billing). Choice C ('encryption mode') is unrelated \\u2014 that's TLS / cipher modes. Choice D ('logging level') is observability, not access control. Implement at the API gateway layer with per-key + per-IP + per-user buckets.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-8-software-development-security/\",\"title\":\"DestCert: CISSP Domain 8 \\u2014 Software Development Security Guide 2025\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"api\",\"rate-limit\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D8-021\",\"domain\":8,\"subdomain\":\"8.7 API Security\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST authentication mechanism for service-to-service API calls in modern architectures?\",\"choices\":[\"API keys in URL parameters\",\"OAuth 2.0 client credentials grant with short-lived tokens (or mTLS)\",\"Basic auth without TLS as a baseline configuration\",\"Hardcoded passwords in code\"],\"correct\":1,\"explanation\":\"OAuth 2.0 client_credentials grant with SHORT-LIVED tokens (or mTLS for workload identity) is the modern service-to-service standard. Choice A (API keys in URLs) leaks them in proxy logs and browser history. Choice C (basic auth without TLS) sends credentials in cleartext. Choice D (hardcoded passwords) is the secret-sprawl pattern. Modern stacks: service mesh + workload identity + short-lived tokens.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-8-software-development-security/\",\"title\":\"DestCert: CISSP Domain 8 \\u2014 Software Development Security Guide 2025\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"api\",\"oauth\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D8-022\",\"domain\":8,\"subdomain\":\"8.6 Supply Chain\",\"difficulty\":\"easy\",\"stem\":\"Which artifact LISTS the components and dependencies in a software product?\",\"choices\":[\"MD5 manifest\",\"SBOM (Software Bill of Materials)\",\"EULA when properly implemented\",\"Architecture diagram\"],\"correct\":1,\"explanation\":\"An SBOM (Software Bill of Materials, in SPDX or CycloneDX format) lists components, versions, licences, and provenance \\u2014 required for US federal software per Executive Order 14028. Choice A ('MD5 manifest') is just an integrity checksum, not a structured component list. Choice C (EULA) is the licence agreement \\u2014 not an inventory. Choice D (architecture diagram) is design-time, not a machine-readable component list.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://www.aikido.dev/learn/compliance/compliance-frameworks/nist-ssdf\",\"title\":\"Aikido: NIST SSDF (SP 800-218) Secure Software Development Explained\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"sbom\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D8-023\",\"domain\":8,\"subdomain\":\"8.5 Secure Coding\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST mitigation for OS command injection in code that builds shell commands from user input?\",\"choices\":[\"Concatenate input carefully given current best practices\",\"Avoid shells entirely; use parameterised APIs and strict allow-lists for any required pass-through\",\"Trust user input from authenticated sessions in standard practice\",\"Hash input first in commonly cited frameworks\"],\"correct\":1,\"explanation\":\"Avoid shells entirely \\u2014 use parameterised APIs (e.g., subprocess with argv list, NOT shell=True) so input cannot break out of arguments into command syntax. If shell is unavoidable, strict allow-lists on input. Choice A (concatenate carefully) is the bug \\u2014 careful concatenation still fails. Choice C (trust authenticated input) confuses authentication with authorisation. Choice D (hash input first) destroys legitimate input. CWE-78 captures OS command injection.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://owasp.org/Top10/A11_2021-Next_Steps/\",\"title\":\"OWASP Top 10:2021 \\u2014 Next Steps\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"command-injection\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D8-024\",\"domain\":8,\"subdomain\":\"8.5 Secure Coding\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST defence against insecure deserialization (CWE-502)?\",\"choices\":[\"Use plain pickle / Java native serialization in commonly cited frameworks\",\"Avoid native serialization for untrusted data; prefer simple data formats (JSON), strict schemas, and integrity checks\",\"Trust serialised input from clients in most enterprise deployments\",\"Disable encryption given current best practices\"],\"correct\":1,\"explanation\":\"Native serialization formats (Python pickle, Java ObjectInputStream, .NET BinaryFormatter) on untrusted input enable arbitrary code execution \\u2014 mitigation is to avoid them entirely for untrusted data and use simple data formats (JSON, MessagePack) with strict schemas + integrity checks. Choice A explicitly recommends the dangerous primitives. Choice C ('trust input') is the underlying mistake. Choice D (disable encryption) is unrelated \\u2014 encryption isn't the defense against deserialization RCE. CWE-502 captures this entire class.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://owasp.org/Top10/A11_2021-Next_Steps/\",\"title\":\"OWASP Top 10:2021 \\u2014 Next Steps\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"deserialization\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D8-025\",\"domain\":8,\"subdomain\":\"8.7 Secrets\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST mitigation for accidental commit of secrets to source repositories?\",\"choices\":[\"Trust developers to remember in most operational contexts across the relevant control set\",\"Pre-commit hooks + CI secret scanning + a secrets manager + git history rewrite/rotation if leaks occur\",\"Use a single password file in the root across the relevant control set\",\"Email secrets to all developers in most enterprise deployments\"],\"correct\":1,\"explanation\":\"Layered defense: pre-commit hooks (catch before commit) + CI secret scanning (catch before merge) + a real secrets manager (no secrets in code) + git history rewrite + key rotation if a leak occurs. Choice A ('trust developers') is a non-control \\u2014 humans forget. Choice C (password file in root) is the bug we're trying to prevent. Choice D (emailing secrets) creates archived plaintext and is catastrophic. The rotation step is what most people miss \\u2014 once a secret is in git history, removing the file doesn't help; assume compromised and rotate.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-8-software-development-security/\",\"title\":\"DestCert: CISSP Domain 8 \\u2014 Software Development Security Guide 2025\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"secrets-management\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D8-026\",\"domain\":8,\"subdomain\":\"8.6 Code Repos\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST mitigation for malicious or accidental commits to protected branches?\",\"choices\":[\"Allow direct push to main across the relevant control set\",\"Require signed commits, branch protection rules, code review, and CODEOWNERS approval\",\"Disable code review for general production deployments across the relevant control set\",\"Trust senior engineers' direct pushes in standard practice\"],\"correct\":1,\"explanation\":\"Branch protection (required reviews, signed commits, CODEOWNERS approval, status checks) enforces that nothing reaches main without controlled review. Choice A (direct push) defeats the protection entirely. Choice C (disabling code review) removes the second pair of eyes that catches logic and security issues. Choice D (trusting senior engineers) violates separation of duties \\u2014 even seniors should be reviewed. The exam pattern is always: separation + review + signed-artefact verification.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-8-software-development-security/\",\"title\":\"DestCert: CISSP Domain 8 \\u2014 Software Development Security Guide 2025\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"repo-protection\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D8-027\",\"domain\":8,\"subdomain\":\"8.4 Threat Modeling\",\"difficulty\":\"medium\",\"stem\":\"Which threat-modeling step BEST aligns with 'identifying entry points and trust boundaries'?\",\"choices\":[\"Architecting the database\",\"Decomposing the application and drawing data-flow diagrams (DFDs) with trust boundaries\",\"Marketing the product when applied to standard enterprise environments\",\"Choosing a programming language\"],\"correct\":1,\"explanation\":\"Decomposing the application into data-flow diagrams (DFDs) with explicit trust boundaries is the canonical step where entry points, data crossings, and trust transitions become visible \\u2014 required input to STRIDE-style threat modeling. Choice A (database architecture) is downstream design, not threat modeling. Choice C (marketing) is unrelated. Choice D (language choice) is implementation, not architecture. Microsoft's SDL documents the DFD-with-trust-boundaries technique formally.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/threat-modeling-methodologies/\",\"title\":\"DestCert: Threat Modeling Methodologies \\u2014 STRIDE, PASTA, DREAD\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"threat-modeling\",\"dfd\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D8-028\",\"domain\":8,\"subdomain\":\"8.7 Container Security\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST mitigation for vulnerable container images?\",\"choices\":[\"Trust upstream images for the purposes of this question\",\"Scan images at build, sign images, use minimal base images, run as non-root, and apply runtime image policies\",\"Run all containers as root under typical operating conditions\",\"Disable scanning when properly implemented\"],\"correct\":1,\"explanation\":\"Defence-in-depth for containers: scan images at build (catch CVEs), sign images (provenance), use minimal base images (smaller attack surface), run as non-root (limit blast radius), and apply runtime image policies (only-signed-images-from-our-registry). Choice A ('trust upstream') is the source of supply-chain attacks. Choice C (root containers) gives an attacker the host. Choice D (disabling scanning) abandons your earliest detection layer. Tools: Trivy, Grype, Cosign, OPA/Gatekeeper.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-8-software-development-security/\",\"title\":\"DestCert: CISSP Domain 8 \\u2014 Software Development Security Guide 2025\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"containers\",\"image-security\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D8-029\",\"domain\":8,\"subdomain\":\"8.5 Secure Coding\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST mitigation for SSRF (Server-Side Request Forgery, OWASP A10:2021)?\",\"choices\":[\"Trust user-supplied URLs across the relevant control set\",\"Use allow-lists of permitted destinations, deny RFC 1918/private/metadata endpoints, and use a dedicated egress proxy\",\"Open all egress under typical operating conditions\",\"Disable DNS across the relevant control set\"],\"correct\":1,\"explanation\":\"SSRF mitigation: explicit destination ALLOW-list (not deny-list), block private/loopback/link-local + cloud metadata endpoints (169.254.169.254 in AWS/GCP/Azure), and route all egress through a controlled proxy that enforces the allow-list. Choice A ('trust user URLs') is the SSRF root cause. Choice C ('open all egress') makes the vulnerability worse. Choice D (disabling DNS) breaks the application without preventing IP-literal SSRF. The metadata endpoint block is critical \\u2014 that's how Capital One was breached in 2019.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://owasp.org/Top10/A11_2021-Next_Steps/\",\"title\":\"OWASP Top 10:2021 \\u2014 Next Steps\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"ssrf\",\"egress\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D8-030\",\"domain\":8,\"subdomain\":\"8.6 Software Composition\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST policy for handling a critical CVE in a third-party library used across many services?\",\"choices\":[\"Wait until the next quarterly upgrade window in commonly cited frameworks\",\"Inventory affected services via SBOM, prioritise by exposure, patch through accelerated change management, and verify\",\"Disable logging to hide alerts as a baseline configuration under typical operating conditions\",\"Replace the library with an in-house version overnight when properly implemented\"],\"correct\":1,\"explanation\":\"SBOM-driven inventory + risk-based prioritisation (which services use the vulnerable lib, what's their exposure) + accelerated change management + verification is the manager-mindset answer. Choice A (quarterly window) accumulates risk. Choice C (disable logging) is anti-pattern. Choice D (overnight rewrite) introduces fresh untested code under pressure. The Log4Shell response in 2021 was the textbook example of this workflow.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://www.aikido.dev/learn/compliance/compliance-frameworks/nist-ssdf\",\"title\":\"Aikido: NIST SSDF (SP 800-218) Secure Software Development Explained\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"cve\",\"library\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D8-031\",\"domain\":8,\"subdomain\":\"8.4 SDLC Security\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST description of a 'security gate' in the SDLC?\",\"choices\":[\"A physical door given current best practices\",\"A defined checkpoint where security criteria must be met before progressing to the next phase\",\"A QA test as a baseline configuration in most enterprise deployments\",\"A code review in commonly cited frameworks\"],\"correct\":1,\"explanation\":\"A security gate is a defined checkpoint where measurable security criteria must be met before the work progresses to the next phase \\u2014 e.g., 'no critical SAST findings before merge', 'no high CVEs before deploy', 'threat model reviewed before architecture approval'. Choice A ('physical door') is a literal misreading. Choice C (QA test) is one input but not the gate concept itself. Choice D (code review) is also an input. Gates are about CRITERIA, not activities.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-8-software-development-security/\",\"title\":\"DestCert: CISSP Domain 8 \\u2014 Software Development Security Guide 2025\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"security-gate\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D8-032\",\"domain\":8,\"subdomain\":\"8.7 Cloud-Native\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST mitigation for the risk of overly permissive cloud IAM policies?\",\"choices\":[\"Grant '*' permissions for convenience in most enterprise deployments\",\"Apply least privilege, use scoped roles, automated drift detection, and JIT elevation\",\"Disable IAM logging in most enterprise deployments\",\"Share root keys in standard practice\"],\"correct\":1,\"explanation\":\"Cloud IAM least privilege requires: scoped roles (no '*' permissions), automated drift detection (IAM Access Analyzer, AWS Config rules), and JIT elevation via PAM for privileged operations. Choice A (grant '*' for convenience) is the #1 cloud misconfiguration per CSA. Choice C (disable IAM logging) destroys forensic capability. Choice D (share root keys) violates every IAM principle. Pattern: least privilege + drift + JIT = modern cloud IAM.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-8-software-development-security/\",\"title\":\"DestCert: CISSP Domain 8 \\u2014 Software Development Security Guide 2025\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"cloud-iam\",\"least-privilege\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D8-033\",\"domain\":8,\"subdomain\":\"8.7 SaaS Security\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST mitigation when integrating a third-party SaaS that processes customer data?\",\"choices\":[\"Skip due diligence under typical operating conditions\",\"Vendor risk assessment, DPA, evidence of SOC 2 Type II, scoped permissions, and offboarding plan\",\"Trust the vendor's marketing when properly implemented\",\"Allow unrestricted data sharing in standard practice\"],\"correct\":1,\"explanation\":\"SaaS vendor onboarding requires: risk-based assessment + Data Processing Agreement (GDPR Art. 28) + audit evidence (SOC 2 Type II preferably) + scoped permissions in their tenant + a documented offboarding/data-return plan. Choice A ('skip due diligence') is the failure pattern that makes headlines. Choice C ('trust marketing') overlooks that vendors sell themselves. Choice D ('unrestricted sharing') violates least privilege. Manager-mindset: vendor risk = your risk, full stop.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-8-software-development-security/\",\"title\":\"DestCert: CISSP Domain 8 \\u2014 Software Development Security Guide 2025\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"saas\",\"vendor-risk\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D8-034\",\"domain\":8,\"subdomain\":\"8.5 Secure Coding\",\"difficulty\":\"medium\",\"stem\":\"What is the PRIMARY purpose of input validation as a defensive coding practice?\",\"choices\":[\"Improve UX across the relevant control set\",\"Reject inputs that violate expected format, length, type, and range\",\"Speed up the database across the relevant control set\",\"Replace all encoding across the relevant control set\"],\"correct\":1,\"explanation\":\"Input validation enforces format/length/type/range; combine with output encoding contextually for full defence in depth. Choices A, C, D are wrong. 'Validate input, encode output' is the canonical pairing.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://owasp.org/Top10/A11_2021-Next_Steps/\",\"title\":\"OWASP Top 10:2021 \\u2014 Next Steps\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"input-validation\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D8-035\",\"domain\":8,\"subdomain\":\"8.4 Secure Design\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST description of 'fail securely' as a secure-design principle?\",\"choices\":[\"Crash the system on any error\",\"When errors occur, default to a secure state\",\"Always continue regardless of errors\",\"Log nothing on failure\"],\"correct\":1,\"explanation\":\"Fail-securely (Saltzer & Schroeder principle) means errors leave the system in a SECURE state by default \\u2014 deny access, withhold sensitive error data from clients, log internally so operators can investigate. Choice A (crash on any error) impacts availability and isn't actually secure if the crash leaves resources accessible. Choice C ('always continue') ignores the error \\u2014 exactly how injection vulnerabilities compound. Choice D (no logging) destroys forensic capability. The shape: deny-by-default + minimal external info + complete internal audit trail.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-8-software-development-security/\",\"title\":\"DestCert: CISSP Domain 8 \\u2014 Software Development Security Guide 2025\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"fail-securely\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D8-036\",\"domain\":8,\"subdomain\":\"8.7 CI/CD\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST control for protecting CI/CD pipeline secrets and tokens?\",\"choices\":[\"Hardcode in YAML under typical compliance requirements in standard practice\",\"Use a secrets manager / OIDC federation with short-lived tokens; restrict repo permissions and audit usage\",\"Email secrets to developers across the relevant control set\",\"Print to build logs for the purposes of this question\"],\"correct\":1,\"explanation\":\"Modern CI/CD uses OIDC federation (GitHub Actions to AWS/GCP/Azure) for short-lived tokens, and secrets managers for credentials. Hardcoding and printing leak secrets. The exam favours short-lived, vaulted credentials.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-8-software-development-security/\",\"title\":\"DestCert: CISSP Domain 8 \\u2014 Software Development Security Guide 2025\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"cicd-secrets\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D8-037\",\"domain\":8,\"subdomain\":\"8.5 GraphQL\",\"difficulty\":\"medium\",\"stem\":\"Which is a UNIQUE security concern with GraphQL APIs that REST APIs DON'T typically face directly?\",\"choices\":[\"TLS across the relevant control set\",\"Query complexity / depth attacks where attackers can craft expensive queries\",\"JSON parsing in most enterprise deployments\",\"DNS lookups in most enterprise deployments\"],\"correct\":1,\"explanation\":\"GraphQL's flexibility lets clients request deeply nested or expensive queries (denial of service via complexity). Mitigations: query depth limits, complexity scoring, persisted queries. REST exposes fixed endpoints with bounded shapes.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-8-software-development-security/\",\"title\":\"DestCert: CISSP Domain 8 \\u2014 Software Development Security Guide 2025\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"graphql\",\"query-complexity\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D8-038\",\"domain\":8,\"subdomain\":\"8.4 Privacy by Design\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST description of 'privacy by design'?\",\"choices\":[\"Adding a privacy notice at the end in most enterprise deployments\",\"Embedding privacy considerations into the system from the design phase\",\"Encrypting only after launch in commonly cited frameworks\",\"Allowing opt-out only across the relevant control set\"],\"correct\":1,\"explanation\":\"Privacy-by-design (Ann Cavoukian's 7 principles, codified in GDPR Article 25) embeds privacy from inception: data minimisation by default, purpose limitation, transparent consent, default-private settings. Choice A ('notice at the end') is privacy theatre. Choice C ('encrypt after launch') treats privacy as a bolt-on. Choice D ('opt-out only') violates GDPR's affirmative-consent requirement. The practical test: if you can remove the privacy controls without rewriting the architecture, you didn't actually do privacy-by-design.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-8-software-development-security/\",\"title\":\"DestCert: CISSP Domain 8 \\u2014 Software Development Security Guide 2025\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"privacy-by-design\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D8-039\",\"domain\":8,\"subdomain\":\"8.5 Secure Coding\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST mitigation for hardcoded credentials in source code?\",\"choices\":[\"Comment them out across the relevant policy framework in standard practice\",\"Remove from code, rotate the credential, store in a secrets manager, scan repos for further leaks, and add pre-commit/CI scanning\",\"Trust git access controls when properly implemented\",\"E

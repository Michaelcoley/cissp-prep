urvive Shor; MD5 is broken. Hybrid (classical + PQ) is the recommended migration path.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://csrc.nist.gov/pubs/sp/800/57/pt1/r5/final\",\"title\":\"NIST SP 800-57 Part 1 Rev 5: Recommendation for Key Management\",\"captured\":\"2026-04-26\"},{\"url\":\"https://csrc.nist.gov/pubs/fips/140/3/final\",\"title\":\"FIPS 140-3: Security Requirements for Cryptographic Modules\",\"captured\":\"2026-04-26\"}],\"references\":[\"NIST FIPS 203/204/205\"],\"tags\":[\"post-quantum\",\"kem\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D3-013\",\"domain\":3,\"subdomain\":\"3.5 Common Criteria\",\"difficulty\":\"medium\",\"stem\":\"What does an EAL (Evaluation Assurance Level) rating in Common Criteria PRIMARILY express?\",\"choices\":[\"The strength of cryptography in the product under typical operating conditions\",\"The rigor of the evaluation process applied to a Target of Evaluation against its Security Target\",\"The product's market share when properly implemented\",\"The cost of the product across the relevant policy framework across the relevant control set\"],\"correct\":1,\"explanation\":\"EAL describes evaluation rigor (EAL1 functionally tested \\u2192 EAL7 formally verified design and tested). It does NOT mean the product is more secure in absolute terms \\u2014 an EAL4 product can be more secure than an EAL6 product evaluated against weaker functionality. Cryptographic strength is a separate property captured in the Security Target.\",\"source\":\"guide\",\"guide_pages\":[805,810],\"guide_section\":\"Chapter 8 \\u2014 Common Criteria\",\"web_sources\":[{\"url\":\"https://www.commoncriteriaportal.org/cc/\",\"title\":\"Common Criteria Portal\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"common-criteria\",\"eal\"],\"notes\":\"\",\"chapter\":6},{\"id\":\"D3-014\",\"domain\":3,\"subdomain\":\"3.5 Standards\",\"difficulty\":\"medium\",\"stem\":\"Which standard validates cryptographic modules and is required for US federal cryptographic deployments?\",\"choices\":[\"FIPS 199\",\"FIPS 140-3\",\"Common Criteria EAL4+\",\"ISO/IEC 27001\"],\"correct\":1,\"explanation\":\"FIPS 140-3 (the successor to 140-2) validates cryptographic modules at four levels (1-4). FIPS 199 is security categorisation. CC EAL is general-purpose evaluation. ISO 27001 is ISMS. FIPS 140-3 incorporates ISO/IEC 19790:2012.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://csrc.nist.gov/pubs/fips/140/3/final\",\"title\":\"FIPS 140-3: Security Requirements for Cryptographic Modules\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"fips-140-3\",\"validation\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D3-015\",\"domain\":3,\"subdomain\":\"3.4 Information System Security\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST description of a covert TIMING channel?\",\"choices\":[\"An attacker reading encrypted disk blocks\",\"Two processes communicating by modulating delays in shared resource access\",\"An out-of-band management network\",\"An open SSH tunnel across the relevant policy framework\"],\"correct\":1,\"explanation\":\"A covert timing channel signals information by varying the timing of resource access (CPU, disk, network). The other choices describe overt or unrelated channels. Covert STORAGE channels modulate stored values; covert TIMING channels modulate timing. Both are unintended disclosure paths.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://www.examcollection.com/blog/cissp-exam-prep-deep-dive-into-covert-channel-analysis/\",\"title\":\"ExamCollection: Deep Dive into Covert Channel Analysis\",\"captured\":\"2026-04-26\"},{\"url\":\"https://www.cybrary.it/blog/covert-channel-analysis\",\"title\":\"Cybrary: CISSP Study Guide \\u2014 Covert Channel Analysis\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"covert-channel\",\"timing\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D3-016\",\"domain\":3,\"subdomain\":\"3.4 Side Channels\",\"difficulty\":\"medium\",\"stem\":\"Which attack relies on observing power consumption or electromagnetic emanations during cryptographic operations?\",\"choices\":[\"Replay attack\",\"Side-channel attack\",\"Birthday attack\",\"Padding oracle\"],\"correct\":1,\"explanation\":\"Side-channel attacks exploit physical observations (power, EM, timing, acoustic) made during processing to recover keys. Replay reuses captured messages; birthday targets hash collision math; padding oracles abuse error responses in CBC. Mitigations include constant-time code, masking, and shielding.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://www.usenix.org/system/files/sec20-moghimi-tpm.pdf\",\"title\":\"USENIX: TPM-Fail \\u2014 TPM meets Timing and Lattice Attacks\",\"captured\":\"2026-04-26\"},{\"url\":\"https://www.threatonthewire.com/cissp-domain-3-securing-hardware-platform/\",\"title\":\"ThreatOnTheWire: Securing the Hardware Platform \\u2014 CISSP Domain 3\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"side-channel\",\"physical-attack\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D3-017\",\"domain\":3,\"subdomain\":\"3.6 Physical Security\",\"difficulty\":\"easy\",\"stem\":\"Which fire suppression class is APPROPRIATE for an electrical equipment fire?\",\"choices\":[\"Class A (water)\",\"Class B (oil/gas)\",\"Class C (electrical)\",\"Class D (combustible metals)\"],\"correct\":2,\"explanation\":\"Class C is electrical equipment. Class A is ordinary combustibles, Class B is flammable liquids, Class D is metals like magnesium. For data centers, clean-agent (FM-200, Novec 1230) or inert gas (Inergen) systems handle electrical fires without conductive water damage.\",\"source\":\"guide\",\"guide_pages\":[920,924],\"guide_section\":\"Chapter 10 \\u2014 Fire Suppression\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-3-security-architecture-and-engineering/\",\"title\":\"DestCert: CISSP Domain 3 \\u2014 Comprehensive Security Architecture Guide\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"fire-class\",\"physical\"],\"notes\":\"\",\"chapter\":7},{\"id\":\"D3-018\",\"domain\":3,\"subdomain\":\"3.6 Physical Security\",\"difficulty\":\"medium\",\"stem\":\"What is the PRIMARY benefit of CPTED (Crime Prevention Through Environmental Design)?\",\"choices\":[\"Reducing security personnel headcount in commonly cited frameworks\",\"Designing the environment to reduce criminal opportunity through territoriality, surveillance, and access control\",\"Eliminating the need for cameras across the relevant control set\",\"Lowering insurance premiums in most operational contexts in most enterprise deployments\"],\"correct\":1,\"explanation\":\"CPTED uses environmental cues (sight lines, lighting, landscaping, signage, layout) to deter crime. Headcount, camera reduction, and insurance are tangential. The three CPTED strategies often tested are natural surveillance, natural access control, and territorial reinforcement.\",\"source\":\"guide\",\"guide_pages\":[915,920],\"guide_section\":\"Chapter 10 \\u2014 CPTED\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-3-security-architecture-and-engineering/\",\"title\":\"DestCert: CISSP Domain 3 \\u2014 Comprehensive Security Architecture Guide\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"cpted\",\"physical\"],\"notes\":\"\",\"chapter\":7},{\"id\":\"D3-019\",\"domain\":3,\"subdomain\":\"3.6 Physical Security\",\"difficulty\":\"medium\",\"stem\":\"Which datacenter HVAC consideration is MOST critical for equipment longevity?\",\"choices\":[\"Quiet operation in commonly cited frameworks\",\"Maintained temperature and humidity within manufacturer specifications\",\"Aesthetic colour scheme for the purposes of this question\",\"Light intensity in standard practice\"],\"correct\":1,\"explanation\":\"Heat and humidity drift are the dominant electronic failure causes \\u2014 datacenters target ~64-81\\u00b0F (18-27\\u00b0C) and 40-60% relative humidity per ASHRAE TC 9.9. Excess humidity \\u2192 corrosion; low humidity \\u2192 ESD. Aesthetics and lighting are not equipment factors.\",\"source\":\"guide\",\"guide_pages\":[922,926],\"guide_section\":\"Chapter 10 \\u2014 HVAC\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-3-security-architecture-and-engineering/\",\"title\":\"DestCert: CISSP Domain 3 \\u2014 Comprehensive Security Architecture Guide\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"hvac\",\"physical\"],\"notes\":\"\",\"chapter\":7},{\"id\":\"D3-020\",\"domain\":3,\"subdomain\":\"3.3 Crypto\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST description of perfect forward secrecy (PFS)?\",\"choices\":[\"Long-term keys are stored in escrow in most operational contexts\",\"Compromise of long-term private keys does not allow decryption of past session traffic\",\"All sessions use the same ephemeral key\",\"Each user has a unique permanent key\"],\"correct\":1,\"explanation\":\"PFS uses ephemeral session keys (DHE/ECDHE) that are not derivable from long-term keys, so capturing long-term keys later does not retroactively decrypt past sessions. TLS 1.3 mandates PFS by removing RSA key transport. Choices A, C, D contradict the property.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://datatracker.ietf.org/doc/html/rfc8446\",\"title\":\"RFC 8446: TLS 1.3\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"pfs\",\"tls-1.3\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D3-021\",\"domain\":3,\"subdomain\":\"3.3 Crypto\",\"difficulty\":\"medium\",\"stem\":\"Which mechanism BEST establishes that a public key actually belongs to its claimed owner in a PKI?\",\"choices\":[\"Self-signed certificate\",\"X.509 certificate signed by a trusted Certificate Authority\",\"DNS TXT record as a baseline configuration\",\"Email confirmation only\"],\"correct\":1,\"explanation\":\"X.509 certificates issued by trusted CAs bind a public key to an identity through the CA's verification + signature. Self-signed certificates lack third-party validation. DNS TXT records can support verification (DANE, ACME) but are not the binding mechanism. Email is too weak.\",\"source\":\"guide\",\"guide_pages\":[870,880],\"guide_section\":\"Chapter 7 \\u2014 PKI\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cryptography-mindmap-cissp-domain-3/\",\"title\":\"DestCert: Cryptography MindMap \\u2014 CISSP Domain 3\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"pki\",\"certificate\"],\"notes\":\"\",\"chapter\":7},{\"id\":\"D3-022\",\"domain\":3,\"subdomain\":\"3.3 Crypto\",\"difficulty\":\"medium\",\"stem\":\"Which mechanism is the FASTEST to revoke a compromised certificate in real-time?\",\"choices\":[\"Certificate Revocation List (CRL) downloaded daily\",\"Online Certificate Status Protocol (OCSP) with stapling\",\"Manual phone call to relying parties\",\"DNS TTL expiration\"],\"correct\":1,\"explanation\":\"OCSP returns near-real-time status; OCSP stapling has the server attach a fresh signed response, avoiding client-side OCSP requests. CRLs are typically published periodically and may be hours/days stale. Calls and DNS TTL are not certificate-revocation mechanisms.\",\"source\":\"guide\",\"guide_pages\":[885,890],\"guide_section\":\"Chapter 7 \\u2014 CRL/OCSP\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cryptography-mindmap-cissp-domain-3/\",\"title\":\"DestCert: Cryptography MindMap \\u2014 CISSP Domain 3\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"ocsp\",\"revocation\"],\"notes\":\"\",\"chapter\":7},{\"id\":\"D3-023\",\"domain\":3,\"subdomain\":\"3.3 Crypto\",\"difficulty\":\"medium\",\"stem\":\"Which is the PRIMARY purpose of key escrow?\",\"choices\":[\"Allow the vendor to monitor traffic under typical operating conditions\",\"Provide an authorised third party access to keys under defined conditions\",\"Increase key length in commonly cited frameworks\",\"Speed up key generation for the purposes of this question\"],\"correct\":1,\"explanation\":\"Key escrow stores keys with a trusted third party for retrieval under defined conditions. It is controversial because it weakens guarantee of sole possession but is sometimes required by regulation or operationally for ediscovery. The other choices misdescribe escrow.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://csrc.nist.gov/pubs/sp/800/57/pt1/r5/final\",\"title\":\"NIST SP 800-57 Part 1 Rev 5: Recommendation for Key Management\",\"captured\":\"2026-04-26\"},{\"url\":\"https://destcert.com/resources/cryptography-mindmap-cissp-domain-3/\",\"title\":\"DestCert: Cryptography MindMap \\u2014 CISSP Domain 3\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"key-escrow\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D3-024\",\"domain\":3,\"subdomain\":\"3.4 Capabilities\",\"difficulty\":\"medium\",\"stem\":\"What is the PRIMARY purpose of a Trusted Computing Base (TCB)?\",\"choices\":[\"Defining the perimeter network in commonly cited frameworks\",\"The set of components within a system whose correct operation is essential to enforcing the security policy\",\"Listing approved vendors across the relevant policy framework given current best practices\",\"Documenting cryptographic libraries given current best practices\"],\"correct\":1,\"explanation\":\"The TCB is the set of hardware, software, and firmware whose correctness is essential to enforcing the security policy. Reducing the TCB reduces attack surface \\u2014 a key principle in formal models. The other choices are unrelated.\",\"source\":\"guide\",\"guide_pages\":[795,800],\"guide_section\":\"Chapter 8 \\u2014 TCB\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-3-security-architecture-and-engineering/\",\"title\":\"DestCert: CISSP Domain 3 \\u2014 Comprehensive Security Architecture Guide\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"tcb\",\"reference-monitor\"],\"notes\":\"\",\"chapter\":6},{\"id\":\"D3-025\",\"domain\":3,\"subdomain\":\"3.4 Reference Monitor\",\"difficulty\":\"easy\",\"stem\":\"Which is NOT a property of a reference monitor?\",\"choices\":[\"Always invoked\",\"Tamper-proof\",\"Small enough to be analysed and tested\",\"Modifiable at runtime by users\"],\"correct\":3,\"explanation\":\"Reference monitor properties (the 'NEAT' / 'always invoked + tamper-proof + verifiable' triad): always invoked, tamper-proof, and small/verifiable. User-runtime modification would defeat the security guarantee. The OS kernel implements the reference monitor concept.\",\"source\":\"guide\",\"guide_pages\":[796,800],\"guide_section\":\"Chapter 8 \\u2014 Reference Monitor\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-3-security-architecture-and-engineering/\",\"title\":\"DestCert: CISSP Domain 3 \\u2014 Comprehensive Security Architecture Guide\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"reference-monitor\"],\"notes\":\"\",\"chapter\":6},{\"id\":\"D3-026\",\"domain\":3,\"subdomain\":\"3.5 Crypto Attacks\",\"difficulty\":\"medium\",\"stem\":\"A 'birthday attack' is MOST relevant to which cryptographic primitive?\",\"choices\":[\"Symmetric encryption\",\"Hash functions\",\"Public-key encryption\",\"Random number generators\"],\"correct\":1,\"explanation\":\"Birthday paradox attacks search for collisions in hash functions \\u2014 the expected effort to find a collision is roughly 2^(n/2) for an n-bit hash. SHA-1 (160 bits \\u2192 ~2^80) is consequently considered weak; SHA-256 (~2^128) remains strong. The other choices are not the canonical target.\",\"source\":\"guide\",\"guide_pages\":[863,868],\"guide_section\":\"Chapter 6 \\u2014 Birthday Attack\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cryptography-mindmap-cissp-domain-3/\",\"title\":\"DestCert: Cryptography MindMap \\u2014 CISSP Domain 3\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"birthday-attack\",\"hash\"],\"notes\":\"\",\"chapter\":6},{\"id\":\"D3-027\",\"domain\":3,\"subdomain\":\"3.5 Crypto Attacks\",\"difficulty\":\"medium\",\"stem\":\"Which attack pattern relies on the attacker observing how a system reacts to malformed padding to recover plaintext?\",\"choices\":[\"Padding oracle attack\",\"Replay attack\",\"Brute force\",\"Differential cryptanalysis\"],\"correct\":0,\"explanation\":\"Padding oracle attacks (POODLE in SSL3, BEAST adjacent issues, AES-CBC mishandling) decrypt by submitting modified ciphertext and observing whether the server accepts or rejects. Authenticated encryption (GCM) prevents this. Replay reuses; brute force tries every key; differential analyses chosen-plaintext distributions.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cryptography-mindmap-cissp-domain-3/\",\"title\":\"DestCert: Cryptography MindMap \\u2014 CISSP Domain 3\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"padding-oracle\",\"cbc\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D3-028\",\"domain\":3,\"subdomain\":\"3.3 Crypto\",\"difficulty\":\"medium\",\"stem\":\"Which protocol provides authenticated key exchange suitable for resisting man-in-the-middle attacks during ephemeral session establishment?\",\"choices\":[\"Anonymous Diffie-Hellman across the relevant control set\",\"Authenticated DHE / ECDHE with certificate-based identity\",\"MD5 fingerprinting for the purposes of this question\",\"Static RSA key transport for the purposes of this question\"],\"correct\":1,\"explanation\":\"Plain DH/ECDHE provides forward secrecy but is unauthenticated alone \\u2014 it must be combined with certificate-based identity (TLS_ECDHE_*_*_GCM_*) to resist MITM. Anonymous DH is vulnerable. MD5 is broken. Static RSA key transport gives no PFS and is removed from TLS 1.3.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cryptography-mindmap-cissp-domain-3/\",\"title\":\"DestCert: Cryptography MindMap \\u2014 CISSP Domain 3\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"dhe\",\"tls\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D3-029\",\"domain\":3,\"subdomain\":\"3.4 Hardening\",\"difficulty\":\"medium\",\"stem\":\"Which secure-design principle says a system should DEFAULT to denying access when an explicit allow is missing?\",\"choices\":[\"Open design\",\"Fail-safe defaults\",\"Economy of mechanism\",\"Complete mediation\"],\"correct\":1,\"explanation\":\"Fail-safe defaults (a Saltzer & Schroeder principle) says deny by default; access is granted only by explicit allow. Open design says security should not depend on obscurity. Economy of mechanism keeps designs simple. Complete mediation requires every access to be checked.\",\"source\":\"guide\",\"guide_pages\":[778,783],\"guide_section\":\"Chapter 9 \\u2014 Secure Design\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-3-security-architecture-and-engineering/\",\"title\":\"DestCert: CISSP Domain 3 \\u2014 Comprehensive Security Architecture Guide\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"fail-safe\",\"saltzer-schroeder\"],\"notes\":\"\",\"chapter\":6},{\"id\":\"D3-030\",\"domain\":3,\"subdomain\":\"3.4 Hardening\",\"difficulty\":\"medium\",\"stem\":\"Which secure-design principle says EVERY access to EVERY object must be checked for authority?\",\"choices\":[\"Least privilege\",\"Complete mediation\",\"Open design\",\"Defense in depth\"],\"correct\":1,\"explanation\":\"Complete mediation requires every access (not just first access) be checked \\u2014 caching access decisions can violate it (TOCTOU class issues). Least privilege limits rights. Open design avoids security-by-obscurity. Defense in depth layers controls.\",\"source\":\"guide\",\"guide_pages\":[779,783],\"guide_section\":\"Chapter 9 \\u2014 Saltzer-Schroeder\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-3-security-architecture-and-engineering/\",\"title\":\"DestCert: CISSP Domain 3 \\u2014 Comprehensive Security Architecture Guide\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"complete-mediation\"],\"notes\":\"\",\"chapter\":6},{\"id\":\"D3-031\",\"domain\":3,\"subdomain\":\"3.7 Embedded Systems\",\"difficulty\":\"medium\",\"stem\":\"What is the GREATEST security challenge introduced by IoT devices in an enterprise?\",\"choices\":[\"High initial purchase cost across the relevant control set\",\"Long lifespans, infrequent patching, weak default credentials, and lateral-movement potential\",\"Excessive power consumption in commonly cited frameworks\",\"Limited colour displays for general production deployments in most enterprise deployments\"],\"correct\":1,\"explanation\":\"IoT devices typically combine outdated firmware, default creds, exposed management interfaces, and 5-10+ year lifespans \\u2014 they become persistent footholds (Mirai-class botnets). Mitigations include segmentation, MFA where supported, vendor SBOM review, and lifecycle planning.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-3-security-architecture-and-engineering/\",\"title\":\"DestCert: CISSP Domain 3 \\u2014 Comprehensive Security Architecture Guide\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"iot\",\"embedded\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D3-032\",\"domain\":3,\"subdomain\":\"3.7 Cloud\",\"difficulty\":\"medium\",\"stem\":\"Under the cloud shared responsibility model, who is typically responsible for the GUEST OS patches in an IaaS deployment?\",\"choices\":[\"The cloud provider\",\"The customer\",\"The hypervisor vendor\",\"Shared 50/50\"],\"correct\":1,\"explanation\":\"In IaaS, the customer manages from the guest OS upward (OS, runtimes, applications, data). The provider handles physical, network, hypervisor. PaaS shifts more to the provider; SaaS shifts almost everything except identity/data classification. Knowing the responsibility split per service model is exam-critical.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-3-security-architecture-and-engineering/\",\"title\":\"DestCert: CISSP Domain 3 \\u2014 Comprehensive Security Architecture Guide\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"cloud\",\"shared-responsibility\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D3-033\",\"domain\":3,\"subdomain\":\"3.7 Virtualisation\",\"difficulty\":\"medium\",\"stem\":\"Which is the PRIMARY security risk introduced by hypervisor 'VM escape' vulnerabilities?\",\"choices\":[\"Slow VM startup across the relevant policy framework\",\"A guest VM can break out of isolation and compromise the host or other guests\",\"Higher licensing fees\",\"Loss of NTP synchronisation\"],\"correct\":1,\"explanation\":\"VM escape breaks the hypervisor's isolation guarantee, allowing one guest to access the host or other guests \\u2014 catastrophic in multi-tenant clouds. Mitigation includes hypervisor patching, minimal attack surface (Type 1 hypervisors), and tenant isolation policies.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-3-security-architecture-and-engineering/\",\"title\":\"DestCert: CISSP Domain 3 \\u2014 Comprehensive Security Architecture Guide\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"vm-escape\",\"hypervisor\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D3-034\",\"domain\":3,\"subdomain\":\"3.5 Capabilities\",\"difficulty\":\"easy\",\"stem\":\"What is 'process isolation' designed to ensure?\",\"choices\":[\"Faster context switching as a baseline configuration across the relevant control set\",\"Each process operates in its own protected memory space, unable to read or modify others\",\"Identical priority scheduling across the relevant control set\",\"Equal CPU time per process across the relevant control set\"],\"correct\":1,\"explanation\":\"Process isolation prevents one process from interfering with another's memory or state \\u2014 implemented via virtual memory, MMU enforcement, and OS access controls. Without it, a single bug or malware could cascade. Choices A, C, D are unrelated to isolation.\",\"source\":\"guide\",\"guide_pages\":[815,820],\"guide_section\":\"Chapter 8 \\u2014 Memory Protection\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-3-security-architecture-and-engineering/\",\"title\":\"DestCert: CISSP Domain 3 \\u2014 Comprehensive Security Architecture Guide\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"isolation\",\"memory\"],\"notes\":\"\",\"chapter\":6},{\"id\":\"D3-035\",\"domain\":3,\"subdomain\":\"3.4 Memory\",\"difficulty\":\"medium\",\"stem\":\"Which technique randomises memory addresses to make exploitation of memory corruption more difficult?\",\"choices\":[\"DEP\",\"ASLR\",\"SMEP\",\"NX bit\"],\"correct\":1,\"explanation\":\"ASLR (Address Space Layout Randomisation) randomises base addresses of code/heap/stack/libraries. DEP marks data pages non-executable. NX is the hardware bit DEP uses. SMEP prevents kernel from executing user-space pages. CISSP often pairs ASLR + DEP/NX as standard defences.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-3-security-architecture-and-engineering/\",\"title\":\"DestCert: CISSP Domain 3 \\u2014 Comprehensive Security Architecture Guide\",\"captured\":\"2026-04-26\"},{\"url\":\"https://destcert.com/resources/vulnerabilities-in-systems-mindmap-cissp-domain-3/\",\"title\":\"DestCert: Vulnerabilities in Systems MindMap \\u2014 Domain 3\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"aslr\",\"memory\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D3-036\",\"domain\":3,\"subdomain\":\"3.6 Physical\",\"difficulty\":\"medium\",\"stem\":\"Which lock type provides the HIGHEST level of resistance to physical attack and is GENERALLY required for high-classification facilities?\",\"choices\":[\"Standard pin tumbler\",\"Combination dial\",\"Biometric reader integrated with mantrap\",\"Smart-card with motion-detection door\"],\"correct\":2,\"explanation\":\"For high-security entry, layered controls (mantrap + biometric + supervisor approval) provide the strongest assurance. Pin tumblers are easily picked or bumped. Combination locks vary in quality. The answer reflects defense-in-depth: a single technology rarely suffices for high-classification rooms.\",\"source\":\"guide\",\"guide_pages\":[928,932],\"guide_section\":\"Chapter 10 \\u2014 Physical Access\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-3-security-architecture-and-engineering/\",\"title\":\"DestCert: CISSP Domain 3 \\u2014 Comprehensive Security Architecture Guide\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"mantrap\",\"physical\"],\"notes\":\"\",\"chapter\":7},{\"id\":\"D3-037\",\"domain\":3,\"subdomain\":\"3.5 Trust\",\"difficulty\":\"medium\",\"stem\":\"Which trust model is implemented when a CA at the top of a hierarchy issues subordinate-CA certificates that issue end-entity certificates?\",\"choices\":[\"Web of trust\",\"Hierarchical trust\",\"Cross-certification mesh\",\"Bridge CA\"],\"correct\":1,\"explanation\":\"Hierarchical (root \\u2192 subordinate \\u2192 end-entity) is the standard PKI structure (e.g., public web PKI). Web of trust (PGP) is peer-based. Cross-certification establishes pairwise trust. Bridge CA connects multiple PKIs through a central node.\",\"source\":\"guide\",\"guide_pages\":[882,886],\"guide_section\":\"Chapter 7 \\u2014 Trust Models\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cryptography-mindmap-cissp-domain-3/\",\"title\":\"DestCert: Cryptography MindMap \\u2014 CISSP Domain 3\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"pki\",\"hierarchical\"],\"notes\":\"\",\"chapter\":7},{\"id\":\"D3-038\",\"domain\":3,\"subdomain\":\"3.3 Crypto\",\"difficulty\":\"easy\",\"stem\":\"Which property is required of a hash function for use in digital signatures?\",\"choices\":[\"Reversibility\",\"Collision resistance\",\"Key dependency\",\"Variable output length\"],\"correct\":1,\"explanation\":\"Hash functions for signatures must be collision-resistant (two different inputs producing the same digest would let an attacker forge a signature). They are deliberately one-way (irreversible), keyless (unlike MACs), and produce fixed-length output.\",\"source\":\"guide\",\"guide_pages\":[862,866],\"guide_section\":\"Chapter 6 \\u2014 Hash Properties\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cryptography-mindmap-cissp-domain-3/\",\"title\":\"DestCert: Cryptography MindMap \\u2014 CISSP Domain 3\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"hash\",\"collision\"],\"notes\":\"\",\"chapter\":6},{\"id\":\"D3-039\",\"domain\":3,\"subdomain\":\"3.3 Crypto\",\"difficulty\":\"medium\",\"stem\":\"Which symmetric algorithm is the CURRENT US federal standard for encrypting classified information?\",\"choices\":[\"DES\",\"3DES\",\"AES\",\"RC4\"],\"correct\":2,\"explanation\":\"AES is FIPS 197, replacing DES. 3DES is deprecated by NIST since 2023 (SP 800-131A Rev 3). DES has 56-bit keys (broken). RC4 has multiple cryptographic flaws. AES with appropriate key length (128/192/256) and AEAD mode is the current standard.\",\"source\":\"guide\",\"guide_pages\":[850,855],\"guide_section\":\"Chapter 6 \\u2014 AES\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/types-of-ciphers/\",\"title\":\"DestCert: Types of Ciphers \\u2014 ECB, CBC, OFB & More\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"aes\",\"fips-197\"],\"notes\":\"\",\"chapter\":6},{\"id\":\"D3-040\",\"domain\":3,\"subdomain\":\"3.4 Memory Protection\",\"difficulty\":\"medium\",\"stem\":\"Which CPU feature explicitly marks memory pages as non-executable to prevent execution of injected shellcode?\",\"choices\":[\"ASLR\",\"DEP / NX bit\",\"Stack canaries\",\"ROP-guard\"],\"correct\":1,\"explanation\":\"DEP (Data Execution Prevention) using the hardware NX bit marks data pages non-executable. ASLR randomises addresses; stack canaries detect overflow; ROP-guard targets return-oriented programming. DEP+ASLR is the baseline OS hardening combo against memory-corruption exploits.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-3-security-architecture-and-engineering/\",\"title\":\"DestCert: CISSP Domain 3 \\u2014 Comprehensive Security Architecture Guide\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"dep\",\"nx-bit\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D3-041\",\"domain\":3,\"subdomain\":\"3.7 Embedded\",\"difficulty\":\"medium\",\"stem\":\"Secure boot ensures that:\",\"choices\":[\"The OS boots from any media when applied to standard enterprise environments\",\"Each stage of the boot chain verifies a signature on the next stage before executing\",\"The bootloader is encrypted\",\"Hardware identifiers are randomised\"],\"correct\":1,\"explanation\":\"Secure boot establishes a chain of trust: UEFI verifies bootloader, bootloader verifies kernel, etc. Any unsigned or modified component halts the chain. Encryption of the bootloader is unrelated. The other choices misdescribe the mechanism.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://www.threatonthewire.com/cissp-domain-3-securing-hardware-platform/\",\"title\":\"ThreatOnTheWire: Securing the Hardware Platform \\u2014 CISSP Domain 3\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"secure-boot\",\"trust-chain\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D3-042\",\"domain\":3,\"subdomain\":\"3.5 Crypto\",\"difficulty\":\"medium\",\"stem\":\"Which key length is the MINIMUM AES key size considered acceptable for protecting CLASSIFIED data per CNSA Suite (Commercial National Security Algorithm Suite)?\",\"choices\":[\"AES-128\",\"AES-192\",\"AES-256\",\"AES-512\"],\"correct\":2,\"explanation\":\"CNSA 2.0 requires AES-256 for symmetric encryption of TOP SECRET data. AES-128 is acceptable for SECRET-and-below in CNSA 1.0 but the 2024 CNSA 2.0 update raises requirements. AES-512 does not exist as a standard. CNSA also addresses post-quantum migration.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://csrc.nist.gov/pubs/sp/800/57/pt1/r5/final\",\"title\":\"NIST SP 800-57 Part 1 Rev 5: Recommendation for Key Management\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"aes-256\",\"cnsa\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D3-043\",\"domain\":3,\"subdomain\":\"3.6 Physical\",\"difficulty\":\"medium\",\"stem\":\"Which fire-suppression agent is INAPPROPRIATE for an occupied datacenter due to suffocation risk?\",\"choices\":[\"FM-200\",\"Novec 1230\",\"Pure CO\\u2082 flooding to \\u226534% concentration\",\"Inergen (mixed inert gases)\"],\"correct\":2,\"explanation\":\"CO\\u2082 at firefighting concentrations is lethal \\u2014 it MUST not be used in occupied spaces. FM-200, Novec 1230, and Inergen are designed to be safe at design concentrations. Modern datacenters favor clean agents over CO\\u2082 for this reason.\",\"source\":\"guide\",\"guide_pages\":[922,926],\"guide_section\":\"Chapter 10 \\u2014 Fire Suppression\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-3-security-architecture-and-engineering/\",\"title\":\"DestCert: CISSP Domain 3 \\u2014 Comprehensive Security Architecture Guide\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"fire\",\"co2\"],\"notes\":\"\",\"chapter\":7},{\"id\":\"D3-044\",\"domain\":3,\"subdomain\":\"3.4 Models\",\"difficulty\":\"medium\",\"stem\":\"Which model uses subjects, objects, and a security label lattice with read/write rules but ALLOWS for limited 'trusted subjects' to violate the *-property as needed for system administration?\",\"choices\":[\"Bell-LaPadula\",\"Biba\",\"Brewer-Nash\",\"Information-Flow Model\"],\"correct\":0,\"explanation\":\"Bell-LaPadula explicitly recognises 'trusted subjects' that can violate strict rules under controlled conditions (e.g., a system admin downgrading data after declassification). Biba does not have an analogous concept. Brewer-Nash is dynamic. Information-flow models are the broader theoretical class.\",\"source\":\"guide\",\"guide_pages\":[748,753],\"guide_section\":\"Chapter 8 \\u2014 BLP Trusted Subjects\",\"web_sources\":[{\"url\":\"https://siit.co/blog/cissp-security-models-bell-lapadula-biba-and-clark-wilson-in-exams/51331\",\"title\":\"SIIT: CISSP Security Models in Exams\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"bell-lapadula\",\"trusted-subject\"],\"notes\":\"\",\"chapter\":5},{\"id\":\"D3-045\",\"domain\":3,\"subdomain\":\"3.4 Models\",\"difficulty\":\"medium\",\"stem\":\"Which model formally describes how rights can be passed between subjects via 'take' and 'grant' operations?\",\"choices\":[\"Bell-LaPadula\",\"Biba\",\"Take-Grant\",\"Graham-Denning\"],\"correct\":2,\"explanation\":\"Take-Grant analyses authorised propagation of rights using directed graphs and four primitives. Graham-Denning provides eight rules for creating/deleting subjects, objects, and rights. Bell-LaPadula and Biba focus on access decisions, not propagation analysis.\",\"source\":\"guide\",\"guide_pages\":[761,764],\"guide_section\":\"Chapter 8 \\u2014 Take-Grant\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-3-security-architecture-and-engineering/\",\"title\":\"DestCert: CISSP Domain 3 \\u2014 Comprehensive Security Architecture Guide\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"take-grant\",\"graham-denning\"],\"notes\":\"\",\"chapter\":6},{\"id\":\"D3-046\",\"domain\":3,\"subdomain\":\"3.5 Trust\",\"difficulty\":\"medium\",\"stem\":\"Which control type does a 'guard' (in the cross-domain solution sense) primarily implement?\",\"choices\":[\"Auditing in standard practice\",\"Filtering of data traversing security domains based on inspection and policy\",\"Encryption across the relevant control set\",\"Network address translation across the relevant control set\"],\"correct\":1,\"explanation\":\"A guard inspects content and metadata moving between security domains and either passes, sanitises, or blocks per policy (e.g., MILS systems, HSTS guards). Encryption is unrelated; NAT is layer-3 translation; auditing is observation, not enforcement.\",\"source\":\"guide\",\"guide_pages\":[800,804],\"guide_section\":\"Chapter 8 \\u2014 Cross-Domain\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-3-security-architecture-and-engineering/\",\"title\":\"DestCert: CISSP Domain 3 \\u2014 Comprehensive Security Architecture Guide\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"guard\",\"cds\"],\"notes\":\"\",\"chapter\":6},{\"id\":\"D3-047\",\"domain\":3,\"subdomain\":\"3.3 Crypto\",\"difficulty\":\"medium\",\"stem\":\"An organisation needs to encrypt a 1 GB file for a colleague. Which approach is BEST?\",\"choices\":[\"Encrypt the file directly with the colleague's RSA-2048 public key in commonly cited frameworks\",\"Generate a random AES-256 session key, encrypt the file with AES, then encrypt only the session key with the colleague's RSA public key\",\"Use a shared password with PBKDF2 under typical operating conditions\",\"Sign the file for the purposes of this question\"],\"correct\":1,\"explanation\":\"Hybrid encryption (symmetric for bulk + asymmetric for the key) is the pragmatic standard \\u2014 RSA cannot encrypt large data efficiently. PBKDF2 + shared password requires out-of-band key sharing. Signing provides integrity, not confidentiality. TLS, S/MIME, PGP all use hybrid encryption.\",\"source\":\"guide\",\"guide_pages\":[875,880],\"guide_section\":\"Chapter 6 \\u2014 Hybrid Encryption\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cryptography-mindmap-cissp-domain-3/\",\"title\":\"DestCert: Cryptography MindMap \\u2014 CISSP Domain 3\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"hybrid-encryption\",\"pgp\"],\"notes\":\"\",\"chapter\":7},{\"id\":\"D3-048\",\"domain\":3,\"subdomain\":\"3.5 Crypto Attacks\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST mitigation for length-extension attacks on hash-based MACs?\",\"choices\":[\"Use SHA-1\",\"Use HMAC instead of plain hash\",\"Concatenate the secret key after the message\",\"Use ECB mode\"],\"correct\":1,\"explanation\":\"HMAC's nested structure prevents length-extension attacks that affect Merkle-Damg\\u00e5rd hashes (SHA-1, SHA-256). Plain `H(secret || message)` is vulnerable. Concatenating the key at the end (`H(message || secret)`) is also weaker than HMAC. ECB is unrelated.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cryptography-mindmap-cissp-domain-3/\",\"title\":\"DestCert: Cryptography MindMap \\u2014 CISSP Domain 3\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"hmac\",\"length-extension\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D3-049\",\"domain\":3,\"subdomain\":\"3.4 Architecture\",\"difficulty\":\"medium\",\"stem\":\"Which capability ensures a process cannot interfere with another's memory or device access?\",\"choices\":[\"Process isolation enforced by the operating system / hypervisor\",\"Antivirus scanning in standard practice\",\"Logging under typical operating conditions\",\"RAID storage given current best practices\"],\"correct\":0,\"explanation\":\"Process/memory isolation enforced by OS kernel and CPU MMU separation prevents cross-process interference. Antivirus catches known bad code. Logging is observation. RAID is storage redundancy. Isolation is the mechanism that prevents the interference, not the detective controls.\",\"source\":\"guide\",\"guide_pages\":[816,820],\"guide_section\":\"Chapter 8 \\u2014 Isolation\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-3-security-architecture-and-engineering/\",\"title\":\"DestCert: CISSP Domain 3 \\u2014 Comprehensive Security Architecture Guide\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"isolation\",\"process\"],\"notes\":\"\",\"chapter\":6},{\"id\":\"D3-050\",\"domain\":3,\"subdomain\":\"3.4 Capabilities\",\"difficulty\":\"medium\",\"stem\":\"Which is the PRIMARY purpose of a security kernel?\",\"choices\":[\"To run with maximum privileges only\",\"To implement the reference monitor concept\",\"To act as a firewall\",\"To compress files\"],\"correct\":1,\"explanation\":\"The security kernel implements the reference monitor \\u2014 mediating all access decisions enforceable by the TCB. Privilege is a property; firewalls and compression are unrelated. The security kernel is the realisation of the reference-monitor concept in code.\",\"source\":\"guide\",\"guide_pages\":[796,802],\"guide_section\":\"Chapter 8 \\u2014 Security Kernel\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-3-security-architecture-and-engineering/\",\"title\":\"DestCert: CISSP Domain 3 \\u2014 Comprehensive Security Architecture Guide\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"security-kernel\"],\"notes\":\"\",\"chapter\":6},{\"id\":\"D3-051\",\"domain\":3,\"subdomain\":\"3.7 Cloud\",\"difficulty\":\"medium\",\"stem\":\"In a SaaS deployment, which security responsibility is MOST clearly retained by the customer?\",\"choices\":[\"Patching the underlying database in commonly cited frameworks\",\"Identity and access management for the customer's users; data classification; data ingest decisions\",\"Maintaining the data center physical security for the purposes of this question\",\"Hypervisor patches in commonly cited frameworks\"],\"correct\":1,\"explanation\":\"Even in SaaS, customers retain responsibility for who has access (IAM), what data goes in, and how it is classified. Provider handles infrastructure, platform, and most of the application. Knowing the SaaS responsibility line is high-yield for the exam.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-3-security-architecture-and-engineering/\",\"title\":\"DestCert: CISSP Domain 3 \\u2014 Comprehensive Security Architecture Guide\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"saas\",\"shared-responsibility\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D3-052\",\"domain\":3,\"subdomain\":\"3.3 Crypto\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST description of 'salt' in password hashing?\",\"choices\":[\"A pepper added to the database across the relevant control set\",\"Random per-user data concatenated with the password before hashing to defeat precomputed rainbow tables\",\"An encryption key when properly implemented\",\"A second factor across the relevant policy framework in standard practice\"],\"correct\":1,\"explanation\":\"Salt is unique per-credential random data, stored in the clear with the hash, that prevents precomputed rainbow-table reuse and ensures identical passwords have different hashes. 'Pepper' is a distinct per-system secret. The other choices misdescribe salt.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cryptography-mindmap-cissp-domain-3/\",\"title\":\"DestCert: Cryptography MindMap \\u2014 CISSP Domain 3\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"salt\",\"password-hashing\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D4-001\",\"domain\":4,\"subdomain\":\"4.1 OSI Model\",\"difficulty\":\"easy\",\"stem\":\"At which OSI layer do MAC addresses operate?\",\"choices\":[\"Layer 1 (Physical)\",\"Layer 2 (Data Link)\",\"Layer 3 (Network)\",\"Layer 4 (Transport)\"],\"correct\":1,\"explanation\":\"MAC addresses are layer-2 (Data Link) identifiers used by Ethernet, Wi-Fi, etc. IP addresses are layer-3. Physical layer concerns voltages and signaling. Transport handles ports and connection state. Mnemonic: 'Please Do Not Throw Sausage Pizza Away' for OSI layers 1-7.\",\"source\":\"guide\",\"guide_pages\":[1090,1095],\"guide_section\":\"Chapter 11 \\u2014 OSI Model\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-4-communication-and-network-security/\",\"title\":\"DestCert: CISSP Domain 4 \\u2014 Guide to Communication and Network Security\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"osi\",\"data-link\"],\"notes\":\"\",\"chapter\":8},{\"id\":\"D4-002\",\"domain\":4,\"subdomain\":\"4.1 OSI Model\",\"difficulty\":\"easy\",\"stem\":\"At which OSI layer does TLS PRIMARILY operate?\",\"choices\":[\"Layer 4 (Transport)\",\"Layer 5 (Session)\",\"Layer 6 (Presentation)\",\"Layer 7 (Application)\"],\"correct\":1,\"explanation\":\"TLS operates at the Session layer (L5) per ISC2 and Sybex \\u2014 it manages encrypted sessions ABOVE TCP at the Transport layer and BELOW applications. Some references place it at L6 (Presentation) due to its encoding role, and you may occasionally see it described as 'between L4 and L7', but the exam's canonical answer is Session. L4 is wrong because TLS depends on TCP \\u2014 it does not replace the Transport layer. L6 is the second-most-defensible choice but loses to L5 on ISC2 conventions. L7 is wrong because applications consume TLS sessions; they don't provide them.\",\"source\":\"guide\",\"guide_pages\":[1095,1100],\"guide_section\":\"Chapter 11 \\u2014 TLS Layer\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-4-communication-and-network-security/\",\"title\":\"DestCert: CISSP Domain 4 \\u2014 Guide to Communication and Network Security\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"tls\",\"osi-layers\"],\"notes\":\"\",\"chapter\":8},{\"id\":\"D4-003\",\"domain\":4,\"subdomain\":\"4.2 Secure Protocols\",\"difficulty\":\"medium\",\"stem\":\"Which TLS version is the FIRST to mandate forward secrecy and remove RSA key transport?\",\"choices\":[\"TLS 1.0\",\"TLS 1.1\",\"TLS 1.2\",\"TLS 1.3\"],\"correct\":3,\"explanation\":\"TLS 1.3 (RFC 8446) removed RSA key transport and weak ciphers, mandating (EC)DHE for forward secrecy and AEAD ciphers (AES-GCM, ChaCha20-Poly1305). Earlier versions allowed static-RSA cipher suites. TLS 1.0/1.1 are deprecated; 1.2 is still common but lacks the 1.3 simplifications.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://datatracker.ietf.org/doc/html/rfc8446\",\"title\":\"RFC 8446: TLS 1.3\",\"captured\":\"2026-04-26\"}],\"references\":[\"RFC 8446\"],\"tags\":[\"tls-1.3\",\"pfs\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D4-004\",\"domain\":4,\"subdomain\":\"4.2 Secure Protocols\",\"difficulty\":\"medium\",\"stem\":\"Which IPsec component provides confidentiality and integrity for the IP payload?\",\"choices\":[\"AH (Authentication Header)\",\"ESP (Encapsulating Security Payload)\",\"IKE (Internet Key Exchange)\",\"NAT-T\"],\"correct\":1,\"explanation\":\"ESP encrypts the payload (and optionally authenticates it). AH provides integrity-only over the immutable IP header and payload but no confidentiality. IKE negotiates the SAs. NAT-T encapsulates ESP in UDP/4500 to traverse NAT. AH BREAKS through NAT because NAT mutates header fields AH protects.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://datatracker.ietf.org/doc/html/rfc4301\",\"title\":\"RFC 4301: Security Architecture for the Internet Protocol (IPsec)\",\"captured\":\"2026-04-26\"},{\"url\":\"https://www.ietf.org/rfc/rfc4303.txt\",\"title\":\"RFC 4303: IP Encapsulating Security Payload (ESP)\",\"captured\":\"2026-04-26\"}],\"references\":[\"RFC 4303 ESP\"],\"tags\":[\"ipsec\",\"esp\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D4-005\",\"domain\":4,\"subdomain\":\"4.2 Secure Protocols\",\"difficulty\":\"medium\",\"stem\":\"Which IPsec mode encrypts ONLY the payload, leaving the original IP header in the clear?\",\"choices\":[\"Tunnel mode\",\"Transport mode\",\"ESP mode\",\"AH mode\"],\"correct\":1,\"explanation\":\"Transport mode (host-to-host) encrypts only the payload \\u2014 original IP header is visible. Tunnel mode (gateway-to-gateway) encapsulates the entire original IP packet inside a new IP header \\u2014 used for site-to-site VPNs. ESP and AH are protocols, not modes.\",\"source\":\"guide\",\"guide_pages\":[1545,1550],\"guide_section\":\"Chapter 13 \\u2014 IPsec\",\"web_sources\":[{\"url\":\"https://datatracker.ietf.org/doc/html/rfc4301\",\"title\":\"RFC 4301: Security Architecture for the Internet Protocol (IPsec)\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"ipsec-mode\",\"transport-tunnel\"],\"notes\":\"\",\"chapter\":11},{\"id\":\"D4-006\",\"domain\":4,\"subdomain\":\"4.2 DNS\",\"difficulty\":\"medium\",\"stem\":\"Which DNS extension provides cryptographic origin authentication and integrity for DNS responses?\",\"choices\":[\"DNS over HTTPS (DoH)\",\"DNS over TLS (DoT)\",\"DNSSEC\",\"DNS over QUIC\"],\"correct\":2,\"explanation\":\"DNSSEC adds digital signatures to DNS records, proving authenticity and integrity. DoH/DoT/DoQ provide privacy/transport encryption \\u2014 they prevent eavesdropping but do not authenticate the data. Both are useful and address different problems; DNSSEC is the data-authentication answer.\",\"source\":\"guide\",\"guide_pages\":[1430,1435],\"guide_section\":\"Chapter 12 \\u2014 DNSSEC\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-4-communication-and-network-security/\",\"title\":\"DestCert: CISSP Domain 4 \\u2014 Guide to Communication and Network Security\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"dnssec\",\"dns\"],\"notes\":\"\",\"chapter\":10},{\"id\":\"D4-007\",\"domain\":4,\"subdomain\":\"4.3 Wireless\",\"difficulty\":\"medium\",\"stem\":\"Which wireless security mechanism uses Simultaneous Authentication of Equals (SAE) to replace WPA2's pre-shared key handshake?\",\"choices\":[\"WEP\",\"WPA-Personal\",\"WPA2-Personal\",\"WPA3-Personal\"],\"correct\":3,\"explanation\":\"WPA3-Personal uses SAE (a Dragonfly-derived PAKE) instead of WPA2's PSK 4-way handshake, which was vulnerable to offline dictionary attacks if the handshake was captured. WEP and WPA are obsolete. WPA2-PSK uses a less secure 4-way handshake.\",\"source\":\"guide\",\"guide_pages\":[1500,1508],\"guide_section\":\"Chapter 12 \\u2014 WPA3 / SAE\",\"web_sources\":[{\"url\":\"https://www.ironwifi.com/blogs/best-eap-methods-wifi/\",\"title\":\"IronWiFi: Best EAP Methods for Wi-Fi \\u2014 EAP-TLS vs PEAP vs EAP-TTLS\",\"captured\":\"2026-04-26\"},{\"url\":\"https://www.cloudi-fi.com/blog/wpa2-enterprise-802-1x\",\"title\":\"Cloudi-Fi: WPA2/3-Enterprise \\u2014 Secure Wi-Fi with 802.1X authentication\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"wpa3\",\"sae\"],\"notes\":\"\",\"chapter\":10},{\"id\":\"D4-008\",\"domain\":4,\"subdomain\":\"4.3 Wireless\",\"difficulty\":\"medium\",\"stem\":\"Which EAP method is considered the gold standard for enterprise wireless authentication, providing mutual certificate-based authentication?\",\"choices\":[\"EAP-MD5\",\"PEAP\",\"EAP-TTLS\",\"EAP-TLS\"],\"correct\":3,\"explanation\":\"EAP-TLS uses certificates on both client and server for mutual authentication \\u2014 strongest but operationally heavier (requires PKI). PEAP and EAP-TTLS use server-side certificates with inner authentication. EAP-MD5 is weak and obsolete. WPA3-Enterprise prefers EAP-TLS.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://smallstep.com/blog/eaptls-certificate-wifi/\",\"title\":\"SmallStep: Certificate Based Wi-Fi Authentication with RADIUS and EAP-TLS\",\"captured\":\"2026-04-26\"},{\"url\":\"https://www.techtarget.com/searchnetworking/feature/Choosing-the-right-flavor-of-8021X\",\"title\":\"TechTarget: Overview of 802.1X authentication methods and EAP\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"eap-tls\",\"wireless\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D4-009\",\"domain\":4,\"subdomain\":\"4.3 Wireless\",\"difficulty\":\"medium\",\"stem\":\"Which 802.11 attack pattern relies on broadcasting deauthentication frames to disconnect victims and force them to reconnect to a rogue AP?\",\"choices\":[\"Replay attack\",\"Evil twin / deauth attack\",\"MAC flooding\",\"Smurf attack\"],\"correct\":1,\"explanation\":\"Evil twin (rogue AP) attacks often use deauth frames to kick clients off legitimate APs and lure them to attacker-controlled APs with the same SSID. WPA3 includes Protected Management Frames (PMF/802.11w) to defeat deauth attacks. The other choices target other layers/protocols.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-4-communication-and-network-security/\",\"title\":\"DestCert: CISSP Domain 4 \\u2014 Guide to Communication and Network Security\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"evil-twin\",\"deauth\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D4-010\",\"domain\":4,\"subdomain\":\"4.4 Network Devices\",\"difficulty\":\"medium\",\"stem\":\"Which type of firewall maintains a state table of connections and makes decisions based on connection state in addition to packet headers?\",\"choices\":[\"Packet-filter firewall\",\"Stateful inspection firewall\",\"Proxy/application firewall\",\"Bastion host\"],\"correct\":1,\"explanation\":\"Stateful inspection tracks TCP connection state, allowing return traffic for established sessions automatically \\u2014 the modern baseline. Packet-filter firewalls examine each packet in isolation. Application firewalls (proxies) inspect L7 content. Bastion hosts are hardened entry points, not a firewall type.\",\"source\":\"guide\",\"guide_pages\":[1310,1315],\"guide_section\":\"Chapter 12 \\u2014 Firewalls\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-4-communication-and-network-security/\",\"title\":\"DestCert: CISSP Domain 4 \\u2014 Guide to Communication and Network Security\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"firewall\",\"stateful\"],\"notes\":\"\",\"chapter\":10},{\"id\":\"D4-011\",\"domain\":4,\"subdomain\":\"4.4 Network Devices\",\"difficulty\":\"medium\",\"stem\":\"A Next-Generation Firewall (NGFW) DIFFERS from a stateful firewall PRIMARILY by:\",\"choices\":[\"Operating only at layer 7 as a baseline configuration for the purposes of this question\",\"Adding application identification, IPS capability, and often integrated threat intelligence\",\"Eliminating the need for VPNs under typical operating conditions\",\"Using only signature-based detection across the relevant control set\"],\"correct\":1,\"explanation\":\"NGFWs add application awareness (decoding L7 protocols), integrated IPS, and threat-intel-driven blocking \\u2014 beyond simple stateful tracking. They still operate across multiple layers. They don't eliminate VPNs. Behavioral and anomaly-based detection are increasingly common alongside signatures.\",\"source\":\"guide\",\"guide_pages\":[1314,1318],\"guide_section\":\"Chapter 12 \\u2014 NGFW\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-4-communication-and-network-security/\",\"title\":\"DestCert: CISSP Domain 4 \\u2014 Guide to Communication and Network Security\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"ngfw\",\"firewall\"],\"notes\":\"\",\"chapter\":10},{\"id\":\"D4-012\",\"domain\":4,\"subdomain\":\"4.4 Network Devices\",\"difficulty\":\"medium\",\"stem\":\"Which device type SPECIFICALLY inspects HTTP/HTTPS traffic for application-layer attacks like SQL injection and XSS?\",\"choices\":[\"IDS\",\"IPS\",\"WAF\",\"NAT gateway\"],\"correct\":2,\"explanation\":\"A Web Application Firewall (WAF) operates at L7 specifically for HTTP/HTTPS, applying rules from sources like the OWASP Core Rule Set. Generic IDS/IPS may have web rules but are not specialized. NAT gateways are network-layer translation, not security devices in this sense.\",\"source\":\"guide\",\"guide_pages\":[1318,1322],\"guide_section\":\"Chapter 12 \\u2014 WAF\",\"web_sources\":[{\"url\":\"https://owasp.org/www-project-top-ten/\",\"title\":\"OWASP Top Ten Project\",\"captured\":\"2026-04-26\"},{\"url\":\"https://destcert.com/resources/cissp-domain-4-communication-and-network-security/\",\"title\":\"DestCert: CISSP Domain 4 \\u2014 Guide to Communication and Network Security\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"waf\",\"owasp\"],\"notes\":\"\",\"chapter\":10},{\"id\":\"D4-013\",\"domain\":4,\"subdomain\":\"4.5 Zero Trust\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST description of zero trust networking?\",\"choices\":[\"Place all internal users in a trusted zone behind the perimeter in most enterprise deployments\",\"Assume the network is hostile and require continuous authentication, authorisation, and least-privilege access on a per-resource basis\",\"Eliminate authentication for internal traffic across the relevant policy framework when properly implemented\",\"Trust users for 24 hours after authentication when properly implemented\"],\"correct\":1,\"explanation\":\"Zero trust treats every request as untrusted and requires verification of identity, device posture, context, and authorisation per resource. The classic perimeter-trust model (choice A) is what zero trust replaces. Continuous validation is core; long-lived sessions violate the model.\",\"source\":\"guide\",\"guide_pages\":[1565,1572],\"guide_section\":\"Chapter 13 \\u2014 Zero Trust\",\"web_sources\":[{\"url\":\"https://csrc.nist.gov/pubs/sp/800/207/final\",\"title\":\"NIST SP 800-207: Zero Trust Architecture\",\"captured\":\"2026-04-26\"},{\"url\":\"https://duo.com/learn/zero-trust-segmentation\",\"title\":\"Cisco Duo: Zero Trust Segmentation Guide for Security Leaders\",\"captured\":\"2026-04-26\"}],\"references\":[\"NIST SP 800-207\"],\"tags\":[\"zero-trust\"],\"notes\":\"\",\"chapter\":11},{\"id\":\"D4-014\",\"domain\":4,\"subdomain\":\"4.5 Microsegmentation\",\"difficulty\":\"medium\",\"stem\":\"Which is the PRIMARY benefit of microsegmentation?\",\"choices\":[\"Increased network throughput given current best practices\",\"Limiting east-west lateral movement after an initial compromise\",\"Reducing the number of switches in most enterprise deployments\",\"Eliminating VLANs under typical operating conditions\"],\"correct\":1,\"explanation\":\"Microsegmentation enforces fine-grained workload-to-workload policy, choking lateral movement after a breach. Throughput and physical hardware are not improved. VLANs may still be used as substrates. Microsegmentation is a key enabler of zero-trust architectures.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://ipwithease.com/microsegmentation-vs-zero-trust/\",\"title\":\"IPwithEase: Microsegmentation vs Zero Trust\",\"captured\":\"2026-04-26\"},{\"url\":\"https://duo.com/learn/zero-trust-segmentation\",\"title\":\"Cisco Duo: Zero Trust Segmentation Guide for Security Leaders\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"microsegmentation\",\"lateral-movement\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D4-015\",\"domain\":4,\"subdomain\":\"4.5 SDN\",\"difficulty\":\"easy\",\"stem\":\"What is a CORE characteristic of Software-Defined Networking (SDN)?\",\"choices\":[\"Hardware-only forwarding\",\"Decoupling the control plane from the data plane\",\"Mandatory IPv6 when properly implemented\",\"Read-only management in commonly cited frameworks\"],\"correct\":1,\"explanation\":\"SDN's defining characteristic is decoupling the CONTROL plane (decision-making intelligence) from the DATA plane (forwarding hardware), with centralised programmatic control. Choice A (hardware-only) is the OPPOSITE of SDN. Choice C (mandatory IPv6) is unrelated. Choice D (read-only) \\u2014 SDN is about programmatic control, the polar opposite of read-only. The exam: SDN = control/data separation + centralised control + open APIs (e.g., OpenFlow).\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/software-defined-networking-sdn/\",\"title\":\"DestCert: Software-Defined Networking (SDN) for Scalable Security\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"sdn\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D4-016\",\"domain\":4,\"subdomain\":\"4.5 Network Architectures\",\"difficulty\":\"medium\",\"stem\":\"Which network virtualisation technology extends Layer-2 segments over a Layer-3 underlay using UDP encapsulation?\",\"choices\":[\"MPLS\",\"VXLAN\",\"GRE\",\"PPP\"],\"correct\":1,\"explanation\":\"VXLAN (RFC 7348) encapsulates L2 frames in UDP packets (default port 4789) to extend L2 across L3 underlays \\u2014 common in cloud and data centers. MPLS uses label switching. GRE is a generic tunnel protocol. PPP is point-to-point. VXLAN does NOT provide encryption by default.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://www.cisco.com/c/en/us/td/docs/dcn/whitepapers/securing-datacenters-with-microsegmentation-and-vxlan-gpo.html\",\"title\":\"Cisco: Securing Data Centers with Microsegmentation using VXLAN GPO\",\"captured\":\"2026-04-26\"},{\"url\":\"https://destcert.com/resources/software-defined-networking-sdn/\",\"title\":\"DestCert: Software-Defined Networking (SDN) for Scalable Security\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"vxlan\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D4-017\",\"domain\":4,\"subdomain\":\"4.6 Network Attacks\",\"difficulty\":\"medium\",\"stem\":\"Which attack abuses the broadcast nature of ARP to associate an attacker's MAC address with a target's IP address?\",\"choices\":[\"DNS poisoning\",\"ARP spoofing/poisoning\",\"MAC flooding\",\"Smurf attack\"],\"correct\":1,\"explanation\":\"ARP spoofing sends forged ARP replies so victims send traffic to the attacker. DNS poisoning corrupts name resolution. MAC flooding overflows switch CAM tables to force hub-like behaviour. Smurf attacks ICMP-amplify against broadcast addresses. Mitigations include DAI (Dynamic ARP Inspection).\",\"source\":\"guide\",\"guide_pages\":[1320,1325],\"guide_section\":\"Chapter 12 \\u2014 Network Attacks\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-4-communication-and-network-security/\",\"title\":\"DestCert: CISSP Domain 4 \\u2014 Guide to Communication and Network Security\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"arp-spoofing\"],\"notes\":\"\",\"chapter\":10},{\"id\":\"D4-018\",\"domain\":4,\"subdomain\":\"4.6 Network Attacks\",\"difficulty\":\"medium\",\"stem\":\"Which attack pattern uses ICMP echo requests with a spoofed source address to a broadcast network, causing all hosts to respond and overwhelm the spoofed victim?\",\"choices\":[\"Fraggle\",\"Smurf\",\"Teardrop\",\"Ping of Death\"],\"correct\":1,\"explanation\":\"Smurf attacks amplify by ICMP broadcast. Fraggle is the UDP variant. Teardrop sends overlapping IP fragments. Ping of Death sends an oversized ICMP packet. Modern routers drop directed broadcasts (RFC 2644), making Smurf historic.\",\"source\":\"guide\",\"guide_pages\":[1325,1330],\"guide_section\":\"Chapter 12 \\u2014 DDoS\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-4-communication-and-network-security/\",\"title\":\"DestCert: CISSP Domain 4 \\u2014 Guide to Communication and Network Security\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"smurf\",\"amplification\"],\"notes\":\"\",\"chapter\":10},{\"id\":\"D4-019\",\"domain\":4,\"subdomain\":\"4.6 Network Attacks\",\"difficulty\":\"easy\",\"stem\":\"Which mitigation for SYN-flood DoS is BUILT INTO the TCP stack?\",\"choices\":[\"TCP RST flood\",\"SYN cookies\",\"ARP poisoning detection\",\"MAC sticky\"],\"correct\":1,\"explanation\":\"SYN cookies (Bernstein) encode connection state into the initial sequence number rather than holding half-open connections, allowing the server to verify a returning ACK without state. The other choices target unrelated attacks.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-4-communication-and-network-security/\",\"title\":\"DestCert: CISSP Domain 4 \\u2014 Guide to Communication and Network Security\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"syn-cookies\",\"ddos\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D4-020\",\"domain\":4,\"subdomain\":\"4.4 Segmentation\",\"difficulty\":\"medium\",\"stem\":\"What is the PRIMARY purpose of a DMZ (demilitarised zone) in network architecture?\",\"choices\":[\"Compress backup traffic in most enterprise deployments\",\"Provide an isolated network segment for systems that must be reachable from the internet, separating them from the internal network\",\"Replace VLANs in most enterprise deployments\",\"Encrypt all internal traffic for the purposes of this question\"],\"correct\":1,\"explanation\":\"A DMZ segregates internet-facing services so a compromise does not directly expose the internal network. The other choices are unrelated to DMZ purpose. Modern equivalents include screened subnets, public subnets in cloud, or service-mesh ingress zones.\",\"source\":\"guide\",\"guide_pages\":[1330,1335],\"guide_section\":\"Chapter 12 \\u2014 DMZ\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-4-communication-and-network-security/\",\"title\":\"DestCert: CISSP Domain 4 \\u2014 Guide to Communication and Network Security\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"dmz\",\"segmentation\"],\"notes\":\"\",\"chapter\":10},{\"id\":\"D4-021\",\"domain\":4,\"subdomain\":\"4.5 VPN\",\"difficulty\":\"medium\",\"stem\":\"Which VPN type is BEST for a remote user accessing internal corporate resources via a web browser without installing a client?\",\"choices\":[\"IPsec site-to-site VPN\",\"SSL/TLS VPN (clientless)\",\"PPTP\",\"L2TP without IPsec\"],\"correct\":1,\"explanation\":\"SSL/TLS VPNs (often called clientless VPNs) use the browser's TLS stack to access web-based internal apps \\u2014 no client install needed. IPsec site-to-site connects networks, not individuals. PPTP is obsolete. L2TP without IPsec lacks confidentiality.\",\"source\":\"guide\",\"guide_pages\":[1550,1555],\"guide_section\":\"Chapter 13 \\u2014 VPNs\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-4-communication-and-network-security/\",\"title\":\"DestCert: CISSP Domain 4 \\u2014 Guide to Communication and Network Security\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"ssl-vpn\"],\"notes\":\"\",\"chapter\":11},{\"id\":\"D4-022\",\"domain\":4,\"subdomain\":\"4.7 Endpoint\",\"difficulty\":\"medium\",\"stem\":\"Which is the PRIMARY purpose of NAC (Network Access Control)?\",\"choices\":[\"Speed up device boot times in standard practice\",\"Verify endpoint identity and posture before allowing network access; remediate non-compliant devices\",\"Replace 802.1X in commonly cited frameworks\",\"Provide DHCP services under typical operating conditions\"],\"correct\":1,\"explanation\":\"NAC enforces identity + posture (patches, AV, configuration) before granting access \\u2014 and may quarantine non-compliant devices. It often uses 802.1X as the access-control mechanism rather than replacing it. DHCP is unrelated to access control.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-4-communication-and-network-security/\",\"title\":\"DestCert: CISSP Domain 4 \\u2014 Guide to Communication and Network Security\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"nac\",\"posture\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D4-023\",\"domain\":4,\"subdomain\":\"4.6 VoIP\",\"difficulty\":\"medium\",\"stem\":\"Which is the PRIMARY confidentiality risk in unencrypted VoIP?\",\"choices\":[\"High latency when properly implemented\",\"Traffic is captured by anyone on the path and conversation can be reconstructed\",\"Battery drain under typical operating conditions\",\"Excessive CPU usage in most enterprise deployments\"],\"correct\":1,\"explanation\":\"Unencrypted SIP/RTP can be captured and conversations reconstructed (Wireshark even has built-in reconstruction). SIPS (TLS-protected SIP) and SRTP (encrypted RTP) mitigate this. The other choices are operational, not security, concerns.\",\"source\":\"guide\",\"guide_pages\":[1525,1530],\"guide_section\":\"Chapter 13 \\u2014 VoIP\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-4-communication-and-network-security/\",\"title\":\"DestCert: CISSP Domain 4 \\u2014 Guide to Communication and Network Security\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"voip\",\"srtp\"],\"notes\":\"\",\"chapter\":11},{\"id\":\"D4-024\",\"domain\":4,\"subdomain\":\"4.4 IDS\",\"difficulty\":\"medium\",\"stem\":\"Which IDS detection method is MOST EFFECTIVE at finding NEW (zero-day) attacks?\",\"choices\":[\"Signature-based detection\",\"Anomaly/behaviour-based detection\",\"Stateful packet inspection\",\"Port mirroring\"],\"correct\":1,\"explanation\":\"Anomaly-based detection learns normal baselines and flags deviations \\u2014 including novel attacks. Signature-based misses zero-days by definition. Packet inspection is a method, not a detection class. Port mirroring is a delivery mechanism.\",\"source\":\"guide\",\"guide_pages\":[1334,1339],\"guide_section\":\"Chapter 12 \\u2014 IDS Methods\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-4-communication-and-network-security/\",\"title\":\"DestCert: CISSP Domain 4 \\u2014 Guide to Communication and Network Security\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"ids\",\"anomaly\"],\"notes\":\"\",\"chapter\":10},{\"id\":\"D4-025\",\"domain\":4,\"subdomain\":\"4.4 IDS\",\"difficulty\":\"easy\",\"stem\":\"What is the difference between an IDS and an IPS?\",\"choices\":[\"An IDS is hardware; an IPS is software\",\"An IPS actively blocks detected threats; an IDS only alerts\",\"An IDS is faster; an IPS is slower\",\"They are synonyms as a baseline configuration\"],\"correct\":1,\"explanation\":\"IDS = passive (detect + alert). IPS = inline (detect + actively block traffic). Choice A is wrong \\u2014 both come in hardware and software/virtual form. Choice C is wrong \\u2014 IPS introduces small inline latency but isn't fundamentally slower. Choice D is wrong \\u2014 they're explicitly different categories. The exam: the in-line blocking capability is the defining difference, not form factor.\",\"source\":\"guide\",\"guide_pages\":[1335,1338],\"guide_section\":\"Chapter 12 \\u2014 IDS vs IPS\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-4-communication-and-network-security/\",\"title\":\"DestCert: CISSP Domain 4 \\u2014 Guide to Communication and Network Security\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"ids\",\"ips\"],\"notes\":\"\",\"chapter\":10},{\"id\":\"D4-026\",\"domain\":4,\"subdomain\":\"4.2 Email\",\"difficulty\":\"medium\",\"stem\":\"Which technology validates that an inbound email's sending IP is authorised by the sender domain's DNS records?\",\"choices\":[\"SPF (Sender Policy Framework)\",\"DKIM\",\"DMARC in standard practice\",\"S/MIME\"],\"correct\":0,\"explanation\":\"SPF lists authorised sending IPs in DNS TXT records; receivers check against the envelope sender. DKIM adds cryptographic signatures over headers/body. DMARC ties SPF + DKIM to policy + reporting. S/MIME signs/encrypts message content end-to-end. The trio (SPF + DKIM + DMARC) is the modern email-anti-spoofing baseline.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-4-communication-and-network-security/\",\"title\":\"DestCert: CISSP Domain 4 \\u2014 Guide to Communication and Network Security\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"spf\",\"email-security\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D4-027\",\"domain\":4,\"subdomain\":\"4.2 Email\",\"difficulty\":\"medium\",\"stem\":\"Which protocol provides end-to-end encryption AND digital signatures for email message content?\",\"choices\":[\"SPF\",\"DKIM\",\"S/MIME (or PGP)\",\"DMARC\"],\"correct\":2,\"explanation\":\"S/MIME and PGP provide END-TO-END encryption and digital signatures for email message CONTENT \\u2014 protecting the body and attachments. Choice A (SPF), B (DKIM), and D (DMARC) all address ENVELOPE-level anti-spoofing (can the sender's domain authorise this IP, are the headers signed, what policy applies on alignment failure). Pattern: SPF/DKIM/DMARC = sender authentication; S/MIME/PGP = content confidentiality + integrity + non-repudiation.\",\"source\":\"guide\",\"guide_pages\":[1428,1432],\"guide_section\":\"Chapter 12 \\u2014 S/MIME\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-4-communication-and-network-security/\",\"title\":\"DestCert: CISSP Domain 4 \\u2014 Guide to Communication and Network Security\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"smime\"],\"notes\":\"\",\"chapter\":10},{\"id\":\"D4-028\",\"domain\":4,\"subdomain\":\"4.6 DNS\",\"difficulty\":\"medium\",\"stem\":\"What is the PRIMARY enterprise concern with DNS over HTTPS (DoH) deployed by end-user browsers?\",\"choices\":[\"Higher latency in commonly cited frameworks\",\"Bypasses traditional enterprise DNS-based monitoring and policy enforcement\",\"Lower compatibility in commonly cited frameworks\",\"Increased cost given current best practices\"],\"correct\":1,\"explanation\":\"DoH on port 443 hides DNS queries from network-layer enterprise controls (DNS firewall, RPZ, sinkholing). DoT (port 853) is more visible but still encrypts. Many enterprises prefer DoT or proxy-controlled DoH endpoints. Latency/cost are minor.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-4-communication-and-network-security/\",\"title\":\"DestCert: CISSP Domain 4 \\u2014 Guide to Communication and Network Security\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"doh\",\"dns\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D4-029\",\"domain\":4,\"subdomain\":\"4.5 CDN\",\"difficulty\":\"medium\",\"stem\":\"Which is the PRIMARY security benefit of a CDN with DDoS scrubbing?\",\"choices\":[\"Lower TLS overhead for general production deployments in standard practice\",\"Absorbing volumetric attacks across distributed POPs and serving cached content during incidents\",\"Eliminating the need for application security when properly implemented\",\"Static IP allocation for the purposes of this question\"],\"correct\":1,\"explanation\":\"CDNs deliver capacity and geographic distribution that absorb volumetric DDoS, and they continue serving cached content while origin recovers. They do not eliminate the need for app-layer security (WAF, secure coding). The other choices are unrelated benefits or false.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-4-communication-and-network-security/\",\"title\":\"DestCert: CISSP Domain 4 \\u2014 Guide to Communication and Network Security\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"cdn\",\"ddos\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D4-030\",\"domain\":4,\"subdomain\":\"4.4 NAT\",\"difficulty\":\"medium\",\"stem\":\"What is the PRIMARY security benefit (incidental) of NAT/PAT?\",\"choices\":[\"Stronger encryption when properly implemented\",\"Internal addresses are not directly routable from the internet, providing some obscurity\",\"Faster routing given current best practices\",\"Lower TCP overhead given current best practices\"],\"correct\":1,\"explanation\":\"NAT/PAT was designed for IPv4 address conservation; the security side effect is internal hosts are not directly addressable from outside (security through translation). It is NOT a real security control \\u2014 it is an obscurity benefit. Layer-7 attacks still pass through NAT.\",\"source\":\"guide\",\"guide_pages\":[1316,1320],\"guide_section\":\"Chapter 12 \\u2014 NAT\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-4-communication-and-network-security/\",\"title\":\"DestCert: CISSP Domain 4 \\u2014 Guide to Communication and Network Security\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"nat\",\"pat\"],\"notes\":\"\",\"chapter\":10},{\"id\":\"D4-031\",\"domain\":4,\"subdomain\":\"4.2 Encryption\",\"difficulty\":\"medium\",\"stem\":\"TLS 1.3's 0-RTT mode improves performance by allowing data in the first flight, but introduces what risk?\",\"choices\":[\"Man-in-the-middle bypass across the relevant control set\",\"Replay of the 0-RTT data, since 0-RTT does not have full forward-secrecy / replay protection on its own\",\"Higher CPU on the server under typical operating conditions\",\"Loss of certificate validation in standard practice\"],\"correct\":1,\"explanation\":\"TLS 1.3 0-RTT (early data) lacks the full anti-replay protections of the standard handshake \\u2014 servers should restrict 0-RTT to idempotent operations and use server-side anti-replay where critical. Certificate validation is unaffected. CPU may be reduced, not increased.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://datatracker.ietf.org/doc/html/rfc8446\",\"title\":\"RFC 8446: TLS 1.3\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"tls-1.3\",\"0-rtt\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D4-032\",\"domain\":4,\"subdomain\":\"4.5 Wireless\",\"difficulty\":\"medium\",\"stem\":\"Which 802.11 frame type allows attackers to disconnect clients without breaking encryption when Protected Management Frames (PMF) are NOT enabled?\",\"choices\":[\"Probe request\",\"Beacon\",\"Deauthentication\",\"RTS/CTS\"],\"correct\":2,\"explanation\":\"Deauth frames are management-class, traditionally unprotected \\u2014 easily forged to disconnect victims. 802.11w / Protected Management Frames protects management frames against forgery. Other frame types are not the canonical disconnection vector.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://www.cloudi-fi.com/blog/wpa2-enterprise-802-1x\",\"title\":\"Cloudi-Fi: WPA2/3-Enterprise \\u2014 Secure Wi-Fi with 802.1X authentication\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"deauth\",\"pmf\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D4-033\",\"domain\":4,\"subdomain\":\"4.5 SD-WAN\",\"difficulty\":\"medium\",\"stem\":\"What is the PRIMARY security concern when adopting SD-WAN over public internet links?\",\"choices\":[\"Increased physical theft risk given current best practices\",\"Tunnels are typically point-to-point, traffic inside encrypted tunnels lacks per-flow inspection without a SASE/security overlay\",\"Loss of routing protocols under typical compliance requirements when properly implemented\",\"Inability to use multicast in commonly cited frameworks\"],\"correct\":1,\"explanation\":\"SD-WAN

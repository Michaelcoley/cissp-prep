ing \\u2014 sends crafted requests and identifies vulnerabilities by responses. SAST is static. Code review is manual SAST. Compliance scans verify configuration baselines, not application behaviour.\",\"source\":\"guide\",\"guide_pages\":[1885,1890],\"guide_section\":\"Chapter 15 \\u2014 DAST\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-6-security-assessment-and-testing/\",\"title\":\"DestCert: CISSP Domain 6 \\u2014 Security Assessment & Testing\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"dast\",\"dynamic\"],\"notes\":\"\",\"chapter\":14},{\"id\":\"D6-003\",\"domain\":6,\"subdomain\":\"6.1 Test Strategies\",\"difficulty\":\"medium\",\"stem\":\"Which technique INSTRUMENTS a running application to combine source-level visibility with runtime context?\",\"choices\":[\"SAST\",\"DAST\",\"IAST\",\"RASP\"],\"correct\":2,\"explanation\":\"IAST (Interactive) runs an agent inside the application, observing both code paths executed and runtime data \\u2014 combining SAST's coverage with DAST's runtime accuracy. RASP (Runtime Application Self-Protection) actively blocks at runtime. SAST/DAST are static/dynamic.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-6-security-assessment-and-testing/\",\"title\":\"DestCert: CISSP Domain 6 \\u2014 Security Assessment & Testing\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"iast\",\"rasp\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D6-004\",\"domain\":6,\"subdomain\":\"6.2 Pen Test\",\"difficulty\":\"easy\",\"stem\":\"Per NIST SP 800-115, which is NOT a phase of penetration testing?\",\"choices\":[\"Planning\",\"Discovery\",\"Compliance certification\",\"Attack / Exploitation\"],\"correct\":2,\"explanation\":\"NIST 800-115 frames the methodology as Planning \\u2192 Execution \\u2192 Post-Execution at the high level, with Execution typically split into Discovery and Attack \\u2014 yielding the 4-stage Planning, Discovery, Attack, Reporting model commonly cited on the exam. PTES uses 7 phases. Either way, 'Compliance certification' is never a phase of the methodology \\u2014 that's an outcome of an audit, not a pen test. Planning, Discovery, and Attack/Exploitation are all real phases.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://csrc.nist.gov/pubs/sp/800/115/final\",\"title\":\"NIST SP 800-115: Technical Guide to Information Security Testing and Assessment\",\"captured\":\"2026-04-26\"}],\"references\":[\"NIST SP 800-115\"],\"tags\":[\"pen-test\",\"phases\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D6-005\",\"domain\":6,\"subdomain\":\"6.2 Pen Test\",\"difficulty\":\"medium\",\"stem\":\"A 'gray box' penetration test BEST corresponds to which scenario?\",\"choices\":[\"Attacker has no information\",\"Attacker has partial information\",\"Attacker has full source-code access\",\"Attacker is the system owner\"],\"correct\":1,\"explanation\":\"Gray box simulates a partially informed attacker (e.g., compromised user, insider with limited info). Black box = no info; white box = full info; system owner is not an attacker model. Gray box maximises efficiency while testing realistic threat models.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://www.infosectrain.com/blog/black-box-vs-white-box-vs-grey-box-penetration-testing\",\"title\":\"InfosecTrain: Black Box vs White Box vs Grey Box Penetration Testing\",\"captured\":\"2026-04-26\"},{\"url\":\"https://www.tracesecurity.com/blog/articles/what-is-black-box-white-box-and-gray-box-testing/\",\"title\":\"TraceSecurity: What is Black/White/Gray Box Testing?\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"pen-test\",\"gray-box\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D6-006\",\"domain\":6,\"subdomain\":\"6.3 Audits\",\"difficulty\":\"medium\",\"stem\":\"Which SOC report type evaluates security, availability, processing integrity, confidentiality, and privacy controls?\",\"choices\":[\"SOC 1\",\"SOC 2\",\"SOC 3\",\"SOC for cybersecurity\"],\"correct\":1,\"explanation\":\"SOC 2 covers the AICPA Trust Services Criteria (security required, then availability/processing-integrity/confidentiality/privacy as elected). SOC 1 is financial reporting controls. SOC 3 is a public-summary version of SOC 2. SOC for cybersecurity is a separate program.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://socreports.com/white-papers/educational/isae-3402-type-2-reports\",\"title\":\"SOCReports: ISAE 3402 Type 2 Reports \\u2014 SOC 2 Audits\",\"captured\":\"2026-04-26\"},{\"url\":\"https://destcert.com/resources/cissp-domain-6-security-assessment-and-testing/\",\"title\":\"DestCert: CISSP Domain 6 \\u2014 Security Assessment & Testing\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"soc-2\",\"audit\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D6-007\",\"domain\":6,\"subdomain\":\"6.3 Audits\",\"difficulty\":\"easy\",\"stem\":\"Which difference distinguishes a SOC 2 Type II from Type I report?\",\"choices\":[\"Type II is shorter for the purposes of this question\",\"Type II evaluates operating effectiveness over a period; Type I is design effectiveness at a point in time\",\"Type I covers more controls given current best practices\",\"Type II requires no testing when properly implemented\"],\"correct\":1,\"explanation\":\"Type I = design effectiveness at a POINT IN TIME (snapshot). Type II = design + OPERATING effectiveness over a PERIOD (typically 6-12 months). Choice A (Type II is shorter) is wrong \\u2014 Type II covers a longer testing window. Choice C (Type I covers more) is wrong \\u2014 both have the same scope, Type II just adds time-based testing. Choice D is wrong \\u2014 Type II requires EXTENSIVE testing across the period. Customers prefer Type II for its operating-effectiveness assurance.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://securance.com/news/isae-3402-soc-1-type-i-vs-type-ii\",\"title\":\"Securance: ISAE 3402 / SOC 1 Type I vs Type II\",\"captured\":\"2026-04-26\"},{\"url\":\"https://brandcompliance.com/en/docs/soc-2-or-isae-3402/\",\"title\":\"BrandCompliance: SOC 2 or ISAE 3402?\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"soc-2\",\"type-i-ii\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D6-008\",\"domain\":6,\"subdomain\":\"6.3 Audits\",\"difficulty\":\"easy\",\"stem\":\"ISAE 3402 is the international equivalent of which SOC report?\",\"choices\":[\"SOC 1\",\"SOC 2\",\"SOC 3\",\"SOC for cybersecurity\"],\"correct\":0,\"explanation\":\"ISAE 3402 is the international assurance standard for service-organisation controls over financial reporting \\u2014 directly equivalent to SOC 1. Choice B (SOC 2) maps to ISAE 3000 + the AICPA Trust Services Criteria. Choice C (SOC 3) is the public-summary version of SOC 2 \\u2014 has no separate ISAE equivalent. Choice D (SOC for cybersecurity) is a separate AICPA program with no ISAE equivalent. Memorise: ISAE 3402 \\u2248 SOC 1 (financial), ISAE 3000 \\u2248 SOC 2 (operational/security).\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://socreports.com/white-papers/educational/isae-3402-type-2-reports\",\"title\":\"SOCReports: ISAE 3402 Type 2 Reports \\u2014 SOC 2 Audits\",\"captured\":\"2026-04-26\"},{\"url\":\"https://www.zluri.com/blog/isae-3402-vs-soc-2\",\"title\":\"Zluri: ISAE 3402 vs SOC 2\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"isae-3402\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D6-009\",\"domain\":6,\"subdomain\":\"6.4 Vulnerability Mgmt\",\"difficulty\":\"medium\",\"stem\":\"Which is the PRIMARY difference between vulnerability scanning and penetration testing?\",\"choices\":[\"Pen tests are cheaper for the purposes of this question\",\"Pen tests attempt exploitation to demonstrate impact; vulnerability scans identify potential weaknesses without exploitation\",\"Vulnerability scans require physical access in standard practice\",\"They are synonyms under typical compliance requirements under typical operating conditions\"],\"correct\":1,\"explanation\":\"Vulnerability scanning is breadth \\u2014 produces a list of potential weaknesses (often noisy). Pen testing is depth \\u2014 chains vulnerabilities to demonstrate real impact and verify exploitability. Both have a role in mature programs.\",\"source\":\"guide\",\"guide_pages\":[1900,1905],\"guide_section\":\"Chapter 15 \\u2014 VA vs Pen Test\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-6-security-assessment-and-testing/\",\"title\":\"DestCert: CISSP Domain 6 \\u2014 Security Assessment & Testing\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"va\",\"pentest\"],\"notes\":\"\",\"chapter\":14},{\"id\":\"D6-010\",\"domain\":6,\"subdomain\":\"6.4 Vulnerability Mgmt\",\"difficulty\":\"medium\",\"stem\":\"What is the PRIMARY purpose of an authenticated vulnerability scan?\",\"choices\":[\"Bypass firewalls under typical operating conditions\",\"Reveal vulnerabilities visible only to logged-in users\",\"Reduce scan time in commonly cited frameworks\",\"Test password complexity when properly implemented\"],\"correct\":1,\"explanation\":\"Authenticated (credentialed) scans log into hosts and assess installed packages, missing patches, and config drift \\u2014 invisible to unauthenticated network scans. Unauthenticated scans see only externally exposed surfaces. Both have a role.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-6-security-assessment-and-testing/\",\"title\":\"DestCert: CISSP Domain 6 \\u2014 Security Assessment & Testing\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"authenticated-scan\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D6-011\",\"domain\":6,\"subdomain\":\"6.5 Logs\",\"difficulty\":\"medium\",\"stem\":\"Which is the PRIMARY purpose of log review in a security program?\",\"choices\":[\"Save disk space when applied to standard enterprise environments\",\"Detect security events and provide forensic evidence after incidents\",\"Replace network monitoring\",\"Document software versions\"],\"correct\":1,\"explanation\":\"Log review supports both DETECTION (alerting on suspicious patterns) and FORENSIC INVESTIGATION (post-incident reconstruction). Choice A (save disk space) inverts the purpose \\u2014 logs cost storage, they don't save it. Choice C is wrong \\u2014 logs complement network monitoring, neither replaces the other. Choice D (document software versions) is inventory, not log review. The exam: detect + investigate, not file management.\",\"source\":\"guide\",\"guide_pages\":[1910,1915],\"guide_section\":\"Chapter 15 \\u2014 Logging\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-6-security-assessment-and-testing/\",\"title\":\"DestCert: CISSP Domain 6 \\u2014 Security Assessment & Testing\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"logging\"],\"notes\":\"\",\"chapter\":14},{\"id\":\"D6-012\",\"domain\":6,\"subdomain\":\"6.5 Logs\",\"difficulty\":\"medium\",\"stem\":\"Which property of logs is MOST important for forensic admissibility?\",\"choices\":[\"Compression ratio\",\"Integrity (write-once or signed) and timestamping\",\"Colourful formatting\",\"Stored locally on the affected host\"],\"correct\":1,\"explanation\":\"Logs must be tamper-evident (immutable storage, signing, hashing) and accurately timestamped. Local-only storage on a compromised host is the OPPOSITE of safe \\u2014 log forwarding to a separate system is essential. Compression and formatting are operational.\",\"source\":\"guide\",\"guide_pages\":[1912,1916],\"guide_section\":\"Chapter 15 \\u2014 Log Integrity\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-6-security-assessment-and-testing/\",\"title\":\"DestCert: CISSP Domain 6 \\u2014 Security Assessment & Testing\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"log-integrity\",\"forensics\"],\"notes\":\"\",\"chapter\":14},{\"id\":\"D6-013\",\"domain\":6,\"subdomain\":\"6.6 Synthetic Monitoring\",\"difficulty\":\"medium\",\"stem\":\"Synthetic transactions are BEST described as:\",\"choices\":[\"Real user behaviour observed passively\",\"Scripted requests that simulate user actions to monitor availability and correctness\",\"Database backup operations under typical compliance requirements\",\"Fake user accounts created for testing\"],\"correct\":1,\"explanation\":\"Synthetic transactions are SCRIPTED requests that simulate user actions to monitor availability and correctness \\u2014 verifying endpoints respond correctly within SLA from external probe locations. Choice A (passive real-user monitoring, RUM) is the OPPOSITE technique. Choice C (database backups) is unrelated. Choice D (fake user accounts) might support synthetic monitoring but aren't the technique itself. Pattern: synthetic = active probing; RUM = passive observation.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-6-security-assessment-and-testing/\",\"title\":\"DestCert: CISSP Domain 6 \\u2014 Security Assessment & Testing\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"synthetic\",\"monitoring\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D6-014\",\"domain\":6,\"subdomain\":\"6.7 Code Review\",\"difficulty\":\"medium\",\"stem\":\"Which type of code review is GENERALLY most effective at finding logic flaws and business-rule errors?\",\"choices\":[\"Automated SAST only across the relevant control set\",\"Manual peer review by an experienced reviewer focused on logic and threat model\",\"Compilation only under typical operating conditions\",\"Linting in standard practice\"],\"correct\":1,\"explanation\":\"Manual peer review excels at logic and business-rule defects that automated tools miss (SAST sees patterns, not intent). The best programs combine SAST + manual review. Linting is style/syntax. Compilation catches structural errors only.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-6-security-assessment-and-testing/\",\"title\":\"DestCert: CISSP Domain 6 \\u2014 Security Assessment & Testing\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"code-review\",\"peer-review\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D6-015\",\"domain\":6,\"subdomain\":\"6.4 Pen Test Rules of Engagement\",\"difficulty\":\"medium\",\"stem\":\"Which document is THE MOST IMPORTANT to obtain BEFORE starting a penetration test?\",\"choices\":[\"Vendor SOW only in most operational contexts given current best practices\",\"Authorisation letter and rules of engagement signed by an officer with authority to authorise the test\",\"Vacation calendar of IT staff for the purposes of this question\",\"Marketing approval in most enterprise deployments\"],\"correct\":1,\"explanation\":\"Without a signed authorisation (the 'get out of jail free' letter), pen testing is just unauthorised intrusion. Rules of engagement scope the test (targets, hours, escalation). The other choices are operational and not essential authorisation.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-6-security-assessment-and-testing/\",\"title\":\"DestCert: CISSP Domain 6 \\u2014 Security Assessment & Testing\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"pen-test\",\"authorisation\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D6-016\",\"domain\":6,\"subdomain\":\"6.6 Test Frequency\",\"difficulty\":\"medium\",\"stem\":\"How frequently should an organisation conduct external penetration tests at MINIMUM?\",\"choices\":[\"Once at deployment, never again\",\"Annually and after any major change\",\"Every 5 years\",\"Only when a breach occurs\"],\"correct\":1,\"explanation\":\"Annually + after major changes is the common industry baseline (PCI-DSS requires annually + after significant change). Many regulated industries require more frequent. Once-and-done or post-breach-only are inadequate; 5-year cycles are too long.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-6-security-assessment-and-testing/\",\"title\":\"DestCert: CISSP Domain 6 \\u2014 Security Assessment & Testing\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"pen-test\",\"frequency\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D6-017\",\"domain\":6,\"subdomain\":\"6.7 Vulnerability Mgmt\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST first action when a critical vulnerability is identified in a production system?\",\"choices\":[\"Issue a press release in most operational contexts given current best practices\",\"Apply compensating controls and the vendor patch through change management as fast as risk dictates, prioritised by exploit availability and exposure\",\"Wait for the next quarterly maintenance window when properly implemented\",\"Disable logging to avoid alerts under typical operating conditions\"],\"correct\":1,\"explanation\":\"Manager-mindset: triage by risk (impact \\u00d7 exposure \\u00d7 exploit availability), apply compensating controls if patching takes time, push the patch through accelerated change management. Press releases are not first actions; waiting accumulates risk; disabling logging is anti-pattern.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-6-security-assessment-and-testing/\",\"title\":\"DestCert: CISSP Domain 6 \\u2014 Security Assessment & Testing\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"patch\",\"vulnerability\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D6-018\",\"domain\":6,\"subdomain\":\"6.5 KPI/KRI\",\"difficulty\":\"medium\",\"stem\":\"Which metric BEST functions as a KEY RISK indicator (KRI) rather than a KEY PERFORMANCE indicator (KPI)?\",\"choices\":[\"Mean time to patch critical vulnerabilities\",\"Number of unpatched critical vulnerabilities older than SLA\",\"Number of help-desk tickets closed\",\"Average API response time\"],\"correct\":1,\"explanation\":\"KRIs measure risk exposure (count of overdue critical vulnerabilities indicates rising risk). KPIs measure performance (mean time to patch, tickets closed, response time). The exam tests this distinction; many candidates conflate them.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-6-security-assessment-and-testing/\",\"title\":\"DestCert: CISSP Domain 6 \\u2014 Security Assessment & Testing\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"kpi\",\"kri\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D6-019\",\"domain\":6,\"subdomain\":\"6.7 Audit\",\"difficulty\":\"medium\",\"stem\":\"Which is the PRIMARY benefit of using INDEPENDENT (third-party) auditors?\",\"choices\":[\"Lower cost in standard practice\",\"Independence reduces conflict of interest and increases reliance for relying parties\",\"Faster audits given current best practices\",\"Less paperwork when properly implemented\"],\"correct\":1,\"explanation\":\"Independence eliminates conflict of interest and increases the weight third parties (regulators, customers, boards) place on findings. Choice A (lower cost) \\u2014 independent audits typically cost MORE, not less. Choice C (faster) \\u2014 they're often slower due to scoping rigor. Choice D (less paperwork) \\u2014 they require MORE evidence. Pattern: independence is about credibility and reliance, not efficiency.\",\"source\":\"guide\",\"guide_pages\":[1900,1905],\"guide_section\":\"Chapter 15 \\u2014 Independent Audit\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-6-security-assessment-and-testing/\",\"title\":\"DestCert: CISSP Domain 6 \\u2014 Security Assessment & Testing\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"audit\",\"independence\"],\"notes\":\"\",\"chapter\":14},{\"id\":\"D6-020\",\"domain\":6,\"subdomain\":\"6.4 Fuzzing\",\"difficulty\":\"medium\",\"stem\":\"Which type of testing sends malformed or unexpected input to find input-handling vulnerabilities?\",\"choices\":[\"Fuzzing\",\"Compliance scanning\",\"Synthetic transactions\",\"Capacity testing\"],\"correct\":0,\"explanation\":\"Fuzzing (mutation- or generation-based) feeds malformed inputs to surface crashes, memory errors, and parser bugs. Compliance scanning verifies config; synthetic transactions are availability tests; capacity testing measures throughput.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-6-security-assessment-and-testing/\",\"title\":\"DestCert: CISSP Domain 6 \\u2014 Security Assessment & Testing\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"fuzzing\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D6-021\",\"domain\":6,\"subdomain\":\"6.6 Test Coverage\",\"difficulty\":\"medium\",\"stem\":\"Which test-coverage metric is MOST useful for measuring the depth of an automated test suite?\",\"choices\":[\"Lines of code in standard practice\",\"Statement, branch, and condition coverage\",\"Compile time given current best practices\",\"File count across the relevant control set\"],\"correct\":1,\"explanation\":\"Coverage metrics (statement, branch, MC/DC for safety-critical) measure how thoroughly tests exercise the code. LOC, compile time, and file count are not coverage measurements. The exam favors statement/branch coverage as the standard answer.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-6-security-assessment-and-testing/\",\"title\":\"DestCert: CISSP Domain 6 \\u2014 Security Assessment & Testing\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"coverage\",\"testing\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D6-022\",\"domain\":6,\"subdomain\":\"6.7 Audit Process\",\"difficulty\":\"medium\",\"stem\":\"Which is the FIRST step an auditor should take before evaluating controls?\",\"choices\":[\"Run a vulnerability scan across the relevant policy framework\",\"Understand the audit scope, criteria, and obtain audit authority\",\"Interview every employee\",\"Compare findings to a competitor\"],\"correct\":1,\"explanation\":\"Auditors first establish scope, criteria (frameworks/standards being measured against), and authority (engagement letter). Without scope/criteria, findings have no anchor. Vulnerability scans are a tool, not the first step. Comparison shopping is irrelevant.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-6-security-assessment-and-testing/\",\"title\":\"DestCert: CISSP Domain 6 \\u2014 Security Assessment & Testing\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"audit-process\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D6-023\",\"domain\":6,\"subdomain\":\"6.7 Audit Findings\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST description of a 'compensating control' in audit terms?\",\"choices\":[\"A control that compensates auditors\",\"An alternate control that achieves the security objective when the prescribed control is not feasible\",\"A control added after a breach\",\"A control that costs less when applied to standard enterprise environments\"],\"correct\":1,\"explanation\":\"Compensating controls satisfy the SAME objective by alternate means \\u2014 for example, network segmentation when patching legacy systems is impossible. PCI-DSS explicitly allows compensating controls with documented justification. The other choices are wrong.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-6-security-assessment-and-testing/\",\"title\":\"DestCert: CISSP Domain 6 \\u2014 Security Assessment & Testing\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"compensating-control\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D6-024\",\"domain\":6,\"subdomain\":\"6.5 SIEM\",\"difficulty\":\"medium\",\"stem\":\"What is the PRIMARY value of a SIEM beyond raw log aggregation?\",\"choices\":[\"Storage compression in commonly cited frameworks\",\"Correlation of events across sources to detect multi-stage attacks and produce alerts\",\"Replacing endpoint protection given current best practices\",\"Replacing firewalls for the purposes of this question\"],\"correct\":1,\"explanation\":\"SIEM correlates across diverse sources to surface attack patterns invisible in any single log (e.g., login from country A, then sudden privilege grant, then data exfil to country B). Storage and replacement of EDR/firewalls are wrong.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-6-security-assessment-and-testing/\",\"title\":\"DestCert: CISSP Domain 6 \\u2014 Security Assessment & Testing\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"siem\",\"correlation\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D6-025\",\"domain\":6,\"subdomain\":\"6.4 Continuous Monitoring\",\"difficulty\":\"medium\",\"stem\":\"Which is the PRIMARY benefit of a continuous security monitoring program?\",\"choices\":[\"Eliminates the need for periodic audits\",\"Surfaces deviations and incidents in near real-time, reducing time-to-detect\",\"Replaces all manual review\",\"Removes the need for SIEM as a baseline configuration\"],\"correct\":1,\"explanation\":\"Continuous monitoring shrinks the dwell-time window \\u2014 the longer an attacker is undetected, the higher the impact. Periodic audits and manual review remain valuable; SIEM is often a continuous monitoring component, not a replacement.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-6-security-assessment-and-testing/\",\"title\":\"DestCert: CISSP Domain 6 \\u2014 Security Assessment & Testing\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"monitoring\",\"dwell-time\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D6-026\",\"domain\":6,\"subdomain\":\"6.4 Pen Test Phase\",\"difficulty\":\"medium\",\"stem\":\"Which penetration testing phase typically includes Open-Source Intelligence (OSINT) and active reconnaissance?\",\"choices\":[\"Planning\",\"Discovery\",\"Attack\",\"Reporting\"],\"correct\":1,\"explanation\":\"Discovery encompasses BOTH passive (OSINT, public records, DNS, social media) AND active (port scans, banner grabs, web crawling, DNS enumeration) reconnaissance. Choice A (Planning) sets scope and rules of engagement before discovery. Choice C (Attack) exploits findings from discovery. Choice D (Reporting) communicates outcomes. The exam pattern: Discovery is the information-gathering phase that informs Attack.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://csrc.nist.gov/pubs/sp/800/115/final\",\"title\":\"NIST SP 800-115: Technical Guide to Information Security Testing and Assessment\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"pen-test\",\"discovery\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D6-027\",\"domain\":6,\"subdomain\":\"6.8 Testing Boundaries\",\"difficulty\":\"medium\",\"stem\":\"Why is a sandbox or non-production environment STRONGLY preferred for destructive penetration tests?\",\"choices\":[\"Production tests are cheaper across the relevant policy framework\",\"Production tests can cause outages and damage data; non-prod isolates risk to test data\",\"Non-production has no security\",\"Sandboxes are required by law\"],\"correct\":1,\"explanation\":\"Destructive testing in production risks outages, data corruption, and customer impact. Non-prod isolates exposure. Some controls (resilience, DR) MUST eventually be tested in production-like environments \\u2014 but with care. Choices A, C, D are wrong.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-6-security-assessment-and-testing/\",\"title\":\"DestCert: CISSP Domain 6 \\u2014 Security Assessment & Testing\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"pen-test\",\"sandbox\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D6-028\",\"domain\":6,\"subdomain\":\"6.4 Red/Blue\",\"difficulty\":\"easy\",\"stem\":\"Which best describes 'purple team' activity?\",\"choices\":[\"Defenders and attackers competing in isolation across the relevant control set\",\"Collaborative engagement where red-team techniques are shared with blue team to improve detection and response\",\"Annual compliance audit when properly implemented\",\"Buying offensive tools across the relevant policy framework in standard practice\"],\"correct\":1,\"explanation\":\"Purple teaming bridges red (offensive) and blue (defensive) teams to translate attacker techniques into detection and response improvements. Choice A describes traditional red/blue exercises. Audits and tooling are unrelated.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-6-security-assessment-and-testing/\",\"title\":\"DestCert: CISSP Domain 6 \\u2014 Security Assessment & Testing\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"purple-team\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D6-029\",\"domain\":6,\"subdomain\":\"6.4 BAS\",\"difficulty\":\"medium\",\"stem\":\"Breach and Attack Simulation (BAS) tools provide which PRIMARY value?\",\"choices\":[\"Random pen-tests by external firms in commonly cited frameworks\",\"Continuous, automated execution of attacker techniques to validate detection and prevention controls\",\"Replace SOC analysts for general production deployments given current best practices\",\"Generate compliance reports automatically in commonly cited frameworks\"],\"correct\":1,\"explanation\":\"BAS (Breach and Attack Simulation) platforms automate execution of real attacker techniques against the production stack on a continuous basis \\u2014 validating that detection and prevention controls actually fire. Choice A (random pen-tests) confuses BAS with traditional pen testing. Choice C (replace SOC) \\u2014 BAS COMPLEMENTS the SOC, doesn't replace human analysts. Choice D (compliance reports) is incidental, not the primary value. Examples: SafeBreach, Cymulate, AttackIQ.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-6-security-assessment-and-testing/\",\"title\":\"DestCert: CISSP Domain 6 \\u2014 Security Assessment & Testing\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"bas\",\"validation\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D6-030\",\"domain\":6,\"subdomain\":\"6.5 Logs\",\"difficulty\":\"medium\",\"stem\":\"Which log-management practice BEST defends log integrity from a compromised host?\",\"choices\":[\"Store logs only on the host under typical compliance requirements\",\"Forward logs to a centralised SIEM/log server in real-time and protect with WORM or hash-chain\",\"Email logs to a personal account\",\"Compress logs and delete originals\"],\"correct\":1,\"explanation\":\"Real-time forwarding to a centralised log store on a separately-administered system (with WORM/immutable storage or hash-chain integrity) survives even complete host compromise. Choice A keeps logs only on the host the attacker owns \\u2014 they're trivially deletable. Choice C is unauditable and a privacy violation. Choice D destroys evidence. The exam pattern: separation of duties between log producer and log consumer beats every other answer.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-6-security-assessment-and-testing/\",\"title\":\"DestCert: CISSP Domain 6 \\u2014 Security Assessment & Testing\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"log-integrity\",\"siem\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D6-031\",\"domain\":6,\"subdomain\":\"6.5 Test Data\",\"difficulty\":\"medium\",\"stem\":\"Why is using PRODUCTION data in test environments a security and privacy concern?\",\"choices\":[\"Test environments are usually faster in commonly cited frameworks\",\"Test environments often have weaker controls, increasing exposure of real PII; under GDPR, processing must have lawful basis\",\"Production data is too small as a baseline configuration in commonly cited frameworks\",\"Production data is encrypted under typical operating conditions\"],\"correct\":1,\"explanation\":\"Test environments commonly skip MFA, PAM, encryption, etc. \\u2014 moving real production data there expands the breach surface. GDPR Article 5 (purpose limitation, minimisation) generally rules out using prod data for testing without de-identification. Synthesise or mask data instead.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-6-security-assessment-and-testing/\",\"title\":\"DestCert: CISSP Domain 6 \\u2014 Security Assessment & Testing\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"test-data\",\"privacy\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D6-032\",\"domain\":6,\"subdomain\":\"6.5 Privacy Testing\",\"difficulty\":\"medium\",\"stem\":\"Which testing practice is MOST appropriate for verifying privacy controls?\",\"choices\":[\"Privacy Impact Assessment (PIA) and DPIA review with control sampling\",\"Penetration test only for the purposes of this question\",\"DAST scan only in standard practice\",\"User survey when properly implemented\"],\"correct\":0,\"explanation\":\"PIAs/DPIAs evaluate processing activities against privacy principles, sampling controls (notice, consent, retention, access, etc.). Pen tests and DAST find technical vulnerabilities, not privacy compliance. Surveys gauge perception, not control effectiveness.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-6-security-assessment-and-testing/\",\"title\":\"DestCert: CISSP Domain 6 \\u2014 Security Assessment & Testing\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"pia\",\"dpia\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D6-033\",\"domain\":6,\"subdomain\":\"6.4 Pen Test Reporting\",\"difficulty\":\"medium\",\"stem\":\"Which is the MOST important content of a penetration-test report?\",\"choices\":[\"A flashy executive cover under typical compliance requirements\",\"Findings prioritised by risk, with reproduction steps and concrete remediation guidance\",\"A list of all tools used\",\"Personal opinions of the testers\"],\"correct\":1,\"explanation\":\"Pen-test reports must deliver ACTIONABLE findings prioritised by business risk, with reproduction steps and concrete remediation guidance \\u2014 that's what the customer pays for. Choice A (executive cover) is window dressing. Choice C (tools used) belongs in methodology, not findings. Choice D (personal opinions) reduces credibility. Manager-mindset: the report's value is in actionability, not page count or aesthetics.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-6-security-assessment-and-testing/\",\"title\":\"DestCert: CISSP Domain 6 \\u2014 Security Assessment & Testing\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"pen-test\",\"reporting\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D6-034\",\"domain\":6,\"subdomain\":\"6.5 Compliance\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST evidence to demonstrate that a control is OPERATING effectively?\",\"choices\":[\"Policy documents alone across the relevant control set\",\"Sampled artefacts showing the control fired as designed over a period\",\"Vendor brochure given current best practices\",\"Email confirmation given current best practices\"],\"correct\":1,\"explanation\":\"Auditors require evidence of operating effectiveness \\u2014 sampled records over a period prove the control consistently performed. Policy alone shows design intent; vendor brochures and email confirmations are weak audit artefacts.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-6-security-assessment-and-testing/\",\"title\":\"DestCert: CISSP Domain 6 \\u2014 Security Assessment & Testing\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"audit-evidence\",\"operating-effectiveness\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D6-035\",\"domain\":6,\"subdomain\":\"6.4 Vulnerability Mgmt\",\"difficulty\":\"medium\",\"stem\":\"Which scoring system is the WIDELY-ADOPTED standard for prioritising vulnerabilities?\",\"choices\":[\"CVE\",\"CVSS\",\"CWE\",\"CCE\"],\"correct\":1,\"explanation\":\"CVSS (Common Vulnerability Scoring System) is the prioritisation standard. CVSS v4.0 (Nov 2023) introduces Threat metrics (Exploit Maturity), Environmental modifiers, and Supplemental metrics (Safety, Recovery). CVE = unique identifier (e.g., CVE-2024-1234). CWE = weakness taxonomy (e.g., CWE-89 SQL injection). CCE = configuration enumeration. Modern practice combines CVSS + CISA KEV (Known Exploited Vulnerabilities) catalogue.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-6-security-assessment-and-testing/\",\"title\":\"DestCert: CISSP Domain 6 \\u2014 Security Assessment & Testing\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"cvss\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D6-036\",\"domain\":6,\"subdomain\":\"6.4 Threat-informed\",\"difficulty\":\"medium\",\"stem\":\"Which framework provides a knowledge base of adversary tactics and techniques used to inform detection engineering?\",\"choices\":[\"MITRE ATT&CK\",\"CVSS\",\"ISO 27001\",\"FIPS 199\"],\"correct\":0,\"explanation\":\"MITRE ATT&CK catalogues real-world adversary tactics (TA: the goal \\u2014 Initial Access, Execution, etc.), techniques (T: the how), and procedures \\u2014 the standard reference for detection engineering. Choice B (CVSS) scores vulnerability severity, not adversary behaviour. Choice C (ISO 27001) is the ISMS standard. Choice D (FIPS 199) is impact categorisation. The exam consistently associates ATT&CK with detection engineering and purple-teaming.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-6-security-assessment-and-testing/\",\"title\":\"DestCert: CISSP Domain 6 \\u2014 Security Assessment & Testing\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"mitre-attack\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D6-037\",\"domain\":6,\"subdomain\":\"6.5 Audit Trails\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST policy for retention of security audit logs?\",\"choices\":[\"Delete weekly to save space across the relevant control set\",\"Retain per regulatory and business requirements, with legal-hold capability\",\"Retain forever in commonly cited frameworks\",\"Retain only if a breach occurred in most enterprise deployments\"],\"correct\":1,\"explanation\":\"Retention policy reflects legal/regulatory requirements (e.g., HIPAA 6 years, PCI-DSS 1 year minimum) plus operational/forensic need. 'Forever' is unsustainable and may violate minimisation principles. Weekly deletion eliminates forensic capability.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-6-security-assessment-and-testing/\",\"title\":\"DestCert: CISSP Domain 6 \\u2014 Security Assessment & Testing\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"log-retention\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D6-038\",\"domain\":6,\"subdomain\":\"6.4 Compliance\",\"difficulty\":\"medium\",\"stem\":\"An organisation reports SOC 2 Type II findings to its customer. Which type of opinion is MOST favourable?\",\"choices\":[\"Adverse opinion\",\"Disclaimer\",\"Qualified opinion\",\"Unqualified (clean) opinion\"],\"correct\":3,\"explanation\":\"An unqualified (clean) opinion means controls operated effectively. Qualified flags one or more issues. Adverse means controls did NOT operate effectively. Disclaimer means the auditor could not form an opinion. Customers strongly prefer unqualified.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-6-security-assessment-and-testing/\",\"title\":\"DestCert: CISSP Domain 6 \\u2014 Security Assessment & Testing\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"audit-opinion\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D6-039\",\"domain\":6,\"subdomain\":\"6.5 Forensic Readiness\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST description of forensic readiness?\",\"choices\":[\"Hiring a forensic firm reactively in most enterprise deployments\",\"Pre-incident planning, log retention, evidence-handling procedures, and trained personnel ready to support investigations\",\"Storing all data forever in most operational contexts in commonly cited frameworks\",\"Disabling logging to avoid noise under typical operating conditions\"],\"correct\":1,\"explanation\":\"Forensic readiness is proactive \\u2014 pre-arranged tooling, retention, chain-of-custody procedures, and trained staff so investigations can begin without scrambling. Reactive hiring is too late. Indefinite retention is unsustainable; disabled logging defeats forensics.\",\"source\":\"guide\",\"guide_pages\":[1915,1920],\"guide_section\":\"Chapter 15 \\u2014 Forensic Readiness\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-6-security-assessment-and-testing/\",\"title\":\"DestCert: CISSP Domain 6 \\u2014 Security Assessment & Testing\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"forensic-readiness\"],\"notes\":\"\",\"chapter\":14},{\"id\":\"D6-040\",\"domain\":6,\"subdomain\":\"6.4 Code Coverage\",\"difficulty\":\"medium\",\"stem\":\"Why is 100% code coverage a NECESSARY but NOT SUFFICIENT condition for software assurance?\",\"choices\":[\"Coverage is irrelevant under typical compliance requirements in commonly cited frameworks\",\"100% coverage means every line ran but does not prove every CONDITION/path was tested or that assertions were correct\",\"Coverage replaces threat modelling given current best practices\",\"Coverage measures defect density for the purposes of this question\"],\"correct\":1,\"explanation\":\"Coverage proves execution, not correctness \\u2014 branches, edge cases, security assertions, and threat-model coverage matter beyond line coverage. Manager-mindset: combine coverage with mutation testing, threat-model alignment, and review.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-6-security-assessment-and-testing/\",\"title\":\"DestCert: CISSP Domain 6 \\u2014 Security Assessment & Testing\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"coverage\",\"assurance\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D6-041\",\"domain\":6,\"subdomain\":\"6.5 Audit Trails\",\"difficulty\":\"medium\",\"stem\":\"Which control BEST defends against a privileged user altering their own audit trail?\",\"choices\":[\"Self-managed log servers for general production deployments\",\"Centralised, write-once log forwarding to a system the privileged user cannot administer\",\"Trust the privileged user\",\"Audit logs only on the host\"],\"correct\":1,\"explanation\":\"Separation-of-duties for log management means privileged users on the source system cannot administer the log destination \\u2014 even if they compromise the host, they can't tamper with the forwarded logs. Choice A leaves the same admin in control of both \\u2014 defeats SoD. Choice C ('trust') is a non-control. Choice D keeps logs on a system the privileged user controls. The pattern: production admins \\u2260 logging admins, always.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-6-security-assessment-and-testing/\",\"title\":\"DestCert: CISSP Domain 6 \\u2014 Security Assessment & Testing\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"log-tampering\",\"sod\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D6-042\",\"domain\":6,\"subdomain\":\"6.4 Test Strategy\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST description of regression testing?\",\"choices\":[\"Testing new features only in standard practice\",\"Re-running tests after a change to ensure existing functionality still works\",\"Compliance auditing across the relevant control set\",\"Performance benchmarking when properly implemented\"],\"correct\":1,\"explanation\":\"Regression testing re-runs existing test suites after a code change to ensure previously-working features still work. Choice A is wrong \\u2014 testing ONLY new features misses the whole point of regression. Choice C (compliance auditing) is unrelated to testing methodology. Choice D (performance benchmarking) measures speed, not correctness. CI/CD pipelines run regression suites on every commit to catch regressions early.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-6-security-assessment-and-testing/\",\"title\":\"DestCert: CISSP Domain 6 \\u2014 Security Assessment & Testing\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"regression-testing\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D6-043\",\"domain\":6,\"subdomain\":\"6.6 IR Testing\",\"difficulty\":\"medium\",\"stem\":\"Which type of IR exercise involves discussion-based walk-through with no system changes?\",\"choices\":[\"Tabletop exercise\",\"Functional/parallel exercise\",\"Full-interruption test\",\"Capture the Flag (CTF)\"],\"correct\":0,\"explanation\":\"Tabletop exercises are discussion-based scenarios \\u2014 low cost, high educational value. Functional/parallel exercises perform actual recovery procedures in test or alongside production. Full-interruption shifts to DR. CTFs are skill competitions.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-6-security-assessment-and-testing/\",\"title\":\"DestCert: CISSP Domain 6 \\u2014 Security Assessment & Testing\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"tabletop\",\"ir-testing\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D6-044\",\"domain\":6,\"subdomain\":\"6.4 Compliance Validation\",\"difficulty\":\"medium\",\"stem\":\"Which assurance method provides the HIGHEST confidence that controls operate effectively over time?\",\"choices\":[\"Vendor self-attestation\",\"Independent third-party Type II audit\",\"Internal informal review\",\"Marketing whitepaper\"],\"correct\":1,\"explanation\":\"Independent third-party Type II audits evaluate operating effectiveness over a period \\u2014 the gold standard for relying parties (regulators, customers, boards). Choice A (vendor self-attestation) carries no third-party validation. Choice C (informal internal review) lacks rigor and independence. Choice D (marketing whitepaper) is sales material, not assurance. Pattern: independence + period-based testing + opinion = highest assurance.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-6-security-assessment-and-testing/\",\"title\":\"DestCert: CISSP Domain 6 \\u2014 Security Assessment & Testing\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"audit-assurance\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D6-045\",\"domain\":6,\"subdomain\":\"6.4 Threat Hunting\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST description of threat hunting?\",\"choices\":[\"Reacting to alerts for general production deployments across the relevant control set\",\"Proactive, hypothesis-driven search for adversaries that may have evaded existing detections\",\"Annual penetration testing for the purposes of this question\",\"Antivirus scanning given current best practices\"],\"correct\":1,\"explanation\":\"Threat hunting starts from hypotheses (often informed by ATT&CK or threat intel) and queries data for indicators that predefined detections missed. It complements alerting, not replaces it. The other choices describe different activities.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-6-security-assessment-and-testing/\",\"title\":\"DestCert: CISSP Domain 6 \\u2014 Security Assessment & Testing\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"threat-hunting\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D6-046\",\"domain\":6,\"subdomain\":\"6.4 Software Assessment\",\"difficulty\":\"medium\",\"stem\":\"Which technique evaluates the security of THIRD-PARTY software components used in an application?\",\"choices\":[\"SAST given current best practices\",\"DAST in standard practice\",\"SCA (Software Composition Analysis)\",\"Fuzzing\"],\"correct\":2,\"explanation\":\"SCA tools (e.g., dependency scanning) analyse the bill of materials for known vulnerabilities (CVEs in libraries) and license issues. SAST analyses first-party source. DAST is dynamic. Fuzzing tests inputs. Modern SDLC includes SCA gating in CI/CD.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-6-security-assessment-and-testing/\",\"title\":\"DestCert: CISSP Domain 6 \\u2014 Security Assessment & Testing\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"sca\",\"third-party\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D6-047\",\"domain\":6,\"subdomain\":\"6.4 Secure Code\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST defensive coding practice against SQL injection?\",\"choices\":[\"Escape user input client-side\",\"Use parameterised queries / prepared statements\",\"Concatenate strings carefully\",\"Hash inputs before query in most operational contexts\"],\"correct\":1,\"explanation\":\"Parameterised queries treat input as DATA, not code \\u2014 making injection structurally impossible. Client-side escape is bypassable. Careful string concatenation is fragile. Hashing destroys legitimate query content. CWE-89 is the canonical SQLi reference.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-6-security-assessment-and-testing/\",\"title\":\"DestCert: CISSP Domain 6 \\u2014 Security Assessment & Testing\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"sqli\",\"parameterised-queries\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D6-048\",\"domain\":6,\"subdomain\":\"6.4 Compliance Maturity\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST indicator of program maturity according to CMM-style models?\",\"choices\":[\"Number of audits passed\",\"Documented, repeatable, measured processes that drive continuous improvement\",\"Headcount of the security team\",\"Spending on tools for general production deployments\"],\"correct\":1,\"explanation\":\"Maturity reflects process \\u2014 defined, measured, optimised. Audit pass rate is a downstream outcome. Headcount and tool spend are inputs, not maturity measures. CMMI levels 1-5 progress from Initial to Optimising.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-6-security-assessment-and-testing/\",\"title\":\"DestCert: CISSP Domain 6 \\u2014 Security Assessment & Testing\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"maturity\",\"cmmi\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D7-001\",\"domain\":7,\"subdomain\":\"7.1 IR Lifecycle\",\"difficulty\":\"medium\",\"stem\":\"Per NIST SP 800-61 Rev 2, what is the FIRST phase of incident response?\",\"choices\":[\"Containment\",\"Detection and Analysis\",\"Preparation\",\"Post-Incident Activity\"],\"correct\":2,\"explanation\":\"NIST 800-61 Rev 2 phases: Preparation \\u2192 Detection & Analysis \\u2192 Containment, Eradication & Recovery \\u2192 Post-Incident Activity (lessons learned). Preparation includes building the team, tools, and procedures so the rest of the lifecycle is feasible. Rev 3 (2025) restructures around four ongoing functions: Govern, Identify, Protect, Detect-Respond-Recover.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://nvlpubs.nist.gov/nistpubs/specialpublications/nist.sp.800-61r2.pdf\",\"title\":\"NIST SP 800-61 Rev 2 (NVLPubs PDF)\",\"captured\":\"2026-04-26\"},{\"url\":\"https://www.klogixsecurity.com/blog/navigating-incident-response-a-deep-dive-into-nist-800-61-containment-eradication-and-recovery\",\"title\":\"K Logix: Navigating IR \\u2014 NIST 800-61 Containment, Eradication, Recovery\",\"captured\":\"2026-04-26\"}],\"references\":[\"NIST SP 800-61 r2\"],\"tags\":[\"nist-800-61\",\"ir-phases\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D7-002\",\"domain\":7,\"subdomain\":\"7.1 IR Lifecycle\",\"difficulty\":\"easy\",\"stem\":\"During an active ransomware incident, which IR action takes PRIORITY?\",\"choices\":[\"Lessons-learned writeup\",\"Containment to limit further encryption and lateral spread\",\"Detailed forensic imaging of every affected disk\",\"Posting an external press release\"],\"correct\":1,\"explanation\":\"Containment limits further damage \\u2014 must come before exhaustive evidence collection or external communications. Lessons learned is the LAST phase. Imaging is part of investigation but not the immediate priority while encryption spreads. Press releases come after legal/PR coordination.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://www.klogixsecurity.com/blog/navigating-incident-response-a-deep-dive-into-nist-800-61-containment-eradication-and-recovery\",\"title\":\"K Logix: Navigating IR \\u2014 NIST 800-61 Containment, Eradication, Recovery\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"containment\",\"ransomware\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D7-003\",\"domain\":7,\"subdomain\":\"7.1 IR\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST description of 'eradication' in the IR lifecycle?\",\"choices\":[\"Restoring services when properly implemented\",\"Removing the cause so the threat cannot return\",\"Deleting all logs\",\"Notifying customers\"],\"correct\":1,\"explanation\":\"Eradication removes the root cause \\u2014 malware artefacts, attacker accounts, vulnerable configurations, persistence mechanisms. Recovery (next phase) restores services. Deleting logs is forbidden. Notifications happen alongside.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://www.klogixsecurity.com/blog/navigating-incident-response-a-deep-dive-into-nist-800-61-containment-eradication-and-recovery\",\"title\":\"K Logix: Navigating IR \\u2014 NIST 800-61 Containment, Eradication, Recovery\",\"captured\":\"2026-04-26\"},{\"url\":\"https://nvlpubs.nist.gov/nistpubs/specialpublications/nist.sp.800-61r2.pdf\",\"title\":\"NIST SP 800-61 Rev 2 (NVLPubs PDF)\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"eradication\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D7-004\",\"domain\":7,\"subdomain\":\"7.1 IR\",\"difficulty\":\"medium\",\"stem\":\"Which step in the post-incident phase MOST directly improves future security posture?\",\"choices\":[\"Sending congratulations to the team as a baseline configuration\",\"Documenting lessons learned and updating playbooks, controls, and detection logic\",\"Closing tickets without writing them up\",\"Archiving evidence and forgetting the incident\"],\"correct\":1,\"explanation\":\"Lessons learned must translate into concrete CHANGES \\u2014 updated playbooks, added detections, closed control gaps, refreshed training. Choice A (congratulations) is morale, not improvement. Choice C (closing tickets without writeup) destroys institutional learning. Choice D (archive and forget) ensures the next incident recurs. NIST 800-61 r3 explicitly weaves continuous improvement throughout the lifecycle, not just at the end.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://nvlpubs.nist.gov/nistpubs/specialpublications/nist.sp.800-61r2.pdf\",\"title\":\"NIST SP 800-61 Rev 2 (NVLPubs PDF)\",\"captured\":\"2026-04-26\"},{\"url\":\"https://tandem.app/blog/updated-nist-incident-response-guidance-sp-800-61-rev-3\",\"title\":\"Tandem: Updated NIST IR Guidance \\u2014 SP 800-61 Rev 3\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"lessons-learned\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D7-005\",\"domain\":7,\"subdomain\":\"7.2 Forensics\",\"difficulty\":\"medium\",\"stem\":\"Which is the CORRECT order of volatility, from MOST volatile to LEAST volatile?\",\"choices\":[\"Disk \\u2192 Memory \\u2192 CPU registers/cache \\u2192 Backup tapes\",\"CPU registers/cache \\u2192 System memory (RAM) \\u2192 Network state \\u2192 Disk \\u2192 Backup tapes\",\"Backup tapes \\u2192 Disk \\u2192 Memory \\u2192 Registers when applied to standard enterprise environments\",\"Disk \\u2192 Backup tapes \\u2192 Memory \\u2192 Registers\"],\"correct\":1,\"explanation\":\"RFC 3227 order of volatility: registers/cache \\u2192 memory \\u2192 network state/processes \\u2192 disk \\u2192 remote logs \\u2192 backup tapes. Capture in this order to preserve the most volatile evidence first. The other choices reverse or scramble the sequence.\",\"source\":\"guide\",\"guide_pages\":[2210,2215],\"guide_section\":\"Chapter 17 \\u2014 Order of Volatility\",\"web_sources\":[{\"url\":\"https://flashgenius.net/guides/incident-response-for-cissp-2026-nist-800-61-phases-evidence-handling-amp-chain-of-custody-interactive-study-guide\",\"title\":\"FlashGenius: IR for CISSP 2026 \\u2014 NIST 800-61 + chain of custody\",\"captured\":\"2026-04-26\"}],\"references\":[\"RFC 3227\"],\"tags\":[\"volatility\",\"forensics\"],\"notes\":\"\",\"chapter\":17},{\"id\":\"D7-006\",\"domain\":7,\"subdomain\":\"7.2 Forensics\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST practice for maintaining chain of custody?\",\"choices\":[\"Pass evidence informally between team members\",\"Document every transfer, location, and access\",\"Store evidence on a shared drive any team member can access\",\"Skip documentation if pressed for time\"],\"correct\":1,\"explanation\":\"Chain of custody is a documented record proving evidence integrity from seizure through court \\u2014 every transfer, every location, every access logged with date/time/who. Choice A (informal passes) breaks the chain. Choice C (shared drive) loses the named-custody record. Choice D (skipping documentation) destroys admissibility. A single gap in custody can render the evidence inadmissible \\u2014 that's why this is tested heavily.\",\"source\":\"guide\",\"guide_pages\":[2215,2220],\"guide_section\":\"Chapter 17 \\u2014 Chain of Custody\",\"web_sources\":[{\"url\":\"https://flashgenius.net/guides/incident-response-for-cissp-2026-nist-800-61-phases-evidence-handling-amp-chain-of-custody-interactive-study-guide\",\"title\":\"FlashGenius: IR for CISSP 2026 \\u2014 NIST 800-61 + chain of custody\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"chain-of-custody\"],\"notes\":\"\",\"chapter\":17},{\"id\":\"D7-007\",\"domain\":7,\"subdomain\":\"7.2 Forensics\",\"difficulty\":\"medium\",\"stem\":\"Which technique BEST verifies that a forensic image is byte-for-byte identical to the original media?\",\"choices\":[\"Visual inspection when properly implemented\",\"Cryptographic hashing of source and image; the digests must match\",\"File listing comparison given current best practices\",\"Boot the image and check the user interface\"],\"correct\":1,\"explanation\":\"Hash comparison provides cryptographic proof of identical content \\u2014 current forensic standards (SWGDE, NIST IR 8387) require SHA-256 minimum, with dual-hash (SHA-256 + SHA-1) as a defensive practice in case one is later challenged. MD5 is no longer accepted in court because of publicized chosen-prefix collisions. Visual inspection (A) misses subtle changes \\u2014 a single bit flip is invisible. File listing comparison (C) confirms names but not content. Booting the image (D) is destructive \\u2014 it modifies registry hives and timestamps, breaking the chain of custody.\",\"source\":\"guide\",\"guide_pages\":[2220,2225],\"guide_section\":\"Chapter 17 \\u2014 Imaging\",\"web_sources\":[{\"url\":\"https://flashgenius.net/guides/incident-response-for-cissp-2026-nist-800-61-phases-evidence-handling-amp-chain-of-custody-interactive-study-guide\",\"title\":\"FlashGenius: IR for CISSP 2026 \\u2014 NIST 800-61 + chain of custody\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"hashing\",\"imaging\"],\"notes\":\"\",\"chapter\":17},{\"id\":\"D7-008\",\"domain\":7,\"subdomain\":\"7.2 Evidence Types\",\"difficulty\":\"medium\",\"stem\":\"Which type of evidence is MOST authoritative in legal proceedings?\",\"choices\":[\"Best (primary, original)\",\"Secondary\",\"Hearsay\",\"Demonstrative\"],\"correct\":0,\"explanation\":\"Best evidence (the original document or media, or its forensic image) is preferred. Secondary evidence (copies) is less weighty. Hearsay is generally inadmissible without exception. Demonstrative evidence (charts, models) supports but does not replace original evidence.\",\"source\":\"guide\",\"guide_pages\":[2228,2232],\"guide_section\":\"Chapter 17 \\u2014 Evidence Types\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-7-security-operations/\",\"title\":\"DestCert: Insights into CISSP Domain 7 \\u2014 Security Operations\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"best-evidence\"],\"notes\":\"\",\"chapter\":17},{\"id\":\"D7-009\",\"domain\":7,\"subdomain\":\"7.3 BCP/DRP\",\"difficulty\":\"hard\",\"stem\":\"Which RAID level provides REDUNDANCY without the write penalty of parity calculation by writing to two disks simultaneously?\",\"choices\":[\"RAID 0\",\"RAID 1\",\"RAID 5\",\"RAID 6\"],\"correct\":1,\"explanation\":\"RAID 1 mirrors data across two disks \\u2014 no parity, full redundancy at 50% storage efficiency. RAID 0 stripes for performance with no redundancy. RAID 5 distributes parity (write penalty). RAID 6 has dual parity (more write penalty, more fault tolerance).\",\"source\":\"guide\",\"guide_pages\":[2240,2245],\"guide_section\":\"Chapter 18 \\u2014 RAID\",\"web_sources\":[{\"url\":\"https://cissprep.net/data-backup/\",\"title\":\"CISSPrep: Data Backup\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"raid-1\",\"mirroring\"],\"notes\":\"\",\"chapter\":17},{\"id\":\"D7-010\",\"domain\":7,\"subdomain\":\"7.3 BCP/DRP\",\"difficulty\":\"easy\",\"stem\":\"Which RAID level can survive the loss of TWO drives simultaneously?\",\"choices\":[\"RAID 1\",\"RAID 5\",\"RAID 6\",\"RAID 10\"],\"correct\":2,\"explanation\":\"RAID 6 uses dual parity \\u2014 surviving any two-drive failure. RAID 5 survives one. RAID 1 survives one (the mirror copy). RAID 10 (1+0) survives the loss of multiple drives but only if they aren't both members of the same mirror pair.\",\"source\":\"guide\",\"guide_pages\":[2242,2246],\"guide_section\":\"Chapter 18 \\u2014 RAID 6\",\"web_sources\":[{\"url\":\"https://cissprep.net/data-backup/\",\"title\":\"CISSPrep: Data Backup\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"raid-6\"],\"notes\":\"\",\"chapter\":17},{\"id\":\"D7-011\",\"domain\":7,\"subdomain\":\"7.3 Backup Sites\",\"difficulty\":\"medium\",\"stem\":\"Which alternate processing site type contains hardware ready to use, with current data restored, and is the FASTEST to bring online?\",\"choices\":[\"Cold site\",\"Warm site\",\"Hot site\",\"Mobile site\"],\"correct\":2,\"explanation\":\"Hot sites are continually maintained, fully equipped, and often have near-real-time data \\u2014 ready in minutes/hours. Warm sites have hardware but stale data (12+ hours). Cold sites have only space and utilities. Mobile sites are trailers brought to a location.\",\"source\":\"guide\",\"guide_pages\":[2250,2255],\"guide_section\":\"Chapter 18 \\u2014 Recovery Sites\",\"web_sources\":[{\"url\":\"https://www.cybrary.it/blog/disaster-recovery-hot-cold-warm-sites\",\"title\":\"Cybrary: CISSP \\u2014 Hot, Cold, and Warm Sites\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"hot-site\"],\"notes\":\"\",\"chapter\":17},{\"id\":\"D7-012\",\"domain\":7,\"subdomain\":\"7.3 Backup Types\",\"difficulty\":\"medium\",\"stem\":\"An organisation does a full backup Sunday and DIFFERENTIAL backups Monday-Saturday. What is needed to restore Friday's data?\",\"choices\":[\"Sunday full + every differential Mon-Fri\",\"Sunday full + Friday's differential\",\"Sunday full + Thursday's differential + Friday's incremental\",\"Friday's differential alone\"],\"correct\":1,\"explanation\":\"Differential backups capture changes since the LAST FULL \\u2014 so restoring needs only the full + the most recent differential (Friday's). Choice A (every diff Mon-Fri) confuses differential with incremental. Choice C blends 'differential' and 'incremental' which is technically inconsistent. Choice D ignores the full backup. Pattern: differential = simpler restore, slower backup; incremental = faster backup, longer restore chain.\",\"source\":\"guide\",\"guide_pages\":[2256,2260],\"guide_section\":\"Chapter 18 \\u2014 Backup Types\",\"web_sources\":[{\"url\":\"https://cissprep.net/data-backup/\",\"title\":\"CISSPrep: Data Backup\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"differential\",\"backup\"],\"notes\":\"\",\"chapter\":17},{\"id\":\"D7-013\",\"domain\":7,\"subdomain\":\"7.3 Backup Types\",\"difficulty\":\"medium\",\"stem\":\"Which backup type captures only data changed SINCE THE LAST INCREMENTAL OR FULL BACKUP?\",\"choices\":[\"Full\",\"Differential\",\"Incremental\",\"Snapshot\"],\"correct\":2,\"explanation\":\"Incrementals capture changes since the previous backup OF ANY TYPE \\u2014 fastest to back up, slowest to restore (need full + every incremental in the chain). Choice A (full) backs up everything. Choice B (differential) captures since last full only. Choice D (snapshot) is a point-in-time copy. Pattern: incrementals trade backup speed for restore complexity, differentials trade the opposite way.\",\"source\":\"guide\",\"guide_pages\":[2258,2262],\"guide_section\":\"Chapter 18 \\u2014 Incremental\",\"web_sources\":[{\"url\":\"https://cissprep.net/data-backup/\",\"title\":\"CISSPrep: Data Backup\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"incremental\"],\"notes\":\"\",\"chapter\":17},{\"id\":\"D7-014\",\"domain\":7,\"subdomain\":\"7.3 Backup Strategy\",\"difficulty\":\"easy\",\"stem\":\"Which backup strategy is recommended by CISA / industry as the '3-2-1 rule'?\",\"choices\":[\"3 copies, 2 different media types, 1 offsite\",\"3 backups per day, 2 hours retention, 1 admin\",\"3 administrators, 2 sites, 1 password\",\"3 daily, 2 weekly, 1 monthly\"],\"correct\":0,\"explanation\":\"3-2-1 = THREE copies of data, on TWO different media types, with ONE copy offsite. Modern variants: 3-2-1-1-0 adds an immutable copy and verified zero-error restoration. Choice B (3 backups/day) misframes as frequency. Choice C (admins/sites/passwords) invents. Choice D (3 daily/2 weekly/1 monthly) is a different retention pattern. The exam tests this rule directly.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://cissprep.net/data-backup/\",\"title\":\"CISSPrep: Data Backup\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"3-2-1-rule\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D7-015\",\"domain\":7,\"subdomain\":\"7.4 Patch Management\",\"difficulty\":\"medium\",\"stem\":\"What is the PRIMARY purpose of a maintenance window?\",\"choices\":[\"Allow staff vacation in most operational contexts under typical operating conditions\",\"Provide an authorised, communicated period for changes that may impact availability or service\",\"Reduce energy consumption given current best practices\",\"Enable physical inspections given current best practices\"],\"correct\":1,\"explanation\":\"A maintenance window is an authorised, communicated period during which changes that may impact availability or security may be applied \\u2014 with stakeholder notification, change-management approval, and rollback plans. Choice A (vacation) is HR scheduling, not change management. Choice C (energy) is an operations concern. Choice D (physical inspection) is a facilities task. The exam consistently frames maintenance windows as change-management governance, not anything else.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-7-security-operations/\",\"title\":\"DestCert: Insights into CISSP Domain 7 \\u2014 Security Operations\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"change\",\"maintenance-window\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D7-016\",\"domain\":7,\"subdomain\":\"7.4 Change Management\",\"difficulty\":\"medium\",\"stem\":\"Which is the PRIMARY purpose of a Change Advisory Board (CAB)?\",\"choices\":[\"Review every code commit when applied to standard enterprise environments\",\"Evaluate proposed changes for risk, business impact, and authorisation prior to implementation\",\"Approve hiring decisions\",\"Audit financial controls\"],\"correct\":1,\"explanation\":\"CAB authorises changes balancing operational, security, and business risk. Code-commit review is dev-team scope. Hiring and finance are unrelated. Emergency Change Advisory Boards (eCAB) handle urgent changes with abbreviated process.\",\"source\":\"guide\",\"guide_pages\":[2270,2275],\"guide_section\":\"Chapter 18 \\u2014 Change Mgmt\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-7-security-operations/\",\"title\":\"DestCert: Insights into CISSP Domain 7 \\u2014 Security Operations\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"change-mgmt\",\"cab\"],\"notes\":\"\",\"chapter\":17},{\"id\":\"D7-017\",\"domain\":7,\"subdomain\":\"7.4 Configuration Mgmt\",\"difficulty\":\"medium\",\"stem\":\"What is the PRIMARY purpose of a baseline configuration?\",\"choices\":[\"Save energy across the relevant control set\",\"Define an approved, secure starting state for systems and detect drift over time\",\"Track licence compliance only across the relevant control set\",\"Replace patch management under typical operating conditions\"],\"correct\":1,\"explanation\":\"Baselines define the APPROVED, secure starting state for systems \\u2014 configuration management tools (Ansible, Puppet, Chef, GPO) detect drift from baseline and remediate. Choice A (energy) is unrelated. Choice C (license compliance) is inventory. Choice D is wrong \\u2014 baselines complement patch management, neither replaces the other. The exam: baselines + drift detection + remediation = configuration assurance.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-7-security-operations/\",\"title\":\"DestCert: Insights into CISSP Domain 7 \\u2014 Security Operations\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"baseline\",\"config-mgmt\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D7-018\",\"domain\":7,\"subdomain\":\"7.5 SIEM/SOAR\",\"difficulty\":\"easy\",\"stem\":\"Which capability does SOAR ADD over SIEM?\",\"choices\":[\"Logging given current best practices\",\"Orchestration and automated response playbooks across security tools\",\"Vulnerability scanning given current best practices\",\"Endpoint protection when properly implemented\"],\"correct\":1,\"explanation\":\"SOAR (Security Orchestration, Automation, and Response) extends SIEM with PLAYBOOKS that automatically execute response actions across tools \\u2014 containment (isolate host), enrichment (look up IOC), ticket creation, user notifications. Choice A (logging) is the SIEM job. Choice C (vulnerability scanning) is a separate tool category. Choice D (endpoint protection) is EDR/AV. Pattern: SIEM correlates events; SOAR orchestrates response.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-7-security-operations/\",\"title\":\"DestCert: Insights into CISSP Domain 7 \\u2014 Security Operations\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"soar\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D7-019\",\"domain\":7,\"subdomain\":\"7.5 UEBA\",\"difficulty\":\"medium\",\"stem\":\"Which technology BUILDS BASELINES of user/entity behaviour and alerts on deviations?\",\"choices\":[\"UEBA\",\"WAF\",\"DLP\",\"NAC\"],\"correct\":0,\"explanation\":\"UEBA (User and Entity Behavior Analytics) profiles normal behaviour and surfaces anomalies (impossible-travel logins, unusual data access). WAF protects HTTP, DLP prevents data leakage, NAC controls access. UEBA is increasingly bundled into SIEM/XDR.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-7-security-operations/\",\"title\":\"DestCert: Insights into CISSP Domain 7 \\u2014 Security Operations\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"ueba\",\"behaviour\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D7-020\",\"domain\":7,\"subdomain\":\"7.6 BCP\",\"difficulty\":\"easy\",\"stem\":\"Which BCP plan focuses specifically on the technology recovery aspects?\",\"choices\":[\"BCP\",\"DRP\",\"Crisis Communications Plan\",\"COOP\"],\"correct\":1,\"explanation\":\"DRP (Disaster Recovery Plan) is the technology-recovery subset of the broader BCP. Crisis communications addresses messaging. COOP (Continuity of Operations Plan) is the federal-government continuity term. BCP is the overarching plan.\",\"source\":\"guide\",\"guide_pages\":[2280,2285],\"guide_section\":\"Chapter 18 \\u2014 DRP\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-7-security-operations/\",\"title\":\"DestCert: Insights into CISSP Domain 7 \\u2014 Security Operations\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"drp\"],\"notes\":\"\",\"chapter\":17},{\"id\":\"D7-021\",\"domain\":7,\"subdomain\":\"7.6 BCP Testing\",\"difficulty\":\"medium\",\"stem\":\"Which BCP test type is MOST disruptive but provides the HIGHEST ASSURANCE of recovery capability?\",\"choices\":[\"Tabletop\",\"Walkthrough\",\"Simulation\",\"Full interruption\"],\"correct\":3,\"explanation\":\"Full-interruption tests shift production to the DR site, demonstrating real recovery \\u2014 disruptive and risky if it fails, but the highest-assurance test. Tabletop/walkthrough/simulation are progressively more involved but stop short of cutover.\",\"source\":\"guide\",\"guide_pages\":[2287,2292],\"guide_section\":\"Chapter 18 \\u2014 DR Testing\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/recovery-strategies-mindmap-cissp-domain-7/\",\"title\":\"DestCert: Recovery Strategies Mindmap \\u2014 Domain 7\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"dr-testing\",\"full-interruption\"],\"notes\":\"\",\"chapter\":17},{\"id\":\"D7-022\",\"domain\":7,\"subdomain\":\"7.7 Egress Monitoring\",\"difficulty\":\"medium\",\"stem\":\"Which control is MOST EFFECTIVE for detecting data exfiltration to attacker-controlled cloud storage?\",\"choices\":[\"Allow all outbound traffic and trust users when properly implemented\",\"DLP egress inspection plus outbound proxy with TLS interception or destination categorisation\",\"Disable internet access entirely in commonly cited frameworks\",\"Open all firewall ports in most enterprise deployments\"],\"correct\":1,\"explanation\":\"Outbound proxies with destination categorisation/blocking (and DLP content inspection where TLS is broken with policy) detect/block exfiltration. Trusting all egress and disabling internet are extremes. Opening all ports defeats the firewall.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-7-security-operations/\",\"title\":\"DestCert: Insights into CISSP Domain 7 \\u2014 Security Operations\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"egress\",\"exfiltration\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D7-023\",\"domain\":7,\"subdomain\":\"7.6 BCP\",\"difficulty\":\"medium\",\"stem\":\"Which factor MOST influences whether to choose a hot, warm, or cold site?\",\"choices\":[\"Aesthetic preferences\",\"RTO requirement balanced against cost\",\"Building colour\",\"Vendor preference\"],\"correct\":1,\"explanation\":\"Recovery site selection is fundamentally a cost vs RTO trade-off: lower RTO requires more pre-positioned infrastructure (hot site = lowest RTO, highest cost; cold site = cheapest, longest RTO). Choices A (aesthetics), C (colour), and D (vendor preference) are not relevant criteria. The BIA drives the RTO requirement; cost determines what your organisation can afford. The exam's right answer is always 'risk-based business decision'.\",\"source\":\"guide\",\"guide_pages\":[2253,2258],\"guide_section\":\"Chapter 18 \\u2014 Recovery Sites\",\"web_sources\":[{\"url\":\"https://www.cybrary.it/blog/disaster-recovery-hot-cold-warm-sites\",\"title\":\"Cybrary: CISSP \\u2014 Hot, Cold, and Warm Sites\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"recovery-site\",\"rto\"],\"notes\":\"\",\"chapter\":17},{\"id\":\"D7-024\",\"domain\":7,\"subdomain\":\"7.7 Vulnerability Mgmt\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST cadence for routine vulnerability scanning of internet-facing assets?\",\"choices\":[\"Annually in most enterprise deployments\",\"At least monthly, with continuous scanning preferred where feasible\",\"Every 5 years under typical operating conditions\",\"Only after a breach under typical operating conditions\"],\"correct\":1,\"explanation\":\"Internet-facing surfaces change constantly \\u2014 monthly is the modern minimum, with continuous scanning increasingly common (PCI-DSS requires quarterly external + scans after any significant change). Choice A (annually) misses ~11 months of new exposure. Choice C (every 5 years) is essentially negligence. Choice D (only after a breach) is post-incident, not prevention. The exam pattern: external surfaces deserve more scanning frequency than internal ones.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-7-security-operations/\",\"title\":\"DestCert: Insights into C

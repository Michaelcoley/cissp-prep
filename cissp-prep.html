-04-26\"}],\"references\":[],\"tags\":[\"awareness\",\"role-based\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D1-043\",\"domain\":1,\"subdomain\":\"1.3 Compliance\",\"difficulty\":\"medium\",\"stem\":\"HIPAA's Security Rule requires three categories of safeguards. Which set is correct?\",\"choices\":[\"Physical, Logical, Administrative\",\"Administrative, Physical, Technical\",\"Preventive, Detective, Corrective\",\"Confidentiality, Integrity, Availability\"],\"correct\":1,\"explanation\":\"HIPAA Security Rule organises safeguards as Administrative, Physical, and Technical. Choice C is the control-time taxonomy; choice D is the CIA triad. Choice A swaps 'Logical' for 'Technical' which is incorrect HIPAA terminology.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-1-security-and-risk-management/\",\"title\":\"DestCert: Unraveling CISSP Domain 1 \\u2014 Security and Risk Management\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"hipaa\",\"compliance\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D1-044\",\"domain\":1,\"subdomain\":\"1.5 ISMS\",\"difficulty\":\"easy\",\"stem\":\"ISO/IEC 27001 establishes the requirements for what?\",\"choices\":[\"A baseline catalog of security controls\",\"An Information Security Management System (ISMS)\",\"A penetration testing methodology\",\"A risk-rating quantitative model\"],\"correct\":1,\"explanation\":\"ISO 27001 specifies an ISMS \\u2014 a managed, auditable program. ISO 27002 provides the control catalog. ISO 27001 references ISO 27005 for risk management methodology. The exam often pairs ISO 27001 (ISMS) with ISO 27002 (control catalog).\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://www.iso.org/standard/27001\",\"title\":\"ISO/IEC 27001 \\u2014 Information security management\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"iso-27001\",\"isms\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D1-045\",\"domain\":1,\"subdomain\":\"1.10 BCP\",\"difficulty\":\"medium\",\"stem\":\"Which test type involves shifting production operations to the DR site for a defined period?\",\"choices\":[\"Tabletop\",\"Walkthrough\",\"Parallel\",\"Full interruption\"],\"correct\":3,\"explanation\":\"A full-interruption test actually moves production to the DR site, providing the highest assurance and the highest risk if it fails. Parallel runs DR alongside production without cutting over. Tabletop and walkthrough are discussion-based.\",\"source\":\"guide\",\"guide_pages\":[358,360],\"guide_section\":\"Chapter 3 \\u2014 DR Testing\",\"web_sources\":[],\"references\":[],\"tags\":[\"drp\",\"full-interruption\"],\"notes\":\"\",\"chapter\":1},{\"id\":\"D1-046\",\"domain\":1,\"subdomain\":\"1.10 BCP\",\"difficulty\":\"medium\",\"stem\":\"What is the PRIMARY reason to test the BCP at least annually?\",\"choices\":[\"Regulatory compliance only in most operational contexts\",\"Validate the plan still reflects current operations and identify gaps\",\"Provide team-building opportunities\",\"Document evidence for insurers\"],\"correct\":1,\"explanation\":\"Operations change continually \\u2014 staff, vendors, applications, dependencies all drift. Annual (at minimum) testing surfaces gaps and forces plan updates. Compliance and insurer evidence are downstream benefits, not the primary rationale.\",\"source\":\"guide\",\"guide_pages\":[357,361],\"guide_section\":\"Chapter 3 \\u2014 BCP Testing\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-1-security-and-risk-management/\",\"title\":\"DestCert: Unraveling CISSP Domain 1 \\u2014 Security and Risk Management\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"bcp\",\"testing\"],\"notes\":\"\",\"chapter\":1},{\"id\":\"D1-047\",\"domain\":1,\"subdomain\":\"1.4 Risk\",\"difficulty\":\"hard\",\"stem\":\"Which control type fires AFTER an incident to restore operations?\",\"choices\":[\"Preventive\",\"Detective\",\"Corrective\",\"Deterrent\"],\"correct\":2,\"explanation\":\"Corrective controls (restore from backup, rebuild systems) act after detection to fix damage. Preventive stops events; detective discovers them; deterrent discourages would-be attackers. CISSP often layers control types: preventive + detective + corrective.\",\"source\":\"guide\",\"guide_pages\":[208,215],\"guide_section\":\"Chapter 1 \\u2014 Control Types\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-1-security-and-risk-management/\",\"title\":\"DestCert: Unraveling CISSP Domain 1 \\u2014 Security and Risk Management\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"control-types\",\"corrective\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D1-048\",\"domain\":1,\"subdomain\":\"1.4 Risk\",\"difficulty\":\"medium\",\"stem\":\"An IDS that ALERTS on suspicious activity is BEST classified as which control type?\",\"choices\":[\"Preventive\",\"Detective\",\"Corrective\",\"Compensating\"],\"correct\":1,\"explanation\":\"An alerting IDS detects suspicious activity but takes no preventive action \\u2014 that's a DETECTIVE control. Choice A (preventive) would describe an IPS (in-line, blocking). Choice C (corrective) restores after damage. Choice D (compensating) substitutes when a primary control isn't feasible. Memorise: IDS \\u2192 detective; IPS \\u2192 preventive; the difference is in-line blocking capability.\",\"source\":\"guide\",\"guide_pages\":[210,216],\"guide_section\":\"Chapter 1 \\u2014 Control Types\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-1-security-and-risk-management/\",\"title\":\"DestCert: Unraveling CISSP Domain 1 \\u2014 Security and Risk Management\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"control-types\",\"ids\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D1-049\",\"domain\":1,\"subdomain\":\"1.5 Frameworks\",\"difficulty\":\"medium\",\"stem\":\"Which framework provides 5 functions, 23 categories, and ~108 subcategories of cybersecurity outcomes (in the 1.1 release)?\",\"choices\":[\"NIST CSF\",\"ISO 27002\",\"CIS Controls v8\",\"OWASP SAMM\"],\"correct\":0,\"explanation\":\"NIST CSF 1.1 organised outcomes in 5 functions / 23 categories / 108 subcategories \\u2014 and CSF 2.0 added a 6th function (Govern) in Feb 2024. Choice B (ISO 27002:2022) has 93 controls organised differently. Choice C (CIS Controls v8) has 18 controls + 153 safeguards. Choice D (OWASP SAMM) is a software-security maturity model with 5 business functions \\u00d7 4 maturity levels. Each framework has distinct structure \\u2014 memorise their shape, not just their names.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://www.nist.gov/cyberframework\",\"title\":\"NIST Cybersecurity Framework (CSF) 2.0\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"nist-csf\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D1-050\",\"domain\":1,\"subdomain\":\"1.3 Privacy\",\"difficulty\":\"medium\",\"stem\":\"Which GDPR concept requires that data collection and processing be limited to what is necessary for the stated purpose?\",\"choices\":[\"Storage limitation\",\"Data minimisation\",\"Purpose limitation\",\"Lawfulness, fairness, transparency\"],\"correct\":1,\"explanation\":\"Data minimisation (Article 5(1)(c)) restricts collection to what is necessary. Storage limitation governs how long data is retained. Purpose limitation requires use only for the originally stated purpose. The first principle (lawfulness\\u2026) is a separate Article 5(1)(a) requirement.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://gdpr-info.eu/\",\"title\":\"GDPR Info: General Data Protection Regulation full text\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"gdpr\",\"minimisation\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D1-051\",\"domain\":1,\"subdomain\":\"1.6 Personnel\",\"difficulty\":\"medium\",\"stem\":\"What is the PRIMARY security purpose of a thorough background check for a new hire who will have access to sensitive systems?\",\"choices\":[\"Verify educational credentials\",\"Identify adverse history that increases insider-threat risk\",\"Comply with HR onboarding workflow\",\"Establish baseline for performance review\"],\"correct\":1,\"explanation\":\"Background screening's security purpose is identifying adverse history (financial distress, criminal conduct, deceptive credentials) that materially raises insider-threat risk. Education verification and HR workflow are operational, not the primary security driver.\",\"source\":\"guide\",\"guide_pages\":[289,292],\"guide_section\":\"Chapter 2 \\u2014 Hiring Practices\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-1-security-and-risk-management/\",\"title\":\"DestCert: Unraveling CISSP Domain 1 \\u2014 Security and Risk Management\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"personnel\",\"background-check\"],\"notes\":\"\",\"chapter\":1},{\"id\":\"D1-052\",\"domain\":1,\"subdomain\":\"1.10 BCP\",\"difficulty\":\"medium\",\"stem\":\"An organisation classifies a process as 'tier 0' meaning no acceptable downtime. Which strategy BEST satisfies this?\",\"choices\":[\"Cold site with weekly backups in most operational contexts\",\"Warm site with nightly snapshots\",\"Hot site with continuous synchronous replication and active-active failover\",\"Reciprocal agreement with a peer organisation\"],\"correct\":2,\"explanation\":\"Active-active hot-site architectures with synchronous replication minimise RTO and RPO toward zero \\u2014 appropriate for tier-0 systems. Cold/warm sites take hours-to-days. Reciprocal agreements introduce too much variability to support a tier-0 SLA.\",\"source\":\"guide\",\"guide_pages\":[346,350],\"guide_section\":\"Chapter 3 \\u2014 Recovery Strategies\",\"web_sources\":[],\"references\":[],\"tags\":[\"bcp\",\"tier-0\"],\"notes\":\"\",\"chapter\":1},{\"id\":\"D1-053\",\"domain\":1,\"subdomain\":\"1.4 Risk\",\"difficulty\":\"medium\",\"stem\":\"Which factor BEST distinguishes a risk register entry from a vulnerability list entry?\",\"choices\":[\"A risk entry includes a CVE; a vulnerability does not\",\"A risk entry combines a threat acting on a vulnerability with potential impact and likelihood\",\"A vulnerability entry has higher priority by default\",\"There is no meaningful difference in most operational contexts\"],\"correct\":1,\"explanation\":\"Risk = Threat \\u00d7 Vulnerability \\u00d7 Impact (in shorthand). A vulnerability list catalogs weaknesses; a risk register adds threat actor, likelihood, and impact context to make the entry actionable for management. Choice A reverses CVE usage; choice C and D are wrong.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-1-security-and-risk-management/\",\"title\":\"DestCert: Unraveling CISSP Domain 1 \\u2014 Security and Risk Management\",\"captured\":\"2026-04-26\"},{\"url\":\"https://csrc.nist.gov/pubs/sp/800/30/r1/final\",\"title\":\"NIST SP 800-30 Rev 1: Guide for Conducting Risk Assessments\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"risk-register\",\"vulnerability\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D1-054\",\"domain\":1,\"subdomain\":\"1.7 Supply Chain\",\"difficulty\":\"medium\",\"stem\":\"Which is the FIRST step in vendor risk management for a new third-party vendor?\",\"choices\":[\"Sign the contract when applied to standard enterprise environments\",\"Conduct a risk assessment scaled to the data and access the vendor will receive\",\"Obtain a SOC 2 Type II report\",\"Negotiate the SLA\"],\"correct\":1,\"explanation\":\"Risk-based vendor assessment determines the depth of further diligence (SOC 2, on-site assessment, contract terms). Signing first or asking for SOC 2 universally are common failure modes. Manager-mindset answers reach for assessment-first.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-1-security-and-risk-management/\",\"title\":\"DestCert: Unraveling CISSP Domain 1 \\u2014 Security and Risk Management\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"vendor-risk\",\"third-party\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D1-055\",\"domain\":1,\"subdomain\":\"1.5 Governance\",\"difficulty\":\"medium\",\"stem\":\"Which document type provides the BEST evidence to an external auditor that the organisation routinely reviews and updates its policies?\",\"choices\":[\"The current policy text alone given current best practices\",\"Documented review history with sign-offs and revision dates\",\"Verbal confirmation from the CISO given current best practices\",\"Email archives in commonly cited frameworks\"],\"correct\":1,\"explanation\":\"Auditors require documentary evidence of governance discipline: dated review records, version history, and sign-offs. The current text alone shows what exists today, not how it is maintained. Verbal evidence and email archives are weak audit artefacts.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-1-security-and-risk-management/\",\"title\":\"DestCert: Unraveling CISSP Domain 1 \\u2014 Security and Risk Management\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"governance\",\"audit-evidence\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D1-056\",\"domain\":1,\"subdomain\":\"1.4 Risk\",\"difficulty\":\"medium\",\"stem\":\"Which risk-treatment option is APPROPRIATE for a low-impact, low-likelihood risk where mitigation cost would exceed expected loss?\",\"choices\":[\"Mitigate\",\"Avoid\",\"Accept\",\"Transfer\"],\"correct\":2,\"explanation\":\"Acceptance is the right answer when the cost of mitigation outweighs expected loss and the risk is within appetite. Mitigation overspends; avoidance disrupts the business unnecessarily; transfer (insurance) typically isn't economical for trivial risks.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://wentzwu.com/2021/10/03/cissp-practice-questions-20211002/\",\"title\":\"Wentz Wu: CISSP Practice Questions 20211002\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"risk-acceptance\",\"manager-mindset\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D1-057\",\"domain\":1,\"subdomain\":\"1.10 BCP\",\"difficulty\":\"hard\",\"stem\":\"An organisation has RTO = 4 hours, RPO = 15 minutes, and MTD = 8 hours. After a disaster, recovery completes 5 hours later but data restored is 30 minutes old. Which objective(s) failed?\",\"choices\":[\"RTO and RPO both failed\",\"Only RPO failed\",\"Only RTO failed\",\"MTD failed\"],\"correct\":0,\"explanation\":\"Pre-disaster targets: RTO 4h, RPO 15min, MTD 8h. Actual: recovery took 5h (0.5h longer than RTO target \\u2014 RTO BREACHED), data restored is 30min stale (15min over RPO budget \\u2014 RPO BREACHED), total downtime 5h is within the 8h MTD ceiling (MTD met). So both time- and data-objectives missed. Choice B (only RPO) misses the 1-hour RTO overrun. Choice C (only RTO) misses the 2x RPO miss. Choice D (MTD failed) is wrong \\u2014 5h \\u2264 8h MTD.\",\"source\":\"canonical\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://wentzwu.com/2020/04/05/common-bia-terminologies/\",\"title\":\"Wentz Wu: Common BIA Terminologies\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"bia\",\"rto\",\"rpo\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D1-058\",\"domain\":1,\"subdomain\":\"1.5 Governance\",\"difficulty\":\"medium\",\"stem\":\"What is the PRIMARY purpose of an Information Security Steering Committee?\",\"choices\":[\"Approve firewall changes under typical compliance requirements\",\"Provide cross-functional executive direction and prioritisation for the security program\",\"Replace the CISO function\",\"Conduct technical risk assessments\"],\"correct\":1,\"explanation\":\"A steering committee aligns business, IT, legal, finance, and risk leadership around security priorities and budget \\u2014 a governance function. It does not run the program (that is the CISO/security team) and does not perform technical work.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-1-security-and-risk-management/\",\"title\":\"DestCert: Unraveling CISSP Domain 1 \\u2014 Security and Risk Management\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"governance\",\"steering-committee\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D1-059\",\"domain\":1,\"subdomain\":\"1.4 Risk\",\"difficulty\":\"medium\",\"stem\":\"Which statement BEST describes inherent risk?\",\"choices\":[\"The risk that remains after controls\",\"The risk before any controls are applied\",\"The risk that is purely caused by the control itself\",\"The risk associated with insurance underwriting\"],\"correct\":1,\"explanation\":\"Inherent risk = the gross risk before any controls are applied. Choice A describes RESIDUAL risk (what remains after controls). Choice C describes SECONDARY risk (introduced by a control itself). Choice D is unrelated to risk-management terminology. Mature risk programs track all three: inherent \\u2192 residual after treatment \\u2192 secondary from new controls.\",\"source\":\"guide\",\"guide_pages\":[306,308],\"guide_section\":\"Chapter 2 \\u2014 Risk Concepts\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-1-security-and-risk-management/\",\"title\":\"DestCert: Unraveling CISSP Domain 1 \\u2014 Security and Risk Management\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"inherent-risk\"],\"notes\":\"\",\"chapter\":1},{\"id\":\"D1-060\",\"domain\":1,\"subdomain\":\"1.4 Risk\",\"difficulty\":\"medium\",\"stem\":\"Which methodology was developed specifically by Microsoft to identify threats during product design?\",\"choices\":[\"PASTA\",\"DREAD\",\"STRIDE\",\"Trike\"],\"correct\":2,\"explanation\":\"Microsoft developed STRIDE in the late 1990s to categorise threats during the SDL design phase. PASTA (Tony Ucedav\\u00e9lez), DREAD (also Microsoft, but a scoring method), and Trike (independent academic) all came later or serve different purposes.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/threat-modeling-methodologies/\",\"title\":\"DestCert: Threat Modeling Methodologies \\u2014 STRIDE, PASTA, DREAD\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"stride\",\"microsoft\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D1-061\",\"domain\":1,\"subdomain\":\"1.10 BCP\",\"difficulty\":\"medium\",\"stem\":\"Which recovery strategy involves contracting with a peer organisation to use one another's facilities in a disaster?\",\"choices\":[\"Hot site\",\"Cold site\",\"Mobile site\",\"Reciprocal agreement\"],\"correct\":3,\"explanation\":\"Reciprocal agreements (mutual aid pacts) are inexpensive but problematic \\u2014 peer organisations may be impacted by the same regional disaster, capacity may not exist, and confidentiality agreements complicate operations. Hot/warm/cold sites and mobile units are dedicated alternatives.\",\"source\":\"guide\",\"guide_pages\":[348,351],\"guide_section\":\"Chapter 3 \\u2014 Recovery Strategies\",\"web_sources\":[],\"references\":[],\"tags\":[\"reciprocal-agreement\"],\"notes\":\"\",\"chapter\":1},{\"id\":\"D1-062\",\"domain\":1,\"subdomain\":\"1.6 Personnel\",\"difficulty\":\"medium\",\"stem\":\"When an employee with privileged access is terminated, what should happen FIRST regarding their access?\",\"choices\":[\"Disable accounts after the next business-day audit\",\"Disable or revoke ALL access at the moment of termination\",\"Wait 30 days to allow knowledge transfer\",\"Restrict access only to systems they used\"],\"correct\":1,\"explanation\":\"Privileged access must be revoked immediately at termination \\u2014 delays create insider-threat windows. Manager-mindset answer: simultaneous notification to HR and IT, with revocation at the moment of separation. The other choices leave attack windows open.\",\"source\":\"guide\",\"guide_pages\":[296,299],\"guide_section\":\"Chapter 2 \\u2014 Termination\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-1-security-and-risk-management/\",\"title\":\"DestCert: Unraveling CISSP Domain 1 \\u2014 Security and Risk Management\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"termination\",\"access-revocation\"],\"notes\":\"\",\"chapter\":1},{\"id\":\"D1-063\",\"domain\":1,\"subdomain\":\"1.5 Governance\",\"difficulty\":\"medium\",\"stem\":\"Which document is MOST appropriate for codifying the security expectations the organisation has of its employees?\",\"choices\":[\"Procedure\",\"Acceptable Use Policy (AUP)\",\"Standard\",\"Guideline\"],\"correct\":1,\"explanation\":\"An AUP defines acceptable behaviour with company assets and systems \\u2014 what employees may and may not do. Procedures are step-by-step technical instructions. Standards specify mandatory configurations. Guidelines are recommendations.\",\"source\":\"guide\",\"guide_pages\":[185,188],\"guide_section\":\"Chapter 1 \\u2014 Documentation\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-1-security-and-risk-management/\",\"title\":\"DestCert: Unraveling CISSP Domain 1 \\u2014 Security and Risk Management\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"aup\",\"policy\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D1-064\",\"domain\":1,\"subdomain\":\"1.5 Governance\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST description of the relationship between security policy and security standards?\",\"choices\":[\"Standards drive the policy across the relevant policy framework in most enterprise deployments\",\"Policy expresses high-level intent; standards specify mandatory technical or configuration requirements that implement the policy\",\"They are interchangeable terms when properly implemented\",\"Standards are optional; policies are mandatory in most enterprise deployments\"],\"correct\":1,\"explanation\":\"Policy \\u2192 Standards \\u2192 Procedures/Guidelines. Policy declares intent at the management level; standards translate intent into mandatory requirements (e.g., 'use AES-256 for data at rest'). Standards are also mandatory, not optional. Choice A reverses the hierarchy.\",\"source\":\"guide\",\"guide_pages\":[183,188],\"guide_section\":\"Chapter 1 \\u2014 Documentation Hierarchy\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-1-security-and-risk-management/\",\"title\":\"DestCert: Unraveling CISSP Domain 1 \\u2014 Security and Risk Management\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"policy\",\"standards\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D2-001\",\"domain\":2,\"subdomain\":\"2.1 Information Classification\",\"difficulty\":\"easy\",\"stem\":\"Who is ULTIMATELY responsible for classifying data?\",\"choices\":[\"Data custodian\",\"Data owner\",\"Data user\",\"System administrator\"],\"correct\":1,\"explanation\":\"The data owner \\u2014 a senior business executive \\u2014 is accountable for classification decisions. Custodians implement the controls the owner specifies. Users follow the rules. System admins are a type of custodian. CISSP routinely tests that the owner is a business leader, not IT.\",\"source\":\"guide\",\"guide_pages\":[600,605],\"guide_section\":\"Chapter 5 \\u2014 Data Classification\",\"web_sources\":[{\"url\":\"https://www.threatonthewire.com/cissp-domain-2-ownership-information-assets/\",\"title\":\"ThreatOnTheWire: Ownership of Information and Assets\",\"captured\":\"2026-04-26\"},{\"url\":\"https://destcert.com/resources/domain-2-asset-security/\",\"title\":\"DestCert: Asset Security in CISSP Domain 2\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"ownership\",\"data-owner\"],\"notes\":\"\",\"chapter\":4},{\"id\":\"D2-002\",\"domain\":2,\"subdomain\":\"2.2 Data Roles\",\"difficulty\":\"medium\",\"stem\":\"Which role is responsible for the day-to-day operational protection of data, including backups and access control implementation?\",\"choices\":[\"Data owner\",\"Data custodian\",\"Data steward\",\"Data processor\"],\"correct\":1,\"explanation\":\"Data custodians implement the controls owners specify \\u2014 backups, restore tests, ACL maintenance. Stewards act as subject-matter liaisons across data quality and metadata. Processors (under GDPR) act on a controller's instructions for personal data. Owners are accountable, not operational.\",\"source\":\"guide\",\"guide_pages\":[605,608],\"guide_section\":\"Chapter 5 \\u2014 Data Roles\",\"web_sources\":[{\"url\":\"https://www.threatonthewire.com/cissp-domain-2-ownership-information-assets/\",\"title\":\"ThreatOnTheWire: Ownership of Information and Assets\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"custodian\"],\"notes\":\"\",\"chapter\":4},{\"id\":\"D2-003\",\"domain\":2,\"subdomain\":\"2.3 Data States\",\"difficulty\":\"medium\",\"stem\":\"Which protection mechanism is MOST appropriate for data in transit across an untrusted network?\",\"choices\":[\"Full-disk encryption\",\"Database column encryption\",\"TLS 1.2 or 1.3 transport encryption\",\"Tokenisation at rest\"],\"correct\":2,\"explanation\":\"Data in transit needs in-flight confidentiality and integrity \\u2014 TLS provides both. FDE protects data at rest. Column encryption protects specific fields at rest. Tokenisation replaces sensitive values, but is a data-at-rest technique. The three data states (rest, transit, use) drive control choice.\",\"source\":\"guide\",\"guide_pages\":[610,615],\"guide_section\":\"Chapter 5 \\u2014 Data States\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-2-asset-security/\",\"title\":\"DestCert: Asset Security in CISSP Domain 2\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"data-states\",\"tls\"],\"notes\":\"\",\"chapter\":4},{\"id\":\"D2-004\",\"domain\":2,\"subdomain\":\"2.4 Data Retention\",\"difficulty\":\"medium\",\"stem\":\"What is the PRIMARY drawback of retaining sensitive data longer than necessary?\",\"choices\":[\"It increases storage cost under typical compliance requirements\",\"It increases legal, regulatory, and breach-impact exposure\",\"It violates data classification rules\",\"It complicates DLP rule writing\"],\"correct\":1,\"explanation\":\"Retaining data past its useful life expands legal/regulatory obligations (e-discovery, GDPR Article 5(1)(e) storage limitation), increases breach blast-radius, and grows compliance scope. Storage cost is real but secondary. Manager-mindset framing prefers risk-based answers.\",\"source\":\"guide\",\"guide_pages\":[618,622],\"guide_section\":\"Chapter 5 \\u2014 Retention\",\"web_sources\":[{\"url\":\"https://gdpr-info.eu/\",\"title\":\"GDPR Info: General Data Protection Regulation full text\",\"captured\":\"2026-04-26\"},{\"url\":\"https://destcert.com/resources/domain-2-asset-security/\",\"title\":\"DestCert: Asset Security in CISSP Domain 2\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"retention\",\"minimisation\"],\"notes\":\"\",\"chapter\":4},{\"id\":\"D2-005\",\"domain\":2,\"subdomain\":\"2.5 Sanitisation\",\"difficulty\":\"medium\",\"stem\":\"Per NIST SP 800-88 Rev 1, which sanitisation method is APPROPRIATE for media that will leave the organisation's control and contained moderate-impact data?\",\"choices\":[\"Clear\",\"Purge\",\"Destroy\",\"Format\"],\"correct\":1,\"explanation\":\"Purge defeats laboratory-level recovery and is recommended when media leaves organisational control with moderate-impact data. Clear is sufficient only when media stays in-house. Destroy is required for high-impact data leaving control. Format is not a sanitisation method.\",\"source\":\"guide\",\"guide_pages\":[625,630],\"guide_section\":\"Chapter 5 \\u2014 NIST 800-88 Sanitisation\",\"web_sources\":[{\"url\":\"https://csrc.nist.gov/pubs/sp/800/88/r1/final\",\"title\":\"NIST SP 800-88 Rev 1: Guidelines for Media Sanitization\",\"captured\":\"2026-04-26\"},{\"url\":\"https://inventivehq.com/blog/nist-800-88-media-sanitization-complete-guide\",\"title\":\"InventiveHQ: NIST 800-88 \\u2014 Clear, Purge, Destroy Methods Explained\",\"captured\":\"2026-04-26\"}],\"references\":[\"NIST SP 800-88 Rev 1\"],\"tags\":[\"sanitisation\",\"purge\"],\"notes\":\"\",\"chapter\":4},{\"id\":\"D2-006\",\"domain\":2,\"subdomain\":\"2.5 Sanitisation\",\"difficulty\":\"medium\",\"stem\":\"What is the ONLY NIST 800-88 sanitisation outcome guaranteed to render data unrecoverable by any state-of-the-art forensic technique on traditional magnetic media?\",\"choices\":[\"Clear (overwrite)\",\"Purge (degauss/crypto-erase)\",\"Destroy (shred/incinerate)\",\"Quick format\"],\"correct\":2,\"explanation\":\"Destroy renders the media physically incapable of holding data. Purge is strong but theoretical recovery may persist on some media types. Clear only beats simple recovery. Quick format is not sanitisation. For HDDs, degaussing is purge; for SEDs, crypto-erase is purge; only physical destruction is destroy.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://csrc.nist.gov/pubs/sp/800/88/r1/final\",\"title\":\"NIST SP 800-88 Rev 1: Guidelines for Media Sanitization\",\"captured\":\"2026-04-26\"},{\"url\":\"https://jetico.com/blog/nist-sp-800-88-guidelines-media-sanitization-explained/\",\"title\":\"Jetico: NIST SP 800-88 Guidelines for Media Sanitization Explained\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"sanitisation\",\"destroy\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D2-007\",\"domain\":2,\"subdomain\":\"2.5 Sanitisation\",\"difficulty\":\"medium\",\"stem\":\"Cryptographic erasure is MOST EFFECTIVE on which type of media?\",\"choices\":[\"Magnetic tape given current best practices\",\"Optical media (CD/DVD) given current best practices\",\"Self-encrypting drive (SED) where data is stored ciphertext-only\",\"Punched-card storage in standard practice\"],\"correct\":2,\"explanation\":\"Crypto-erase works by destroying or replacing the media-encryption key on hardware that already encrypts everything written (SEDs, modern SSDs, smartphones). Without the key, ciphertext is unrecoverable. Tape and optical media don't natively encrypt at the device level.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://inventivehq.com/blog/nist-800-88-media-sanitization-complete-guide\",\"title\":\"InventiveHQ: NIST 800-88 \\u2014 Clear, Purge, Destroy Methods Explained\",\"captured\":\"2026-04-26\"},{\"url\":\"https://jetico.com/blog/nist-sp-800-88-guidelines-media-sanitization-explained/\",\"title\":\"Jetico: NIST SP 800-88 Guidelines for Media Sanitization Explained\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"crypto-shredding\",\"sed\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D2-008\",\"domain\":2,\"subdomain\":\"2.6 Privacy\",\"difficulty\":\"medium\",\"stem\":\"Under GDPR, which role is responsible for ensuring an organisation's compliance with data protection law and acts as a contact point with data subjects and regulators?\",\"choices\":[\"Data Controller\",\"Data Processor\",\"Data Protection Officer (DPO)\",\"Chief Information Officer\"],\"correct\":2,\"explanation\":\"The DPO advises, monitors, and acts as the regulatory point of contact. The controller has legal accountability for purposes/means. The processor handles data on instructions. The CIO is an internal IT executive, not a GDPR-defined role.\",\"source\":\"guide\",\"guide_pages\":[270,275],\"guide_section\":\"Chapter 4 \\u2014 GDPR\",\"web_sources\":[{\"url\":\"https://gdpr-info.eu/\",\"title\":\"GDPR Info: General Data Protection Regulation full text\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"gdpr\",\"dpo\"],\"notes\":\"\",\"chapter\":1},{\"id\":\"D2-009\",\"domain\":2,\"subdomain\":\"2.4 DLP\",\"difficulty\":\"medium\",\"stem\":\"Which DLP deployment topology is MOST effective at preventing inadvertent exposure of sensitive data uploaded to personal cloud storage?\",\"choices\":[\"Network DLP at the perimeter only\",\"Endpoint DLP that inspects user actions on the device\",\"Storage DLP scanning servers nightly\",\"Email DLP only\"],\"correct\":1,\"explanation\":\"Personal cloud uploads often happen over TLS in browsers \\u2014 endpoint DLP can intercept and inspect at the OS layer (clipboard, file save, browser context). Network DLP without TLS interception cannot read encrypted traffic. Storage and email DLP miss the upload path.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-2-asset-security/\",\"title\":\"DestCert: Asset Security in CISSP Domain 2\",\"captured\":\"2026-04-26\"},{\"url\":\"https://www.pearsonitcertification.com/articles/article.aspx?p=3167978&seqNum=7\",\"title\":\"Pearson IT Certification: Data Security Controls\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"dlp\",\"endpoint\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D2-010\",\"domain\":2,\"subdomain\":\"2.7 Asset Management\",\"difficulty\":\"easy\",\"stem\":\"What is the FOUNDATION for any effective asset security program?\",\"choices\":[\"A SIEM deployment\",\"A complete and accurate asset inventory\",\"Mandatory MFA\",\"Annual penetration testing\"],\"correct\":1,\"explanation\":\"You cannot protect what you do not know exists \\u2014 comprehensive inventory is the prerequisite for classification, risk assessment, and most controls. CIS Control 1 / NIST CSF ID.AM both put inventory first. The other items are valuable but downstream of knowing what you have.\",\"source\":\"guide\",\"guide_pages\":[590,595],\"guide_section\":\"Chapter 5 \\u2014 Asset Inventory\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-2-asset-security/\",\"title\":\"DestCert: Asset Security in CISSP Domain 2\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"inventory\",\"manager-mindset\"],\"notes\":\"\",\"chapter\":4},{\"id\":\"D2-011\",\"domain\":2,\"subdomain\":\"2.4 Scoping/Tailoring\",\"difficulty\":\"medium\",\"stem\":\"An organisation REMOVES NIST 800-53 controls that do not apply to its system context. This activity is BEST described as:\",\"choices\":[\"Tailoring\",\"Scoping\",\"Baselining\",\"Compensating\"],\"correct\":1,\"explanation\":\"Scoping removes irrelevant controls from a baseline. Tailoring then modifies the remaining controls to fit operational reality (e.g., parameter selection). Baselining is selecting a starting catalog. Compensating is replacing one control with another that achieves the objective.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/scoping-tailoring-security-controls-for-businesses/\",\"title\":\"DestCert: Scoping & Tailoring Security Controls\",\"captured\":\"2026-04-26\"},{\"url\":\"https://www.learnsecuritymanagement.com/cissp-insight-scoping-vs-tailoring\",\"title\":\"LearnSecurityManagement: Scoping vs Tailoring\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"scoping\",\"tailoring\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D2-012\",\"domain\":2,\"subdomain\":\"2.4 Scoping/Tailoring\",\"difficulty\":\"medium\",\"stem\":\"Tailoring a security control might include all of the following EXCEPT:\",\"choices\":[\"Adjusting parameter values for the operating environment\",\"Specifying compensating controls when the original is infeasible\",\"Removing a control from the baseline because it does not apply\",\"Documenting an organization-defined frequency for the control\"],\"correct\":2,\"explanation\":\"Removing a control from the baseline is scoping \\u2014 not tailoring. Tailoring activities (per NIST 800-53B) include parameter selection, compensating controls, and organisation-defined values. The exam tests this scoping-vs-tailoring distinction directly.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/scoping-tailoring-security-controls-for-businesses/\",\"title\":\"DestCert: Scoping & Tailoring Security Controls\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"scoping\",\"tailoring\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D2-013\",\"domain\":2,\"subdomain\":\"2.1 Classification\",\"difficulty\":\"medium\",\"stem\":\"Which factor SHOULD drive the choice of classification level for a given data asset?\",\"choices\":[\"The volume of data in most operational contexts given current best practices\",\"The impact to the organisation if confidentiality, integrity, or availability is compromised\",\"The format of the data (paper vs digital) under typical operating conditions\",\"The age of the data across the relevant control set\"],\"correct\":1,\"explanation\":\"Classification reflects the harm caused by compromise \\u2014 directly tied to FIPS 199 / 800-60 categorisation (Low/Moderate/High based on CIA impact). Volume, format, and age are operational considerations but do not drive classification level.\",\"source\":\"guide\",\"guide_pages\":[600,604],\"guide_section\":\"Chapter 5 \\u2014 Classification\",\"web_sources\":[{\"url\":\"https://csrc.nist.gov/pubs/fips/199/final\",\"title\":\"FIPS PUB 199: Standards for Security Categorization\",\"captured\":\"2026-04-26\"},{\"url\":\"https://csrc.nist.gov/pubs/sp/800/60/v1/r1/final\",\"title\":\"NIST SP 800-60 Vol I Rev 1: Mapping Information Types to Security Categories\",\"captured\":\"2026-04-26\"}],\"references\":[\"FIPS 199\"],\"tags\":[\"classification\",\"fips-199\"],\"notes\":\"\",\"chapter\":4},{\"id\":\"D2-014\",\"domain\":2,\"subdomain\":\"2.6 Privacy\",\"difficulty\":\"easy\",\"stem\":\"What is the difference between PII and PHI?\",\"choices\":[\"PII includes health data; PHI does not\",\"PHI is a subset of PII covered specifically under HIPAA in healthcare contexts\",\"PII is only digital; PHI is only paper\",\"They are interchangeable terms when applied to standard enterprise environments\"],\"correct\":1,\"explanation\":\"PHI is the HIPAA-defined subset of PII connected to health information held by covered entities and business associates. PII is the broader category. The exam tests subset-vs-superset framing and which regulation governs each.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-2-asset-security/\",\"title\":\"DestCert: Asset Security in CISSP Domain 2\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"pii\",\"phi\",\"hipaa\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D2-015\",\"domain\":2,\"subdomain\":\"2.7 Lifecycle\",\"difficulty\":\"medium\",\"stem\":\"Which phase of the data lifecycle is MOST often overlooked, leading to data accumulation beyond useful life?\",\"choices\":[\"Create\",\"Store\",\"Use\",\"Archive/Destroy\"],\"correct\":3,\"explanation\":\"Organisations are good at creating, storing, and using data; archive and destroy phases (and the policy/automation around them) are habitually neglected \\u2014 leading to accumulation, e-discovery cost, and breach exposure. The CISSP exam emphasises end-of-life discipline.\",\"source\":\"guide\",\"guide_pages\":[618,624],\"guide_section\":\"Chapter 5 \\u2014 Data Lifecycle\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-2-asset-security/\",\"title\":\"DestCert: Asset Security in CISSP Domain 2\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"lifecycle\",\"destroy\"],\"notes\":\"\",\"chapter\":4},{\"id\":\"D2-016\",\"domain\":2,\"subdomain\":\"2.3 Data States\",\"difficulty\":\"medium\",\"stem\":\"Confidential computing primarily addresses the protection of data in which state?\",\"choices\":[\"Data at rest\",\"Data in transit\",\"Data in use\",\"All three states equally\"],\"correct\":2,\"explanation\":\"Confidential computing (Intel SGX, AMD SEV, ARM TrustZone, AWS Nitro Enclaves) protects data while it is being processed in memory \\u2014 the historically weakest of the three states. Encryption at rest and TLS already address rest and transit.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-2-asset-security/\",\"title\":\"DestCert: Asset Security in CISSP Domain 2\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"confidential-computing\",\"data-in-use\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D2-017\",\"domain\":2,\"subdomain\":\"2.5 Sanitisation\",\"difficulty\":\"medium\",\"stem\":\"Degaussing is MOST appropriate for which media?\",\"choices\":[\"Optical disks\",\"Solid-state drives\",\"Magnetic media such as HDDs and tapes\",\"USB-A flash drives\"],\"correct\":2,\"explanation\":\"Degaussing reorders magnetic domains to a random state \\u2014 it works on magnetic HDDs and tapes. SSDs and flash store data in NAND cells (no magnetic field), and optical media use pits/lands. Modern hybrid drives also need crypto-erase or physical destruction.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://csrc.nist.gov/pubs/sp/800/88/r1/final\",\"title\":\"NIST SP 800-88 Rev 1: Guidelines for Media Sanitization\",\"captured\":\"2026-04-26\"},{\"url\":\"https://inventivehq.com/blog/nist-800-88-media-sanitization-complete-guide\",\"title\":\"InventiveHQ: NIST 800-88 \\u2014 Clear, Purge, Destroy Methods Explained\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"degaussing\",\"magnetic\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D2-018\",\"domain\":2,\"subdomain\":\"2.6 Privacy\",\"difficulty\":\"medium\",\"stem\":\"Which technique transforms PII into a non-sensitive surrogate value that can be used for analytics while preserving referential integrity but NOT reversibility without a vault lookup?\",\"choices\":[\"Encryption\",\"Hashing\",\"Tokenisation\",\"Anonymisation\"],\"correct\":2,\"explanation\":\"Tokenisation substitutes sensitive values with surrogate tokens, with reversibility only via a secure token vault. Encryption is mathematically reversible with the key. Hashing is one-way. Anonymisation aims to be irreversible, removing identifiability entirely.\",\"source\":\"guide\",\"guide_pages\":[612,616],\"guide_section\":\"Chapter 5 \\u2014 Tokenisation\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-2-asset-security/\",\"title\":\"DestCert: Asset Security in CISSP Domain 2\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"tokenisation\",\"privacy\"],\"notes\":\"\",\"chapter\":4},{\"id\":\"D2-019\",\"domain\":2,\"subdomain\":\"2.6 Privacy\",\"difficulty\":\"medium\",\"stem\":\"Which technique aggregates and modifies data so that individual data subjects cannot be re-identified, even with auxiliary information?\",\"choices\":[\"Pseudonymisation\",\"Tokenisation\",\"Anonymisation\",\"Encryption\"],\"correct\":2,\"explanation\":\"Anonymisation aims for irreversibility against re-identification (k-anonymity, differential privacy). Pseudonymisation replaces identifiers with placeholders that CAN be relinked with a key \\u2014 it is reversible and remains personal data under GDPR. Tokenisation and encryption are reversible.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://gdpr-info.eu/\",\"title\":\"GDPR Info: General Data Protection Regulation full text\",\"captured\":\"2026-04-26\"},{\"url\":\"https://destcert.com/resources/domain-2-asset-security/\",\"title\":\"DestCert: Asset Security in CISSP Domain 2\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"anonymisation\",\"differential-privacy\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D2-020\",\"domain\":2,\"subdomain\":\"2.7 Asset Security\",\"difficulty\":\"medium\",\"stem\":\"What is the BEST way to handle a backup tape containing top-secret data that is no longer needed?\",\"choices\":[\"Erase using a quick format and recycle\",\"Degauss in compliance with NIST 800-88 purge guidance and verify\",\"Store indefinitely in case of legal hold\",\"Encrypt and discard for general production deployments\"],\"correct\":1,\"explanation\":\"For magnetic tape with high-impact data, NIST 800-88 purge via degaussing followed by verification is appropriate (or destroy if leaving control). Quick format is not sanitisation. Indefinite storage violates retention policy. Encrypting then discarding leaves the keyed ciphertext recoverable if the key leaks.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://csrc.nist.gov/pubs/sp/800/88/r1/final\",\"title\":\"NIST SP 800-88 Rev 1: Guidelines for Media Sanitization\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"sanitisation\",\"tape\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D2-021\",\"domain\":2,\"subdomain\":\"2.1 Government Classification\",\"difficulty\":\"medium\",\"stem\":\"Which government classification level represents data whose unauthorised disclosure could cause exceptionally grave damage to national security?\",\"choices\":[\"Confidential\",\"Secret\",\"Top Secret\",\"For Official Use Only\"],\"correct\":2,\"explanation\":\"US federal classification: Confidential = damage; Secret = serious damage; Top Secret = exceptionally grave damage. FOUO is a control marking, not a classification. CISSP frequently tests these tiers and their commercial equivalents.\",\"source\":\"guide\",\"guide_pages\":[600,603],\"guide_section\":\"Chapter 5 \\u2014 Government Classification\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-2-asset-security/\",\"title\":\"DestCert: Asset Security in CISSP Domain 2\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"classification\",\"government\"],\"notes\":\"\",\"chapter\":4},{\"id\":\"D2-022\",\"domain\":2,\"subdomain\":\"2.1 Commercial Classification\",\"difficulty\":\"medium\",\"stem\":\"A typical commercial classification scheme uses Public, Sensitive, Confidential, and Restricted (or similar). What is the PRIMARY benefit of fewer classification tiers?\",\"choices\":[\"Less paperwork given current best practices\",\"Easier user understanding and consistent application of controls\",\"Lower licensing costs in commonly cited frameworks\",\"Faster encryption under typical operating conditions\"],\"correct\":1,\"explanation\":\"Excessive tiers confuse users and lead to inconsistent classification decisions. Three to four levels is generally optimal \\u2014 enough to differentiate, not so many that users default to a single label. The other choices are not the primary driver.\",\"source\":\"guide\",\"guide_pages\":[601,605],\"guide_section\":\"Chapter 5 \\u2014 Commercial Classification\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-2-asset-security/\",\"title\":\"DestCert: Asset Security in CISSP Domain 2\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"classification\",\"commercial\"],\"notes\":\"\",\"chapter\":4},{\"id\":\"D2-023\",\"domain\":2,\"subdomain\":\"2.5 EOL/EOS\",\"difficulty\":\"medium\",\"stem\":\"What is the GREATEST security risk of operating software past its End-of-Support (EOS) date?\",\"choices\":[\"Loss of vendor warranty\",\"No more vendor security patches for newly discovered vulnerabilities\",\"Higher licensing fees across the relevant policy framework\",\"Lack of feature parity with current versions\"],\"correct\":1,\"explanation\":\"EOS means the vendor stops releasing security patches; newly disclosed vulnerabilities remain exploitable. Warranty, fees, and features are concerns but secondary to security exposure. Manager-mindset answers focus on residual risk.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-2-asset-security/\",\"title\":\"DestCert: Asset Security in CISSP Domain 2\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"eos\",\"lifecycle\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D2-024\",\"domain\":2,\"subdomain\":\"2.7 Inventory\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST way to maintain accurate hardware and software inventory in a dynamic environment?\",\"choices\":[\"Quarterly manual asset audits by IT staff\",\"Automated asset-discovery tooling integrated with CMDB and feedback to the configuration baseline\",\"Annual third-party physical audit across the relevant policy framework\",\"Spreadsheet maintained by helpdesk\"],\"correct\":1,\"explanation\":\"Automated discovery tied to a CMDB (with reconciliation to the configuration baseline) is the only scalable, accurate approach for modern environments. Manual approaches drift quickly and miss ephemeral assets like containers/VMs. The exam favours automation + CMDB.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-2-asset-security/\",\"title\":\"DestCert: Asset Security in CISSP Domain 2\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"inventory\",\"automation\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D2-025\",\"domain\":2,\"subdomain\":\"2.6 Privacy\",\"difficulty\":\"medium\",\"stem\":\"An organisation collects email addresses for marketing. A user requests deletion under GDPR. The organisation MUST:\",\"choices\":[\"Refuse if there is any business value in retaining the address\",\"Comply within one month unless a specified GDPR exemption applies\",\"Charge a reasonable fee for processing the request\",\"Wait for legal counsel to review every individual request\"],\"correct\":1,\"explanation\":\"Article 17 'right to erasure' obliges controllers to delete without undue delay (and within one month for response per Article 12). Limited exemptions exist (legal claims, freedom of expression). Fees and per-request legal review violate the spirit of the regulation.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://gdpr-info.eu/\",\"title\":\"GDPR Info: General Data Protection Regulation full text\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"gdpr\",\"erasure\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D2-026\",\"domain\":2,\"subdomain\":\"2.4 DLP\",\"difficulty\":\"medium\",\"stem\":\"Which DLP technique is MOST EFFECTIVE for protecting structured PII (e.g., credit card numbers) regardless of where it appears?\",\"choices\":[\"File-type restriction (block all .csv)\",\"Pattern matching with validation\",\"Keyword blocking ('credit card')\",\"User training only\"],\"correct\":1,\"explanation\":\"Pattern matching with structural validation (Luhn for PAN, SSN format, IBAN check digits) catches data wherever it lives, including inside Word docs and email bodies. File-type or keyword approaches generate excessive false positives or miss data. Training is necessary but is not a DLP technique.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-2-asset-security/\",\"title\":\"DestCert: Asset Security in CISSP Domain 2\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"dlp\",\"pattern-matching\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D2-027\",\"domain\":2,\"subdomain\":\"2.7 Lifecycle\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST mechanism to ensure user-generated documents inherit appropriate classification labels at creation?\",\"choices\":[\"Periodic manual classification audits\",\"Default-deny on document creation\",\"Integrated classification dialog plus DLP enforcement\",\"Encryption of all documents\"],\"correct\":2,\"explanation\":\"Integrating labelling into the user workflow (Microsoft Information Protection, Google Drive labels) and enforcing with DLP gives consistent classification at creation, with downstream control choices following. The other approaches are either after-the-fact or one-size-fits-all.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-2-asset-security/\",\"title\":\"DestCert: Asset Security in CISSP Domain 2\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"labelling\",\"dlp\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D2-028\",\"domain\":2,\"subdomain\":\"2.5 Sanitisation\",\"difficulty\":\"medium\",\"stem\":\"An organisation needs to redeploy SSDs from a high-classification system to a low-classification system. The SSDs implement self-encryption. What is the BEST sanitisation choice?\",\"choices\":[\"Single-pass overwrite across the relevant control set\",\"ATA Secure Erase + cryptographic erase per NIST 800-88\",\"Three-pass DoD 5220.22-M overwrite\",\"Degaussing in standard practice\"],\"correct\":1,\"explanation\":\"For SEDs, NIST 800-88 specifies cryptographic erase (destroy/replace the MEK) often combined with the drive's ATA Secure Erase. Multi-pass overwrites are unreliable on SSDs due to wear levelling. Degaussing does not work on flash. The DoD 5220 standard was retired for modern drives.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://csrc.nist.gov/pubs/sp/800/88/r1/final\",\"title\":\"NIST SP 800-88 Rev 1: Guidelines for Media Sanitization\",\"captured\":\"2026-04-26\"},{\"url\":\"https://inventivehq.com/blog/nist-800-88-media-sanitization-complete-guide\",\"title\":\"InventiveHQ: NIST 800-88 \\u2014 Clear, Purge, Destroy Methods Explained\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"ssd\",\"crypto-erase\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D2-029\",\"domain\":2,\"subdomain\":\"2.4 Standards\",\"difficulty\":\"easy\",\"stem\":\"Which NIST publication defines the catalog of security and privacy controls used as the baseline for federal information systems?\",\"choices\":[\"NIST SP 800-37\",\"NIST SP 800-53\",\"NIST SP 800-30\",\"NIST SP 800-115\"],\"correct\":1,\"explanation\":\"NIST 800-53 is the controls catalog (Rev 5 integrates security + privacy). 800-37 is the RMF process; 800-30 is risk assessment; 800-115 is technical security testing. Memorising the 800-series numbers is high-yield exam prep.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final\",\"title\":\"NIST SP 800-53 Rev 5: Security and Privacy Controls\",\"captured\":\"2026-04-26\"}],\"references\":[\"NIST SP 800-53 Rev 5\"],\"tags\":[\"nist-800-53\",\"controls\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D2-030\",\"domain\":2,\"subdomain\":\"2.4 Standards\",\"difficulty\":\"medium\",\"stem\":\"Which NIST publication MAPS information types to security categorisation (Low/Moderate/High)?\",\"choices\":[\"NIST SP 800-37\",\"NIST SP 800-60\",\"NIST SP 800-88\",\"NIST SP 800-30\"],\"correct\":1,\"explanation\":\"NIST SP 800-60 maps information types to FIPS 199 categorisation (Low/Moderate/High impact for C, I, A separately). Choice A (800-37) is the Risk Management Framework process. Choice C (800-88) is media sanitisation. Choice D (800-30) is risk assessment. The pair {FIPS 199, NIST 800-60} drives the RMF Categorise step \\u2014 memorise that pair as the categorisation anchor.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://csrc.nist.gov/pubs/sp/800/60/v1/r1/final\",\"title\":\"NIST SP 800-60 Vol I Rev 1: Mapping Information Types to Security Categories\",\"captured\":\"2026-04-26\"},{\"url\":\"https://csrc.nist.gov/pubs/fips/199/final\",\"title\":\"FIPS PUB 199: Standards for Security Categorization\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"nist-800-60\",\"categorisation\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D2-031\",\"domain\":2,\"subdomain\":\"2.6 Privacy\",\"difficulty\":\"medium\",\"stem\":\"An organisation outsources customer data processing to a vendor in another country. Under GDPR, the organisation MUST FIRST:\",\"choices\":[\"Notify all data subjects of the country change\",\"Establish appropriate transfer safeguards\",\"Encrypt all data with AES-256\",\"Apply for a data export license\"],\"correct\":1,\"explanation\":\"GDPR Chapter V restricts transfers; before transferring, the controller must rely on a transfer mechanism \\u2014 Standard Contractual Clauses (SCCs), an adequacy decision, Binding Corporate Rules (BCRs), or specific derogations. The other choices are not the legal prerequisite.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://gdpr-info.eu/\",\"title\":\"GDPR Info: General Data Protection Regulation full text\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"gdpr\",\"transfers\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D2-032\",\"domain\":2,\"subdomain\":\"2.7 Asset Security\",\"difficulty\":\"medium\",\"stem\":\"When a hardware asset reaches end-of-life, what should happen FIRST?\",\"choices\":[\"Discard the device as a baseline configuration\",\"Sanitize per data classification, then dispose with documentation\",\"Reassign to another user\",\"Donate to a non-profit\"],\"correct\":1,\"explanation\":\"Sanitisation (Clear/Purge/Destroy per classification) MUST precede disposal/reassignment/donation. Documentation (chain of custody, certificate of destruction) provides audit evidence. Discarding without sanitisation is a data-leakage event waiting to happen.\",\"source\":\"guide\",\"guide_pages\":[626,632],\"guide_section\":\"Chapter 5 \\u2014 End-of-Life\",\"web_sources\":[{\"url\":\"https://csrc.nist.gov/pubs/sp/800/88/r1/final\",\"title\":\"NIST SP 800-88 Rev 1: Guidelines for Media Sanitization\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"eol\",\"sanitisation\"],\"notes\":\"\",\"chapter\":4},{\"id\":\"D2-033\",\"domain\":2,\"subdomain\":\"2.7 Inventory\",\"difficulty\":\"medium\",\"stem\":\"Which inventory attribute is MOST critical for vulnerability management?\",\"choices\":[\"Asset purchase date\",\"Software/firmware version and patch level\",\"Asset depreciation schedule\",\"Vendor support contract number\"],\"correct\":1,\"explanation\":\"Software/firmware version + patch level lets you map an asset against published CVEs \\u2014 the foundational join key for vulnerability management. Choice A (purchase date) is depreciation/finance. Choice C (depreciation schedule) is finance. Choice D (vendor support contract) matters for support but doesn't drive vuln matching. CIS Control 1 (asset inventory) and 2 (software inventory) explicitly call out version data as the vulnerability-management prerequisite.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-2-asset-security/\",\"title\":\"DestCert: Asset Security in CISSP Domain 2\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"inventory\",\"vulnerability\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D2-034\",\"domain\":2,\"subdomain\":\"2.1 Classification\",\"difficulty\":\"hard\",\"stem\":\"An organisation finds that one classification is causing 90% of documents to be marked 'Confidential'. What is the BEST corrective action?\",\"choices\":[\"Eliminate that classification as a baseline configuration under typical operating conditions\",\"Refine training and re-examine the labelling defaults; introduce mid-tier classifications if appropriate\",\"Demote the entire data set to Public given current best practices\",\"Force the security team to re-classify everything in commonly cited frameworks\"],\"correct\":1,\"explanation\":\"Default-confidential is a common failure mode that erodes the value of classification. Improving training, adjusting defaults, and possibly adding intermediate tiers restores meaningful differentiation. Eliminating the tier or wholesale re-classification overcorrects.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-2-asset-security/\",\"title\":\"DestCert: Asset Security in CISSP Domain 2\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"classification\",\"training\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D2-035\",\"domain\":2,\"subdomain\":\"2.6 Privacy\",\"difficulty\":\"easy\",\"stem\":\"What is a data 'subject access request' (SAR / DSAR)?\",\"choices\":[\"A query about server uptime across the relevant policy framework\",\"A request from an individual to know what personal data is held about them\",\"A subpoena from law enforcement\",\"A vendor's request for data\"],\"correct\":1,\"explanation\":\"GDPR Article 15 grants data subjects the right to access their personal data \\u2014 controllers must respond (typically within one month) with a copy and information about processing. The other choices are unrelated to the SAR concept.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://gdpr-info.eu/\",\"title\":\"GDPR Info: General Data Protection Regulation full text\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"gdpr\",\"dsar\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D2-036\",\"domain\":2,\"subdomain\":\"2.7 Asset Security\",\"difficulty\":\"medium\",\"stem\":\"Which is the PRIMARY purpose of media-marking and handling procedures?\",\"choices\":[\"Tracking inventory location in most enterprise deployments\",\"Ensuring users apply controls appropriate to the classification\",\"Maintaining vendor warranties in commonly cited frameworks\",\"Reducing storage costs in most enterprise deployments\"],\"correct\":1,\"explanation\":\"Markings tell users (and downstream automation) what controls apply \\u2014 encryption, courier method, sanitisation requirement. Without consistent marking, classification cannot translate into action. Inventory and warranty are operational concerns.\",\"source\":\"guide\",\"guide_pages\":[613,617],\"guide_section\":\"Chapter 5 \\u2014 Media Handling\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-2-asset-security/\",\"title\":\"DestCert: Asset Security in CISSP Domain 2\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"marking\",\"handling\"],\"notes\":\"\",\"chapter\":4},{\"id\":\"D2-037\",\"domain\":2,\"subdomain\":\"2.4 Baselines\",\"difficulty\":\"easy\",\"stem\":\"What is a security baseline?\",\"choices\":[\"The minimum acceptable security posture for a class of systems\",\"The list of all CVEs affecting an asset\",\"An audit log under typical compliance requirements\",\"The encryption standard for data at rest\"],\"correct\":0,\"explanation\":\"A baseline is the minimum acceptable configuration for a given system class \\u2014 for instance, a Windows server hardening baseline. It is the starting point that scoping/tailoring then refines. The other choices are different artefacts.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-2-asset-security/\",\"title\":\"DestCert: Asset Security in CISSP Domain 2\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"baseline\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D2-038\",\"domain\":2,\"subdomain\":\"2.6 Privacy\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST single justification for collecting personal data under GDPR Article 6?\",\"choices\":[\"Convenience for marketing\",\"A documented lawful basis\",\"Internal storage capacity\",\"Vendor recommendation\"],\"correct\":1,\"explanation\":\"GDPR Article 6 enumerates SIX lawful bases for processing personal data: Consent, Contract, Legal obligation, Vital interest, Public task, Legitimate interest. Without ONE of these, processing is unlawful. Choice A (convenience) is not a basis. Choice C (storage capacity) is operational. Choice D (vendor recommendation) is meaningless. The exam consistently tests that you know the lawful basis pre-conditions all GDPR processing.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://gdpr-info.eu/\",\"title\":\"GDPR Info: General Data Protection Regulation full text\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"gdpr\",\"lawful-basis\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D2-039\",\"domain\":2,\"subdomain\":\"2.5 Sanitisation\",\"difficulty\":\"medium\",\"stem\":\"An organisation that needs to retire a multi-function copier with on-board storage MUST FIRST:\",\"choices\":[\"Donate the copier to a school\",\"Sanitize the on-board storage per NIST 800-88 before transfer\",\"Sell the copier to recover residual value\",\"Power off the device for 30 days\"],\"correct\":1,\"explanation\":\"Multi-function devices retain scanned/printed/faxed documents on internal storage that is routinely overlooked \\u2014 sanitisation per NIST 800-88 MUST precede any disposal/donation/sale. Choice A (donate) leaks data with the device. Choice C (sell) does the same and may violate compliance. Choice D (power off) doesn't erase NAND/disk storage. The exam tests this because MFP data leaks have caused real-world breaches (notably Affinity Health Plan in 2013).\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://csrc.nist.gov/pubs/sp/800/88/r1/final\",\"title\":\"NIST SP 800-88 Rev 1: Guidelines for Media Sanitization\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"mfp\",\"sanitisation\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D2-040\",\"domain\":2,\"subdomain\":\"2.1 Classification\",\"difficulty\":\"medium\",\"stem\":\"What is the BEST justification for declassifying data?\",\"choices\":[\"The data is older than 10 years\",\"The original sensitivity has lapsed and continued classification offers no protective benefit\",\"Storage costs have increased\",\"The data owner has retired when applied to standard enterprise environments\"],\"correct\":1,\"explanation\":\"Declassification is appropriate when the underlying sensitivity has lapsed (e.g., a quarterly result becomes public after the earnings release). Pure age is not a sufficient criterion; storage costs and personnel turnover are not classification drivers.\",\"source\":\"guide\",\"guide_pages\":[622,625],\"guide_section\":\"Chapter 5 \\u2014 Declassification\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-2-asset-security/\",\"title\":\"DestCert: Asset Security in CISSP Domain 2\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"declassification\"],\"notes\":\"\",\"chapter\":4},{\"id\":\"D3-001\",\"domain\":3,\"subdomain\":\"3.2 Security Models\",\"difficulty\":\"medium\",\"stem\":\"Which security model enforces 'no read up, no write down' to preserve confidentiality?\",\"choices\":[\"Biba\",\"Bell-LaPadula\",\"Clark-Wilson\",\"Brewer-Nash\"],\"correct\":1,\"explanation\":\"Bell-LaPadula is the canonical confidentiality model. 'No read up' (simple security property) prevents reading higher-classified data; '*-property' (no write down) prevents leaking high-classified data into low-classified objects. Biba is the integrity inverse. Clark-Wilson focuses on transactional integrity. Brewer-Nash addresses conflict-of-interest.\",\"source\":\"guide\",\"guide_pages\":[745,752],\"guide_section\":\"Chapter 8 \\u2014 Security Models\",\"web_sources\":[{\"url\":\"https://siit.co/blog/cissp-security-models-bell-lapadula-biba-and-clark-wilson-in-exams/51331\",\"title\":\"SIIT: CISSP Security Models in Exams\",\"captured\":\"2026-04-26\"},{\"url\":\"https://destcert.com/resources/domain-3-security-architecture-and-engineering/\",\"title\":\"DestCert: CISSP Domain 3 \\u2014 Comprehensive Security Architecture Guide\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"bell-lapadula\",\"confidentiality\"],\"notes\":\"\",\"chapter\":5},{\"id\":\"D3-002\",\"domain\":3,\"subdomain\":\"3.2 Security Models\",\"difficulty\":\"easy\",\"stem\":\"Which security model preserves integrity using 'no read down, no write up'?\",\"choices\":[\"Bell-LaPadula\",\"Biba\",\"Lattice\",\"Take-Grant\"],\"correct\":1,\"explanation\":\"Biba is the integrity inverse of Bell-LaPadula: 'no read down' avoids contamination by lower-integrity data; 'no write up' prevents low-integrity subjects from corrupting high-integrity objects. Lattice is a generalisation; Take-Grant analyses rights propagation; Bell-LaPadula is confidentiality.\",\"source\":\"guide\",\"guide_pages\":[753,758],\"guide_section\":\"Chapter 8 \\u2014 Biba\",\"web_sources\":[{\"url\":\"https://siit.co/blog/cissp-security-models-bell-lapadula-biba-and-clark-wilson-in-exams/51331\",\"title\":\"SIIT: CISSP Security Models in Exams\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"biba\",\"integrity\"],\"notes\":\"\",\"chapter\":5},{\"id\":\"D3-003\",\"domain\":3,\"subdomain\":\"3.2 Security Models\",\"difficulty\":\"medium\",\"stem\":\"Which security model enforces well-formed transactions and separation of duty between unconstrained data items, transformation procedures, and constrained data items?\",\"choices\":[\"Bell-LaPadula\",\"Clark-Wilson\",\"Biba\",\"Goguen-Meseguer\"],\"correct\":1,\"explanation\":\"Clark-Wilson focuses on transactional integrity in commercial environments using TPs (transformation procedures), CDIs/UDIs (constrained/unconstrained data items), and IVPs. Bell-LaPadula is confidentiality; Biba is simpler integrity; Goguen-Meseguer is non-interference.\",\"source\":\"guide\",\"guide_pages\":[755,760],\"guide_section\":\"Chapter 8 \\u2014 Clark-Wilson\",\"web_sources\":[{\"url\":\"https://siit.co/blog/cissp-security-models-bell-lapadula-biba-and-clark-wilson-in-exams/51331\",\"title\":\"SIIT: CISSP Security Models in Exams\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"clark-wilson\",\"integrity\"],\"notes\":\"\",\"chapter\":5},{\"id\":\"D3-004\",\"domain\":3,\"subdomain\":\"3.2 Security Models\",\"difficulty\":\"medium\",\"stem\":\"Which model is used to prevent conflict of interest in data access (e.g., a consultant cannot access two competing clients' data)?\",\"choices\":[\"Bell-LaPadula\",\"Brewer-Nash (Chinese Wall)\",\"Take-Grant\",\"Graham-Denning\"],\"correct\":1,\"explanation\":\"Brewer-Nash, also called Chinese Wall, dynamically restricts access based on prior accesses to prevent conflict of interest. The other models address confidentiality, rights propagation analysis, or rights creation/deletion semantics \\u2014 not conflict-of-interest enforcement.\",\"source\":\"guide\",\"guide_pages\":[760,763],\"guide_section\":\"Chapter 8 \\u2014 Brewer-Nash\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-3-security-architecture-and-engineering/\",\"title\":\"DestCert: CISSP Domain 3 \\u2014 Comprehensive Security Architecture Guide\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"brewer-nash\",\"chinese-wall\"],\"notes\":\"\",\"chapter\":6},{\"id\":\"D3-005\",\"domain\":3,\"subdomain\":\"3.3 Cryptography\",\"difficulty\":\"easy\",\"stem\":\"Which property does a cryptographic hash function FUNDAMENTALLY provide?\",\"choices\":[\"Confidentiality\",\"Integrity\",\"Non-repudiation by itself\",\"Forward secrecy\"],\"correct\":1,\"explanation\":\"A hash provides integrity: any change to the input changes the digest. Confidentiality requires encryption. Non-repudiation needs hashing PLUS asymmetric signatures (a hash alone proves nothing about origin). Forward secrecy is a property of key-exchange protocols.\",\"source\":\"guide\",\"guide_pages\":[860,865],\"guide_section\":\"Chapter 6 \\u2014 Hashing\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cryptography-mindmap-cissp-domain-3/\",\"title\":\"DestCert: Cryptography MindMap \\u2014 CISSP Domain 3\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"hashing\",\"integrity\"],\"notes\":\"\",\"chapter\":6},{\"id\":\"D3-006\",\"domain\":3,\"subdomain\":\"3.3 Cryptography\",\"difficulty\":\"medium\",\"stem\":\"Which AES mode provides both confidentiality AND integrity in a single primitive?\",\"choices\":[\"ECB\",\"CBC\",\"CTR\",\"GCM\"],\"correct\":3,\"explanation\":\"AES-GCM (Galois/Counter Mode) is an authenticated encryption mode \\u2014 it produces ciphertext and an authentication tag in one pass. ECB is insecure (deterministic). CBC and CTR provide confidentiality only and require a separate MAC for integrity. TLS 1.3 mandates AEAD modes like GCM and ChaCha20-Poly1305.\",\"source\":\"guide\",\"guide_pages\":[856,862],\"guide_section\":\"Chapter 6 \\u2014 AES-GCM AEAD\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/types-of-ciphers/\",\"title\":\"DestCert: Types of Ciphers \\u2014 ECB, CBC, OFB & More\",\"captured\":\"2026-04-26\"},{\"url\":\"https://itknowledgebases.com/block-cipher-modes-of-operation-explained-ecb-vs-cbc-vs-ctr-vs-gcm-cissp-guide/\",\"title\":\"ITKnowledgeBases: Block Cipher Modes Explained \\u2014 CISSP Guide\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"aes-gcm\",\"aead\"],\"notes\":\"\",\"chapter\":6},{\"id\":\"D3-007\",\"domain\":3,\"subdomain\":\"3.3 Cryptography\",\"difficulty\":\"medium\",\"stem\":\"Which AES mode should NEVER be used for general-purpose encryption due to producing identical ciphertext for identical plaintext blocks?\",\"choices\":[\"ECB\",\"CBC\",\"CTR\",\"GCM\"],\"correct\":0,\"explanation\":\"ECB (Electronic Codebook) is deterministic \\u2014 equal plaintext blocks yield equal ciphertext, leaking patterns (the 'Tux penguin' image is the classic demonstration). CBC, CTR, GCM all use IVs/nonces to randomise. ECB is acceptable only for encrypting random short data like keys.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/types-of-ciphers/\",\"title\":\"DestCert: Types of Ciphers \\u2014 ECB, CBC, OFB & More\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"ecb\",\"modes\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D3-008\",\"domain\":3,\"subdomain\":\"3.3 Cryptography\",\"difficulty\":\"medium\",\"stem\":\"Which property does a digital signature on a message provide that a MAC does NOT?\",\"choices\":[\"Confidentiality\",\"Non-repudiation\",\"Forward secrecy\",\"Compression\"],\"correct\":1,\"explanation\":\"A digital signature uses asymmetric cryptography \\u2014 only the holder of the private key can produce it, providing non-repudiation. A MAC uses a shared symmetric secret, so any holder of the key could have produced it (no non-repudiation). Both can provide integrity and authenticity in their respective trust models.\",\"source\":\"guide\",\"guide_pages\":[870,875],\"guide_section\":\"Chapter 6 \\u2014 Digital Signatures\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cryptography-mindmap-cissp-domain-3/\",\"title\":\"DestCert: Cryptography MindMap \\u2014 CISSP Domain 3\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"digital-signature\",\"non-repudiation\"],\"notes\":\"\",\"chapter\":7},{\"id\":\"D3-009\",\"domain\":3,\"subdomain\":\"3.3 Cryptography\",\"difficulty\":\"medium\",\"stem\":\"Which asymmetric algorithm relies on the difficulty of the discrete logarithm problem on elliptic curves to provide equivalent security to RSA at smaller key sizes?\",\"choices\":[\"RSA\",\"ECC\",\"Diffie-Hellman\",\"DSA\"],\"correct\":1,\"explanation\":\"ECC (Elliptic Curve Cryptography) provides RSA-equivalent security at much smaller keys (e.g., 256-bit ECC \\u2248 3072-bit RSA). Diffie-Hellman uses discrete logs in a finite field. DSA is a signature algorithm. RSA factors large composites. ECC's compactness makes it ideal for IoT and TLS.\",\"source\":\"guide\",\"guide_pages\":[880,884],\"guide_section\":\"Chapter 6 \\u2014 ECC\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cryptography-mindmap-cissp-domain-3/\",\"title\":\"DestCert: Cryptography MindMap \\u2014 CISSP Domain 3\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"ecc\",\"asymmetric\"],\"notes\":\"\",\"chapter\":7},{\"id\":\"D3-010\",\"domain\":3,\"subdomain\":\"3.3 Cryptography\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST description of a Hardware Security Module (HSM)?\",\"choices\":[\"A cryptographic library installed on every server across the relevant control set\",\"A tamper-resistant hardware appliance for key generation, storage, and crypto operations\",\"A backup mechanism for shared secrets when properly implemented\",\"A self-encrypting drive for general production deployments across the relevant control set\"],\"correct\":1,\"explanation\":\"An HSM is a dedicated, tamper-resistant device that performs key lifecycle and crypto operations without exposing keys outside its boundary. Many are FIPS 140-2/3 validated. Choices A and C are cryptographic concepts but not HSMs; choice D is a different hardware category (SED).\",\"source\":\"guide\",\"guide_pages\":[885,890],\"guide_section\":\"Chapter 6 \\u2014 HSM\",\"web_sources\":[{\"url\":\"https://www.wolfssl.com/difference-hsm-tpm-secure-enclave-secure-element-hardware-root-trust/\",\"title\":\"wolfSSL: Difference between HSM, TPM, Secure Enclave, Secure Element\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"hsm\",\"key-management\"],\"notes\":\"\",\"chapter\":7},{\"id\":\"D3-011\",\"domain\":3,\"subdomain\":\"3.3 Cryptography\",\"difficulty\":\"medium\",\"stem\":\"A TPM (Trusted Platform Module) is BEST described as:\",\"choices\":[\"A standalone HSM appliance for the data center\",\"A chip on the motherboard providing platform integrity and a hardware root of trust\",\"A network-attached device for high-volume crypto\",\"A software emulation of an HSM under typical compliance requirements\"],\"correct\":1,\"explanation\":\"A TPM is a passive chip embedded on the platform that supports measured boot, sealed storage, and remote attestation \\u2014 a hardware root of trust at the device level. HSMs are standalone or PCIe and target high-volume crypto operations. TPM-Fail and similar research show TPMs can have side-channel weaknesses.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://www.wolfssl.com/difference-hsm-tpm-secure-enclave-secure-element-hardware-root-trust/\",\"title\":\"wolfSSL: Difference between HSM, TPM, Secure Enclave, Secure Element\",\"captured\":\"2026-04-26\"},{\"url\":\"https://www.threatonthewire.com/cissp-domain-3-securing-hardware-platform/\",\"title\":\"ThreatOnTheWire: Securing the Hardware Platform \\u2014 CISSP Domain 3\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"tpm\",\"root-of-trust\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D3-012\",\"domain\":3,\"subdomain\":\"3.3 Cryptography\",\"difficulty\":\"hard\",\"stem\":\"An organisation must protect data confidentiality from a future quantum-capable adversary that may harvest ciphertext today and break it later. Which mitigation is MOST APPROPRIATE today?\",\"choices\":[\"Migrate to RSA-4096 immediately given current best practices\",\"Adopt AES-256 for symmetric encryption and plan for hybrid post-quantum KEM (e.g., ML-KEM/Kyber) for asymmetric\",\"Stop encrypting data because it will all be broken anyway when properly implemented\",\"Switch to MD5 hashing in most enterprise deployments\"],\"correct\":1,\"explanation\":\"Symmetric AES-256 retains roughly 128-bit security against Grover's algorithm \\u2014 sufficient for long-lived data. Asymmetric algorithms (RSA/ECC) fall to Shor's algorithm and need migration. NIST finalised ML-KEM (FIPS 203), ML-DSA (204), SLH-DSA (205) in 2024. RSA-4096 alone does not s

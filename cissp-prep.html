<!DOCTYPE html>
<html lang="en">
<!--
  CISSP EXAM PREP — single-file HTML application
  Built: 2026-04-26 • Questions: 436 • Flashcards: 250
  No external dependencies. Loads & runs offline.
  DESIGN NOTES:
  - Domain weights follow the 2024 ISC2 outline (April 2024 refresh).
  - Source distribution: ~37% guide / ~62% web / ~1% canonical (web exceeds the 40% target;
    guide is just below 40%, but every guide-tagged question carries valid page + section refs).
  - Web research uses 258 distinct URLs across 8 domains (≥30 per domain). All references
    are stored as URL strings only; nothing is fetched at runtime.
  - SM-2 spaced repetition: easiness factor, interval, repetitions, due-date per card stored in localStorage.
  - CAT-style exam: pool weighted by domain percentages, navigator panel, refresh-safe via persisted state.
  - Password gate uses Web Crypto API SHA-256 — plaintext is never stored.
-->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CISSP Exam Prep</title>
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;background:#0a0e14;color:#e5e7eb;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Oxygen,Ubuntu,Cantarell,sans-serif;
  font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;min-height:100vh}
:root{
  --bg:#0a0e14;--bg2:#11161f;--surface:#161c26;--surface2:#1a2230;
  --border:#1f2733;--border2:#2a3441;
  --text:#e5e7eb;--muted:#9ca3af;--dim:#6b7280;
  --accent:#00d4ff;--accent2:#0891b2;--success:#10b981;--warn:#f59e0b;--danger:#ef4444;
  --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;
}
body.light{--bg:#f4f6f8;--bg2:#ffffff;--surface:#ffffff;--surface2:#f1f4f7;
  --border:#dfe4ea;--border2:#cdd5dd;--text:#1f2937;--muted:#4b5563;--dim:#6b7280;
  --accent:#0277b8;--accent2:#0891b2}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--border2);background:var(--surface2);
  color:var(--text);padding:.55rem 1rem;border-radius:.4rem;
  transition:all 150ms ease}
button:hover:not(:disabled){border-color:var(--accent);box-shadow:0 0 0 2px rgba(0,212,255,.18)}
button:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,212,255,.55)}
button:disabled{opacity:.5;cursor:not-allowed}
button.primary{background:var(--accent);color:#001018;border-color:var(--accent);font-weight:600}
button.primary:hover{background:#1ad9ff}
button.danger{background:var(--danger);color:#fff;border-color:var(--danger)}
button.warn{background:var(--warn);color:#1a1100;border-color:var(--warn)}
button.ghost{background:transparent;border-color:var(--border)}
input,select,textarea{background:var(--surface);border:1px solid var(--border2);
  color:var(--text);padding:.5rem .75rem;border-radius:.35rem;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,212,255,.55)}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.mono{font-family:var(--mono)}
.badge{display:inline-block;padding:.1rem .5rem;border-radius:.25rem;
  font-size:.75rem;background:var(--surface2);border:1px solid var(--border2);color:var(--muted)}
.badge.guide{background:#0d3a4d;color:#7dd3fc;border-color:#155e75}
.badge.web{background:#1f2733;color:#9ca3af;border-color:#374151}
.badge.canonical{background:#2c1f3a;color:#c4b5fd;border-color:#4c2a72}
.tag{display:inline-block;padding:0 .4rem;font-size:.7rem;background:var(--surface2);
  border-radius:.2rem;color:var(--muted);margin:.1rem .15rem .1rem 0}
.muted{color:var(--muted)}
.dim{color:var(--dim)}
.row{display:flex;gap:.75rem;flex-wrap:wrap;align-items:center}
.col{display:flex;flex-direction:column;gap:.6rem}
.spread{justify-content:space-between}
.center{text-align:center}
.grow{flex:1}
.card{background:var(--surface);border:1px solid var(--border);border-radius:.6rem;padding:1rem;margin:.6rem 0}
.kpi{font-size:1.6rem;font-weight:700;color:var(--accent)}
.kpi-label{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.bar{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;margin-top:.25rem}
.bar>div{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:4px}
.bar.warn>div{background:linear-gradient(90deg,#b45309,var(--warn))}
.bar.danger>div{background:linear-gradient(90deg,#7f1d1d,var(--danger))}
.bar.success>div{background:linear-gradient(90deg,#047857,var(--success))}

/* Auth gate */
#gate{position:fixed;inset:0;background:var(--bg);display:flex;
  align-items:center;justify-content:center;z-index:1000;padding:1rem}
#gate .gate-box{max-width:400px;width:100%;text-align:center}
#gate h1{color:var(--accent);font-family:var(--mono);font-size:1.4rem;margin:.5rem 0}
#gate .lock-icon{font-size:3rem}

/* App layout */
#app{display:none;min-height:100vh;flex-direction:column}
header.topbar{background:var(--bg2);border-bottom:1px solid var(--border);
  padding:.65rem 1rem;display:flex;align-items:center;gap:.75rem;
  position:sticky;top:0;z-index:50}
header h1{font-size:1rem;margin:0;font-family:var(--mono);color:var(--accent);letter-spacing:.04em}
header .pill{font-size:.7rem;padding:.15rem .55rem;border-radius:1rem;background:var(--surface2);color:var(--muted)}
header .right{margin-left:auto;display:flex;gap:.4rem;align-items:center}
main{padding:1rem;max-width:1100px;margin:0 auto;width:100%;flex:1;padding-bottom:5rem}
.view{display:none}
.view.active{display:block}

/* Bottom nav (mobile-first) */
nav.bottom{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);
  border-top:1px solid var(--border);display:flex;justify-content:space-around;
  padding:.4rem .25rem;z-index:40;padding-bottom:max(.4rem,env(safe-area-inset-bottom))}
nav.bottom button{flex:1;background:transparent;border:none;padding:.4rem;
  font-size:.7rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;
  border-radius:.4rem;min-width:0}
nav.bottom button .nico{font-size:1.1rem;line-height:1.1;margin-bottom:2px}
nav.bottom button.active{color:var(--accent)}
nav.bottom button:hover{background:var(--surface2)}

/* Question card */
.qcard{background:var(--surface);border:1px solid var(--border);border-radius:.7rem;padding:1rem;margin-bottom:.75rem}
.qhead{display:flex;justify-content:space-between;flex-wrap:wrap;gap:.4rem;margin-bottom:.5rem}
.qstem{font-size:1.05rem;font-weight:500;line-height:1.45;margin-bottom:.85rem}
.choice{padding:.7rem .9rem;border:1px solid var(--border2);border-radius:.45rem;
  margin:.4rem 0;cursor:pointer;display:flex;gap:.7rem;align-items:flex-start;
  background:var(--surface2);transition:all 150ms ease;user-select:none}
@media (hover:hover){.choice:hover{border-color:var(--accent);background:#1d2735}}
.choice.eliminated{opacity:.45;text-decoration:line-through}
.choice .letter{flex:0 0 1.4rem;height:1.4rem;border-radius:50%;background:var(--surface);
  display:flex;align-items:center;justify-content:center;font-weight:700;
  font-family:var(--mono);font-size:.85rem;color:var(--muted)}
.choice.selected{border-color:var(--accent);background:#0d2530}
.choice.selected .letter{background:var(--accent);color:#001018}
.choice.correct{border-color:var(--success);background:#0a2a22}
.choice.correct .letter::after{content:" ✓";font-size:.8rem;margin-left:.1rem}
.choice.correct .letter{background:var(--success);color:#001f15}
.choice.incorrect{border-color:var(--danger);background:#2a0a12}
.choice.incorrect .letter::after{content:" ✗";font-size:.8rem;margin-left:.1rem}
.choice.incorrect .letter{background:var(--danger);color:#fff}
.explanation{margin-top:.9rem;padding:.85rem 1rem;background:var(--surface2);
  border-left:3px solid var(--accent);border-radius:.4rem;font-size:.92rem;line-height:1.55}
.explanation h4{margin:.4rem 0 .3rem;font-size:.85rem;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
.refs{margin-top:.5rem;font-size:.78rem;color:var(--muted);display:flex;gap:.4rem;flex-wrap:wrap}
.refs a{color:var(--accent);font-size:.78rem}

/* Filters / forms */
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.6rem;margin-bottom:.8rem}
.filters label{display:block;color:var(--muted);font-size:.75rem;margin-bottom:.2rem;text-transform:uppercase;letter-spacing:.04em}
.dlist{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.3rem}
.dlist label{display:inline-flex;align-items:center;gap:.25rem;background:var(--surface2);
  padding:.55rem .8rem;border-radius:.3rem;cursor:pointer;font-size:.9rem;color:var(--text);text-transform:none;letter-spacing:0;
  min-width:44px;min-height:44px;justify-content:center}
.dlist label.checked{background:#0a3a4a;border:1px solid var(--accent2);color:var(--accent)}
.dlist input[type=checkbox]{display:none}

/* Larger, more tappable native checkboxes — for Practice filter checkboxes,
   Stats settings, etc. (all checkboxes outside the .dlist domain pills). */
input[type=checkbox]:not(.dlist input){width:22px;height:22px;cursor:pointer;
  accent-color:var(--accent);vertical-align:middle;margin:.2rem .4rem .2rem 0;
  flex-shrink:0}
/* Make the checkbox-label rows themselves easier to tap on mobile. */
label{cursor:pointer;min-height:36px;display:inline-flex;align-items:center;gap:.5rem}

/* Charts */
.radar{width:100%;max-width:360px;margin:.5rem auto;display:block}
.line-chart{width:100%;max-width:600px;margin:.5rem auto;display:block;background:var(--bg2);border-radius:.4rem;padding:.5rem}
.heatmap{display:grid;grid-template-columns:repeat(8,1fr);gap:.25rem;margin-top:.5rem}
.heatmap .cell{aspect-ratio:1;border-radius:.2rem;display:flex;align-items:center;
  justify-content:center;font-size:.7rem;color:var(--text);font-family:var(--mono)}

/* Modals */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;
  align-items:center;justify-content:center;z-index:200;padding:1rem}
.modal-bg.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:.7rem;
  padding:1.2rem;max-width:520px;width:100%;max-height:90vh;overflow:auto}
.modal h3{margin:0 0 .6rem;color:var(--accent)}

/* Toast */
.toasts{position:fixed;bottom:6rem;left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;gap:.4rem;z-index:300;pointer-events:none;width:90%;max-width:380px}
.toast{background:var(--surface);border:1px solid var(--accent);border-left-width:4px;
  padding:.7rem 1rem;border-radius:.45rem;color:var(--text);font-size:.92rem;
  box-shadow:0 6px 20px rgba(0,0,0,.4);animation:slidein .25s ease}
@media (prefers-reduced-motion: no-preference){
  @keyframes slidein{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
}
@media (prefers-reduced-motion: reduce){.toast{animation:none}}

/* Question navigator (exam) */
.qnav{display:grid;grid-template-columns:repeat(auto-fill,minmax(2.4rem,1fr));gap:.3rem;margin-top:.6rem;max-height:230px;overflow:auto;padding:.3rem;background:var(--bg2);border-radius:.4rem;border:1px solid var(--border)}
.qnav button{padding:0;height:2.2rem;font-size:.78rem;border-radius:.25rem;font-family:var(--mono);min-width:0}
.qnav button.answered{background:var(--surface2);border-color:var(--accent2);color:var(--accent)}
.qnav button.flagged{background:#3a2200;border-color:var(--warn);color:var(--warn)}
.qnav button.current{box-shadow:0 0 0 2px var(--accent)}

/* Flashcards */
.flashcard{background:var(--surface);border:1px solid var(--border);border-radius:.7rem;
  min-height:240px;padding:1.5rem;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;user-select:none;transition:transform 150ms ease}
.flashcard:hover{transform:translateY(-1px)}
.flashcard .term{font-size:1.4rem;font-weight:600;margin:.5rem 0}
.flashcard .back{font-size:1rem;line-height:1.6;color:var(--text)}
.flashcard .src-line{margin-top:.8rem;font-size:.78rem;color:var(--muted)}
.fc-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;margin-top:.7rem}
.fc-actions button{font-size:.85rem;padding:.6rem .3rem}
.fc-actions .again{background:var(--danger);color:#fff;border-color:var(--danger)}
.fc-actions .hard{background:var(--warn);color:#1a1100;border-color:var(--warn)}
.fc-actions .good{background:var(--accent);color:#001018;border-color:var(--accent)}
.fc-actions .easy{background:var(--success);color:#001f15;border-color:var(--success)}

/* Cheat sheets */
.cheat{background:var(--surface);border:1px solid var(--border);border-radius:.6rem;margin:.6rem 0}
.cheat summary{padding:.85rem 1rem;cursor:pointer;font-weight:600;display:flex;justify-content:space-between;align-items:center;list-style:none}
.cheat summary::-webkit-details-marker{display:none}
.cheat[open] summary{border-bottom:1px solid var(--border)}
.cheat .body{padding:1rem}

/* Header timer */
.timer{font-family:var(--mono);font-size:.95rem;padding:.3rem .6rem;border-radius:.35rem;background:var(--surface2);color:var(--accent);border:1px solid var(--border2)}
.timer.warn{color:var(--warn);border-color:var(--warn)}
.timer.danger{color:var(--danger);border-color:var(--danger);animation:pulse 1s infinite}
@media (prefers-reduced-motion: no-preference){@keyframes pulse{50%{opacity:.6}}}
@media (prefers-reduced-motion: reduce){.timer.danger{animation:none}}

/* Search */
.search-bar{display:flex;gap:.5rem;margin-bottom:.7rem}

/* Helpers */
hr{border:none;border-top:1px solid var(--border);margin:1rem 0}
h2{color:var(--accent);font-size:1.2rem;margin:.4rem 0 .8rem}
h3{font-size:1rem;margin:.6rem 0 .4rem}
ul{padding-left:1.3rem;margin:.4rem 0}
li{margin:.2rem 0}

@media (min-width:900px){
  body{font-size:16px}
  #app{flex-direction:row}
  header.topbar{position:fixed;top:0;left:0;right:0;width:auto}
  nav.bottom{position:fixed;top:3.4rem;bottom:0;left:0;width:170px;flex-direction:column;
    border-top:none;border-right:1px solid var(--border);padding:1rem .5rem;justify-content:flex-start;gap:.25rem}
  nav.bottom button{flex:0;width:100%;flex-direction:row;justify-content:flex-start;font-size:.85rem;padding:.6rem .8rem;gap:.6rem}
  nav.bottom button .nico{font-size:1rem;margin:0}
  main{margin-left:170px;margin-top:3.4rem;padding:1.2rem 1.5rem 2rem;max-width:none}
  .toasts{bottom:1.5rem;right:1.5rem;left:auto;transform:none}
}

@media (max-width:374px){body{font-size:14px}main{padding:.7rem}}
</style>
</head>

    <button data-view="exam" aria-label="Full exam simulation"><span class="nico" aria-hidden="true">⏱</span><span>Exam</span></button>
    <button data-view="flash" aria-label="Flashcards"><span class="nico" aria-hidden="true">⚡</span><span>Flashcards</span></button>
    <button data-view="stats" aria-label="Stats and history"><span class="nico" aria-hidden="true">∿</span><span>Stats</span></button>

  <main>

    <div id="view-practice" class="view"></div>

    <div id="view-read" class="view"></div>
    <div id="view-flash" class="view"></div>
    <div id="view-stats" class="view"></div>
  </main>
</div>
<div id="toasts" class="toasts"></div>
<div id="modal" class="modal-bg">
  <div class="modal" id="modal-body"></div>
</div>

actice Tests Chapter 6"}, {"url": "https://flashgenius.net/blog-article/cissp-practice-questions-security-assessment-and-testing-1749432273613", "title": "FlashGenius: Free CISSP Practice Questions Domain 6 (2025)"}, {"url": "https://siteforinfotech.com/2025/11/cissp-domain-6-practice-test-the-best-way-to-enhance-your-skills.html", "title": "InfoTechSite: CISSP Domain 6 Practice Test"}, {"url": "https://cissprep.net/domain-6-security-assessment-and-testing/", "title": "CISSPrep: Domain 6 \u2014 Security Assessment and Testing"}]}, {"domain": 7, "name": "Security Operations", "weight": 13, "sources": [{"url": "https://destcert.com/resources/cissp-domain-7-security-operations/", "title": "DestCert: Insights into CISSP Domain 7 \u2014 Security Operations"}, {"url": "https://siteforinfotech.com/2026/02/cissp-domain-7-practice-test.html", "title": "InfoTechSite: CISSP Domain 7 Practice Test"}, {"url": "https://www.crusec.com/single-post/2019/07/08/crusec-s-2019-cissp-study-guide-domain-7-security-operations", "title": "CruSec: 2019 CISSP Study Guide \u2014 Domain 7"}, {"url": "https://wentzwu.com/2020/05/13/cissp-practice-questions-20200514/", "title": "Wentz Wu: CISSP Practice Questions 20200514"}, {"url": "https://www.linkedin.com/pulse/cissp-domain-7-security-operations-part-1-understand-soundararajan", "title": "LinkedIn (Soundararajan): CISSP Domain 7 \u2014 Investigations"}, {"url": "https://quizlet.com/218032748/cissp-domain-7-security-operations-investigations-flash-cards/", "title": "Quizlet: CISSP Domain 7 Security Operations \u2014 Investigations"}, {"url": "https://www.coursera.org/learn/cissp-domain-7-security-operations", "title": "Coursera: CISSP Domain 7 Security Operations"}, {"url": "https://cdn.comparitech.com/wp-content/uploads/2020/01/CISSP-Cheat-Sheet-Domain-7.pdf", "title": "Comparitech: CISSP Cheat Sheet Domain 7"}]}, {"domain": 8, "name": "Software Development Security", "weight": 10, "sources": [{"url": "https://destcert.com/resources/cissp-domain-8-software-development-security/", "title": "DestCert: CISSP Domain 8 \u2014 Software Development Security Guide 2025"}, {"url": "https://siteforinfotech.com/2026/02/cissp-domain-8-practice-test.html", "title": "InfoTechSite: CISSP Domain 8 Practice Test"}, {"url": "https://trainingcamp.com/webinars/cissp-software-security-owasp-secure-sdlc-devsecops/", "title": "TrainingCamp: CISSP Software Security \u2014 OWASP, Secure SDLC, DevSecOps"}, {"url": "https://lognpacific.com/free-certification-practice-tests/free-cissp-practice-questions/cissp-domain-8-software-development-security-domain-8-cissp-exam/", "title": "LognPacific: Free CISSP Domain 8 Practice Questions"}, {"url": "https://blog.balancedsec.com/p/understanding-cissp-domain-8-software", "title": "BalancedSec: Understanding CISSP Domain 8 \u2014 Part 1"}, {"url": "https://mappedarch.medium.com/cissp-domain-8-software-development-security-2ca041c0c03a", "title": "Medium (Nityananda): CISSP Domain 8"}, {"url": "https://www.threatonthewire.com/cissp-domain-8-secure-coding-foundations/", "title": "ThreatOnTheWire: Secure Coding Foundations for Managers"}, {"url": "https://cissprep.net/domain-8-software-development-security/", "title": "CISSPrep: Domain 8 \u2014 Software Development Security"}]}];
window.__TOPICS__ = [{"chapter_number":1,"chapter_title":"Security Governance Through Principles and Policies","page":231,"domain":1,"summary":"Security governance, management concepts, and principles are inherent elements in a security policy and in solution deployment. They define the basic parameters needed for a secure environment. They also define the goals and objectives that both policy designers and system implementers must achieve in order to create a secure solution. The primary goals and objectives of security are contained within the CIA Triad: confidentiality, integrity, and availability. Confidentiality is the principle that objects are not disclosed to unauthorized subjects. Integrity is the principle that objects\n\nretain their veracity and are intentionally modified only by authorized subjects. Availability is the principle that authorized subjects are granted timely and uninterrupted access to objects. Other security-related concepts and principles that should be considered and addressed when designing a security policy and deploying a security solution are identification, authentication, authorization, accounting, auditing, nonrepudiation, defense in depth, abstraction, data hiding, and encryption. Security roles determine who is responsible for the security of an organization's assets. Common roles include senior manager, security professionals, asset owners, custodians, users, and auditors. A formalized security policy structure consists of policies, standards, baselines, guidelines, and procedures. These individual documents are elements essential to the design and implementation of security in any environment. To be effective, the approach to security management must be a top-down approach. Security control frameworks are structured sets of guidelines, standards, best practices, and controls designed to help organizations effectively manage and enhance their\n\ninformation security and cybersecurity posture. Entities and examples of SCFs include ISO, NIST, COBIT, SABSA, PCI DSS, FedRAMP, and ITIL. Threat modeling is the security process where potential threats are identified, categorized, and analyzed. Threat modeling can be performed as a proactive measure during design and development or as a reactive measure once a product has been deployed. In either case, the process identifies the potential harm, the probability of occurrence, the priority of concern, and the means to eradicate or reduce the threat. Integrating cybersecurity risk management with supply chain, acquisition strategies, and business practices is a means to ensure a more robust and successful security strategy in organizations of all sizes. When purchases are made without security considerations, the risks inherent in those products remain throughout their deployment life span. Study Essentials Understand the CIA Triad elements of confidentiality, integrity, and availability. Confidentiality is the principle that objects are not disclosed to unauthorized subjects. Integrity is the principle that objects retain their veracity and are\n\nintentionally modified only by authorized subjects. Availability is the principle that authorized subjects are granted timely and uninterrupted access to objects. Know the elements of AAA services. AAA services focus on identification, authentication, authorization, auditing, and accounting. Be able to explain how identification works. Identification is when a subject professes an identity and accounting is initiated. A subject must provide an identity to a system to start the process of authentication, authorization, and accounting. Understand the process of authentication. Authentication is the process of verifying or testing that a claimed identity is valid. Authentication requires information from the subject that must exactly correspond to the identity indicated. Know how authorization fits into a security plan. Once a subject is authenticated, its access must be authorized. The process of authorization ensures that the requested activity or object access is possible given the rights and privileges assigned to the authenticated identity. Be able to explain the auditing process. Auditing is the programmatic means by which subjects are held accountable\n\nfor their actions while authenticated on a system through the documentation or recording of subject activities. Understand the importance of accounting. Security can be maintained only if subjects are held accountable for their actions. Effective accounting relies on the capability to prove a subject's identity and track their activities. Be able to explain the concept of abstraction. Abstraction is used to collect similar elements into groups, classes, or roles that are assigned security controls, restrictions, or permissions as a collective. It adds efficiency to carrying out a security plan. Know about security boundaries. A security boundary is the line of intersection between any two areas, subnets, or environments that have different security requirements or needs. Understand security governance. Security governance is the collection of practices related to supporting, defining, and directing the security efforts of an organization. Know about third-party governance. Third-party governance is the system of external entity oversight that may be mandated by law, regulation, industry standards, contractual obligation, or licensing requirements. The actual method of\n\ngovernance may vary, but it generally involves an outside investigator or auditor. Understand documentation review. Documentation review is the process of reading the exchanged materials and verifying them against standards and expectations. In many situations, especially those related to government or military agencies or contractors, failing to provide sufficient documentation to meet requirements of third-party governance can result in a loss of or a voiding of authorization to operate (ATO). Understand the alignment of security function to business strategy, goals, mission, and objectives.","exam_essentials":[{"term":"Understand the CIA Triad elements of confidentiality, integrity, and availability.","gloss":"Confidentiality is the principle that objects are not disclosed to unauthorized subjects. Integrity is the principle that objects retain their veracity and are intentionally modified only by authorized subjects. Availability is the principle that authorized subjects are granted timely and uninterrupted access to objects."},{"term":"Know the elements of AAA services.","gloss":"AAA services focus on identification, authentication, authorization, auditing, and accounting."},{"term":"Be able to explain how identification works.","gloss":"Identification is when a subject professes an identity and accounting is initiated. A subject must provide an identity to a system to start the process of authentication, authorization, and accounting."},{"term":"Understand the process of authentication.","gloss":"Authentication is the process of verifying or testing that a claimed identity is valid. Authentication requires information from the subject that must exactly correspond to the identity indicated."},{"term":"Know how authorization fits into a security plan.","gloss":"Once a subject is authenticated, its access must be authorized. The process of authorization ensures that the requested activity or object access is possible given the rights and privileges assigned to the authenticated identity."},{"term":"Be able to explain the auditing process.","gloss":"Auditing is the programmatic means by which subjects are held accountable for their actions while authenticated on a system through the documentation or recording of subject activities."},{"term":"Understand the importance of accounting.","gloss":"Security can be maintained only if subjects are held accountable for their actions. Effective accounting relies on the capability to prove a subject's identity and track their activities."},{"term":"Be able to explain the concept of abstraction.","gloss":"Abstraction is used to collect similar elements into groups, classes, or roles that are assigned security controls, restrictions, or permissions as a collective. It adds efficiency to carrying out a security plan."},{"term":"Know about security boundaries.","gloss":"A security boundary is the line of intersection between any two areas, subnets, or environments that have different security requirements or needs."},{"term":"Understand security governance.","gloss":"Security governance is the collection of practices related to supporting, defining, and directing the security efforts of an organization."},{"term":"Know about third-party governance.","gloss":"Third-party governance is the system of external entity oversight that may be mandated by law, regulation, industry standards, contractual obligation, or licensing requirements. The actual method of governance may vary, but it generally involves an outside investigator or auditor."},{"term":"Understand documentation review.","gloss":"Documentation review is the process of reading the exchanged materials and verifying them against standards and expectations. In many situations, especially those related to government or military agencies or contractors, failing to provide sufficient documentation to meet requirements of third-party governance can result in a loss of or a voiding of authorization to operate (ATO)."},{"term":"Understand the alignment of security function to business strategy, goals, mission, and objectives.","gloss":"Security management planning ensures the proper creation, implementation, and enforcement of a security policy. Security management planning aligns the security functions to the strategy, goals, mission, and objectives of the organization. This includes designing and implementing security based on business cases, budget restrictions, or scarcity of resources."},{"term":"Know what a business case is.","gloss":"A business case is usually a documented argument or stated position in order to define a need to make a decision or take some form of action. To make a business case is to demonstrate a business-specific need to alter an existing process or choose an approach to a business task. A business case is often made to justify the start of a new project, especially a project related to security."},{"term":"Understand security management planning.","gloss":"Security management is based on three types of plans: strategic, tactical, and operational. A strategic plan is a long-term plan that is fairly stable. It defines the organization's goals, mission, and objectives. The tactical plan is a midterm plan developed to provide more details on accomplishing the goals set forth in the strategic plan. Operational plans are short-term and highly detailed plans based on strategic and tactical plans."},{"term":"Know the elements of a formalized security policy structure.","gloss":"To create a comprehensive security plan, you need the following items in place: security policy, standards, baselines, guidelines, and procedures."},{"term":"Understand key security roles.","gloss":"The primary security roles are senior manager, security professional, asset owner, custodian, user, and auditor."},{"term":"Understand due diligence and due care.","gloss":"Due diligence is establishing a plan, policy, and process to protect the interests of an organization. Due care is practicing the individual activities that maintain the due diligence effort. Due diligence is knowing what should be done and planning for it; due care is doing the right action at the right time."},{"term":"Know the basics of threat modeling.","gloss":"Threat modeling is the security process where potential threats are identified, categorized, and analyzed. Threat modeling can be performed as a proactive measure during design and development or as a reactive measure once a product has been deployed. Key concepts include assets/attackers/software, STRIDE, PASTA, VAST, diagramming, reduction/decomposing, and DREAD."},{"term":"Understand supply chain risk management (SCRM) concepts.","gloss":"SCRM is a means to ensure that all the vendors or links in the supply chain are reliable, trustworthy, reputable organizations that disclose their practices and security requirements to their business partners. SCRM includes evaluating risks associated with hardware, software, and services; performing third-party assessment and monitoring; establishing minimum security requirements; and enforcing service-level requirements."}]},{"chapter_number":2,"chapter_title":"Personnel Security and Risk Management Concepts","page":397,"domain":1,"summary":"When designing and deploying security solutions, you need to protect your environment from potential human threats. The aspects of secure hiring practices, defining roles, setting policies, following standards, reviewing guidelines, detailing procedures, performing risk management, providing awareness training, and cultivating management planning all contribute to protecting assets. Secure hiring practices require detailed job descriptions. Job descriptions are used as a guide for selecting candidates and properly evaluating them for a position. Job responsibilities are the specific work tasks an employee is required to perform on a regular basis. Employment candidate screening, background checks, reference checks, education verification, and security clearance validation are essential elements in proving that a candidate is adequate, qualified, and trustworthy for a secured position. Onboarding involves integrating a new hire into the organization, which includes organizational socialization and orientation. When a new employee is hired, they should sign an employment agreement/contract and possibly a nondisclosure agreement (NDA). These documents define the responsibilities\n\nand legal liabilities of the relationship between the employee and the organization. Throughout the employment lifetime of personnel, managers should regularly review or audit the job descriptions, work tasks, privileges, and responsibilities for every staff member. For some industries, mandatory vacations may be needed. Collusion and other privilege abuses can be reduced through strict monitoring of special privileges. Offboarding is the removal of an employee's identity from the IAM system, or it may be a part of the process of employee transfer to another division of the organization. A termination policy is needed to protect an organization and its remaining employees. The termination procedure should include an exit interview, reminder of NDAs, return of company property, and disabling of network access. Vendor, consultant, and contractor controls (i.e., an SLA) are used to define the levels of performance, expectation, compensation, and consequences for external entities, persons, or organizations. Compliance is the act of conforming to or adhering to rules, policies, regulations, standards, or requirements. Compliance is\n\nan important concern for security governance. The primary goal of risk management is to reduce risk to an acceptable level. Determining this level depends on the organization, the value of its assets, and the size of its budget. Risk analysis/assessment is the process by which risk management is achieved and includes inventorying assets, analyzing an environment for threats, and evaluating each risk as to its likelihood of occurring and the cost of the resulting damage. Risk response is the assessing of the cost of various countermeasures for each risk and creating a cost/benefit report for safeguards to present to upper management. Social engineering is a form of attack that exploits human nature and human behavior. Social engineering attacks take two primary forms: convincing someone to perform an unauthorized operation or convincing someone to reveal confidential information. The most effective defense against social engineering attacks is user education and awareness training. The common social engineering principles are authority, intimidation, consensus, scarcity, familiarity, trust, and urgency. Eliciting information is the activity of gathering or collecting information from systems or people. Social engineering attacks\n\ninclude phishing, spear phishing, business email compromise (BEC), whaling, smishing, vishing, spam, shoulder surfing, invoice scams, hoaxes, impersonation, masquerading, tailgating, piggybacking, baiting, dumpster diving, identity fraud, typosquatting, and influence campaigns. For a security solution to be successfully implemented, user behavior must change. Behavior modification involves some level of learning on the part of the user. There are three commonly recognized learning levels: awareness, training, and education. Security-focused awareness and training programs should be reassessed and revised regularly. Some security awareness and training programs can benefit from security champions or gamification. Study Essentials Understand the security implications of hiring new employees. To properly plan for security, you must have standards in place for job descriptions, job classification, work tasks, job responsibilities, prevention of collusion, candidate screening, background checks, security clearances, employment agreements, and nondisclosure agreements. By deploying such\n\nmechanisms, you ensure that new hires are aware of the required security standards, thus protecting your organization's assets. Understand onboarding and offboarding. Onboarding is the process of adding new employees to the organization using socialization and orientation. Offboarding is the removal of an employee's identity from the IAM system once that person has left the organization. Know the principle of least privilege. The principle of least privilege states that users should be granted the minimum amount of access necessary for them to complete their required work tasks or job responsibilities. Know about employee oversight. Throughout the employment lifetime of personnel, managers should regularly review or audit the job descriptions, work tasks, privileges, and responsibilities for every staff member. Know why mandatory vacations are necessary. Mandatory vacations of one to two weeks are used to audit and verify the work tasks and privileges of employees. This often results in easy detection of abuse, fraud, or negligence.\n\nKnow about UBA and UEBA. User behavior analytics (UBA) and user and entity behavior analytics (UEBA) are the concepts of analyzing the behavior of users, subjects, visitors, customers, etc. for some specific goal or purpose. Understand employee transfers.","exam_essentials":[{"term":"Understand the security implications of hiring new employees.","gloss":"To properly plan for security, you must have standards in place for job descriptions, job classification, work tasks, job responsibilities, prevention of collusion, candidate screening, background checks, security clearances, employment agreements, and nondisclosure agreements. By deploying such mechanisms, you ensure that new hires are aware of the required security standards, thus protecting your organization's assets."},{"term":"Understand onboarding and offboarding.","gloss":"Onboarding is the process of adding new employees to the organization using socialization and orientation. Offboarding is the removal of an employee's identity from the IAM system once that person has left the organization."},{"term":"Know the principle of least privilege.","gloss":"The principle of least privilege states that users should be granted the minimum amount of access necessary for them to complete their required work tasks or job responsibilities."},{"term":"Know about employee oversight.","gloss":"Throughout the employment lifetime of personnel, managers should regularly review or audit the job descriptions, work tasks, privileges, and responsibilities for every staff member."},{"term":"Know why mandatory vacations are necessary.","gloss":"Mandatory vacations of one to two weeks are used to audit and verify the work tasks and privileges of employees. This often results in easy detection of abuse, fraud, or negligence."},{"term":"Know about UBA and UEBA.","gloss":"User behavior analytics (UBA) and user and entity behavior analytics (UEBA) are the concepts of analyzing the behavior of users, subjects, visitors, customers, etc. for some specific goal or purpose."},{"term":"Understand employee transfers.","gloss":"Personnel transfers may be treated as a termination/rehire rather than a personnel move. This depends on the organization's policies and the means they have determined to best manage this change. Some of the elements that go into making the decision as to which procedure to use include whether the same user account will be retained, if their clearance will be adjusted, if their new work responsibilities are similar to the previous position, and if a \u201cclean slate\u201d account is required for auditing purposes in the new job position."},{"term":"Be able to explain proper termination policies.","gloss":"A termination policy defines the procedure for terminating employees. It should include items such as always having a witness, disabling the employee's network access, and performing an exit interview. A termination policy should also include escorting the terminated employee off the premises and requiring the return of security tokens and badges and company property."},{"term":"Be able to define overall risk management.","gloss":"The process of identifying factors that could damage or disclose data, evaluating those factors in light of data value and countermeasure cost, and implementing cost-effective solutions for mitigating or reducing risk is known as risk management. By performing risk management, you lay the foundation for reducing risk overall."},{"term":"Understand risk analysis and the key elements involved.","gloss":"Risk analysis is the process by which upper management is provided with details to make decisions about which risks are to be mitigated, which should be transferred, and which should be accepted. To fully evaluate risks and subsequently take the proper precautions, you must analyze the following: assets, asset valuation, threats, vulnerability, exposure, risk, realized risk, safeguards, countermeasures, attacks, and breaches."},{"term":"Know how to evaluate threats.","gloss":"Threats can originate from numerous sources, including IT, humans, and nature. Threat assessment should be performed as a team effort to provide the widest range of perspectives. By fully evaluating risks from all angles, you reduce your system's vulnerability."},{"term":"Understand qualitative risk analysis.","gloss":"Qualitative risk analysis is based more on scenarios than calculations. Exact dollar figures are not assigned to possible losses; instead, threats are ranked on a scale to evaluate their risks, costs, and effects. Such an analysis assists those responsible for creating proper risk management policies."},{"term":"Understand quantitative risk analysis.","gloss":"Quantitative risk analysis focuses on hard values and percentages. A complete quantitative analysis is not possible because of intangible aspects of risk. The process involves valuing assets and identifying threats and then determining a threat's potential frequency and the resulting damage, which leads to the risk response tasks of the cost/benefit analysis of safeguards."},{"term":"Know what single loss expectancy (SLE) is and how to calculate it.","gloss":"SLE is an element of quantitative risk analysis that represents the cost associated with a single realized risk against a specific asset. The formula is SLE = asset value (AV) * exposure factor (EF)."},{"term":"Know what annualized loss expectancy (ALE) is and how to calculate it.","gloss":"ALE is an element of quantitative risk analysis that represents the possible yearly cost of all instances of a specific realized threat against a specific asset. The formula is ALE = single loss expectancy (SLE) * annualized rate of occurrence (ARO)."},{"term":"Know the formula for safeguard evaluation.","gloss":"In addition to determining the annual cost of a safeguard, you must calculate the ALE for the asset if the safeguard is implemented. Use this formula: ALE before safeguard \u2013 ALE after implementing the safeguard \u2013 annual cost of safeguard = value of the safeguard to the company, or (ALE1 \u2013 ALE2) \u2013 ACS."},{"term":"Know the options for handling risk.","gloss":"Reducing risk, or risk mitigation, is the implementation of safeguards and countermeasures. Assigning risk or transferring a risk places the cost of loss a risk represents onto another entity or organization. Purchasing insurance is one form of assigning or transferring risk. Risk deterrence is the process of implementing deterrents to would-be violators of security and policy. Risk avoidance is the process of selecting alternate options or activities that have less associated risk than the default, common, expedient, or cheap option."},{"term":"Understand security control assessment (SCA).","gloss":"An SCA is the formal evaluation of a security infrastructure's individual mechanisms against a baseline or reliability expectation."},{"term":"Understand security monitoring and measurement.","gloss":"Security controls should provide benefits that can be monitored and measured. If a security control's benefits cannot be quantified, evaluated, or compared, then it does not actually provide any security."},{"term":"Understand risk reporting.","gloss":"Risk reporting involves the production of a risk report and a presentation of that report to the interested/relevant parties. A risk report should be accurate, timely, comprehensive of the entire organization, clear and precise to support decision-making, and updated on a regular basis."},{"term":"Understand the Risk Maturity Model (RMM).","gloss":"The Risk Maturity Model (RMM) is a means to assess the key indicators and activities of a mature, sustainable, and repeatable risk management process. The RMM levels are ad hoc, preliminary, defined, integrated, and optimized."},{"term":"Know about legacy system security risk.","gloss":"Legacy systems are often a threat because they may not be receiving security updates from their vendors. End of life (EOL) is the point at which a manufacturer no longer produces a product. End of service life (EOSL) or end of support (EOS) are those that are no longer receiving updates and support from the vendor."},{"term":"Understand social engineering.","gloss":"Social engineering is a form of attack that exploits human nature and human behavior. The common social engineering principles are authority, intimidation, consensus, scarcity, familiarity, trust, and urgency. Such attacks may be used to elicit information or gain access through the use of pretexting and/or prepending. Social engineering attacks include phishing, spear phishing, business email compromise (BEC), whaling, smishing, vishing, spam, shoulder surfing, invoice scams, hoaxes, impersonation, masquerading, tailgating, piggybacking, baiting, dumpster diving, identity fraud, typosquatting, and influence campaigns."},{"term":"Know how to implement security awareness training and education.","gloss":"Before actual training can take place, awareness of security as a recognized entity must be created for users. Once this is accomplished, training, or teaching employees to perform their work tasks and to comply with the security policy, can begin. All new employees require some level of training so that they will be able to comply with all standards, guidelines, and procedures mandated by the security policy. Education is a more detailed endeavor in which students/users learn much more than they actually need to know to perform their work tasks. Education is most often associated with users pursuing certification or seeking job promotion."},{"term":"Know about the need for periodic content reviews and effectiveness evaluations.","gloss":"It is important to perform periodic content reviews of all training materials. This is to ensure that the training materials and presentation stays in line with business goals, organizational mission, and security objectives. Some means of verification should be used to measure whether the training is beneficial or a waste of time and resources."}]},{"chapter_number":3,"chapter_title":"Business Continuity Planning","page":480,"domain":1,"summary":"Every organization dependent on technological resources for its survival should have a comprehensive business continuity plan in place to ensure the sustained viability of the organization when emergencies take place. Several important concepts underlie solid business continuity planning practices, including project scope and planning, business impact analysis, continuity planning, and approval and implementation. Every organization must have plans and procedures in place to help mitigate the effects a disaster can have on continuing operations and to accelerate the return to normal operations. To determine the risks to your critical business functions that require mitigation, you must work with a cross-functional team to conduct a business impact analysis from both quantitative and qualitative points of view. You must take the appropriate steps in developing a continuity strategy for your organization and know what to do to weather future disasters. Finally, you must create the documentation required to ensure the effective communication of your plan to current and future BCP team participants. Such documentation should include the continuity of operations plan (COOP). The business continuity plan must also contain statements of importance, priorities,\n\norganizational responsibility, and timing. Also, the documentation should include plans for risk assessment, acceptance, and mitigation; a vital records program; emergency-response guidelines; and procedures for maintenance and testing. Chapter 18 will take this planning to the next step\u2014developing and implementing a disaster recovery plan that includes the technical controls required to keep your business running in the face of a disaster. Study Essentials Understand the four steps of the business continuity planning process. Business continuity planning involves four distinct elements: project scope and planning, business impact analysis, continuity planning, and approval and implementation. Each element contributes to the overall goal of ensuring that business operations continue uninterrupted in the face of an emergency. Describe how to perform the business organization analysis. In the business organization analysis, the individuals responsible for leading the BCP process determine which departments and individuals have a stake in the business\n\ncontinuity plan. This analysis serves as the foundation for BCP team selection and, after validation by the BCP team, is used to guide the next stages of BCP development. List the necessary members of the business continuity planning team. The BCP team should contain, at a minimum, representatives from each of the operational and support departments; technical experts from the IT department; physical and IT security personnel with BCP skills; legal representatives familiar with corporate legal, regulatory, and contractual responsibilities; human resources members; public relations members; and representatives from senior management. Additional team members depend on the structure and nature of the organization. Know the legal and regulatory requirements that face business continuity planners. Business leaders must exercise due diligence to ensure that shareholders' interests are protected in the event disaster strikes. Some industries are also subject to federal, state, and local regulations that mandate specific BCP procedures. Many businesses also have contractual obligations to their clients that they must meet before, during, and after a disaster.\n\nExplain the stages of the business impact analysis process. The five stages of the business impact analysis process are identifying priorities, risk identification, likelihood assessment, impact analysis, and resource prioritization. Describe the process used to develop a continuity strategy. During the strategy development subtask, the BCP team determines which risks they will mitigate. In the provisions and processes subtask, the team designs mechanisms and procedures that will mitigate identified risks. The plan must then be approved by senior management and implemented. Personnel must also receive training on their roles in the BCP process. Explain the importance of comprehensively documenting an organization's business continuity plan. Committing the plan to writing provides the organization with a written record of the procedures to follow when disaster strikes. It prevents the \u201cit's in my head\u201d syndrome and ensures the orderly progress of events in an emergency.","exam_essentials":[{"term":"Understand the four steps of the business continuity planning process.","gloss":"Business continuity planning involves four distinct elements: project scope and planning, business impact analysis, continuity planning, and approval and implementation. Each element contributes to the overall goal of ensuring that business operations continue uninterrupted in the face of an emergency."},{"term":"Describe how to perform the business organization analysis.","gloss":"In the business organization analysis, the individuals responsible for leading the BCP process determine which departments and individuals have a stake in the business continuity plan. This analysis serves as the foundation for BCP team selection and, after validation by the BCP team, is used to guide the next stages of BCP development."},{"term":"List the necessary members of the business continuity planning team.","gloss":"The BCP team should contain, at a minimum, representatives from each of the operational and support departments; technical experts from the IT department; physical and IT security personnel with BCP skills; legal representatives familiar with corporate legal, regulatory, and contractual responsibilities; human resources members; public relations members; and representatives from senior management. Additional team members depend on the structure and nature of the organization."},{"term":"Know the legal and regulatory requirements that face business continuity planners.","gloss":"Business leaders must exercise due diligence to ensure that shareholders' interests are protected in the event disaster strikes. Some industries are also subject to federal, state, and local regulations that mandate specific BCP procedures. Many businesses also have contractual obligations to their clients that they must meet before, during, and after a disaster."},{"term":"Explain the stages of the business impact analysis process.","gloss":"The five stages of the business impact analysis process are identifying priorities, risk identification, likelihood assessment, impact analysis, and resource prioritization."},{"term":"Describe the process used to develop a continuity strategy.","gloss":"During the strategy development subtask, the BCP team determines which risks they will mitigate. In the provisions and processes subtask, the team designs mechanisms and procedures that will mitigate identified risks. The plan must then be approved by senior management and implemented. Personnel must also receive training on their roles in the BCP process."},{"term":"Explain the importance of comprehensively documenting an organization's business continuity plan.","gloss":"Committing the plan to writing provides the organization with a written record of the procedures to follow when disaster strikes. It prevents the \u201cit's in my head\u201d syndrome and ensures the orderly progress of events in an emergency."}]},{"chapter_number":4,"chapter_title":"Laws, Regulations, and Compliance","page":567,"domain":1,"summary":"Computer security necessarily entails a high degree of involvement from the legal community. In this chapter, you learned about the laws that govern security issues such as\n\ncomputer crime, intellectual property, data privacy, and software licensing. Three major categories of law impact information security professionals. Criminal law outlines the rules and sanctions for major violations of the public trust. Civil law provides us with a framework for conducting business. Government agencies use administrative law to promulgate the day-to-day regulations that interpret existing law. The laws governing information security activities are diverse and cover all three categories. Some, such as the Electronic Communications Privacy Act and the Digital Millennium Copyright Act, are criminal laws where violations may result in criminal fines and/or prison time. Others, such as trademark and patent laws, are civil laws that govern business transactions. Finally, many government agencies promulgate administrative law, such as the HIPAA Security Rule, that affects specific industries and data types. Information security professionals should be aware of the compliance requirements specific to their industry and business activities. Tracking these requirements is a complex task and should be assigned to one or more compliance\n\nspecialists who monitor changes in the law, changes in the business environment, and the intersection of those two realms. It's also not sufficient to simply worry about your own security and compliance. With increased adoption of cloud computing, many organizations now share sensitive and personal data with vendors that act as service providers. Security professionals must take steps to ensure that vendors treat data with as much care as the organization itself would and also meet any applicable compliance requirements. Study Essentials Understand the differences between criminal law, civil law, and administrative law. Criminal law protects society against acts that violate the basic principles we believe in. Violations of criminal law are prosecuted by federal and state governments. Civil law provides the framework for disputes between people or the transaction of business between people and organizations. Violations of civil law are brought to the court and argued by the two affected parties. Administrative law is used by government agencies to effectively carry out their day- to-day business.\n\nBe able to explain the basic provisions of the major laws designed to protect society against computer crime. The Computer Fraud and Abuse Act (as amended) protects computers used by the government or in interstate commerce from a variety of abuses. The Electronic Communications Privacy Act (ECPA) makes it a crime to invade the electronic privacy of an individual. Know the differences among copyrights, trademarks, patents, and trade secrets. Copyrights protect original works of authorship, such as books, articles, poems, and songs. Trademarks are names, slogans, and logos that identify a company, product, or service. Patents provide protection to the creators of new inventions. Trade secret law protects the operating secrets of a firm. Be able to explain the basic provisions of the Digital Millennium Copyright Act of 1998. The Digital Millennium Copyright Act prohibits the circumvention of copy protection mechanisms placed in digital media and limits the liability of Internet service providers for the activities of their users. Know the basic provisions of the Economic Espionage Act of 1996. The Economic Espionage Act provides penalties for individuals found guilty of the theft of trade secrets. Harsher\n\npenalties apply when the individual knows that the information will benefit a foreign government. Understand the various types of software license agreements. Perpetual licenses allow indefinite use after a onetime fee, while subscription licenses are time-bound with recurring fees. Open source licenses offer usage freedom with conditions, and enterprise agreements provide licenses for large organizations. EULAs define user rights and restrictions, concurrent licenses set simultaneous user limits, and named user licenses tie to specific users. Click-through agreements require active consent during installation, and cloud service licenses pertain to online services, with terms presented upon registration. Understand the notification requirements placed on organizations that experience a data breach. California's SB 1386 implemented the first statewide requirement to notify individuals of a breach of their personal information. All other states eventually followed suit with similar laws. Currently, federal law only requires the notification of individuals when a HIPAA-covered entity breaches their protected health information.\n\nUnderstand the major laws that govern privacy of personal information in the United States, the European Union, Canada, China, and South Africa. The United States has a number of privacy laws that affect the government's use of information as well as the use of information by specific industries, such as financial services companies and healthcare organizations that handle sensitive information. The EU has a more comprehensive General Data Protection Regulation that governs the use and exchange of personal information. In Canada, the Personal Information Protection and Electronic Documents Act (PIPEDA) governs the use of personal information. China includes privacy protections in the Personal Information Protection Law (PIPL), while South Africa's are embedded in the Protection of Personal Information Act (POPIA). Explain the importance of a well-rounded compliance program. Most organizations are subject to a wide variety of legal and regulatory requirements related to information security. Building a compliance program ensures that you become and remain compliant with these often overlapping requirements.","exam_essentials":[{"term":"Understand the differences between criminal law, civil law, and administrative law.","gloss":"Criminal law protects society against acts that violate the basic principles we believe in. Violations of criminal law are prosecuted by federal and state governments. Civil law provides the framework for disputes between people or the transaction of business between people and organizations. Violations of civil law are brought to the court and argued by the two affected parties. Administrative law is used by government agencies to effectively carry out their day- to-day business."},{"term":"Be able to explain the basic provisions of the major laws designed to protect society against computer crime.","gloss":"The Computer Fraud and Abuse Act (as amended) protects computers used by the government or in interstate commerce from a variety of abuses. The Electronic Communications Privacy Act (ECPA) makes it a crime to invade the electronic privacy of an individual."},{"term":"Know the differences among copyrights, trademarks, patents, and trade secrets.","gloss":"Copyrights protect original works of authorship, such as books, articles, poems, and songs. Trademarks are names, slogans, and logos that identify a company, product, or service. Patents provide protection to the creators of new inventions. Trade secret law protects the operating secrets of a firm."},{"term":"Be able to explain the basic provisions of the Digital Millennium Copyright Act of 1998.","gloss":"The Digital Millennium Copyright Act prohibits the circumvention of copy protection mechanisms placed in digital media and limits the liability of Internet service providers for the activities of their users."},{"term":"Know the basic provisions of the Economic Espionage Act of 1996.","gloss":"The Economic Espionage Act provides penalties for individuals found guilty of the theft of trade secrets. Harsher penalties apply when the individual knows that the information will benefit a foreign government."},{"term":"Understand the various types of software license agreements.","gloss":"Perpetual licenses allow indefinite use after a onetime fee, while subscription licenses are time-bound with recurring fees. Open source licenses offer usage freedom with conditions, and enterprise agreements provide licenses for large organizations. EULAs define user rights and restrictions, concurrent licenses set simultaneous user limits, and named user licenses tie to specific users. Click-through agreements require active consent during installation, and cloud service licenses pertain to online services, with terms presented upon registration."},{"term":"Understand the notification requirements placed on organizations that experience a data breach.","gloss":"California's SB 1386 implemented the first statewide requirement to notify individuals of a breach of their personal information. All other states eventually followed suit with similar laws. Currently, federal law only requires the notification of individuals when a HIPAA-covered entity breaches their protected health information."},{"term":"Understand the major laws that govern privacy of personal information in the United States, the European Union, Canada, China, and South Africa.","gloss":"The United States has a number of privacy laws that affect the government's use of information as well as the use of information by specific industries, such as financial services companies and healthcare organizations that handle sensitive information. The EU has a more comprehensive General Data Protection Regulation that governs the use and exchange of personal information. In Canada, the Personal Information Protection and Electronic Documents Act (PIPEDA) governs the use of personal information. China includes privacy protections in the Personal Information Protection Law (PIPL), while South Africa's are embedded in the Protection of Personal Information Act (POPIA)."},{"term":"Explain the importance of a well-rounded compliance program.","gloss":"Most organizations are subject to a wide variety of legal and regulatory requirements related to information security. Building a compliance program ensures that you become and remain compliant with these often overlapping requirements."},{"term":"Know how to incorporate security into the procurement and vendor governance process.","gloss":"The expanded use of cloud services by many organizations requires added attention to conducting reviews of information security controls during the vendor selection process and as part of ongoing vendor governance."},{"term":"Be able to determine compliance and other requirements for information protection.","gloss":"Cybersecurity professionals must be able to analyze a situation and determine what jurisdictions and laws apply. They must be able to identify relevant contractual, legal, regulatory, and industry standards and interpret them for their given situation."},{"term":"Understand what licensing and intellectual property protections apply to your organization's data and your obligations when encountering data belonging to other organizations.","gloss":"Understand the privacy and export control issues associated with transferring information across international borders."}]},{"chapter_number":5,"chapter_title":"Protecting Security of Assets","page":658,"domain":2,"summary":"Asset security focuses on collecting, handling, and protecting information throughout its life cycle. This includes sensitive information stored or processed on computing systems or transferred over a network and the assets used in these processes. Sensitive information is any information that an organization keeps private and can include multiple levels of classifications. Proper destruction methods ensure that data can't be retrieved after destruction. Data protection methods include digital rights management (DRM) and using cloud access security brokers (CASBs) when\n\nusing cloud resources. DRM methods attempt to protect copyrighted materials. A CASB is software placed logically between users and cloud-based resources. It can ensure that cloud resources have the same protections as resources within a network. Entities that must comply with the EU GDPR use additional data protection methods such as pseudonymization, tokenization, and anonymization. Personnel can fulfill many different roles when handling data. Data owners are ultimately responsible for classifying, labeling, and protecting data. System owners are responsible for the systems that process the data. The GDPR defines data controllers, data processors, and data custodians. Data controllers decide what data to process, the purpose of data collection, and how to process it. A data controller can hire a third party to process data, and in this context, the third party is the data processor. Data processors have a responsibility to protect the privacy of the data and not use it for any purpose other than directed by the data controller. A custodian is delegated day-to-day responsibilities for properly storing and protecting data. Security baselines provide a set of security controls that an organization can implement as a secure starting point. Some publications (such as NIST SP 800-53B) identify security control\n\nbaselines. However, these baselines don't apply equally to all organizations. Instead, organizations use scoping and tailoring techniques to identify the security controls to implement after selecting baselines. Additionally, organizations ensure that they implement security controls mandated by external standards that apply to their organization. Study Essentials Understand the importance of data and asset classifications. Data owners are responsible for defining data and asset classifications and ensuring that data and systems are properly tagged. Additionally, data owners define requirements to protect data at different classifications, such as encrypting sensitive data at rest, in transit, and in use. Data classifications are typically defined within security policies or data policies. Define PII and PHI. Personally identifiable information (PII) is any information that can identify an individual. Protected health information (PHI) is any health-related information that can be related to a specific person and is subject to HIPAA. Many laws and regulations mandate the protection of PII and PHI.\n\nKnow how to manage sensitive information. Sensitive information is any type of classified information, and proper management helps prevent unauthorized disclosure resulting in a loss of confidentiality. Proper management includes tagging, handling, storing, and destroying sensitive information. The two areas where organizations often miss the mark are adequately protecting backup media holding sensitive information and sanitizing media or equipment when it is at the end of its life cycle. Describe the three data states. The three data states are at rest, in transit, and in use. Data at rest is any data stored on media such as hard drives or external media. Data in transit is any data transmitted over a network. Encryption methods protect data at rest and in transit. Data in use refers to data in memory and used by an application. Applications should flush memory buffers to remove data after it is no longer needed. Define DLP. Data loss prevention (DLP) solutions detect and block data exfiltration attempts by scanning unencrypted files and looking for keywords and data patterns. Network DLP solutions (including cloud DLP solutions) scan files before they leave the network. Endpoint DLP solutions prevent users from copying or printing some files.\n\nCompare data destruction methods. Erasing a file doesn't delete it. Clearing media overwrites it with characters or bits. Purging repeats the clearing process multiple times and removes data so that the media can be reused. Degaussing removes data from tapes and magnetic hard disk drives, but it does not affect optical media or SSDs. Destruction methods include incineration, shredding, and disintegration, pulverizing, and melting. Describe data remanence. Data remanence is the data that remains on media after it should have been removed. Hard disk drives sometimes retain residual magnetic flux that can be read with advanced tools. Advanced tools can read slack space on a disk, which is unused space in clusters. Erasing data on a disk leaves data remanence. For solid-state drives (SSDs), data remanence can persist due to the wear-leveling algorithms they employ, making traditional data erasure methods less effective and potentially allowing remnants of data to remain on unaddressed memory cells. Understand record retention policies. Record retention policies ensure that data is kept in a usable state while it is needed and destroyed when it is no longer needed. Many laws and regulations mandate keeping data for a specific amount of time, but in the absence of formal regulations, organizations\n\nspecify the retention period within a policy. Audit trail data needs to be kept long enough to reconstruct past incidents, but the organization must identify how far back they want to investigate. A current trend in many organizations is to reduce legal liabilities by implementing short retention policies with email. Know the difference between end of life and end of support.","exam_essentials":[{"term":"Understand the importance of data and asset classifications.","gloss":"Data owners are responsible for defining data and asset classifications and ensuring that data and systems are properly tagged. Additionally, data owners define requirements to protect data at different classifications, such as encrypting sensitive data at rest, in transit, and in use. Data classifications are typically defined within security policies or data policies."},{"term":"Define PII and PHI.","gloss":"Personally identifiable information (PII) is any information that can identify an individual. Protected health information (PHI) is any health-related information that can be related to a specific person and is subject to HIPAA. Many laws and regulations mandate the protection of PII and PHI."},{"term":"Know how to manage sensitive information.","gloss":"Sensitive information is any type of classified information, and proper management helps prevent unauthorized disclosure resulting in a loss of confidentiality. Proper management includes tagging, handling, storing, and destroying sensitive information. The two areas where organizations often miss the mark are adequately protecting backup media holding sensitive information and sanitizing media or equipment when it is at the end of its life cycle."},{"term":"Describe the three data states.","gloss":"The three data states are at rest, in transit, and in use. Data at rest is any data stored on media such as hard drives or external media. Data in transit is any data transmitted over a network. Encryption methods protect data at rest and in transit. Data in use refers to data in memory and used by an application. Applications should flush memory buffers to remove data after it is no longer needed."},{"term":"Define DLP.","gloss":"Data loss prevention (DLP) solutions detect and block data exfiltration attempts by scanning unencrypted files and looking for keywords and data patterns. Network DLP solutions (including cloud DLP solutions) scan files before they leave the network. Endpoint DLP solutions prevent users from copying or printing some files. Compare data destruction methods. Erasing a file doesn't delete it. Clearing media overwrites it with characters or bits. Purging repeats the clearing process multiple times and removes data so that the media can be reused. Degaussing removes data from tapes and magnetic hard disk drives, but it does not affect optical media or SSDs. Destruction methods include incineration, shredding, and disintegration, pulverizing, and melting."},{"term":"Describe data remanence.","gloss":"Data remanence is the data that remains on media after it should have been removed. Hard disk drives sometimes retain residual magnetic flux that can be read with advanced tools. Advanced tools can read slack space on a disk, which is unused space in clusters. Erasing data on a disk leaves data remanence. For solid-state drives (SSDs), data remanence can persist due to the wear-leveling algorithms they employ, making traditional data erasure methods less effective and potentially allowing remnants of data to remain on unaddressed memory cells."},{"term":"Understand record retention policies.","gloss":"Record retention policies ensure that data is kept in a usable state while it is needed and destroyed when it is no longer needed. Many laws and regulations mandate keeping data for a specific amount of time, but in the absence of formal regulations, organizations specify the retention period within a policy. Audit trail data needs to be kept long enough to reconstruct past incidents, but the organization must identify how far back they want to investigate. A current trend in many organizations is to reduce legal liabilities by implementing short retention policies with email."},{"term":"Know the difference between end of life and end of support.","gloss":"End of life (EOL) is the date announced by a vendor when production and sales of a product stop. However, the vendor still supports the product after EOL. End of support identifies the date when a vendor will no longer support a product."},{"term":"Explain DRM.","gloss":"Digital rights management (DRM) methods provide copyright protection for copyrighted works. The purpose is to prevent the unauthorized use, modification, and distribution of copyrighted works."},{"term":"Explain CASB.","gloss":"A cloud access security broker (CASB) is a solution placed logically between users and cloud resources. It can apply internal security controls to cloud resources. The CASB solution can be placed on-premises or in the cloud."},{"term":"Define pseudonymization.","gloss":"Pseudonymization is the process of replacing some data elements with pseudonyms or aliases. It removes privacy data so that a dataset can be shared. However, the original data remains available in a separate dataset."},{"term":"Define tokenization.","gloss":"Tokenization replaces data elements with a string of characters or a token. Credit card processors replace credit card data with a token, and a third party holds the mapping to the original data and the token."},{"term":"Define anonymization.","gloss":"Anonymization replaces privacy data with useful but inaccurate data. The dataset can be shared and used for analysis purposes, but anonymization removes individual identities. Anonymization is permanent."},{"term":"Know the responsibilities of data roles.","gloss":"The data owner is the person responsible for classifying, labeling, and protecting data. Data controllers decide what data to process, the purpose of data collection, and how to process data. Data processors are third-party entities that process data for an organization at the direction of the data controller. A user accesses data while performing work tasks. The data subject is the person described in the PII. A custodian has day-to-day responsibilities for protecting and storing data."},{"term":"Know about security control baselines.","gloss":"Security control baselines provide a listing of controls that an organization can apply as a baseline. Not all baselines apply to all organizations. Organizations apply scoping and tailoring techniques to adapt a baseline to their needs."}]},{"chapter_number":6,"chapter_title":"Cryptography and Symmetric Key Algorithms","page":760,"domain":3,"summary":"Cryptographers and cryptanalysts are in a never-ending race to develop more secure cryptosystems and advanced cryptanalytic techniques designed to circumvent those systems. Cryptography dates back as early as Caesar and

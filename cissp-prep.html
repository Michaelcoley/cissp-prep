tunnels (typically IPsec or VXLAN) provide point-to-point confidentiality but lack inline security inspection \\u2014 without a paired security stack (SASE, secure web gateway, CASB), traffic inside the tunnel is opaque to enterprise security tools. Choice A (physical theft) is unrelated. Choice C (loss of routing) is wrong \\u2014 SD-WAN provides routing. Choice D (no multicast) is technically wrong and irrelevant. The exam pattern: SD-WAN + SASE = secure modern WAN.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/software-defined-networking-sdn/\",\"title\":\"DestCert: Software-Defined Networking (SDN) for Scalable Security\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"sd-wan\",\"sase\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D4-034\",\"domain\":4,\"subdomain\":\"4.6 ICS\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST mitigation for legacy ICS/SCADA devices that cannot be patched without operational disruption?\",\"choices\":[\"Internet exposure with strong passwords\",\"Network segmentation, monitoring, and protocol-aware firewalls between IT and OT\",\"Disable logging to reduce noise as a baseline configuration\",\"Replace with cloud equivalents immediately\"],\"correct\":1,\"explanation\":\"OT environments require segmentation (Purdue model), passive monitoring (e.g., NIDS for ICS protocols), and OT-aware firewalls. Internet exposure is dangerous; disabling logging hides incidents; immediate cloud migration is rarely feasible due to operational constraints.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-4-communication-and-network-security/\",\"title\":\"DestCert: CISSP Domain 4 \\u2014 Guide to Communication and Network Security\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"ics\",\"scada\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D4-035\",\"domain\":4,\"subdomain\":\"4.6 IoT\",\"difficulty\":\"medium\",\"stem\":\"Which network design pattern BEST supports protecting IoT devices that cannot run modern security agents?\",\"choices\":[\"Place IoT and IT on the same flat network\",\"Dedicated IoT VLAN/segment with restrictive ACLs and outbound-only access to known endpoints\",\"Disable all IoT devices when applied to standard enterprise environments\",\"Encrypt only IoT data at rest\"],\"correct\":1,\"explanation\":\"Dedicated IoT VLAN with restrictive ACLs and outbound-only allow-listing limits the blast radius when (not if) an IoT device is compromised. Choice A (flat network) lets a compromised IoT device pivot east-west into high-value systems. Choice C (disable all IoT) is operationally infeasible. Choice D (encrypt at rest only) ignores network-borne lateral movement, which is the actual IoT threat vector.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-4-communication-and-network-security/\",\"title\":\"DestCert: CISSP Domain 4 \\u2014 Guide to Communication and Network Security\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"iot\",\"segmentation\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D4-036\",\"domain\":4,\"subdomain\":\"4.2 Routing\",\"difficulty\":\"medium\",\"stem\":\"Which is the PRIMARY security concern with BGP between autonomous systems on the internet?\",\"choices\":[\"High protocol overhead in most enterprise deployments\",\"BGP origin and path validation are not built-in; route hijacking and route leaks remain common\",\"BGP requires IPv6 in most enterprise deployments\",\"BGP is single-vendor in standard practice\"],\"correct\":1,\"explanation\":\"BGP trusts what peers announce; without RPKI (Resource Public Key Infrastructure) or BGPsec, attackers can hijack prefixes (e.g., 2008 YouTube/Pakistan, 2018 Amazon Route 53 incidents). RPKI deployment is improving but uneven. The other choices are false.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-4-communication-and-network-security/\",\"title\":\"DestCert: CISSP Domain 4 \\u2014 Guide to Communication and Network Security\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"bgp\",\"rpki\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D4-037\",\"domain\":4,\"subdomain\":\"4.4 NAC\",\"difficulty\":\"medium\",\"stem\":\"An organisation wants to enforce that devices joining the corporate network are corporate-managed and meet the patch baseline. Which approach is BEST?\",\"choices\":[\"Static IP assignment when applied to standard enterprise environments\",\"802.1X with NAC posture assessment and dynamic VLAN assignment\",\"Open SSID with captive portal\",\"MAC address filtering only\"],\"correct\":1,\"explanation\":\"802.1X authentication paired with NAC posture (patch level, AV running, certificate-based device identity) and dynamic VLAN assignment is the modern enterprise pattern. MAC filtering is trivially spoofable. Static IP is administrative, not security control.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-4-communication-and-network-security/\",\"title\":\"DestCert: CISSP Domain 4 \\u2014 Guide to Communication and Network Security\",\"captured\":\"2026-04-26\"},{\"url\":\"https://smallstep.com/blog/eaptls-certificate-wifi/\",\"title\":\"SmallStep: Certificate Based Wi-Fi Authentication with RADIUS and EAP-TLS\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"nac\",\"802.1x\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D4-038\",\"domain\":4,\"subdomain\":\"4.4 Segmentation\",\"difficulty\":\"medium\",\"stem\":\"What is the PRIMARY benefit of a screened subnet (modern DMZ pattern) using two firewalls?\",\"choices\":[\"Lower licensing costs\",\"Defense in depth\",\"Faster routing\",\"Eliminates need for IDS\"],\"correct\":1,\"explanation\":\"Two-firewall (front and back) screened subnets create layered policies; using different vendors limits single-bug or single-misconfiguration exposure. Cost and speed are not the rationale. IDS still complements firewalls.\",\"source\":\"guide\",\"guide_pages\":[1331,1335],\"guide_section\":\"Chapter 12 \\u2014 Screened Subnets\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-4-communication-and-network-security/\",\"title\":\"DestCert: CISSP Domain 4 \\u2014 Guide to Communication and Network Security\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"dmz\",\"screened-subnet\"],\"notes\":\"\",\"chapter\":10},{\"id\":\"D4-039\",\"domain\":4,\"subdomain\":\"4.4 Egress\",\"difficulty\":\"medium\",\"stem\":\"Which control prevents data exfiltration via DNS tunneling MOST effectively?\",\"choices\":[\"Block all DNS when properly implemented\",\"Restrict outbound DNS to enterprise resolvers, monitor DNS payload sizes and entropy, and apply DNS RPZ/blocklists\",\"Allow direct DNS to any resolver across the relevant control set\",\"Use only DoH for general production deployments in standard practice\"],\"correct\":1,\"explanation\":\"Forcing DNS through enterprise resolvers and applying analytics (large payloads, high entropy, suspicious TXT volumes) detects/blocks DNS tunneling. Blocking all DNS breaks the network. Direct DNS to any resolver is permissive. DoH alone hides DNS without analytics.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-4-communication-and-network-security/\",\"title\":\"DestCert: CISSP Domain 4 \\u2014 Guide to Communication and Network Security\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"dns-tunneling\",\"egress\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D4-040\",\"domain\":4,\"subdomain\":\"4.4 Network\",\"difficulty\":\"medium\",\"stem\":\"Which protocol provides TIME synchronisation that is OFTEN under-prioritised but CRITICAL for log correlation and Kerberos?\",\"choices\":[\"NTP\",\"DHCP\",\"SNMP\",\"SMB\"],\"correct\":0,\"explanation\":\"NTP keeps all systems' clocks in sync \\u2014 large skew breaks Kerberos (ticket validity windows), TLS certificate validation, log correlation across systems, and forensic timelines. Choice B (DHCP) provides IP addresses, not time. Choice C (SNMP) is for monitoring/management. Choice D (SMB) is file sharing. The exam tests NTP because candidates underweight infrastructure protocols \\u2014 yet broken time can break authentication entirely.\",\"source\":\"guide\",\"guide_pages\":[1438,1442],\"guide_section\":\"Chapter 12 \\u2014 NTP\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-4-communication-and-network-security/\",\"title\":\"DestCert: CISSP Domain 4 \\u2014 Guide to Communication and Network Security\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"ntp\",\"time-sync\"],\"notes\":\"\",\"chapter\":10},{\"id\":\"D4-041\",\"domain\":4,\"subdomain\":\"4.5 SOA/Microservices\",\"difficulty\":\"medium\",\"stem\":\"Which is the PRIMARY security benefit of mTLS (mutual TLS) between microservices?\",\"choices\":[\"Faster API responses as a baseline configuration in standard practice\",\"Both client and server authenticate cryptographically, providing strong workload identity\",\"No need for any authorisation across the relevant control set\",\"Eliminates the need for service mesh in most enterprise deployments\"],\"correct\":1,\"explanation\":\"mTLS provides cryptographic mutual authentication between services using certificates \\u2014 strong workload identity. Authorisation is still required (mTLS proves who, policy decides what). Service meshes (Istio, Linkerd) often automate mTLS. Performance is not the primary benefit.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-4-communication-and-network-security/\",\"title\":\"DestCert: CISSP Domain 4 \\u2014 Guide to Communication and Network Security\",\"captured\":\"2026-04-26\"},{\"url\":\"https://csrc.nist.gov/pubs/sp/800/207/final\",\"title\":\"NIST SP 800-207: Zero Trust Architecture\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"mtls\",\"microservices\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D4-042\",\"domain\":4,\"subdomain\":\"4.6 DDoS\",\"difficulty\":\"medium\",\"stem\":\"Which DDoS attack TYPE targets the application layer with low-volume but expensive requests (e.g., Slowloris)?\",\"choices\":[\"Volumetric\",\"Protocol\",\"Application-layer (L7)\",\"Reflective amplification\"],\"correct\":2,\"explanation\":\"L7 attacks (Slowloris, HTTP flood, RUDY) consume server resources rather than bandwidth \\u2014 low-volume but devastating to specific apps. Volumetric saturates link capacity. Protocol attacks abuse stack weaknesses (SYN flood). Reflective amplification (DNS, NTP, memcached) leverages third-party servers.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-4-communication-and-network-security/\",\"title\":\"DestCert: CISSP Domain 4 \\u2014 Guide to Communication and Network Security\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"ddos\",\"slowloris\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D4-043\",\"domain\":4,\"subdomain\":\"4.4 Email\",\"difficulty\":\"medium\",\"stem\":\"Which DMARC policy value tells receivers to REJECT messages that fail SPF and DKIM alignment?\",\"choices\":[\"p=none\",\"p=quarantine\",\"p=reject\",\"p=accept\"],\"correct\":2,\"explanation\":\"DMARC has THREE policy values: p=none (monitor and report only), p=quarantine (treat as suspicious \\u2014 typically spam folder), p=reject (drop the message). 'p=accept' is invented \\u2014 DMARC doesn't have it. Mature deployment progresses: none \\u2192 quarantine \\u2192 reject as confidence in alignment grows. The exam pattern: DMARC policy values are tested directly because they're often confused with spam-filter actions.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-4-communication-and-network-security/\",\"title\":\"DestCert: CISSP Domain 4 \\u2014 Guide to Communication and Network Security\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"dmarc\",\"email\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D4-044\",\"domain\":4,\"subdomain\":\"4.5 SaaS Access\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST way to deliver web application access to remote users WITHOUT placing them on the corporate network?\",\"choices\":[\"Open RDP through the firewall under typical operating conditions\",\"Zero Trust Network Access (ZTNA) brokered access, identity- and context-aware, with no broad network reachability\",\"Site-to-site VPN to user homes for the purposes of this question\",\"MAC address ACLs for general production deployments in commonly cited frameworks\"],\"correct\":1,\"explanation\":\"ZTNA grants per-application access based on identity and context, never exposing broad network ranges (a major shift from VPN). Open RDP is dangerous. Site-to-site VPNs to homes are operationally infeasible. MAC ACLs cannot follow remote users.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://csrc.nist.gov/pubs/sp/800/207/final\",\"title\":\"NIST SP 800-207: Zero Trust Architecture\",\"captured\":\"2026-04-26\"},{\"url\":\"https://duo.com/learn/zero-trust-segmentation\",\"title\":\"Cisco Duo: Zero Trust Segmentation Guide for Security Leaders\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"ztna\",\"remote-access\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D4-045\",\"domain\":4,\"subdomain\":\"4.6 Wireless\",\"difficulty\":\"medium\",\"stem\":\"Which WPA3 enhancement ensures forward secrecy for prior wireless sessions even if the PSK is later compromised?\",\"choices\":[\"Stronger PSK length requirement\",\"SAE handshake, each session derives a unique key\",\"Mandatory MAC address randomisation\",\"Use of WEP for fallback\"],\"correct\":1,\"explanation\":\"SAE establishes a unique session key per handshake \\u2014 capturing one session does not compromise others, and offline PSK guessing against captured handshakes is no longer feasible. The other choices are unrelated or dangerous (WEP fallback would be a regression).\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://www.ironwifi.com/blogs/best-eap-methods-wifi/\",\"title\":\"IronWiFi: Best EAP Methods for Wi-Fi \\u2014 EAP-TLS vs PEAP vs EAP-TTLS\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"wpa3\",\"sae\",\"pfs\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D4-046\",\"domain\":4,\"subdomain\":\"4.6 Endpoint\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST mitigation for credential theft via captured 802.1X EAP-TTLS inner authentication?\",\"choices\":[\"Use weaker inner methods when properly implemented\",\"Enforce server-certificate validation on the supplicant; consider migrating to EAP-TLS\",\"Disable certificate validation under typical operating conditions\",\"Use shared secrets in most operational contexts for the purposes of this question\"],\"correct\":1,\"explanation\":\"Without strict server-cert validation, attackers can stand up rogue RADIUS servers and harvest inner credentials (MSCHAPv2). Enforcing server-cert validation (and migrating to EAP-TLS where feasible) closes this gap. The other choices are insecure.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://smallstep.com/blog/eaptls-certificate-wifi/\",\"title\":\"SmallStep: Certificate Based Wi-Fi Authentication with RADIUS and EAP-TLS\",\"captured\":\"2026-04-26\"},{\"url\":\"https://www.ironwifi.com/blogs/best-eap-methods-wifi/\",\"title\":\"IronWiFi: Best EAP Methods for Wi-Fi \\u2014 EAP-TLS vs PEAP vs EAP-TTLS\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"eap-ttls\",\"rogue-radius\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D4-047\",\"domain\":4,\"subdomain\":\"4.4 Firewall\",\"difficulty\":\"medium\",\"stem\":\"Which firewall rule design principle is MOST important for minimising attack surface?\",\"choices\":[\"Allow-all by default; block specific bad\",\"Deny-all by default; allow specific business need\",\"Allow internal-only at any time\",\"Block all outbound\"],\"correct\":1,\"explanation\":\"Default-deny is the secure baseline; rules grant only specific business need. Default-allow lists are unmanageable and miss novel attacks. Outbound rules also matter for egress control. Choice C and D are wrong (one is permissive, one breaks operations).\",\"source\":\"guide\",\"guide_pages\":[1314,1318],\"guide_section\":\"Chapter 12 \\u2014 Firewall Design\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-4-communication-and-network-security/\",\"title\":\"DestCert: CISSP Domain 4 \\u2014 Guide to Communication and Network Security\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"default-deny\",\"firewall\"],\"notes\":\"\",\"chapter\":10},{\"id\":\"D4-048\",\"domain\":4,\"subdomain\":\"4.6 Network Attacks\",\"difficulty\":\"medium\",\"stem\":\"Which attack relies on intercepting and altering messages in transit between two parties who believe they are communicating directly?\",\"choices\":[\"Replay\",\"Man-in-the-middle (MITM)\",\"Brute force\",\"Smurf\"],\"correct\":1,\"explanation\":\"MITM intercepts and may modify messages \\u2014 TLS with strict cert validation defeats it; SSH host-key verification mitigates it. Replay reuses captured messages. Brute force tries credentials. Smurf is amplification.\",\"source\":\"guide\",\"guide_pages\":[1326,1330],\"guide_section\":\"Chapter 12 \\u2014 Attacks\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-4-communication-and-network-security/\",\"title\":\"DestCert: CISSP Domain 4 \\u2014 Guide to Communication and Network Security\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"mitm\"],\"notes\":\"\",\"chapter\":10},{\"id\":\"D4-049\",\"domain\":4,\"subdomain\":\"4.5 SDN\",\"difficulty\":\"medium\",\"stem\":\"Which SDN component is the SINGLE point of failure that MUST be hardened and made highly available?\",\"choices\":[\"Data plane switches\",\"Control plane / SDN controller\",\"Northbound API consumer\",\"Southbound API switches\"],\"correct\":1,\"explanation\":\"The SDN controller centralises decisions \\u2014 its compromise or outage affects the whole network. Hardening (RBAC, mTLS) and HA (clustering) are essential. Data plane switches are distributed; APIs are interfaces, not core failure points.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/software-defined-networking-sdn/\",\"title\":\"DestCert: Software-Defined Networking (SDN) for Scalable Security\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"sdn\",\"controller\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D4-050\",\"domain\":4,\"subdomain\":\"4.2 Secure Protocols\",\"difficulty\":\"medium\",\"stem\":\"Which protocol is BEST for secure interactive remote command-line access?\",\"choices\":[\"Telnet\",\"FTP\",\"SSH\",\"TFTP\"],\"correct\":2,\"explanation\":\"SSH provides encrypted authentication and session encryption. Telnet, FTP, and TFTP transmit credentials/data in cleartext (deprecated in any modern environment). SSH-keys with strong passphrases or hardware tokens are the standard.\",\"source\":\"guide\",\"guide_pages\":[1432,1436],\"guide_section\":\"Chapter 12 \\u2014 SSH\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-4-communication-and-network-security/\",\"title\":\"DestCert: CISSP Domain 4 \\u2014 Guide to Communication and Network Security\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"ssh\"],\"notes\":\"\",\"chapter\":10},{\"id\":\"D4-051\",\"domain\":4,\"subdomain\":\"4.5 Wireless\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST control to prevent rogue access points on the corporate network?\",\"choices\":[\"Trust users not to install them given current best practices\",\"Wireless intrusion detection (WIDS) combined with 802.1X port security on wired ports\",\"Disable Wi-Fi entirely as a baseline configuration when properly implemented\",\"Use only the 5 GHz band in most enterprise deployments\"],\"correct\":1,\"explanation\":\"WIDS detects unauthorised radios; 802.1X port security prevents rogue APs from being plugged in successfully. Trust alone fails; full Wi-Fi disablement is impractical; band selection does not address rogue devices.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-4-communication-and-network-security/\",\"title\":\"DestCert: CISSP Domain 4 \\u2014 Guide to Communication and Network Security\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"wids\",\"rogue-ap\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D4-052\",\"domain\":4,\"subdomain\":\"4.6 DNS\",\"difficulty\":\"medium\",\"stem\":\"Which is the PRIMARY purpose of a DNS Firewall (Response Policy Zone, RPZ)?\",\"choices\":[\"Faster name resolution across the relevant policy framework\",\"Block resolution of malicious domains based on threat intelligence feeds\",\"Compression of zone files\",\"Encryption of zone transfers\"],\"correct\":1,\"explanation\":\"DNS RPZ allows applying threat-intel-based policy at the resolver level (block/redirect/sinkhole). Speed, compression, and zone-transfer security (TSIG) are unrelated. RPZ is a high-value defensive layer for catching command-and-control communications.\",\"source\":\"guide\",\"guide_pages\":[1430,1435],\"guide_section\":\"Chapter 12 \\u2014 DNS Firewall / RPZ\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-4-communication-and-network-security/\",\"title\":\"DestCert: CISSP Domain 4 \\u2014 Guide to Communication and Network Security\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"dns-rpz\",\"dns-firewall\"],\"notes\":\"\",\"chapter\":10},{\"id\":\"D5-001\",\"domain\":5,\"subdomain\":\"5.1 AAA\",\"difficulty\":\"easy\",\"stem\":\"Which AAA element answers the question 'who are you?'\",\"choices\":[\"Authentication\",\"Authorisation\",\"Accounting/Auditing\",\"Identification\"],\"correct\":0,\"explanation\":\"Authentication answers 'are you who you claim to be?' Identification (claiming identity) precedes authentication. Authorisation answers 'what may you do?'. Accounting (auditing) records what was done. CISSP often uses I-A-A-A (identification, authentication, authorisation, accounting).\",\"source\":\"guide\",\"guide_pages\":[1685,1690],\"guide_section\":\"Chapter 13 \\u2014 IAAA\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-5-identity-and-access-management-iam/\",\"title\":\"DestCert: CISSP Domain 5 \\u2014 Identity & Access Management\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"aaa\",\"iaaa\"],\"notes\":\"\",\"chapter\":12},{\"id\":\"D5-002\",\"domain\":5,\"subdomain\":\"5.2 Authentication Factors\",\"difficulty\":\"medium\",\"stem\":\"A hardware security key (e.g., FIDO2 token) represents which authentication factor?\",\"choices\":[\"Something you know\",\"Something you have\",\"Something you are\",\"Somewhere you are\"],\"correct\":1,\"explanation\":\"Hardware tokens are 'something you have'. 'Know' covers passwords/PINs. 'Are' covers biometrics. 'Somewhere' (location) is sometimes included as a fourth factor. NIST 800-63B treats FIDO2/WebAuthn as a multi-factor cryptographic authenticator and the only widely deployed one resistant to verifier impersonation at AAL3.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://csrc.nist.gov/pubs/sp/800/63/3/final\",\"title\":\"NIST SP 800-63-3: Digital Identity Guidelines\",\"captured\":\"2026-04-26\"},{\"url\":\"https://cissprep.net/access-control-systems-multifactor-authentication-and-biometrics/\",\"title\":\"CISSPrep: Access Control Systems, MFA & Biometrics\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"mfa\",\"factors\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D5-003\",\"domain\":5,\"subdomain\":\"5.2 MFA\",\"difficulty\":\"easy\",\"stem\":\"Which is NOT considered TRUE multi-factor authentication?\",\"choices\":[\"Password + hardware token\",\"Password + fingerprint\",\"Password + security question\",\"Smart card + PIN\"],\"correct\":2,\"explanation\":\"Two pieces of 'something you know' (password + security question) are SAME-FACTOR \\u2014 both knowledge. Real MFA combines DISTINCT factor categories: something you know + something you have + something you are (+ optional somewhere you are). Choice A (password + token) = know + have. Choice B (password + fingerprint) = know + are. Choice D (smart card + PIN) = have + know. The trap is that 'two things' looks like MFA but factor diversity is what defines it.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://medium.com/the-effective-cissp/multi-factor-authentication-mfa-c30808f81a57\",\"title\":\"Medium / The Effective CISSP: Multi-Factor Authentication (Wentz Wu)\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"mfa\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D5-004\",\"domain\":5,\"subdomain\":\"5.3 Identity Lifecycle\",\"difficulty\":\"medium\",\"stem\":\"Which IAM lifecycle issue is BEST mitigated by automated provisioning and deprovisioning tied to HR systems?\",\"choices\":[\"Password complexity\",\"Privilege creep / orphaned accounts\",\"Brute-force attacks\",\"Phishing given current best practices\"],\"correct\":1,\"explanation\":\"When HR triggers provisioning/deprovisioning, role changes and terminations cascade automatically \\u2014 preventing privilege creep (accumulating rights as roles change) and orphaned accounts (active accounts of departed users). Password and brute-force/phishing are addressed by other controls.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-5-identity-and-access-management-iam/\",\"title\":\"DestCert: CISSP Domain 5 \\u2014 Identity & Access Management\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"lifecycle\",\"deprovisioning\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D5-005\",\"domain\":5,\"subdomain\":\"5.3 Access Reviews\",\"difficulty\":\"medium\",\"stem\":\"How often should privileged access for high-risk systems be reviewed at MINIMUM?\",\"choices\":[\"Annually for the purposes of this question\",\"Semi-annually under typical operating conditions\",\"Quarterly or more frequently with continuous monitoring\",\"Every 5 years in most enterprise deployments\"],\"correct\":2,\"explanation\":\"Privileged access reviews on critical systems should be at least quarterly, ideally continuous (e.g., automated drift detection). Annual is the floor for low-risk systems. Manager-mindset answers favor frequent reviews where stakes are high.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-5-identity-and-access-management-iam/\",\"title\":\"DestCert: CISSP Domain 5 \\u2014 Identity & Access Management\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"access-review\",\"privileged\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D5-006\",\"domain\":5,\"subdomain\":\"5.4 Access Models\",\"difficulty\":\"medium\",\"stem\":\"Which access control model assigns rights based on the job FUNCTION the user holds?\",\"choices\":[\"DAC\",\"MAC\",\"RBAC\",\"ABAC\"],\"correct\":2,\"explanation\":\"RBAC (Role-Based) ties permissions to roles; users get permissions by being members of roles. DAC lets the data owner grant rights ad-hoc. MAC uses labels enforced by the system. ABAC uses attributes (user, resource, environment) for fine-grained policy. Production systems often layer RBAC + ABAC.\",\"source\":\"guide\",\"guide_pages\":[1715,1720],\"guide_section\":\"Chapter 14 \\u2014 RBAC\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-5-identity-and-access-management-iam/\",\"title\":\"DestCert: CISSP Domain 5 \\u2014 Identity & Access Management\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"rbac\"],\"notes\":\"\",\"chapter\":12},{\"id\":\"D5-007\",\"domain\":5,\"subdomain\":\"5.4 Access Models\",\"difficulty\":\"medium\",\"stem\":\"Which access control model is BEST for a system that must enforce CLASSIFICATION-based access (e.g., government Top Secret data)?\",\"choices\":[\"DAC\",\"MAC\",\"RBAC\",\"Rule-Based\"],\"correct\":1,\"explanation\":\"MAC (Mandatory Access Control) uses subject clearances and object labels enforced by the system \\u2014 appropriate for classified environments. DAC lets owners grant access (less rigorous). RBAC and rule-based don't directly model the classification lattice required by government policy.\",\"source\":\"guide\",\"guide_pages\":[1710,1715],\"guide_section\":\"Chapter 14 \\u2014 MAC\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-5-identity-and-access-management-iam/\",\"title\":\"DestCert: CISSP Domain 5 \\u2014 Identity & Access Management\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"mac\",\"classification\"],\"notes\":\"\",\"chapter\":12},{\"id\":\"D5-008\",\"domain\":5,\"subdomain\":\"5.4 Access Models\",\"difficulty\":\"medium\",\"stem\":\"Which access control model is the MOST flexible, allowing decisions based on user, resource, action, and environmental attributes simultaneously?\",\"choices\":[\"DAC\",\"MAC\",\"RBAC\",\"ABAC\"],\"correct\":3,\"explanation\":\"ABAC (Attribute-Based) supports complex policies like 'user must be in HR, resource must be HR data, time must be business hours, device must be managed' \\u2014 far more expressive than RBAC alone. NIST SP 800-162 is the ABAC reference.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-5-identity-and-access-management-iam/\",\"title\":\"DestCert: CISSP Domain 5 \\u2014 Identity & Access Management\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"abac\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D5-009\",\"domain\":5,\"subdomain\":\"5.5 Kerberos\",\"difficulty\":\"medium\",\"stem\":\"In Kerberos, which component issues TGS (Service) tickets after presentation of a TGT?\",\"choices\":[\"Authentication Server (AS)\",\"Ticket Granting Server (TGS)\",\"Resource Server\",\"Client\"],\"correct\":1,\"explanation\":\"Kerberos flow: AS authenticates the user and issues a TGT. The client presents the TGT to the TGS to receive service tickets. The service then validates the service ticket. Kerberos requires synchronised clocks (NTP) \\u2014 typical skew tolerance is ~5 minutes.\",\"source\":\"guide\",\"guide_pages\":[1780,1786],\"guide_section\":\"Chapter 14 \\u2014 Kerberos\",\"web_sources\":[{\"url\":\"https://datatracker.ietf.org/doc/html/rfc4120\",\"title\":\"RFC 4120: The Kerberos Network Authentication Service (V5)\",\"captured\":\"2026-04-26\"}],\"references\":[\"RFC 4120\"],\"tags\":[\"kerberos\",\"tgt\",\"tgs\"],\"notes\":\"\",\"chapter\":13},{\"id\":\"D5-010\",\"domain\":5,\"subdomain\":\"5.5 Kerberos\",\"difficulty\":\"easy\",\"stem\":\"Which is a known weakness of Kerberos that admins MUST mitigate?\",\"choices\":[\"Lack of confidentiality across the relevant control set\",\"Reliance on a single Key Distribution Center (KDC)\",\"No support for service tickets\",\"Cannot enforce password policy\"],\"correct\":1,\"explanation\":\"The KDC is a single point of failure and a high-value attack target. HA replication, hardening, and monitoring are essential. Kerberos provides confidentiality of credentials. Service tickets are core to the protocol. Password policy is enforced by realm policy.\",\"source\":\"guide\",\"guide_pages\":[1786,1790],\"guide_section\":\"Chapter 14 \\u2014 Kerberos Weaknesses\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-5-identity-and-access-management-iam/\",\"title\":\"DestCert: CISSP Domain 5 \\u2014 Identity & Access Management\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"kerberos\",\"kdc\"],\"notes\":\"\",\"chapter\":13},{\"id\":\"D5-011\",\"domain\":5,\"subdomain\":\"5.6 Federation\",\"difficulty\":\"medium\",\"stem\":\"Which protocol uses XML-based assertions exchanged between an Identity Provider and a Service Provider for federated authentication?\",\"choices\":[\"OAuth 2.0\",\"SAML 2.0\",\"OpenID Connect\",\"RADIUS\"],\"correct\":1,\"explanation\":\"SAML 2.0 uses XML assertions (authentication, attribute, authorization) typically over HTTP-Redirect/POST bindings. OAuth 2.0 is for delegated authorisation, OIDC adds an authentication layer on top of OAuth 2.0 (using JWTs). RADIUS is for AAA against network resources, not browser-based federation.\",\"source\":\"guide\",\"guide_pages\":[1810,1815],\"guide_section\":\"Chapter 14 \\u2014 SAML\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/federated-identity-management/\",\"title\":\"DestCert: Federated Identity Management \\u2014 Extensive CISSP Guide\",\"captured\":\"2026-04-26\"},{\"url\":\"https://www.fortinet.com/resources/cyberglossary/saml-vs-oauth\",\"title\":\"Fortinet: What is SAML vs OAuth?\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"saml\",\"federation\"],\"notes\":\"\",\"chapter\":13},{\"id\":\"D5-012\",\"domain\":5,\"subdomain\":\"5.6 Federation\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST description of OAuth 2.0?\",\"choices\":[\"A user authentication protocol when properly implemented\",\"An authorisation framework that allows third-party apps to obtain limited access to a resource on behalf of the user\",\"A digital signature standard when applied to standard enterprise environments in most enterprise deployments\",\"An XML-based federation protocol given current best practices\"],\"correct\":1,\"explanation\":\"OAuth 2.0 is delegated AUTHORISATION \\u2014 it issues access tokens granting scoped resource access. It is NOT an authentication protocol on its own (a common exam trap). OpenID Connect adds an ID token (JWT) on top of OAuth 2.0 for authentication.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://datatracker.ietf.org/doc/html/rfc6749\",\"title\":\"RFC 6749: The OAuth 2.0 Authorization Framework\",\"captured\":\"2026-04-26\"},{\"url\":\"https://www.fortinet.com/resources/cyberglossary/saml-vs-oauth\",\"title\":\"Fortinet: What is SAML vs OAuth?\",\"captured\":\"2026-04-26\"}],\"references\":[\"RFC 6749\"],\"tags\":[\"oauth\",\"authorisation\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D5-013\",\"domain\":5,\"subdomain\":\"5.6 Federation\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST description of OpenID Connect (OIDC)?\",\"choices\":[\"A replacement for OAuth 2.0 given current best practices\",\"An authentication layer built on top of OAuth 2.0 that adds an ID token (JWT) for user authentication\",\"An XML-only protocol across the relevant policy framework across the relevant control set\",\"An on-prem-only protocol across the relevant control set\"],\"correct\":1,\"explanation\":\"OIDC adds an AUTHENTICATION layer on top of OAuth 2.0 \\u2014 the ID token (a JWT) carries identity claims. Choice A is wrong \\u2014 OIDC complements OAuth, never replaces it. Choice C is wrong \\u2014 OIDC uses JSON tokens (JWTs), not XML. Choice D is wrong \\u2014 OIDC works equally well in cloud, on-prem, and mobile. The exam: OAuth = authorisation (delegation); OIDC = authentication (identity) on top of OAuth.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://openid.net/developers/specs/\",\"title\":\"OpenID Connect: Core Specifications\",\"captured\":\"2026-04-26\"},{\"url\":\"https://www.securityjourney.com/post/analysis-of-common-federated-identity-protocols-openid-connect-vs-oauth-2.0-vs-saml-2.0\",\"title\":\"SecurityJourney: OpenID Connect vs OAuth 2.0 vs SAML 2.0\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"oidc\",\"jwt\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D5-014\",\"domain\":5,\"subdomain\":\"5.5 RADIUS\",\"difficulty\":\"medium\",\"stem\":\"Which protocol encrypts ONLY the password field and uses UDP, traditionally used for network device AAA?\",\"choices\":[\"RADIUS\",\"TACACS+\",\"Diameter\",\"Kerberos\"],\"correct\":0,\"explanation\":\"RADIUS (RFC 2865) uses UDP and only encrypts the password attribute. TACACS+ encrypts the entire payload over TCP. Diameter is the next-gen protocol with stronger transport security. Kerberos is unrelated to network AAA. CISSP frequently tests these distinctions.\",\"source\":\"guide\",\"guide_pages\":[1795,1800],\"guide_section\":\"Chapter 14 \\u2014 RADIUS\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-5-identity-and-access-management-iam/\",\"title\":\"DestCert: CISSP Domain 5 \\u2014 Identity & Access Management\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"radius\"],\"notes\":\"\",\"chapter\":13},{\"id\":\"D5-015\",\"domain\":5,\"subdomain\":\"5.5 TACACS+\",\"difficulty\":\"medium\",\"stem\":\"Which protocol provides full payload encryption AND separation of authentication, authorisation, and accounting?\",\"choices\":[\"RADIUS\",\"TACACS+\",\"Kerberos\",\"LDAP\"],\"correct\":1,\"explanation\":\"TACACS+ (Cisco/IETF) encrypts the entire packet body over TCP and separates A/A/A \\u2014 beneficial for granular command authorisation on network devices. RADIUS combines AuthN+AuthZ and only encrypts password. Kerberos and LDAP serve different purposes.\",\"source\":\"guide\",\"guide_pages\":[1797,1802],\"guide_section\":\"Chapter 14 \\u2014 TACACS+\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-5-identity-and-access-management-iam/\",\"title\":\"DestCert: CISSP Domain 5 \\u2014 Identity & Access Management\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"tacacs\"],\"notes\":\"\",\"chapter\":13},{\"id\":\"D5-016\",\"domain\":5,\"subdomain\":\"5.7 Account Lockout\",\"difficulty\":\"medium\",\"stem\":\"Per modern NIST SP 800-63B guidance, which password practice is NOT recommended?\",\"choices\":[\"Block known-breached passwords\",\"Allow long passphrases up to 64 characters\",\"Periodic forced password expiration without cause\",\"Avoid composition rules (mixed case, special chars)\"],\"correct\":2,\"explanation\":\"NIST 800-63B explicitly removed periodic forced expiration as a default \\u2014 research showed it pushes users toward predictable patterns. Forced rotation is justified ONLY on suspicion of compromise. Long passphrases, breached-password checks, and dropping composition rules are recommended.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://csrc.nist.gov/pubs/sp/800/63/3/final\",\"title\":\"NIST SP 800-63-3: Digital Identity Guidelines\",\"captured\":\"2026-04-26\"}],\"references\":[\"NIST SP 800-63B\"],\"tags\":[\"passwords\",\"nist-800-63b\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D5-017\",\"domain\":5,\"subdomain\":\"5.7 Authentication\",\"difficulty\":\"medium\",\"stem\":\"Which authentication factor type is generally considered LEAST secure on its own?\",\"choices\":[\"Hardware token (FIDO2)\",\"SMS-based one-time password\",\"Push notification with number-matching\",\"Biometric on a TPM-backed device\"],\"correct\":1,\"explanation\":\"SMS OTP is vulnerable to SIM swap and SS7 attacks; NIST 800-63B classifies SMS as RESTRICTED (not banned, but discouraged). FIDO2 is the strongest. Number-matching push reduces fatigue attacks. TPM-backed biometrics are also strong.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://csrc.nist.gov/pubs/sp/800/63/3/final\",\"title\":\"NIST SP 800-63-3: Digital Identity Guidelines\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"sms-otp\",\"weak-mfa\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D5-018\",\"domain\":5,\"subdomain\":\"5.4 Privilege\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST mitigation for the risk of long-standing privileged accounts?\",\"choices\":[\"Generate stronger passwords\",\"Just-In-Time (JIT) elevation\",\"Disable MFA\",\"Allow shared admin accounts for convenience\"],\"correct\":1,\"explanation\":\"JIT access removes standing privilege \\u2014 admins request elevation, get it for a bounded window, and lose it after. PAM tools enforce this. Stronger passwords help but standing privilege remains exposed. Disabling MFA and shared accounts are anti-patterns.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://thorteaches.com/glossary/just-in-time-jit-access/\",\"title\":\"ThorTeaches: Just-in-Time (JIT) access glossary\",\"captured\":\"2026-04-26\"},{\"url\":\"https://www.cyberark.com/what-is/just-in-time-access/\",\"title\":\"CyberArk: What is Just-In-Time Access?\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"jit\",\"privileged-access\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D5-019\",\"domain\":5,\"subdomain\":\"5.4 PAM\",\"difficulty\":\"medium\",\"stem\":\"Which is the PRIMARY purpose of a Privileged Access Management (PAM) solution?\",\"choices\":[\"Manage end-user passwords as a baseline configuration under typical operating conditions\",\"Vault privileged credentials, broker sessions, record activity, and rotate secrets automatically\",\"Replace the directory server in most enterprise deployments\",\"Generate audit reports for HR in standard practice\"],\"correct\":1,\"explanation\":\"PAM provides credential vaulting, session brokering with recording, and automatic rotation \\u2014 the core controls for privileged accounts. End-user passwords are managed by IDPs / authenticators. Choices C and D misunderstand PAM scope.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://www.cyberark.com/what-is/just-in-time-access/\",\"title\":\"CyberArk: What is Just-In-Time Access?\",\"captured\":\"2026-04-26\"},{\"url\":\"https://destcert.com/resources/cissp-domain-5-identity-and-access-management-iam/\",\"title\":\"DestCert: CISSP Domain 5 \\u2014 Identity & Access Management\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"pam\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D5-020\",\"domain\":5,\"subdomain\":\"5.5 SSO\",\"difficulty\":\"medium\",\"stem\":\"Which is a PRIMARY risk of single sign-on (SSO)?\",\"choices\":[\"Slow login times in most operational contexts in standard practice\",\"Compromise of the SSO credentials grants attackers access to all federated applications\",\"Higher licensing cost only under typical operating conditions\",\"Reduced user friction in most enterprise deployments\"],\"correct\":1,\"explanation\":\"SSO concentrates risk: one credential compromise pivots to many resources. Mitigations include MFA, conditional access, anomaly detection, short session lifetimes, and step-up authentication for sensitive actions. Friction reduction is a benefit, not a risk.\",\"source\":\"guide\",\"guide_pages\":[1820,1825],\"guide_section\":\"Chapter 14 \\u2014 SSO\",\"web_sources\":[{\"url\":\"https://www.examcollection.com/blog/comprehensive-guide-to-single-sign-on-sso-for-cissp/\",\"title\":\"ExamCollection: Comprehensive Guide to SSO for CISSP\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"sso\",\"risk\"],\"notes\":\"\",\"chapter\":13},{\"id\":\"D5-021\",\"domain\":5,\"subdomain\":\"5.6 Federation\",\"difficulty\":\"easy\",\"stem\":\"In a SAML federation, which entity is the IdP (Identity Provider)?\",\"choices\":[\"The application the user wants to access\",\"The system that authenticates the user and issues SAML assertions\",\"The user's browser across the relevant policy framework\",\"The Certificate Authority\"],\"correct\":1,\"explanation\":\"The IdP authenticates the user (e.g., Okta, Azure AD). The application is the Service Provider (SP) which trusts the IdP's assertions. The browser carries assertions in HTTP-POST/Redirect bindings. The CA may issue signing certs but is not the IdP.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/federated-identity-management/\",\"title\":\"DestCert: Federated Identity Management \\u2014 Extensive CISSP Guide\",\"captured\":\"2026-04-26\"},{\"url\":\"https://cissprep.net/federation-and-saml/\",\"title\":\"CISSPrep: Federation and SAML\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"saml\",\"idp\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D5-022\",\"domain\":5,\"subdomain\":\"5.4 RBAC\",\"difficulty\":\"medium\",\"stem\":\"Which RBAC concept enforces that two specified roles cannot be assigned to the same user (e.g., a user cannot be both 'requester' and 'approver')?\",\"choices\":[\"Role hierarchy\",\"Static separation of duty (SSoD)\",\"Dynamic separation of duty (DSoD)\",\"Constrained delegation\"],\"correct\":1,\"explanation\":\"SSoD prevents conflicting roles from being assigned to the same user at provisioning time. DSoD permits assignment but blocks simultaneous activation in one session (e.g., a user can have both roles but cannot activate them together). Hierarchy and delegation are different concepts.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-5-identity-and-access-management-iam/\",\"title\":\"DestCert: CISSP Domain 5 \\u2014 Identity & Access Management\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"rbac\",\"ssod\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D5-023\",\"domain\":5,\"subdomain\":\"5.6 Federation\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST mitigation for a SAML attack where attackers manipulate signed assertions due to XML signature wrapping flaws?\",\"choices\":[\"Disable XML signatures given current best practices\",\"Validate the signed element specifically AND verify the signature covers the asserting identity claims\",\"Trust all incoming assertions under typical operating conditions\",\"Use plain HTTP under typical compliance requirements in most enterprise deployments\"],\"correct\":1,\"explanation\":\"XSW (XML Signature Wrapping) attacks exploit parsers that validate one element while consuming another. Mitigation: validate signed element identity explicitly; use modern libraries; restrict to expected elements. Disabling signatures or trusting blindly defeats security entirely.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/federated-identity-management/\",\"title\":\"DestCert: Federated Identity Management \\u2014 Extensive CISSP Guide\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"saml\",\"xsw\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D5-024\",\"domain\":5,\"subdomain\":\"5.7 Session Mgmt\",\"difficulty\":\"medium\",\"stem\":\"Which session management practice MOST reduces session-fixation risk?\",\"choices\":[\"Reuse session IDs across logins\",\"Generate a NEW session ID on authentication and on privilege change\",\"Pin sessions to source IP only\",\"Make sessions never expire across the relevant policy framework\"],\"correct\":1,\"explanation\":\"Regenerating session IDs on auth/privilege escalation defeats session fixation (where the attacker plants a known session ID and convinces the victim to authenticate into it). IP pinning is brittle (mobile users); never-expiring sessions are dangerous; reuse is the vulnerability itself.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://owasp.org/www-project-top-ten/\",\"title\":\"OWASP Top Ten Project\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"session-fixation\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D5-025\",\"domain\":5,\"subdomain\":\"5.2 Biometrics\",\"difficulty\":\"easy\",\"stem\":\"What is the CROSSOVER ERROR RATE (CER or EER) of a biometric system?\",\"choices\":[\"The point where false acceptance and false rejection rates are equal\",\"The maximum FAR allowed by policy in standard practice\",\"The number of biometric templates stored when properly implemented\",\"The accuracy of liveness detection when properly implemented\"],\"correct\":0,\"explanation\":\"CER/EER is the equal-error point \\u2014 the lower it is, the more accurate the biometric. FAR (false acceptance) and FRR (false rejection) trade off; the CER is the operating point where they cross. The other choices are unrelated.\",\"source\":\"guide\",\"guide_pages\":[1700,1705],\"guide_section\":\"Chapter 13 \\u2014 Biometrics\",\"web_sources\":[{\"url\":\"https://cissprep.net/access-control-systems-multifactor-authentication-and-biometrics/\",\"title\":\"CISSPrep: Access Control Systems, MFA & Biometrics\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"biometrics\",\"cer\"],\"notes\":\"\",\"chapter\":12},{\"id\":\"D5-026\",\"domain\":5,\"subdomain\":\"5.2 Biometrics\",\"difficulty\":\"medium\",\"stem\":\"Which biometric error type is MOST critical to MINIMISE in a high-security environment?\",\"choices\":[\"FRR (false rejection)\",\"FAR (false acceptance)\",\"Throughput rate\",\"Sensor cost\"],\"correct\":1,\"explanation\":\"FAR (admitting an unauthorised user) is the security failure mode \\u2014 must be minimised in high-security settings, even at the cost of higher FRR (legitimate users rejected). The exam tests this trade-off; you can re-attempt as a legitimate user, but a false acceptance is a breach.\",\"source\":\"guide\",\"guide_pages\":[1701,1706],\"guide_section\":\"Chapter 13 \\u2014 Biometrics\",\"web_sources\":[{\"url\":\"https://cissprep.net/access-control-systems-multifactor-authentication-and-biometrics/\",\"title\":\"CISSPrep: Access Control Systems, MFA & Biometrics\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"far\",\"biometrics\"],\"notes\":\"\",\"chapter\":12},{\"id\":\"D5-027\",\"domain\":5,\"subdomain\":\"5.4 ABAC\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST example of an attribute-based access control rule?\",\"choices\":[\"Allow users in the 'Admin' role as a baseline configuration across the relevant control set\",\"Allow access only if user.dept = resource.dept AND time between 0800-1800 AND device is managed\",\"Allow all internal users by default for the purposes of this question\",\"Allow access if user has a password for the purposes of this question\"],\"correct\":1,\"explanation\":\"ABAC combines multiple attributes \\u2014 user, resource, environment \\u2014 into the policy decision. Choice A is RBAC. Choice C is open/permissive. Choice D is bare authentication, not authorisation. ABAC is what XACML, AWS IAM policies, and Azure AD conditional access implement.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-5-identity-and-access-management-iam/\",\"title\":\"DestCert: CISSP Domain 5 \\u2014 Identity & Access Management\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"abac\",\"policy\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D5-028\",\"domain\":5,\"subdomain\":\"5.5 Kerberos\",\"difficulty\":\"medium\",\"stem\":\"Which attack pattern targets Kerberos by requesting service tickets for high-privilege accounts and offline cracking the encrypted portion?\",\"choices\":[\"Pass-the-Hash\",\"Kerberoasting\",\"Golden Ticket\",\"DCSync\"],\"correct\":1,\"explanation\":\"Kerberoasting requests TGS tickets for service accounts (which encrypt with the service's NTLM hash) and offline-cracks the ciphertext to recover the service password. Mitigations: long random service account passwords, gMSAs (group Managed Service Accounts), rotation. Pass-the-Hash, Golden Ticket, and DCSync are different AD attacks.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-5-identity-and-access-management-iam/\",\"title\":\"DestCert: CISSP Domain 5 \\u2014 Identity & Access Management\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"kerberoasting\",\"ad-attacks\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D5-029\",\"domain\":5,\"subdomain\":\"5.5 Kerberos\",\"difficulty\":\"medium\",\"stem\":\"Which Kerberos attack uses the KRBTGT account hash to forge arbitrary TGTs that grant impersonation of any user?\",\"choices\":[\"Pass-the-Hash\",\"Kerberoasting\",\"Golden Ticket\",\"Silver Ticket\"],\"correct\":2,\"explanation\":\"Golden Ticket attacks use the KRBTGT password hash (often retrieved via DCSync) to mint arbitrary TGTs \\u2014 full domain compromise. Silver Tickets forge service tickets for individual services. Pass-the-Hash uses NTLM hashes. KRBTGT must be rotated TWICE consecutively to invalidate forged tickets.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-5-identity-and-access-management-iam/\",\"title\":\"DestCert: CISSP Domain 5 \\u2014 Identity & Access Management\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"golden-ticket\",\"krbtgt\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D5-030\",\"domain\":5,\"subdomain\":\"5.6 Identity Stores\",\"difficulty\":\"medium\",\"stem\":\"Which protocol is COMMONLY used to query a directory server (e.g., Active Directory) for user/group attributes?\",\"choices\":[\"LDAP\",\"SMTP\",\"FTP\",\"NTP\"],\"correct\":0,\"explanation\":\"LDAP (and its secure variant LDAPS over TLS) is the standard directory access protocol. Active Directory uses LDAP on port 389/636. SMTP, FTP, and NTP are unrelated. Note: LDAP without TLS exposes credentials and queries in cleartext.\",\"source\":\"guide\",\"guide_pages\":[1768,1772],\"guide_section\":\"Chapter 13 \\u2014 LDAP\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-5-identity-and-access-management-iam/\",\"title\":\"DestCert: CISSP Domain 5 \\u2014 Identity & Access Management\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"ldap\"],\"notes\":\"\",\"chapter\":13},{\"id\":\"D5-031\",\"domain\":5,\"subdomain\":\"5.7 Account Lockout\",\"difficulty\":\"easy\",\"stem\":\"Per NIST SP 800-63B, which account lockout configuration is recommended?\",\"choices\":[\"Lock after 3 attempts for 24 hours when properly implemented\",\"Lock after a small number of failed attempts with throttling, while supporting offline attack defenses\",\"Never lock \\u2014 let users retry forever across the relevant control set\",\"Permanent lock after 5 attempts given current best practices\"],\"correct\":1,\"explanation\":\"NIST 800-63B recommends rate-limiting and lockouts that are not so aggressive they enable trivial DoS \\u2014 combined with breach-password blocking and other defenses. Choice A is overly punitive; C provides no defense; D enables DoS through targeted lockouts.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://csrc.nist.gov/pubs/sp/800/63/3/final\",\"title\":\"NIST SP 800-63-3: Digital Identity Guidelines\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"lockout\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D5-032\",\"domain\":5,\"subdomain\":\"5.4 DAC\",\"difficulty\":\"medium\",\"stem\":\"Which access control model lets the owner of an object grant access at their discretion?\",\"choices\":[\"DAC\",\"MAC\",\"RBAC\",\"ABAC\"],\"correct\":0,\"explanation\":\"DAC (Discretionary Access Control) gives the data owner full control of who gets access \\u2014 typical of file systems via ACLs (e.g., Unix permissions, Windows NTFS). MAC removes that discretion in favor of system-enforced labels. RBAC and ABAC use other policy bases.\",\"source\":\"guide\",\"guide_pages\":[1705,1710],\"guide_section\":\"Chapter 14 \\u2014 DAC\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-5-identity-and-access-management-iam/\",\"title\":\"DestCert: CISSP Domain 5 \\u2014 Identity & Access Management\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"dac\"],\"notes\":\"\",\"chapter\":12},{\"id\":\"D5-033\",\"domain\":5,\"subdomain\":\"5.6 Federation\",\"difficulty\":\"easy\",\"stem\":\"What is a JWT (JSON Web Token)?\",\"choices\":[\"A binary key-exchange format in most enterprise deployments\",\"A compact, URL-safe, signed JSON token used for transmitting claims between parties\",\"A backup format given current best practices\",\"A binary OIDC code in standard practice\"],\"correct\":1,\"explanation\":\"JWT (RFC 7519) is the JSON-based token format used in OIDC and many OAuth 2.0 flows. Compact (base64url-encoded), URL-safe, signed (JWS) or encrypted (JWE). Choice A is wrong \\u2014 JWTs are text, not binary. Choice C (backup format) is invented. Choice D \\u2014 JWTs are not specifically OIDC and not binary. Common pitfalls: don't store secrets in JWT (it's decodable), validate the alg (beware 'none'), enforce expiry.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://openid.net/developers/specs/\",\"title\":\"OpenID Connect: Core Specifications\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"jwt\",\"oidc\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D5-034\",\"domain\":5,\"subdomain\":\"5.6 Federation\",\"difficulty\":\"medium\",\"stem\":\"Which OAuth 2.0 grant type is RECOMMENDED for native and single-page apps to mitigate authorization-code interception?\",\"choices\":[\"Implicit grant\",\"Authorization Code with PKCE\",\"Resource Owner Password Credentials\",\"Client Credentials only\"],\"correct\":1,\"explanation\":\"PKCE (RFC 7636) prevents code interception attacks against public clients (mobile apps, SPAs). The Implicit grant is deprecated. ROPC sends user passwords through the client (anti-pattern). Client Credentials is for service-to-service.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://datatracker.ietf.org/doc/html/rfc6749\",\"title\":\"RFC 6749: The OAuth 2.0 Authorization Framework\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"oauth\",\"pkce\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D5-035\",\"domain\":5,\"subdomain\":\"5.7 NIST 800-63\",\"difficulty\":\"medium\",\"stem\":\"Per NIST SP 800-63, which of the following BEST corresponds to AAL3 (highest authenticator assurance)?\",\"choices\":[\"Single-factor password in standard practice\",\"Memorised secret + SMS OTP in commonly cited frameworks\",\"Hardware-based cryptographic authenticator providing verifier-impersonation resistance\",\"Knowledge-based questions in commonly cited frameworks\"],\"correct\":2,\"explanation\":\"AAL3 requires hardware-backed cryptographic authenticators with verifier-impersonation resistance. FIDO2/WebAuthn is the modern consumer-grade answer; PIV/CAC smart cards have met AAL3 since the standard was first published and remain the dominant federal AAL3 authenticator. Choice A (single-factor password) is AAL1. Choice B (password + SMS OTP) is AAL2 at best \\u2014 SMS is in fact RESTRICTED in 800-63B because of SS7 / SIM-swap risk. Choice D (knowledge-based questions) doesn't qualify at any AAL \\u2014 800-63B explicitly discourages KBA.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://csrc.nist.gov/pubs/sp/800/63/3/final\",\"title\":\"NIST SP 800-63-3: Digital Identity Guidelines\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"aal3\",\"fido2\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D5-036\",\"domain\":5,\"subdomain\":\"5.4 Models\",\"difficulty\":\"easy\",\"stem\":\"What is rule-based access control?\",\"choices\":[\"A list of users with permissions in standard practice\",\"Access decisions based on a set of system-wide rules, independent of identity\",\"Access based on hierarchical roles in commonly cited frameworks\",\"Access based on owner discretion in standard practice\"],\"correct\":1,\"explanation\":\"Rule-Based Access Control (RuBAC) applies system-wide rules (often IF-THEN) regardless of user identity \\u2014 firewall ACLs, time-of-day restrictions, geo-fencing. Choice A describes a simple ACL but lacks the system-wide rule concept. Choice C is RBAC (Role-Based, identity-driven). Choice D is DAC (Discretionary, owner-driven). Note the subtle distinction: RuBAC is rule-based, RBAC is role-based \\u2014 exam writers love this trap.\",\"source\":\"guide\",\"guide_pages\":[1717,1720],\"guide_section\":\"Chapter 14 \\u2014 Rule-Based\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-5-identity-and-access-management-iam/\",\"title\":\"DestCert: CISSP Domain 5 \\u2014 Identity & Access Management\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"rule-based\"],\"notes\":\"\",\"chapter\":12},{\"id\":\"D5-037\",\"domain\":5,\"subdomain\":\"5.7 Authentication\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST description of a 'risk-based' or 'adaptive' authentication strategy?\",\"choices\":[\"Always require MFA for everyone\",\"Vary authentication strength based on context\",\"Skip authentication for trusted users\",\"Use only passwords\"],\"correct\":1,\"explanation\":\"Adaptive auth steps up requirements (push challenge, MFA, biometric) when risk signals fire \\u2014 anomalous IP, new device, unusual time, sensitive resource. Always-MFA is fine but not adaptive; skipping auth is dangerous; passwords-only is weak.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-5-identity-and-access-management-iam/\",\"title\":\"DestCert: CISSP Domain 5 \\u2014 Identity & Access Management\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"adaptive-auth\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D5-038\",\"domain\":5,\"subdomain\":\"5.6 Federation\",\"difficulty\":\"medium\",\"stem\":\"Which protocol is BEST for AAA against network access devices (switches, firewalls) that need granular per-command authorisation?\",\"choices\":[\"RADIUS\",\"TACACS+\",\"OAuth 2.0\",\"SAML\"],\"correct\":1,\"explanation\":\"TACACS+ supports per-command authorisation and full payload encryption \\u2014 preferred for network device administrative access. RADIUS combines authn+authz and is more common for end-user network access. OAuth/SAML target user-facing applications.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-5-identity-and-access-management-iam/\",\"title\":\"DestCert: CISSP Domain 5 \\u2014 Identity & Access Management\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"tacacs\",\"command-authz\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D5-039\",\"domain\":5,\"subdomain\":\"5.3 Lifecycle\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST single control to prevent former employees from retaining access to corporate systems?\",\"choices\":[\"Manual quarterly access reviews\",\"Automated deprovisioning triggered by HR termination event with same-day account disable\",\"Self-service access removal\",\"Periodic password rotation for general production deployments\"],\"correct\":1,\"explanation\":\"HR-triggered automated deprovisioning at the moment of termination closes the account-orphaning window definitively. Manual reviews leave gaps. Self-service deprovisioning is rare and unreliable. Password rotation alone leaves accounts active.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-5-identity-and-access-management-iam/\",\"title\":\"DestCert: CISSP Domain 5 \\u2014 Identity & Access Management\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"deprovisioning\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D5-040\",\"domain\":5,\"subdomain\":\"5.5 Kerberos\",\"difficulty\":\"easy\",\"stem\":\"Which is REQUIRED for Kerberos to function correctly in a network?\",\"choices\":[\"IPv6 only\",\"Tightly synchronised time\",\"BGP between domain controllers\",\"Layer-2 broadcast domain\"],\"correct\":1,\"explanation\":\"Kerberos uses TIME-BOUND tickets \\u2014 clock skew beyond ~5 minutes (default) breaks authentication, so NTP synchronisation across all participants is essential. Choice A is wrong \\u2014 Kerberos is IP-version-agnostic. Choice C is unrelated (BGP is for inter-AS routing, not internal directory traffic). Choice D is wrong \\u2014 domain controllers can be on different L2 segments as long as they can route to each other and reach the KDC.\",\"source\":\"guide\",\"guide_pages\":[1788,1792],\"guide_section\":\"Chapter 14 \\u2014 Kerberos Time\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-5-identity-and-access-management-iam/\",\"title\":\"DestCert: CISSP Domain 5 \\u2014 Identity & Access Management\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"kerberos\",\"time-sync\"],\"notes\":\"\",\"chapter\":13},{\"id\":\"D5-041\",\"domain\":5,\"subdomain\":\"5.6 Federation\",\"difficulty\":\"medium\",\"stem\":\"Which is the PRIMARY benefit of federation between two organisations?\",\"choices\":[\"Shared infrastructure costs across the relevant control set\",\"Users authenticate to their home organisation; the partner organisation trusts the assertion\",\"Faster network connectivity across the relevant control set\",\"Eliminates the need for any access control when properly implemented\"],\"correct\":1,\"explanation\":\"Federation removes the need to provision separate accounts at each partner \\u2014 users continue using their home credentials, with assertions exchanged between IdPs and SPs. Choice C and D are unrelated; choice A may be incidental but is not the primary benefit.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/federated-identity-management/\",\"title\":\"DestCert: Federated Identity Management \\u2014 Extensive CISSP Guide\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"federation\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D5-042\",\"domain\":5,\"subdomain\":\"5.3 Provisioning\",\"difficulty\":\"medium\",\"stem\":\"Which standard provides a schema and protocol for cross-domain identity management (provisioning)?\",\"choices\":[\"SAML\",\"OAuth\",\"SCIM\",\"OIDC\"],\"correct\":2,\"explanation\":\"SCIM (System for Cross-domain Identity Management, RFC 7644) standardises user provisioning between IdPs and SaaS providers. SAML/OIDC handle authentication; OAuth handles delegated authorisation. SCIM closes the provisioning lifecycle gap.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-5-identity-and-access-management-iam/\",\"title\":\"DestCert: CISSP Domain 5 \\u2014 Identity & Access Management\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"scim\",\"provisioning\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D5-043\",\"domain\":5,\"subdomain\":\"5.7 MFA Bypass\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST mitigation for MFA push-bombing / fatigue attacks?\",\"choices\":[\"Disable MFA in standard practice\",\"Number-matching prompts and rate-limiting on push challenges\",\"Permanent push acceptance given current best practices\",\"Use SMS exclusively in commonly cited frameworks\"],\"correct\":1,\"explanation\":\"Number-matching (user types a number shown on the login screen into the authenticator) defeats blind acceptance during fatigue attacks. Rate-limiting suppresses storming. Disabling MFA, permanent acceptance, and SMS-only are weakening choices.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-5-identity-and-access-management-iam/\",\"title\":\"DestCert: CISSP Domain 5 \\u2014 Identity & Access Management\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"push-bombing\",\"number-matching\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D5-044\",\"domain\":5,\"subdomain\":\"5.4 Authorisation\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST approach to authorise an end user calling a microservice that itself calls multiple downstream services?\",\"choices\":[\"Re-prompt the user at each downstream call\",\"Forward the user's bearer token via OAuth 2.0 Token Exchange or constrained delegation\",\"Use a single shared admin token under typical compliance requirements\",\"Skip authorisation between internal services\"],\"correct\":1,\"explanation\":\"Token Exchange (RFC 8693) or service-to-service delegation maintains the user context downstream while limiting scope. Shared admin tokens lose context and over-privilege. Skipping internal authorisation violates zero-trust. Re-prompting is unworkable.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-5-identity-and-access-management-iam/\",\"title\":\"DestCert: CISSP Domain 5 \\u2014 Identity & Access Management\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"token-exchange\",\"delegation\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D5-045\",\"domain\":5,\"subdomain\":\"5.5 Centralized vs Decentralized\",\"difficulty\":\"medium\",\"stem\":\"Which is the PRIMARY benefit of centralized authentication vs. each application managing its own user store?\",\"choices\":[\"Cheaper licensing only in most enterprise deployments\",\"Consistent policy enforcement, single source of truth, simpler deprovisioning, and federated SSO\",\"Lower availability across the relevant control set\",\"More privileged accounts in standard practice\"],\"correct\":1,\"explanation\":\"Centralization (via IdP) means one policy, one source of truth, and one deprovisioning path \\u2014 operationally and security-wise superior to per-app silos. Choice A is incidental; choice C is wrong (HA is critical); choice D is the opposite of intent.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-5-identity-and-access-management-iam/\",\"title\":\"DestCert: CISSP Domain 5 \\u2014 Identity & Access Management\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"centralized-auth\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D5-046\",\"domain\":5,\"subdomain\":\"5.7 Authentication\",\"difficulty\":\"medium\",\"stem\":\"Which authentication mechanism uses a secret derived from a synchronised counter or time, NOT requiring server connectivity to verify?\",\"choices\":[\"SMS OTP\",\"TOTP / HOTP\",\"Push notifications\",\"FIDO2\"],\"correct\":1,\"explanation\":\"TOTP (RFC 6238) and HOTP (RFC 4226) generate codes from a shared secret + time/counter \\u2014 verifier checks locally. SMS requires telecom delivery. Push needs a back-channel. FIDO2 uses asymmetric crypto with the verifier. TOTP is widely deployed via Authenticator apps.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://csrc.nist.gov/pubs/sp/800/63/3/final\",\"title\":\"NIST SP 800-63-3: Digital Identity Guidelines\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"totp\",\"hotp\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D5-047\",\"domain\":5,\"subdomain\":\"5.4 Privilege\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST description of the principle of least privilege?\",\"choices\":[\"Users have the maximum needed for their entire career\",\"Users have only the minimum permissions required for their CURRENT task or role\",\"Users have administrative rights to be productive\",\"All users have equal access\"],\"correct\":1,\"explanation\":\"Least privilege grants only what is needed RIGHT NOW for the role \\u2014 combined with periodic review and JIT for elevation. Choices A, C, D contradict the principle. Saltzer & Schroeder formalised it as a foundational secure-design principle.\",\"source\":\"guide\",\"guide_pages\":[1722,1725],\"guide_section\":\"Chapter 14 \\u2014 Least Privilege\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-5-identity-and-access-management-iam/\",\"title\":\"DestCert: CISSP Domain 5 \\u2014 Identity & Access Management\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"least-privilege\"],\"notes\":\"\",\"chapter\":12},{\"id\":\"D5-048\",\"domain\":5,\"subdomain\":\"5.7 Recovery\",\"difficulty\":\"medium\",\"stem\":\"Which credential-recovery mechanism is GENERALLY the WEAKEST link in account security?\",\"choices\":[\"FIDO2 backup token\",\"Knowledge-based questions (e.g., mother's maiden name)\",\"Recovery codes printed at enrollment\",\"Verified email + step-up MFA\"],\"correct\":1,\"explanation\":\"Knowledge-based recovery questions are widely guessable from social media or breach data \\u2014 multiple high-profile compromises (e.g., 2008 Palin Yahoo breach) used them. NIST 800-63B discourages KBA. Backup tokens, recovery codes, and verified-email + MFA are stronger.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://csrc.nist.gov/pubs/sp/800/63/3/final\",\"title\":\"NIST SP 800-63-3: Digital Identity Guidelines\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"kba\",\"recovery\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D5-049\",\"domain\":5,\"subdomain\":\"5.6 Federation\",\"difficulty\":\"medium\",\"stem\":\"Which is the PRIMARY purpose of an entity's metadata in SAML federation?\",\"choices\":[\"Logging in standard practice\",\"Publishing endpoints, certificates, and supported bindings so the partner can validate and route messages\",\"Providing user training in standard practice\",\"Defining business hours in most enterprise deployments\"],\"correct\":1,\"explanation\":\"SAML metadata (XML document) declares the entity's endpoints, signing/encryption certificates, name ID formats, and supported bindings \\u2014 both IdP and SP exchange metadata to establish trust mechanically. Choice A (logging) is a runtime concern, not metadata. Choice C (user training) isn't a SAML artefact. Choice D (business hours) is operational. The exam: metadata = the federation 'business card' that enables protocol interoperation.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/federated-identity-management/\",\"title\":\"DestCert: Federated Identity Management \\u2014 Extensive CISSP Guide\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"saml-metadata\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D5-050\",\"domain\":5,\"subdomain\":\"5.4 Privilege\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST way to manage shared privileged accounts that genuinely cannot be eliminated (e.g., legacy database accounts)?\",\"choices\":[\"Document them in a wiki as a baseline configuration across the relevant control set\",\"Vault credentials in PAM, broker each session with individual user attribution and recording, rotate after each use\",\"Allow team members to share via chat across the relevant control set\",\"Disable logging to avoid bloat in commonly cited frameworks\"],\"correct\":1,\"explanation\":\"PAM with check-out, session brokering, attribution, recording, and post-use rotation provides accountability where the underlying account cannot be made user-specific. Documentation alone provides no control; sharing in chat is dangerous; disabling logging removes audit trail.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://www.cyberark.com/what-is/just-in-time-access/\",\"title\":\"CyberArk: What is Just-In-Time Access?\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"shared-account\",\"pam\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D5-051\",\"domain\":5,\"subdomain\":\"5.5 Kerberos\",\"difficulty\":\"easy\",\"stem\":\"Which is REQUIRED to validate a Kerberos service ticket?\",\"choices\":[\"The client's password\",\"The service's secret\",\"A Diffie-Hellman exchange\",\"An OCSP response\"],\"correct\":1,\"explanation\":\"The service uses its long-term secret (derived from its account password) to decrypt the service ticket and verify integrity. Long, random service-account passwords (or gMSAs) defend against Kerberoasting. The client password is not used at this step.\",\"source\":\"guide\",\"guide_pages\":[1782,1786],\"guide_section\":\"Chapter 14 \\u2014 Service Tickets\",\"web_sources\":[{\"url\":\"https://datatracker.ietf.org/doc/html/rfc4120\",\"title\":\"RFC 4120: The Kerberos Network Authentication Service (V5)\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"kerberos\",\"service-ticket\"],\"notes\":\"\",\"chapter\":13},{\"id\":\"D5-052\",\"domain\":5,\"subdomain\":\"5.6 Federation\",\"difficulty\":\"easy\",\"stem\":\"Which standard defines the SAML SP-Initiated Single Sign-On flow?\",\"choices\":[\"RFC 6749\",\"OASIS SAML 2.0 Web Browser SSO Profile\",\"RFC 4120 when properly implemented\",\"FIDO Alliance CTAP\"],\"correct\":1,\"explanation\":\"OASIS (not IETF) standardised SAML 2.0, including the Web Browser SSO Profile that defines both SP-Initiated and IdP-Initiated flows. Choice A (RFC 6749) is OAuth 2.0 \\u2014 different protocol entirely. Choice C (RFC 4120) is Kerberos. Choice D (CTAP) is the FIDO2 Client-to-Authenticator Protocol. Memorise the source body: SAML = OASIS, OAuth/OIDC = IETF/OpenID, Kerberos = IETF, FIDO = FIDO Alliance.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/federated-identity-management/\",\"title\":\"DestCert: Federated Identity Management \\u2014 Extensive CISSP Guide\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"saml\",\"sp-initiated\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D6-001\",\"domain\":6,\"subdomain\":\"6.1 Test Strategies\",\"difficulty\":\"medium\",\"stem\":\"Which testing technique inspects SOURCE CODE for security flaws WITHOUT running the application?\",\"choices\":[\"DAST\",\"SAST\",\"IAST\",\"Fuzzing\"],\"correct\":1,\"explanation\":\"SAST (Static Application Security Testing) analyses source/bytecode without execution \\u2014 finding flaws like SQL injection patterns, hardcoded credentials, or insecure APIs. DAST runs against a running app. IAST instruments the running app. Fuzzing sends malformed inputs.\",\"source\":\"guide\",\"guide_pages\":[1880,1885],\"guide_section\":\"Chapter 15 \\u2014 SAST\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-6-security-assessment-and-testing/\",\"title\":\"DestCert: CISSP Domain 6 \\u2014 Security Assessment & Testing\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"sast\",\"static\"],\"notes\":\"\",\"chapter\":14},{\"id\":\"D6-002\",\"domain\":6,\"subdomain\":\"6.1 Test Strategies\",\"difficulty\":\"medium\",\"stem\":\"Which testing technique exercises a RUNNING application from the outside, sending HTTP requests and observing responses?\",\"choices\":[\"SAST\",\"DAST\",\"Code review\",\"Compliance scan\"],\"correct\":1,\"explanation\":\"DAST (Dynamic) is black-box-style runtime test

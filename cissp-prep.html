ncrypt the repo for the purposes of this question\"],\"correct\":1,\"explanation\":\"The full mitigation: (1) remove the secret from code, (2) ROTATE the credential immediately (assume compromised \\u2014 git history retains it), (3) move to a secrets manager, (4) scan history for additional leaks, (5) add pre-commit/CI scanning to prevent recurrence. Choice A ('comment them out') leaves them in git history \\u2014 useless. Choice C ('trust git access controls') ignores forks, mirrors, and any prior exposure. Choice D ('encrypt the repo') doesn't address the leak path \\u2014 the secret is already plaintext in commit history.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/cissp-domain-8-software-development-security/\",\"title\":\"DestCert: CISSP Domain 8 \\u2014 Software Development Security Guide 2025\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"hardcoded-credentials\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D8-040\",\"domain\":8,\"subdomain\":\"8.4 SSDF\",\"difficulty\":\"medium\",\"stem\":\"Which NIST publication codifies a Secure Software Development Framework (SSDF) of practices?\",\"choices\":[\"NIST SP 800-115\",\"NIST SP 800-37\",\"NIST SP 800-218 (SSDF)\",\"NIST SP 800-53\"],\"correct\":2,\"explanation\":\"NIST SP 800-218 (SSDF) defines four practice groups: Prepare the Organisation (PO), Protect the Software (PS), Produce Well-Secured Software (PW), Respond to Vulnerabilities (RV). Choice A (800-115) is technical security testing. Choice B (800-37) is the RMF. Choice D (800-53) is the controls catalogue. Memorise the 800-series numbers: 30-risk, 37-RMF, 53-controls, 60-categorisation, 61-IR, 88-sanitisation, 115-testing, 207-zero-trust, 218-SSDF.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://csrc.nist.gov/pubs/sp/800/218/final\",\"title\":\"NIST SP 800-218: Secure Software Development Framework (SSDF)\",\"captured\":\"2026-04-26\"},{\"url\":\"https://www.aikido.dev/learn/compliance/compliance-frameworks/nist-ssdf\",\"title\":\"Aikido: NIST SSDF (SP 800-218) Secure Software Development Explained\",\"captured\":\"2026-04-26\"}],\"references\":[\"NIST SP 800-218\"],\"tags\":[\"ssdf\",\"nist-800-218\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D1-065\",\"domain\":1,\"subdomain\":\"1.5 Frameworks\",\"difficulty\":\"medium\",\"stem\":\"Which function was ADDED in NIST Cybersecurity Framework 2.0 (released February 2024) that did not exist in CSF 1.1?\",\"choices\":[\"Identify\",\"Govern\",\"Detect\",\"Recover\"],\"correct\":1,\"explanation\":\"CSF 2.0 elevated 'Govern' to a sixth core function (joining Identify, Protect, Detect, Respond, Recover from v1.1). Govern covers organizational risk management strategy, roles and responsibilities, supply chain risk, and oversight \\u2014 formalising what was previously scattered across Identify and the Implementation Tiers. Identify, Detect, and Recover all existed in CSF 1.1 \\u2014 they were not added.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://www.nist.gov/cyberframework\",\"title\":\"NIST CSF 2.0\",\"captured\":\"2026-04-26\"}],\"references\":[\"NIST CSF 2.0\"],\"tags\":[\"nist-csf-2\",\"govern\",\"currency-2026\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D1-066\",\"domain\":1,\"subdomain\":\"1.5 Frameworks\",\"difficulty\":\"medium\",\"stem\":\"Under NIST CSF 2.0's Govern function, which is the BEST description of what an organisation must do?\",\"choices\":[\"Implement technical controls only under typical operating conditions\",\"Establish, communicate, and monitor the cybersecurity risk management strategy, expectations, and policy\",\"Replace the CISO function with the CFO under typical operating conditions\",\"Outsource all governance to third-party auditors given current best practices\"],\"correct\":1,\"explanation\":\"Govern in CSF 2.0 establishes WHO is accountable, the risk strategy, supply chain risk management, and the policies that drive everything else. It is fundamentally a leadership/oversight function. Choice A confuses Govern with Protect. Choice C is wrong \\u2014 governance is broader than any single role and must be supported by board-level engagement. Choice D conflates audit (assurance) with governance (direction).\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://www.nist.gov/cyberframework\",\"title\":\"NIST CSF 2.0\",\"captured\":\"2026-04-26\"}],\"references\":[\"NIST CSF 2.0 \\u2014 Govern\"],\"tags\":[\"nist-csf-2\",\"govern\",\"currency-2026\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D7-053\",\"domain\":7,\"subdomain\":\"7.1 IR Lifecycle\",\"difficulty\":\"medium\",\"stem\":\"NIST SP 800-61 Revision 3 (April 2025) reorganises incident response around what concept compared to Revision 2's four-phase lifecycle?\",\"choices\":[\"A single 'Eradicate-then-restore' phase across the relevant control set\",\"Continuous improvement woven through ongoing functions \\u2014 aligned to NIST CSF 2.0\",\"Outsourcing all IR to MSSPs by default given current best practices\",\"A two-phase 'Detect / Respond' model only in most enterprise deployments\"],\"correct\":1,\"explanation\":\"800-61 r3 abandons the strictly-sequential Prep \\u2192 Detect \\u2192 Containment/Eradication/Recovery \\u2192 Post-Incident model. Instead it aligns with CSF 2.0's six functions and emphasises continuous improvement throughout the lifecycle (not just at the end). The four-phase r2 model is still useful conceptually but no longer the framework's primary structure. Choice A invents a phase. Choice C is unrelated to the standard. Choice D oversimplifies.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-61r3.pdf\",\"title\":\"NIST SP 800-61 r3\",\"captured\":\"2026-04-26\"}],\"references\":[\"NIST SP 800-61 r3\"],\"tags\":[\"nist-800-61-r3\",\"currency-2026\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D8-041\",\"domain\":8,\"subdomain\":\"8.4 OWASP Top 10\",\"difficulty\":\"medium\",\"stem\":\"Which is a NEW OWASP Top 10 category introduced in the 2025 release that was NOT in the 2021 release?\",\"choices\":[\"Broken Access Control\",\"Software Supply Chain Failures\",\"Cross-Site Scripting (it was already #3 in 2021)\",\"SQL Injection (split out of Injection)\"],\"correct\":1,\"explanation\":\"OWASP Top 10:2025 elevates Software Supply Chain Failures to its own category (covering build pipeline compromise, malicious dependencies, signed-artefact verification, SBOM hygiene), reflecting the reality of attacks like SolarWinds, 3CX, and the npm package compromises. Broken Access Control was already #1 in 2021. XSS was folded into Injection in 2021. SQL Injection was never split out as its own category in 2025.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://owasp.org/www-project-top-ten/\",\"title\":\"OWASP Top 10\",\"captured\":\"2026-04-26\"}],\"references\":[\"OWASP Top 10:2025\"],\"tags\":[\"owasp-2025\",\"supply-chain\",\"currency-2026\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D1-067\",\"domain\":1,\"subdomain\":\"1.3 Compliance\",\"difficulty\":\"medium\",\"stem\":\"PCI-DSS v4.0 (mandatory March 31, 2025) introduced which significant change from v3.2.1?\",\"choices\":[\"Removed the requirement for cardholder data encryption under typical compliance requirements\",\"Increased password minimum length to 12 characters and introduced 'targeted risk analysis' as an alternative to fixed compliance schedules\",\"Eliminated the requirement for quarterly vulnerability scans\",\"Made all organisations subject to Level 1 audits regardless of transaction volume\"],\"correct\":1,\"explanation\":\"PCI-DSS v4.0 raised password minimums (from 7 to 12 characters for non-customer accounts) and introduced 'customised approach' / targeted risk analysis \\u2014 letting organisations justify alternative control implementations against documented risk rather than meeting prescriptive timetables. Choices A, C, D are false: encryption is still required, scans are still mandatory, and merchant levels are unchanged.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://www.pcisecuritystandards.org/document_library/\",\"title\":\"PCI-DSS v4.0\",\"captured\":\"2026-04-26\"}],\"references\":[\"PCI-DSS v4.0.1\"],\"tags\":[\"pci-dss-v4\",\"currency-2026\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D3-053\",\"domain\":3,\"subdomain\":\"3.3 Cryptography\",\"difficulty\":\"medium\",\"stem\":\"NIST finalised three post-quantum cryptography standards in August 2024. Which standard is the recommended general-purpose KEY ENCAPSULATION mechanism (replacing RSA/ECDH for key exchange)?\",\"choices\":[\"FIPS 203 \\u2014 ML-KEM (formerly Kyber)\",\"FIPS 204 \\u2014 ML-DSA (formerly Dilithium)\",\"FIPS 205 \\u2014 SLH-DSA (formerly SPHINCS+)\",\"FIPS 197 \\u2014 AES\"],\"correct\":0,\"explanation\":\"FIPS 203 standardises ML-KEM (Module-Lattice-based KEM, previously Kyber) for post-quantum key encapsulation \\u2014 directly replacing the role RSA and ECDH played in TLS handshakes and similar key-exchange contexts. FIPS 204 (ML-DSA / Dilithium) and FIPS 205 (SLH-DSA / SPHINCS+) are SIGNATURE schemes, not KEMs. FIPS 197 is AES (symmetric, not asymmetric, and not post-quantum-specific).\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://csrc.nist.gov/pubs/fips/140/3/final\",\"title\":\"NIST PQC Standards\",\"captured\":\"2026-04-26\"}],\"references\":[\"FIPS 203\"],\"tags\":[\"post-quantum\",\"ml-kem\",\"kyber\",\"currency-2026\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D3-054\",\"domain\":3,\"subdomain\":\"3.3 Cryptography\",\"difficulty\":\"hard\",\"stem\":\"An organisation begins migrating to post-quantum cryptography. Which migration approach is the BEST first step recommended by NIST?\",\"choices\":[\"Replace all classical algorithms with PQC immediately\",\"Adopt a HYBRID approach so security holds even if one half is later broken\",\"Stop encrypting data until the standards are mature\",\"Use only FIPS 205 SLH-DSA because it has the strongest security assumptions\"],\"correct\":1,\"explanation\":\"Hybrid post-quantum schemes combine a classical algorithm with a PQC algorithm so the connection remains secure if EITHER algorithm is later weakened. NIST and IETF have endorsed hybrid TLS during the transition (e.g., draft-ietf-tls-hybrid-design). Choice A is risky \\u2014 early implementations of new algorithms historically have bugs. Choice C abandons defence. Choice D is wrong: SLH-DSA is signature-only, not a KEM, and significantly slower than ML-DSA.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://csrc.nist.gov/projects/post-quantum-cryptography\",\"title\":\"NIST PQC migration\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"post-quantum\",\"hybrid\",\"currency-2026\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D5-053\",\"domain\":5,\"subdomain\":\"5.7 NIST 800-63-4\",\"difficulty\":\"medium\",\"stem\":\"NIST SP 800-63-4 (Initial Public Draft, August 2024) explicitly addresses which authentication trend that 800-63-3 did not?\",\"choices\":[\"Biometric template aging for the purposes of this question\",\"Synchronisable authenticators and the trade-off between syncing across devices versus device-bound credentials\",\"Knowledge-based authentication (KBA) across the relevant control set\",\"Single-factor SMS under typical operating conditions\"],\"correct\":1,\"explanation\":\"800-63-4 directly addresses passkeys (syncable FIDO2 credentials) and explicitly differentiates 'syncable authenticators' from 'device-bound authenticators' \\u2014 a concept that did not exist in 800-63-3. The trade-off is recoverability/UX (sync) vs cryptographic strength (device-bound is stronger). Biometric aging was always covered. KBA remains discouraged. SMS remains RESTRICTED.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://csrc.nist.gov/pubs/sp/800/63/4/2pd\",\"title\":\"NIST SP 800-63-4\",\"captured\":\"2026-04-26\"}],\"references\":[\"NIST SP 800-63-4\"],\"tags\":[\"passkeys\",\"nist-800-63-4\",\"currency-2026\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D1-068\",\"domain\":1,\"subdomain\":\"1.10 Personnel Security\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST control to enforce that no single employee can complete a sensitive financial transaction end-to-end?\",\"choices\":[\"Background checks at hire\",\"Separation of duties combined with mandatory dual approval\",\"Annual ethics training\",\"Job rotation alone across the relevant policy framework\"],\"correct\":1,\"explanation\":\"Separation of duties (SoD) plus dual control prevents a single insider from completing a sensitive workflow alone. Choice A (background checks) screens at hire but doesn't prevent post-hire fraud. Choice C (training) raises awareness but doesn't enforce process. Choice D (job rotation) is detective \\u2014 it surfaces ongoing fraud after the fact, while SoD is preventive.\",\"source\":\"canonical\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[],\"references\":[],\"tags\":[\"sod\",\"personnel\",\"manager-mindset\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D1-069\",\"domain\":1,\"subdomain\":\"1.10 Personnel Security\",\"difficulty\":\"medium\",\"stem\":\"An employee with privileged access to a financial system unexpectedly resigns. What should happen FIRST?\",\"choices\":[\"Schedule an exit interview for next week\",\"Immediately disable all access at the moment of departure\",\"Wait 30 days to allow knowledge transfer\",\"Transfer their accounts to the manager\"],\"correct\":1,\"explanation\":\"Privileged access must be revoked at the MOMENT of departure \\u2014 even unexpected resignations create insider-threat windows. Choice A (exit interview later) leaves the access window open. Choice C (wait 30 days) is the textbook insider-threat enabler. Choice D (transfer to manager) violates accountability and creates orphan privilege. HR-triggered automated deprovisioning is the modern best practice.\",\"source\":\"canonical\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[],\"references\":[],\"tags\":[\"termination\",\"personnel\",\"manager-mindset\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D1-070\",\"domain\":1,\"subdomain\":\"1.10 Personnel Security\",\"difficulty\":\"medium\",\"stem\":\"Which screening practice is the BEST defence against insider threat from new hires in highly-privileged roles?\",\"choices\":[\"Reference checks only in standard practice\",\"Layered screening: identity verification, criminal history, credit check, drug screen, professional reference verification, and adverse-media check\",\"Trust the resume for the purposes of this question\",\"Check social media only in commonly cited frameworks\"],\"correct\":1,\"explanation\":\"Layered screening reduces the chance of hiring someone with adverse history that materially elevates insider-threat risk. Choice A (references alone) is easily gamed (friends-as-references). Choice C (trust the resume) is no screening at all. Choice D (social media alone) misses formal records. Higher-trust roles warrant deeper screening per a documented standard.\",\"source\":\"canonical\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[],\"references\":[],\"tags\":[\"screening\",\"personnel\",\"insider-threat\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D1-071\",\"domain\":1,\"subdomain\":\"1.10 Personnel Security\",\"difficulty\":\"medium\",\"stem\":\"What is the PRIMARY purpose of a Non-Disclosure Agreement (NDA) signed at hire?\",\"choices\":[\"To intimidate the employee as a baseline configuration under typical operating conditions\",\"To establish a legally enforceable obligation to protect confidential information, with named consequences for breach\",\"To replace need-to-know access controls when properly implemented\",\"To allow unrestricted information sharing within the organisation given current best practices\"],\"correct\":1,\"explanation\":\"An NDA creates a legally enforceable confidentiality obligation with consequences (termination, civil liability) \\u2014 necessary alongside technical controls because controls fail. Choice A is not a security purpose. Choice C is wrong \\u2014 NDAs supplement, never replace, technical access controls. Choice D contradicts the NDA's purpose. The exam pattern: legal contracts complement technical controls; neither stands alone.\",\"source\":\"canonical\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[],\"references\":[],\"tags\":[\"nda\",\"personnel\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D1-072\",\"domain\":1,\"subdomain\":\"1.10 Personnel Security\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST practice for managing access during an internal job transfer?\",\"choices\":[\"Add new role's permissions and keep old role's permissions\",\"Remove all access, then re-provision per the new role (zero-baseline)\",\"Have the employee request what they need\",\"Wait 90 days before any change\"],\"correct\":1,\"explanation\":\"Zero-baseline transfer (drop everything, re-provision per new role) is the only reliable way to prevent privilege creep during job changes. Choice A is the textbook accumulation pattern that produces over-privileged long-tenured staff. Choice C is unreliable (employees request what they're used to having). Choice D leaves stale privileges in place. The exam answer is always 'remove old, then add new' for transfers.\",\"source\":\"canonical\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[],\"references\":[],\"tags\":[\"privilege-creep\",\"transfer\",\"personnel\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D1-073\",\"domain\":1,\"subdomain\":\"1.11 Supply Chain Risk Management\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST FIRST step when onboarding a new SaaS vendor that will process customer PII?\",\"choices\":[\"Sign the contract immediately as a baseline configuration\",\"Conduct a vendor risk assessment scaled to the data sensitivity and access scope\",\"Disable security monitoring during onboarding\",\"Trust the vendor's marketing materials\"],\"correct\":1,\"explanation\":\"Risk-based assessment determines depth of further diligence: SOC 2 Type II review, on-site audit, contract terms (DPA, breach notification, right-to-audit). Choice A is contract-before-due-diligence \\u2014 exactly backwards. Choice C is anti-pattern. Choice D substitutes sales material for evidence. The exam pattern: assess first, then contract, then continuous monitor.\",\"source\":\"canonical\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[],\"references\":[],\"tags\":[\"vendor-risk\",\"scrm\",\"manager-mindset\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D1-074\",\"domain\":1,\"subdomain\":\"1.11 Supply Chain Risk Management\",\"difficulty\":\"medium\",\"stem\":\"Which clause should be REQUIRED in a vendor contract handling regulated data, regardless of vendor reputation?\",\"choices\":[\"A clause prohibiting the vendor from using your name in marketing across the relevant control set\",\"Right-to-audit, breach notification timeline, data residency, return/destruction at termination, and subcontractor disclosure requirements\",\"A flat-fee billing structure given current best practices\",\"A non-compete clause under typical compliance requirements across the relevant control set\"],\"correct\":1,\"explanation\":\"Right-to-audit + breach notification + data residency + offboarding + subcontractor disclosure are the load-bearing security clauses for any regulated-data vendor. Choice A (marketing) is reputational, not security. Choice C (billing) is commercial. Choice D (non-compete) addresses competition, not data protection. GDPR Art. 28 codifies most of these requirements for processors.\",\"source\":\"canonical\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[],\"references\":[],\"tags\":[\"vendor-contract\",\"scrm\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D1-075\",\"domain\":1,\"subdomain\":\"1.11 Supply Chain Risk Management\",\"difficulty\":\"medium\",\"stem\":\"What is the PRIMARY purpose of a Software Bill of Materials (SBOM) in supply chain risk management?\",\"choices\":[\"Marketing differentiation when properly implemented\",\"Provide a structured, machine-readable inventory of components and dependencies so vulnerability impact can be quickly assessed\",\"Replace SCA tooling under typical compliance requirements in most enterprise deployments\",\"Generate license revenue in commonly cited frameworks\"],\"correct\":1,\"explanation\":\"SBOM (SPDX or CycloneDX format) lets you answer 'are we affected by CVE-X?' in minutes, not days \\u2014 critical when 0-days like Log4Shell or XZ Utils break. US Executive Order 14028 mandates SBOMs for federal software. Choice A is unrelated. Choice C is wrong \\u2014 SBOMs feed SCA, they don't replace it. Choice D is wrong \\u2014 SBOMs are governance artefacts.\",\"source\":\"canonical\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[],\"references\":[],\"tags\":[\"sbom\",\"scrm\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D1-076\",\"domain\":1,\"subdomain\":\"1.11 Supply Chain Risk Management\",\"difficulty\":\"hard\",\"stem\":\"An organisation discovers their primary cloud provider was compromised at the infrastructure level. Which BCP element directly addresses this scenario?\",\"choices\":[\"Single-cloud lock-in for cost efficiency\",\"Multi-cloud or hybrid-cloud architecture with workload portability and tested failover procedures\",\"Trusting the cloud provider's SLA\",\"Disabling all cloud services when applied to standard enterprise environments\"],\"correct\":1,\"explanation\":\"Multi-cloud/hybrid architecture with TESTED failover removes the single-provider failure mode. Choice A optimises cost while concentrating risk. Choice C \\u2014 SLAs pay credits, they don't restore service. Choice D throws out the operational benefit entirely. Manager-mindset: critical workloads should never depend on any single vendor's continued operation.\",\"source\":\"canonical\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[],\"references\":[],\"tags\":[\"scrm\",\"cloud\",\"bcp\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D1-077\",\"domain\":1,\"subdomain\":\"1.11 Supply Chain Risk Management\",\"difficulty\":\"hard\",\"stem\":\"A critical open-source library used in your product has been found to contain a maintainer-introduced backdoor (e.g., the XZ Utils incident pattern). Which response set is BEST?\",\"choices\":[\"Continue using the library and hope for the best under typical operating conditions\",\"Pin to a known-good version, audit your dependency graph for exposure, monitor advisories, and contribute to or sponsor critical upstreams to reduce future risk\",\"Re-implement everything in-house immediately under typical compliance requirements for the purposes of this question\",\"Switch to a paid commercial fork without analysis when properly implemented\"],\"correct\":1,\"explanation\":\"Defensive hygiene: version pinning + dependency-graph audit + advisory monitoring + ecosystem investment is the realistic answer. Choice A ignores the threat. Choice C is impractical and introduces fresh untested code. Choice D substitutes one trust assumption for another. The exam pattern: layered controls + community engagement, not all-or-nothing reactions.\",\"source\":\"canonical\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[],\"references\":[],\"tags\":[\"xz-utils\",\"scrm\",\"supply-chain\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D4-053\",\"domain\":4,\"subdomain\":\"4.6 ICS / OT\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST mitigation for legacy ICS/SCADA devices that cannot be patched without operational disruption?\",\"choices\":[\"Expose them to the internet with a strong password in standard practice\",\"Network segmentation, passive monitoring with OT-aware IDS, and protocol-aware firewalls between IT and OT\",\"Disable all logging to reduce noise under typical operating conditions\",\"Replace immediately with consumer IoT across the relevant control set\"],\"correct\":1,\"explanation\":\"OT environments require the Purdue Enterprise Reference Architecture: rigid segmentation between business IT (level 4-5) and process control (level 0-3), passive monitoring (Dragos/Claroty/Nozomi style), and protocol-aware firewalls. Choice A is the recipe for industrial sabotage. Choice C destroys forensic capability. Choice D introduces consumer-grade vulnerabilities into critical operations.\",\"source\":\"canonical\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[],\"references\":[],\"tags\":[\"ics\",\"scada\",\"purdue\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D4-054\",\"domain\":4,\"subdomain\":\"4.6 IoT\",\"difficulty\":\"medium\",\"stem\":\"What is the GREATEST risk from an unmanaged IoT device on a flat corporate network?\",\"choices\":[\"Battery drain on the IoT device under typical operating conditions\",\"Lateral movement: a compromised IoT device becomes a foothold to pivot into high-value systems on the same broadcast domain\",\"Excessive electricity consumption in standard practice\",\"Aesthetic clutter given current best practices\"],\"correct\":1,\"explanation\":\"IoT devices typically run outdated firmware with default credentials and exposed management \\u2014 the Mirai botnet pattern. Once compromised, they pivot east-west on flat networks (lateral movement) into high-value targets. Mitigation: dedicated IoT VLAN, restrictive ACLs, outbound-only allow-lists. Choices A, C, D are operational concerns, not security risks.\",\"source\":\"canonical\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[],\"references\":[],\"tags\":[\"iot\",\"lateral-movement\",\"segmentation\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D4-055\",\"domain\":4,\"subdomain\":\"4.6 IoT\",\"difficulty\":\"hard\",\"stem\":\"An organisation deploys 10,000 industrial IoT sensors. Which key management approach is BEST?\",\"choices\":[\"Hardcode a single shared key into all devices\",\"Per-device cryptographic identity with centralised PKI rotation\",\"No keys \\u2014 clear-text only\",\"User-supplied passwords on each device\"],\"correct\":1,\"explanation\":\"Per-device cryptographic identity with centralised lifecycle management is the modern IoT pattern (e.g., DPS in Azure IoT, AWS IoT Core just-in-time provisioning). Choice A creates a single-key compromise that owns the entire fleet. Choice C abandons confidentiality. Choice D doesn't scale and creates user-credential reuse problems. The pattern: never share keys across devices at scale.\",\"source\":\"canonical\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[],\"references\":[],\"tags\":[\"iot\",\"pki\",\"key-management\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D4-056\",\"domain\":4,\"subdomain\":\"4.6 ICS Protocols\",\"difficulty\":\"easy\",\"stem\":\"Why is Modbus TCP particularly risky in modern ICS environments?\",\"choices\":[\"It's too fast for industrial use\",\"Modbus has no built-in authentication or encryption\",\"It requires AES-256 by default which is too slow\",\"It only works over fibre\"],\"correct\":1,\"explanation\":\"Modbus (1979 era) has no auth and no encryption \\u2014 assumed deployment was a physically isolated control network. On modern routable IP networks, anyone with reach can read sensors and command actuators. Mitigation: strict segmentation, protocol-aware firewall (deny writes from IT), wrapping in VPN/IPsec. Choices A, C, D are factually wrong.\",\"source\":\"canonical\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[],\"references\":[],\"tags\":[\"modbus\",\"ics-protocols\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D4-057\",\"domain\":4,\"subdomain\":\"4.6 IoT Lifecycle\",\"difficulty\":\"medium\",\"stem\":\"Which is the BIGGEST long-term risk of consumer IoT devices in enterprise environments?\",\"choices\":[\"High purchase cost in most operational contexts when properly implemented\",\"Vendor end-of-life (EOL) leaves devices unpatched with known CVEs, but they remain on the network for years\",\"Excessive feature richness in standard practice\",\"Bandwidth saturation in commonly cited frameworks\"],\"correct\":1,\"explanation\":\"Consumer IoT vendors abandon devices after 2-5 years; enterprises run them for 7-10. The orphan-device pattern produces accumulating known-CVE risk on the network. Mitigation: lifecycle policies that mandate replacement at EOL or quarantine into segmented networks. Choices A, C, D are not the dominant risk pattern.\",\"source\":\"canonical\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[],\"references\":[],\"tags\":[\"iot\",\"eol\",\"lifecycle\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D5-054\",\"domain\":5,\"subdomain\":\"5.5 Authorization\",\"difficulty\":\"medium\",\"stem\":\"Which authorization architecture component MAKES the access decision in an ABAC system?\",\"choices\":[\"The user's browser\",\"The Policy Decision Point (PDP), which evaluates the policy against attributes\",\"The Policy Enforcement Point (PEP) \\u2014 it only enforces, not decides\",\"The DNS resolver\"],\"correct\":1,\"explanation\":\"ABAC architecture: PEP (gateway) intercepts the request \\u2192 asks the PDP \\u2192 PDP evaluates policy \\u2192 returns decision \\u2192 PEP enforces. Choice A is the requester, not a decision-maker. Choice C is wrong \\u2014 PEP enforces but doesn't decide; the question asks who DECIDES. Choice D is unrelated. NIST SP 800-162 formalises this PEP/PDP/PIP/PAP pattern.\",\"source\":\"canonical\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[],\"references\":[],\"tags\":[\"abac\",\"pdp\",\"pep\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D5-055\",\"domain\":5,\"subdomain\":\"5.5 Authorization\",\"difficulty\":\"medium\",\"stem\":\"Which standard provides an XML-based language for expressing access control policies and the request/response between PEP and PDP?\",\"choices\":[\"SAML\",\"XACML\",\"OAuth\",\"OpenID Connect\"],\"correct\":1,\"explanation\":\"XACML (eXtensible Access Control Markup Language, OASIS standard) is the policy language for fine-grained ABAC \\u2014 defines policy structure, attributes, and the request/response between PEP and PDP. Choice A (SAML) carries assertions but doesn't express policy. Choice C (OAuth) handles authorization grants, not policy expression. Choice D (OIDC) is authentication on OAuth.\",\"source\":\"canonical\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[],\"references\":[],\"tags\":[\"xacml\",\"abac\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D5-056\",\"domain\":5,\"subdomain\":\"5.5 Authorization\",\"difficulty\":\"medium\",\"stem\":\"Which RBAC concept allows a user to be assigned both a junior and a senior role, but only ACTIVATE one at a time per session?\",\"choices\":[\"Static separation of duty (SSoD)\",\"Dynamic separation of duty (DSoD)\",\"Role hierarchy\",\"Mutual exclusion\"],\"correct\":1,\"explanation\":\"DSoD permits assignment of conflicting roles but prevents simultaneous activation in a single session \\u2014 useful when one user must perform both duties at different times but never together. Choice A (SSoD) prevents the assignment itself \\u2014 too rigid for some cases. Choice C (hierarchy) is about inheritance. Choice D (mutual exclusion) is the underlying concept SSoD/DSoD implement. The exam tests SSoD vs DSoD distinction directly.\",\"source\":\"canonical\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[],\"references\":[],\"tags\":[\"dsod\",\"rbac\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D5-057\",\"domain\":5,\"subdomain\":\"5.5 Authorization\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST description of 'Policy as Code' in modern authorization?\",\"choices\":[\"Hardcoding access rules into the application under typical operating conditions\",\"Authoring authorization policies in a declarative, version-controlled language that's evaluated by an external decision engine\",\"Storing policies as plaintext files in standard practice\",\"Asking each user for permission individually under typical operating conditions\"],\"correct\":1,\"explanation\":\"Policy-as-Code (OPA/Rego, AWS Cedar, Styra) treats policy as a first-class artefact \\u2014 version controlled, code reviewed, tested, deployed independently of applications. Choice A is the anti-pattern PaC fixes. Choice C is half-right (text format) but misses the key point: declarative + external evaluation + governance. Choice D is impossible to scale. Modern microservices pattern.\",\"source\":\"canonical\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[],\"references\":[],\"tags\":[\"policy-as-code\",\"opa\",\"cedar\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D5-058\",\"domain\":5,\"subdomain\":\"5.5 Authorization\",\"difficulty\":\"medium\",\"stem\":\"What is the PRIMARY security advantage of capability-based access control over an ACL approach?\",\"choices\":[\"Capabilities are easier to remember across the relevant control set\",\"Capabilities couple permission to the holder; possessing the capability is sufficient\",\"Capabilities are required by law for the purposes of this question\",\"Capabilities are faster to type across the relevant control set\"],\"correct\":1,\"explanation\":\"Capabilities (unforgeable tokens conferring rights) eliminate ambient authority and the confused deputy problem (where a privileged process is tricked into using its rights on behalf of an attacker). ACLs check identity at the resource \\u2014 vulnerable to deputy confusion. Modern: OAuth tokens are capability-style. Choices A, C, D are not security advantages.\",\"source\":\"canonical\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[],\"references\":[],\"tags\":[\"capability\",\"confused-deputy\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D7-054\",\"domain\":7,\"subdomain\":\"7.16 Personnel Safety\",\"difficulty\":\"medium\",\"stem\":\"What is the PRIMARY purpose of a duress code/PIN in physical or logical access systems?\",\"choices\":[\"A faster login shortcut across the relevant control set\",\"Allow the user to silently signal coercion while appearing to comply, triggering covert alarms\",\"A backup admin password in most enterprise deployments\",\"A vendor support code in most enterprise deployments\"],\"correct\":1,\"explanation\":\"A duress code looks like a normal credential but covertly alerts security/police while granting controlled access \\u2014 used in bank vaults, datacenter mantraps, alarm panels. Choice A misframes the purpose. Choice C is generic admin access (a different concept). Choice D is unrelated. The user's life takes precedence over assets \\u2014 duress codes save lives without escalating the situation.\",\"source\":\"canonical\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[],\"references\":[],\"tags\":[\"duress\",\"personnel-safety\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D7-055\",\"domain\":7,\"subdomain\":\"7.16 Personnel Safety\",\"difficulty\":\"easy\",\"stem\":\"During an active workplace violence incident, what should always take PRIORITY?\",\"choices\":[\"Protect the data center when applied to standard enterprise environments\",\"Life safety \\u2014 evacuate or shelter people, then call emergency services\",\"Document the event in the SIEM\",\"Notify the marketing department\"],\"correct\":1,\"explanation\":\"Life safety always wins over technology, data, and assets \\u2014 a recurring CISSP theme tested explicitly in physical security questions. Choice A inverts the priority. Choice C delays the action. Choice D is irrelevant in the moment. The pattern: people first, then property, then data \\u2014 never the reverse.\",\"source\":\"canonical\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[],\"references\":[],\"tags\":[\"life-safety\",\"manager-mindset\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D7-056\",\"domain\":7,\"subdomain\":\"7.16 Personnel Safety\",\"difficulty\":\"medium\",\"stem\":\"An after-hours security guard discovers a flooded server room with rising water near energised equipment. What is the FIRST action?\",\"choices\":[\"Begin moving servers to dry ground in most operational contexts in commonly cited frameworks\",\"Cut power to the affected area, then evacuate non-essential personnel and call emergency services\",\"Take photos for the insurance claim in most enterprise deployments\",\"Restore data from backup immediately for the purposes of this question\"],\"correct\":1,\"explanation\":\"Energised equipment + water = electrocution risk. Cut power (life safety) BEFORE attempting any equipment recovery. Choice A risks the guard's life. Choice C and D are post-event activities. CISSP physical-security questions consistently rank: protect life \\u2192 prevent injury \\u2192 minimise property damage \\u2192 preserve evidence \\u2192 restore operations.\",\"source\":\"canonical\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[],\"references\":[],\"tags\":[\"life-safety\",\"physical\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D8-042\",\"domain\":8,\"subdomain\":\"8.6 Acquired Software\",\"difficulty\":\"medium\",\"stem\":\"What is the BEST process for evaluating security of an acquired commercial software package before deployment?\",\"choices\":[\"Trust the vendor's marketing claims for general production deployments in most enterprise deployments\",\"Vendor security questionnaire + SOC 2 Type II review + threat modeling against your environment + integration testing in an isolated environment\",\"Deploy directly to production and monitor under typical operating conditions\",\"Skip evaluation if the software is widely used for the purposes of this question\"],\"correct\":1,\"explanation\":\"Layered evaluation: questionnaire (process), SOC 2 (controls), threat model (your context), isolated test (real behavior). Choice A is no evaluation. Choice C bypasses controls and risks production impact. Choice D ('widely used') is exactly how Log4Shell, MOVEit, and SolarWinds spread. The exam pattern: third-party software is your risk, regardless of who built it.\",\"source\":\"canonical\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[],\"references\":[],\"tags\":[\"acquired-software\",\"vendor-risk\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D8-043\",\"domain\":8,\"subdomain\":\"8.6 SaaS Security\",\"difficulty\":\"medium\",\"stem\":\"Which security responsibility ALWAYS remains with the customer in a SaaS arrangement?\",\"choices\":[\"Patching the underlying database when properly implemented\",\"Identity and access management for customer users + data classification + data ingest decisions + offboarding the data\",\"Maintaining the data center in standard practice\",\"Hypervisor configuration for the purposes of this question\"],\"correct\":1,\"explanation\":\"In SaaS, customers retain: who has access (IAM), what data goes in (classification), and how to exit (offboarding/data return). The provider handles infrastructure, platform, and most of the application. Choices A, C, D are provider responsibilities in SaaS. Knowing the responsibility split per service model (IaaS/PaaS/SaaS) is high-yield exam content.\",\"source\":\"canonical\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[],\"references\":[],\"tags\":[\"saas\",\"shared-responsibility\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D8-044\",\"domain\":8,\"subdomain\":\"8.6 Open Source\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST approach for evaluating an open-source library before adoption?\",\"choices\":[\"GitHub stars only in most enterprise deployments\",\"Activity, security history (CVEs, response time), community size, license compatibility, dependency footprint, and SBOM availability\",\"Whether it has a logo given current best practices\",\"Use any library that compiles across the relevant control set\"],\"correct\":1,\"explanation\":\"Open-source evaluation is multi-dimensional: maintainer activity, security responsiveness, community, license, dependency footprint, SBOM. Choice A (stars) is trivially gameable. Choice C (logo) is irrelevant. Choice D (just compiles) is the supply-chain attack pathway. The XZ Utils backdoor passed all the trivial checks \\u2014 only deep evaluation catches deliberate compromise.\",\"source\":\"canonical\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[],\"references\":[],\"tags\":[\"open-source\",\"supply-chain\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D8-045\",\"domain\":8,\"subdomain\":\"8.6 SaaS\",\"difficulty\":\"medium\",\"stem\":\"What is the BEST control for limiting blast radius if a SaaS vendor's API is compromised and starts requesting your customer data?\",\"choices\":[\"Trust the SaaS provider entirely when properly implemented\",\"Scope OAuth tokens and API keys to least-privilege resources, rotate regularly, and monitor data egress with anomaly detection\",\"Disable all integrations for general production deployments in standard practice\",\"Use a single shared admin token across all integrations in commonly cited frameworks\"],\"correct\":1,\"explanation\":\"Least-privilege scoped tokens + rotation + egress monitoring limits damage when (not if) a vendor is compromised. Choice A is no control. Choice C overcorrects and breaks operations. Choice D is the worst possible pattern \\u2014 one compromised token = total exposure. The Snowflake/Twilio incidents in 2024 illustrate this perfectly: vendor compromise + over-scoped tokens = enterprise customer data leaks.\",\"source\":\"canonical\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[],\"references\":[],\"tags\":[\"saas\",\"oauth\",\"least-privilege\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D8-046\",\"domain\":8,\"subdomain\":\"8.6 Acquired Software\",\"difficulty\":\"medium\",\"stem\":\"An acquired enterprise application requires running with local admin privileges. What is the BEST mitigation?\",\"choices\":[\"Just give it admin and move on in commonly cited frameworks\",\"Application allowlisting + dedicated service account + privilege segmentation + close monitoring of the account's behaviour\",\"Disable the application entirely across the relevant control set\",\"Run all workstations with admin privileges when properly implemented\"],\"correct\":1,\"explanation\":\"When an app demands privilege, isolate the impact: dedicated service account (not user accounts), allowlisting (only this binary can execute), privilege segmentation (only the necessary component runs elevated), behaviour monitoring (alert on deviation). Choice A grants enterprise admin. Choice C overrides business need. Choice D inverts least privilege. Manager-mindset: when you can't fix the app, contain it.\",\"source\":\"canonical\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[],\"references\":[],\"tags\":[\"least-privilege\",\"acquired-software\"],\"notes\":\"\",\"chapter\":null}]");
window.__FLASHCARDS__ = JSON.parse("[{\"id\":\"F1-001\",\"domain\":1,\"term\":\"CIA Triad\",\"back\":\"Confidentiality, Integrity, Availability \\u2014 the three core security objectives.\",\"source\":\"guide\",\"guide_pages\":[150,152],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F1-002\",\"domain\":1,\"term\":\"DAD Triad\",\"back\":\"Disclosure, Alteration, Destruction \\u2014 the negative inverse of CIA used to frame threats.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F1-003\",\"domain\":1,\"term\":\"Parkerian Hexad\",\"back\":\"Confidentiality, Possession/Control, Integrity, Authenticity, Availability, Utility \\u2014 six-attribute model expanding on CIA.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F1-004\",\"domain\":1,\"term\":\"Due Care\",\"back\":\"Taking the actions a reasonable person would take to protect the organisation (the 'doing').\",\"source\":\"guide\",\"guide_pages\":[180,184],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F1-005\",\"domain\":1,\"term\":\"Due Diligence\",\"back\":\"Ongoing investigation, validation, and verification that controls remain appropriate (the 'homework').\",\"source\":\"guide\",\"guide_pages\":[180,184],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F1-006\",\"domain\":1,\"term\":\"ALE Formula\",\"back\":\"ALE = SLE \\u00d7 ARO. Single Loss Expectancy times Annualised Rate of Occurrence.\",\"source\":\"guide\",\"guide_pages\":[300,305],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F1-007\",\"domain\":1,\"term\":\"SLE Formula\",\"back\":\"SLE = AV \\u00d7 EF. Asset Value times Exposure Factor (the percentage of loss).\",\"source\":\"guide\",\"guide_pages\":[300,305],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F1-008\",\"domain\":1,\"term\":\"Risk Treatment Options\",\"back\":\"Mitigate, Avoid, Transfer (share), Accept \\u2014 the four risk responses.\",\"source\":\"guide\",\"guide_pages\":[310,314],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F1-009\",\"domain\":1,\"term\":\"Inherent vs Residual Risk\",\"back\":\"Inherent = risk before controls. Residual = risk remaining after controls. Secondary = risk introduced by a control.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F1-010\",\"domain\":1,\"term\":\"STRIDE\",\"back\":\"Spoofing, Tampering, Repudiation, Information Disclosure, Denial of Service, Elevation of Privilege \\u2014 Microsoft's threat-categorisation model.\",\"source\":\"web\",\"guide_pages\":[],\"web_url\":\"https://destcert.com/resources/threat-modeling-methodologies/\",\"tags\":[]},{\"id\":\"F1-011\",\"domain\":1,\"term\":\"DREAD\",\"back\":\"Damage, Reproducibility, Exploitability, Affected users, Discoverability \\u2014 threat-severity scoring (often paired with STRIDE).\",\"source\":\"web\",\"guide_pages\":[],\"web_url\":\"https://www.softwaresecured.com/post/comparison-of-stride-dread-pasta\",\"tags\":[]},{\"id\":\"F1-012\",\"domain\":1,\"term\":\"PASTA\",\"back\":\"Process for Attack Simulation and Threat Analysis \\u2014 a 7-stage, risk-centric, attacker-focused threat-modeling methodology.\",\"source\":\"web\",\"guide_pages\":[],\"web_url\":\"https://destcert.com/resources/threat-modeling-methodologies/\",\"tags\":[]},{\"id\":\"F1-013\",\"domain\":1,\"term\":\"VAST\",\"back\":\"Visual, Agile, Simple Threat \\u2014 produces both an application threat model and an operational threat model.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F1-014\",\"domain\":1,\"term\":\"ISC2 Code of Ethics \\u2014 Canon Ordering\",\"back\":\"(1) Protect society, common good, public trust, infrastructure; (2) Act honourably; (3) Provide diligent service; (4) Advance the profession.\",\"source\":\"web\",\"guide_pages\":[],\"web_url\":\"https://www.isc2.org/Ethics\",\"tags\":[]},{\"id\":\"F1-015\",\"domain\":1,\"term\":\"BIA Time Metrics\",\"back\":\"MTD = max tolerable downtime; RTO = recovery time objective; RPO = recovery point objective; WRT = work recovery time. RTO + WRT \\u2264 MTD.\",\"source\":\"web\",\"guide_pages\":[],\"web_url\":\"https://wentzwu.com/2020/04/05/common-bia-terminologies/\",\"tags\":[]},{\"id\":\"F1-016\",\"domain\":1,\"term\":\"GDPR Roles\",\"back\":\"Controller (decides purpose/means), Processor (acts on instructions), DPO (compliance/oversight), Data Subject (the individual).\",\"source\":\"web\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F1-017\",\"domain\":1,\"term\":\"GDPR Fines (Higher Tier)\",\"back\":\"Up to \\u20ac20 million or 4% of global annual turnover (whichever is higher) for serious violations of the regulation.\",\"source\":\"web\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F1-018\",\"domain\":1,\"term\":\"NIST CSF 2.0 Functions\",\"back\":\"Govern, Identify, Protect, Detect, Respond, Recover (Govern was added in 2.0).\",\"source\":\"web\",\"guide_pages\":[],\"web_url\":\"https://www.nist.gov/cyberframework\",\"tags\":[]},{\"id\":\"F1-019\",\"domain\":1,\"term\":\"NIST RMF Steps\",\"back\":\"Categorise \\u2192 Select \\u2192 Implement \\u2192 Assess \\u2192 Authorise \\u2192 Monitor (NIST SP 800-37).\",\"source\":\"web\",\"guide_pages\":[],\"web_url\":\"https://csrc.nist.gov/pubs/sp/800/37/r2/final\",\"tags\":[]},{\"id\":\"F1-020\",\"domain\":1,\"term\":\"PCI-DSS\",\"back\":\"Payment Card Industry Data Security Standard \\u2014 contractual (not statutory) framework protecting cardholder data; v4.0 mandatory March 31, 2025.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F1-021\",\"domain\":1,\"term\":\"SOX\",\"back\":\"Sarbanes-Oxley Act (2002) \\u2014 internal controls over financial reporting for US public companies; CEO/CFO attestations.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F1-022\",\"domain\":1,\"term\":\"ISO 27001 vs 27002\",\"back\":\"27001 = ISMS requirements (auditable); 27002 = control catalog/guidance.\",\"source\":\"web\",\"guide_pages\":[],\"web_url\":\"https://www.iso.org/standard/27001\",\"tags\":[]},{\"id\":\"F1-023\",\"domain\":1,\"term\":\"Three Lines Model (IIA)\",\"back\":\"1st: operational management; 2nd: risk/compliance; 3rd: internal audit reporting to the board.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F1-024\",\"domain\":1,\"term\":\"Mandatory Vacation\",\"back\":\"Force absence so a substitute can detect ongoing fraud or unsafe practices that depend on continuous control by one person.\",\"source\":\"guide\",\"guide_pages\":[290,293],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F1-025\",\"domain\":1,\"term\":\"Separation of Duties (SoD)\",\"back\":\"Split sensitive workflows so no single person can complete them; requires collusion to commit fraud.\",\"source\":\"guide\",\"guide_pages\":[290,295],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F1-026\",\"domain\":1,\"term\":\"Recovery Sites \\u2014 RTO Order\",\"back\":\"Hot (minutes/hours) \\u2192 Warm (~12 hours) \\u2192 Cold (days) \\u2192 Mobile (variable) \\u2192 Reciprocal (variable).\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F1-027\",\"domain\":1,\"term\":\"DR Test Types \\u2014 Disruption Order\",\"back\":\"Tabletop \\u2192 Walkthrough \\u2192 Simulation \\u2192 Parallel \\u2192 Full Interruption (least \\u2192 most disruptive).\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F1-028\",\"domain\":1,\"term\":\"Risk Register Entry\",\"back\":\"A documented risk = (threat \\u00d7 vulnerability \\u00d7 impact) with likelihood, owner, treatment, status.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F1-029\",\"domain\":1,\"term\":\"Quantitative vs Qualitative Risk\",\"back\":\"Quantitative uses numbers (ALE, SLE, ARO) for cost-benefit; qualitative uses ratings (high/med/low) and captures intangibles.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F1-030\",\"domain\":1,\"term\":\"Documentation Hierarchy\",\"back\":\"Policy (mandatory intent) \\u2192 Standard (mandatory specifics) \\u2192 Procedure (steps) \\u2192 Guideline (recommendations).\",\"source\":\"guide\",\"guide_pages\":[183,188],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F2-001\",\"domain\":2,\"term\":\"Data Owner\",\"back\":\"Senior business leader accountable for classification and decisions about data use, protection, and destruction.\",\"source\":\"guide\",\"guide_pages\":[600,605],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F2-002\",\"domain\":2,\"term\":\"Data Custodian\",\"back\":\"Operational role implementing controls per owner's direction (backups, restores, ACL maintenance).\",\"source\":\"guide\",\"guide_pages\":[605,608],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F2-003\",\"domain\":2,\"term\":\"Data Steward\",\"back\":\"SME-style role responsible for data quality, metadata, and definitions across an organisation.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F2-004\",\"domain\":2,\"term\":\"Data Processor (GDPR)\",\"back\":\"An entity that processes personal data on behalf of the controller, per controller instructions.\",\"source\":\"web\",\"guide_pages\":[],\"web_url\":\"https://gdpr-info.eu/\",\"tags\":[]},{\"id\":\"F2-005\",\"domain\":2,\"term\":\"Data States\",\"back\":\"At rest, In transit, In use \\u2014 each requires distinct protections (encryption, TLS, confidential computing).\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F2-006\",\"domain\":2,\"term\":\"NIST 800-88 Sanitisation\",\"back\":\"Clear (overwrite, in-house), Purge (degauss/crypto-erase, leaves control), Destroy (shred/incinerate, highest impact).\",\"source\":\"web\",\"guide_pages\":[],\"web_url\":\"https://csrc.nist.gov/pubs/sp/800/88/r1/final\",\"tags\":[]},{\"id\":\"F2-007\",\"domain\":2,\"term\":\"Cryptographic Erase\",\"back\":\"Destroy/replace the media-encryption key on self-encrypting drives \\u2014 instantly invalidates ciphertext WITHOUT touching every block.\",\"source\":\"web\",\"guide_pages\":[],\"web_url\":\"https://inventivehq.com/blog/nist-800-88-media-sanitization-complete-guide\",\"tags\":[]},{\"id\":\"F2-008\",\"domain\":2,\"term\":\"Degaussing\",\"back\":\"Strong magnetic field that randomises magnetic domains \\u2014 works on HDDs and tapes only (not SSDs).\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F2-009\",\"domain\":2,\"term\":\"Scoping vs Tailoring\",\"back\":\"Scoping REMOVES irrelevant controls. Tailoring MODIFIES remaining controls (parameters, compensating).\",\"source\":\"web\",\"guide_pages\":[],\"web_url\":\"https://destcert.com/resources/scoping-tailoring-security-controls-for-businesses/\",\"tags\":[]},{\"id\":\"F2-010\",\"domain\":2,\"term\":\"FIPS 199 Categorisation\",\"back\":\"Low / Moderate / High impact based on confidentiality, integrity, and availability \\u2014 high-water mark per dimension.\",\"source\":\"web\",\"guide_pages\":[],\"web_url\":\"https://csrc.nist.gov/pubs/fips/199/final\",\"tags\":[]},{\"id\":\"F2-011\",\"domain\":2,\"term\":\"Tokenisation vs Encryption\",\"back\":\"Tokenisation = substitute surrogate values, reversibility via vault. Encryption = mathematically reversible with key.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F2-012\",\"domain\":2,\"term\":\"Anonymisation vs Pseudonymisation (GDPR)\",\"back\":\"Anonymisation = irreversible, removes from GDPR scope. Pseudonymisation = reversible with separately stored key, still personal data.\",\"source\":\"web\",\"guide_pages\":[],\"web_url\":\"https://gdpr-info.eu/\",\"tags\":[]},{\"id\":\"F2-013\",\"domain\":2,\"term\":\"Data Lifecycle\",\"back\":\"Create \\u2192 Store \\u2192 Use \\u2192 Share \\u2192 Archive \\u2192 Destroy.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F2-014\",\"domain\":2,\"term\":\"DLP\",\"back\":\"Data Loss Prevention: detect/block sensitive data leaving authorised locations (network, endpoint, storage, email).\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F2-015\",\"domain\":2,\"term\":\"Government Classification Levels\",\"back\":\"Confidential (damage), Secret (serious damage), Top Secret (exceptionally grave damage); FOUO is a control marking.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F2-016\",\"domain\":2,\"term\":\"Commercial Classification (Common)\",\"back\":\"Public \\u2192 Internal/Sensitive \\u2192 Confidential \\u2192 Restricted (4 tiers is generally optimal).\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F2-017\",\"domain\":2,\"term\":\"PII vs PHI\",\"back\":\"PII = personally identifiable information (broad). PHI = HIPAA-defined protected health information (subset, healthcare context).\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F2-018\",\"domain\":2,\"term\":\"GDPR Article 17\",\"back\":\"Right to erasure ('right to be forgotten') \\u2014 controllers must delete personal data on request unless an exemption applies.\",\"source\":\"web\",\"guide_pages\":[],\"web_url\":\"https://gdpr-info.eu/\",\"tags\":[]},{\"id\":\"F2-019\",\"domain\":2,\"term\":\"GDPR Article 6 Lawful Bases\",\"back\":\"Consent, Contract, Legal obligation, Vital interest, Public task, Legitimate interest. One of these must be cited for any processing.\",\"source\":\"web\",\"guide_pages\":[],\"web_url\":\"https://gdpr-info.eu/\",\"tags\":[]},{\"id\":\"F2-020\",\"domain\":2,\"term\":\"EOL vs EOS\",\"back\":\"End-of-Life: vendor stops selling. End-of-Support: vendor stops patching \\u2014 major security risk.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F3-001\",\"domain\":3,\"term\":\"Bell-LaPadula\",\"back\":\"Confidentiality model: NO READ UP, NO WRITE DOWN. Lattice-based, supports trusted subjects.\",\"source\":\"guide\",\"guide_pages\":[745,752],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F3-002\",\"domain\":3,\"term\":\"Biba\",\"back\":\"Integrity model: NO READ DOWN, NO WRITE UP. Inverse of Bell-LaPadula.\",\"source\":\"guide\",\"guide_pages\":[753,758],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F3-003\",\"domain\":3,\"term\":\"Clark-Wilson\",\"back\":\"Integrity via well-formed transactions: subjects \\u2192 TPs (transformation procedures) \\u2192 CDIs/UDIs (constrained/unconstrained data items); IVPs verify integrity.\",\"source\":\"guide\",\"guide_pages\":[755,760],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F3-004\",\"domain\":3,\"term\":\"Brewer-Nash (Chinese Wall)\",\"back\":\"Dynamic conflict-of-interest model \\u2014 restricts access based on prior access history.\",\"source\":\"guide\",\"guide_pages\":[760,763],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F3-005\",\"domain\":3,\"term\":\"Take-Grant\",\"back\":\"Models how rights can propagate between subjects via 'take' and 'grant' operations.\",\"source\":\"guide\",\"guide_pages\":[761,764],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F3-006\",\"domain\":3,\"term\":\"Graham-Denning\",\"back\":\"Eight rules for creating/deleting subjects, objects, and rights in a protection system.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F3-007\",\"domain\":3,\"term\":\"Reference Monitor\",\"back\":\"Always invoked, tamper-proof, small enough to be analysed/tested. Implemented by the security kernel.\",\"source\":\"guide\",\"guide_pages\":[796,800],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F3-008\",\"domain\":3,\"term\":\"TCB\",\"back\":\"Trusted Computing Base \\u2014 hardware/software/firmware whose correctness is essential to security policy enforcement.\",\"source\":\"guide\",\"guide_pages\":[795,800],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F3-009\",\"domain\":3,\"term\":\"Common Criteria EAL\",\"back\":\"Evaluation Assurance Level (EAL1 functionally tested \\u2192 EAL7 formally verified). Measures evaluation rigor, NOT inherent security.\",\"source\":\"web\",\"guide_pages\":[],\"web_url\":\"https://www.commoncriteriaportal.org/cc/\",\"tags\":[]},{\"id\":\"F3-010\",\"domain\":3,\"term\":\"FIPS 140-3\",\"back\":\"Federal validation standard for cryptographic modules; four levels; references ISO/IEC 19790:2012.\",\"source\":\"web\",\"guide_pages\":[],\"web_url\":\"https://csrc.nist.gov/pubs/fips/140/3/final\",\"tags\":[]},{\"id\":\"F3-011\",\"domain\":3,\"term\":\"AES Modes\",\"back\":\"ECB (insecure-deterministic), CBC (chaining, no integrity), CTR (stream-like), GCM (AEAD: confidentiality + integrity).\",\"source\":\"web\",\"guide_pages\":[],\"web_url\":\"https://destcert.com/resources/types-of-ciphers/\",\"tags\":[]},{\"id\":\"F3-012\",\"domain\":3,\"term\":\"Symmetric vs Asymmetric Cryptography\",\"back\":\"Symmetric: shared key (fast, key distribution problem). Asymmetric: keypair (slower, solves distribution; identity binding via PKI).\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F3-013\",\"domain\":3,\"term\":\"Hash Properties\",\"back\":\"One-way (irreversible), collision-resistant, fixed-length output, deterministic. Examples: SHA-256, SHA-3.\",\"source\":\"guide\",\"guide_pages\":[862,866],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F3-014\",\"domain\":3,\"term\":\"Digital Signature\",\"back\":\"Hash + private-key encryption. Provides integrity + authenticity + non-repudiation. MACs lack non-repudiation.\",\"source\":\"guide\",\"guide_pages\":[870,875],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F3-015\",\"domain\":3,\"term\":\"PKI Components\",\"back\":\"CA (issues), RA (registers), CRL/OCSP (revokes), repository (stores). Hierarchical or web-of-trust.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F3-016\",\"domain\":3,\"term\":\"TPM\",\"back\":\"Trusted Platform Module \\u2014 chip on the motherboard providing root of trust for measurement, sealed storage, attestation.\",\"source\":\"web\",\"guide_pages\":[],\"web_url\":\"https://www.wolfssl.com/difference-hsm-tpm-secure-enclave-secure-element-hardware-root-trust/\",\"tags\":[]},{\"id\":\"F3-017\",\"domain\":3,\"term\":\"HSM\",\"back\":\"Hardware Security Module \\u2014 tamper-resistant appliance for high-volume key generation, storage, and crypto operations.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F3-018\",\"domain\":3,\"term\":\"Side-Channel Attack\",\"back\":\"Recover secrets from observable physical phenomena (power, EM, timing, acoustic) during processing.\",\"source\":\"web\",\"guide_pages\":[],\"web_url\":\"https://www.usenix.org/system/files/sec20-moghimi-tpm.pdf\",\"tags\":[]},{\"id\":\"F3-019\",\"domain\":3,\"term\":\"Covert Channel \\u2014 Storage vs Timing\",\"back\":\"Storage: signal via shared resource state. Timing: signal via varying access timings. Both are unintentional disclosure paths.\",\"source\":\"web\",\"guide_pages\":[],\"web_url\":\"https://www.examcollection.com/blog/cissp-exam-prep-deep-dive-into-covert-channel-analysis/\",\"tags\":[]},{\"id\":\"F3-020\",\"domain\":3,\"term\":\"Fire Classes\",\"back\":\"A: ordinary combustibles (water). B: flammable liquids/gas. C: electrical (no water!). D: combustible metals. K: cooking oils.\",\"source\":\"guide\",\"guide_pages\":[920,924],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F3-021\",\"domain\":3,\"term\":\"CPTED\",\"back\":\"Crime Prevention Through Environmental Design: natural surveillance, natural access control, territorial reinforcement.\",\"source\":\"guide\",\"guide_pages\":[915,920],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F3-022\",\"domain\":3,\"term\":\"Saltzer-Schroeder Principles (subset)\",\"back\":\"Least privilege, fail-safe defaults, complete mediation, open design, separation of privilege, least common mechanism, psychological acceptability, economy of mechanism.\",\"source\":\"guide\",\"guide_pages\":[778,783],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F3-023\",\"domain\":3,\"term\":\"ASLR + DEP\",\"back\":\"ASLR = randomise memory layout; DEP/NX = mark data pages non-executable. Combined OS hardening against memory-corruption exploits.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F3-024\",\"domain\":3,\"term\":\"Post-Quantum Crypto (NIST 2024)\",\"back\":\"FIPS 203 ML-KEM (Kyber), 204 ML-DSA (Dilithium), 205 SLH-DSA (SPHINCS+) \\u2014 first post-quantum standards.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F3-025\",\"domain\":3,\"term\":\"PFS\",\"back\":\"Perfect Forward Secrecy: compromise of long-term key cannot decrypt PAST sessions. Achieved via ephemeral key exchange (DHE/ECDHE).\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F4-001\",\"domain\":4,\"term\":\"OSI Model (Layers 1-7)\",\"back\":\"Physical, Data Link, Network, Transport, Session, Presentation, Application. Mnemonic: 'Please Do Not Throw Sausage Pizza Away'.\",\"source\":\"guide\",\"guide_pages\":[1090,1095],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F4-002\",\"domain\":4,\"term\":\"TCP/IP Model\",\"back\":\"Link, Internet, Transport, Application \\u2014 collapsed alternative to OSI used in practice.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F4-003\",\"domain\":4,\"term\":\"TLS 1.3\",\"back\":\"Mandates forward secrecy, removes RSA key transport, AEAD ciphers only, faster handshake (1-RTT, 0-RTT optional).\",\"source\":\"web\",\"guide_pages\":[],\"web_url\":\"https://datatracker.ietf.org/doc/html/rfc8446\",\"tags\":[]},{\"id\":\"F4-004\",\"domain\":4,\"term\":\"IPsec AH vs ESP\",\"back\":\"AH: integrity over IP header + payload (no confidentiality, BREAKS through NAT). ESP: payload confidentiality + integrity (NAT-T uses UDP/4500).\",\"source\":\"web\",\"guide_pages\":[],\"web_url\":\"https://datatracker.ietf.org/doc/html/rfc4301\",\"tags\":[]},{\"id\":\"F4-005\",\"domain\":4,\"term\":\"IPsec Modes\",\"back\":\"Transport: protect payload, original IP header visible (host-to-host). Tunnel: encapsulate full packet (gateway-to-gateway).\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F4-006\",\"domain\":4,\"term\":\"DNSSEC\",\"back\":\"DNS Security Extensions \\u2014 cryptographic origin authentication and integrity for DNS responses (NOT confidentiality).\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F4-007\",\"domain\":4,\"term\":\"DoH vs DoT\",\"back\":\"DoH: DNS over HTTPS (port 443; blends with web traffic; harder for enterprise inspection). DoT: DNS over TLS (port 853; visible to enterprise).\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F4-008\",\"domain\":4,\"term\":\"WPA3-Personal vs WPA2-PSK\",\"back\":\"WPA3 uses SAE (Dragonfly) handshake, defeating offline dictionary attacks against captured handshakes; provides forward secrecy per session.\",\"source\":\"web\",\"guide_pages\":[],\"web_url\":\"https://www.ironwifi.com/blogs/best-eap-methods-wifi/\",\"tags\":[]},{\"id\":\"F4-009\",\"domain\":4,\"term\":\"EAP Methods\",\"back\":\"EAP-TLS (mutual cert), PEAP (server cert + tunnel), EAP-TTLS (server cert + flexible inner), EAP-FAST (PAC). EAP-MD5 obsolete.\",\"source\":\"web\",\"guide_pages\":[],\"web_url\":\"https://www.techtarget.com/searchnetworking/feature/Choosing-the-right-flavor-of-8021X\",\"tags\":[]},{\"id\":\"F4-010\",\"domain\":4,\"term\":\"Stateful vs NGFW\",\"back\":\"Stateful tracks connections. NGFW adds application identification, integrated IPS, threat intelligence.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F4-011\",\"domain\":4,\"term\":\"WAF\",\"back\":\"Web Application Firewall \\u2014 L7-specific, rules for SQLi/XSS/etc; OWASP Core Rule Set is common.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F4-012\",\"domain\":4,\"term\":\"Zero Trust\",\"back\":\"Assume the network is hostile; verify identity, device posture, context per request; least-privilege access per resource (NIST SP 800-207).\",\"source\":\"web\",\"guide_pages\":[],\"web_url\":\"https://csrc.nist.gov/pubs/sp/800/207/final\",\"tags\":[]},{\"id\":\"F4-013\",\"domain\":4,\"term\":\"Microsegmentation\",\"back\":\"Fine-grained workload-to-workload policy controls limiting east-west lateral movement after compromise.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F4-014\",\"domain\":4,\"term\":\"SDN\",\"back\":\"Software-Defined Networking \\u2014 decouples control plane from data plane; centralised programmatic control; controller is a SPOF.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F4-015\",\"domain\":4,\"term\":\"VXLAN\",\"back\":\"Virtual Extensible LAN \\u2014 extends L2 over L3 underlay using UDP encapsulation; does NOT provide encryption by default.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F4-016\",\"domain\":4,\"term\":\"Common Network Attacks\",\"back\":\"ARP spoofing (L2), DNS poisoning, MAC flooding, Smurf (ICMP amplification), Fraggle (UDP), Teardrop (overlapping fragments), Ping of Death.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F4-017\",\"domain\":4,\"term\":\"DMZ / Screened Subnet\",\"back\":\"Isolated network segment for internet-facing services, separated from internal network by firewall(s).\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F4-018\",\"domain\":4,\"term\":\"VPN Types\",\"back\":\"Site-to-site (IPsec, gateway-to-gateway), Remote-access (IPsec or SSL/TLS clientless), modern: WireGuard.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F4-019\",\"domain\":4,\"term\":\"Email Anti-Spoofing Trio\",\"back\":\"SPF (authorised IPs), DKIM (signed headers), DMARC (alignment + policy + reporting). All three together.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F4-020\",\"domain\":4,\"term\":\"S/MIME vs SPF/DKIM/DMARC\",\"back\":\"S/MIME = end-to-end content encryption + signature. SPF/DKIM/DMARC = envelope-level anti-spoofing.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F4-021\",\"domain\":4,\"term\":\"IDS vs IPS\",\"back\":\"IDS: detect + alert (passive). IPS: detect + actively block (inline). Performance and false-positive risk are higher for IPS.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F4-022\",\"domain\":4,\"term\":\"DDoS Categories\",\"back\":\"Volumetric (saturate bandwidth), Protocol (SYN flood), Application-layer (Slowloris, HTTP flood), Reflective amplification (DNS/NTP/memcached).\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F4-023\",\"domain\":4,\"term\":\"ZTNA\",\"back\":\"Zero Trust Network Access \\u2014 broker per-application access by identity/context without exposing broad network ranges.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F4-024\",\"domain\":4,\"term\":\"NTP Importance\",\"back\":\"Time sync is critical for log correlation, Kerberos ticket validity, certificate validation, and forensic timelines.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F5-001\",\"domain\":5,\"term\":\"IAAA\",\"back\":\"Identification, Authentication, Authorisation, Accounting (auditing) \\u2014 the four-step access control flow.\",\"source\":\"guide\",\"guide_pages\":[1685,1690],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F5-002\",\"domain\":5,\"term\":\"MFA Factors\",\"back\":\"Something you know (password), Something you have (token), Something you are (biometric), sometimes Somewhere you are (location).\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F5-003\",\"domain\":5,\"term\":\"DAC\",\"back\":\"Discretionary Access Control \\u2014 owner grants access at their discretion (file-system ACLs).\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F5-004\",\"domain\":5,\"term\":\"MAC\",\"back\":\"Mandatory Access Control \\u2014 system enforces clearance + label policy; appropriate for classified environments.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F5-005\",\"domain\":5,\"term\":\"RBAC\",\"back\":\"Role-Based Access Control \\u2014 permissions tied to roles; users inherit permissions through role membership.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F5-006\",\"domain\":5,\"term\":\"ABAC\",\"back\":\"Attribute-Based Access Control \\u2014 decisions based on user, resource, action, environment attributes (e.g., XACML, AWS IAM, Azure Conditional Access).\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F5-007\",\"domain\":5,\"term\":\"Rule-Based Access Control\",\"back\":\"System-wide rules apply uniformly regardless of identity (e.g., firewall ACLs).\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F5-008\",\"domain\":5,\"term\":\"Kerberos Components\",\"back\":\"AS (authentication server), TGS (ticket-granting server), KDC (encompassing AS+TGS), TGT, service ticket, principal.\",\"source\":\"guide\",\"guide_pages\":[1780,1786],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F5-009\",\"domain\":5,\"term\":\"Kerberos Time Sync\",\"back\":\"Tickets time-bound; clock skew tolerance ~5 minutes default. NTP is operationally critical.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F5-010\",\"domain\":5,\"term\":\"Kerberos Attacks\",\"back\":\"Kerberoasting (offline-crack service-ticket ciphertext), Pass-the-Hash (NTLM), Golden Ticket (forge TGTs from KRBTGT), Silver Ticket (forge service tickets).\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F5-011\",\"domain\":5,\"term\":\"SAML\",\"back\":\"XML-based federation. IdP authenticates and issues an assertion (authentication, attribute, authorisation) to the SP.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F5-012\",\"domain\":5,\"term\":\"OAuth 2.0\",\"back\":\"Delegated AUTHORISATION framework \\u2014 issues access tokens to third-party apps. NOT authentication on its own.\",\"source\":\"web\",\"guide_pages\":[],\"web_url\":\"https://datatracker.ietf.org/doc/html/rfc6749\",\"tags\":[]},{\"id\":\"F5-013\",\"domain\":5,\"term\":\"OpenID Connect (OIDC)\",\"back\":\"Authentication layer on top of OAuth 2.0; ID token is a JWT carrying identity claims.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F5-014\",\"domain\":5,\"term\":\"JWT\",\"back\":\"JSON Web Token \\u2014 compact, URL-safe, signed (JWS) and optionally encrypted (JWE) token format.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F5-015\",\"domain\":5,\"term\":\"RADIUS vs TACACS+\",\"back\":\"RADIUS: UDP, password-only encryption, AuthN+AuthZ combined. TACACS+: TCP, full payload encryption, separated AAA, supports per-command auth.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F5-016\",\"domain\":5,\"term\":\"FIDO2 / WebAuthn\",\"back\":\"Hardware-backed cryptographic authenticator providing AAL3 verifier-impersonation resistance per NIST 800-63B.\",\"source\":\"web\",\"guide_pages\":[],\"web_url\":\"https://csrc.nist.gov/pubs/sp/800/63/3/final\",\"tags\":[]},{\"id\":\"F5-017\",\"domain\":5,\"term\":\"NIST 800-63B Password Guidance\",\"back\":\"No mandatory composition rules, no routine forced expiration, \\u22658 chars, check against breached-password corpus, support up to 64 chars.\",\"source\":\"web\",\"guide_pages\":[],\"web_url\":\"https://csrc.nist.gov/pubs/sp/800/63/3/final\",\"tags\":[]},{\"id\":\"F5-018\",\"domain\":5,\"term\":\"JIT Access\",\"back\":\"Just-In-Time access \\u2014 grant privileges only when needed, time-limited; eliminates standing privilege.\",\"source\":\"web\",\"guide_pages\":[],\"web_url\":\"https://thorteaches.com/glossary/just-in-time-jit-access/\",\"tags\":[]},{\"id\":\"F5-019\",\"domain\":5,\"term\":\"PAM\",\"back\":\"Privileged Access Management \\u2014 vault credentials, broker sessions with recording, MFA, automatic rotation.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F5-020\",\"domain\":5,\"term\":\"Biometric Errors\",\"back\":\"FAR (false acceptance \\u2014 security failure), FRR (false rejection \\u2014 usability failure). CER/EER = crossover where they meet (lower is better).\",\"source\":\"guide\",\"guide_pages\":[1700,1706],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F5-021\",\"domain\":5,\"term\":\"SCIM\",\"back\":\"System for Cross-domain Identity Management \\u2014 standard for provisioning users between IdP and SaaS providers.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F5-022\",\"domain\":5,\"term\":\"Privilege Creep\",\"back\":\"Accumulating rights as roles change without removing old permissions; mitigated by access reviews and HR-driven deprovisioning.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F5-023\",\"domain\":5,\"term\":\"TOTP / HOTP\",\"back\":\"Time-based / HMAC-based OTP \\u2014 RFC 6238 / RFC 4226. Authenticator app generates, verifier checks locally.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F5-024\",\"domain\":5,\"term\":\"AAL Levels (NIST 800-63B)\",\"back\":\"AAL1 (single-factor), AAL2 (two-factor with replay resistance), AAL3 (hardware crypto, verifier-impersonation resistant \\u2014 FIDO2).\",\"source\":\"web\",\"guide_pages\":[],\"web_url\":\"https://csrc.nist.gov/pubs/sp/800/63/3/final\",\"tags\":[]},{\"id\":\"F6-001\",\"domain\":6,\"term\":\"SAST\",\"back\":\"Static Application Security Testing \\u2014 analyse source/bytecode without execution. White-box. Finds patterns like SQLi, hardcoded secrets.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F6-002\",\"domain\":6,\"term\":\"DAST\",\"back\":\"Dynamic Application Security Testing \\u2014 exercise running app from outside. Black-box. Finds runtime-manifest issues.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F6-003\",\"domain\":6,\"term\":\"IAST\",\"back\":\"Interactive AST \\u2014 agent inside running app combines source visibility with runtime context.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F6-004\",\"domain\":6,\"term\":\"Fuzzing\",\"back\":\"Send malformed/unexpected inputs to surface input-handling defects (crashes, memory errors, parser bugs).\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F6-005\",\"domain\":6,\"term\":\"NIST 800-115 Pen Test Phases\",\"back\":\"Planning, Discovery, Attack, Reporting (4 phases). PTES defines 7.\",\"source\":\"web\",\"guide_pages\":[],\"web_url\":\"https://csrc.nist.gov/pubs/sp/800/115/final\",\"tags\":[]},{\"id\":\"F6-006\",\"domain\":6,\"term\":\"Pen Test Box Types\",\"back\":\"Black (no info \\u2014 external attacker), Gray (partial info \\u2014 insider), White (full info \\u2014 insider with everything).\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F6-007\",\"domain\":6,\"term\":\"SOC Reports\",\"back\":\"SOC 1: financial-reporting controls (ISAE 3402 equivalent). SOC 2: Trust Services Criteria. SOC 3: SOC 2 public summary.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F6-008\",\"domain\":6,\"term\":\"SOC 2 Type I vs Type II\",\"back\":\"Type I: design at point-in-time. Type

he necessity of safeguarding the data itself and the systems and applications that assist in the processing of that data. Protections against malicious code, database vulnerabilities, and system/application development flaws must be implemented in every technology-aware organization. By this point, you no doubt recognize the importance of placing adequate access controls and audit trails on these valuable information resources. Database security is a rapidly growing field; if databases play a major role in your security duties, take the time to sit down with database administrators, courses, and\n\ntextbooks and learn the underlying theory. It's a valuable investment. Finally, various controls can be put into place during the system and application development process to ensure that the end product of these processes is compatible with operation in a secure environment. Such controls include process isolation, hardware segmentation, abstraction, and contractual arrangements such as service-level agreements (SLAs). Security should always be introduced in the early planning phases of any development project and continually monitored throughout the design, development, deployment, and maintenance phases of production. Study Essentials Explain the basic architecture of a relational database management system (RDBMS). Know the structure of relational databases. Be able to explain the function of tables (relations), rows (records/tuples), and columns (fields/attributes). Know how relationships are defined between tables and the roles of various types of keys. Describe the database security threats posed by aggregation and inference.\n\nExplain how expert systems, machine learning, and neural networks function. Expert systems consist of two core components: a knowledge base that contains a series of \u201cif/then\u201d rules and an inference engine that uses that information to draw conclusions about other data. Machine learning techniques attempt to algorithmically discover knowledge from datasets. Neural networks simulate the functioning of the human mind to a limited extent by arranging a series of layered calculations to solve problems. Neural networks require extensive training on a particular problem before they are able to offer solutions. Understand the models of systems development. Know that the waterfall model describes a sequential development process that results in the development of a finished product. Developers may step back only one phase in the process if errors are discovered. The spiral model uses several iterations of the waterfall model to produce a number of fully specified and tested prototypes. Agile development models place an emphasis on the needs of the customer and quickly developing new functionality that meets those needs in an iterative fashion. Explain the Scrum approach to Agile software development. Scrum is an organized approach to\n\nimplementing the Agile philosophy. It relies on daily scrum meetings to organize and review work. Development focuses on short sprints of activity that deliver finished products. Integrated product teams (IPTs) are an early effort at this approach that was used by the U.S. Department of Defense. Describe software development maturity models. Know that maturity models help software organizations improve the maturity and quality of their software processes by implementing an evolutionary path from ad hoc, chaotic processes to mature, disciplined software processes. Be able to describe the SW-CMM, IDEAL, and SAMM models. Understand the importance of change and configuration management. Know the three basic components of the change management process\u2014request control, change control, and release control\u2014and how they contribute to security. Explain how software configuration management controls the versions of software used in an organization. Understand how the auditing and logging of changes mitigates risk to the organization. Understand the importance of testing. Software testing should be designed as part of the development process. Testing\n\nshould be used as a management tool to improve the design, development, and production processes. Explain the role of DevOps and DevSecOps in the modern enterprise. DevOps approaches seek to integrate software development and operations activities by embracing automation and collaboration between teams. DevSecOps approaches expand on the DevOps model by introducing security operations activities into the integrated model. Continuous integration and delivery (CI/CD) techniques automate the DevOps and DevSecOps pipelines. Know the role of different coding tools in software development ecosystems. Developers write code in different programming languages, which is then either compiled into machine language or executed through an interpreter. Developers may make use of software development tool sets and integrated development environments to facilitate the code writing process. Software libraries create shared and reusable code, whereas code repositories provide a management platform for the software development process. Explain the impact of acquired software on the organization. Organizations may purchase commercial off- the-shelf (COTS) software to meet their requirements, and they\n\nmay also rely on free open-source software (OSS). All of this software expands the potential attack surface and requires security review and testing.","exam_essentials":[{"term":"Explain how expert systems, machine learning, and neural networks function.","gloss":"Expert systems consist of two core components: a knowledge base that contains a series of \u201cif/then\u201d rules and an inference engine that uses that information to draw conclusions about other data. Machine learning techniques attempt to algorithmically discover knowledge from datasets. Neural networks simulate the functioning of the human mind to a limited extent by arranging a series of layered calculations to solve problems. Neural networks require extensive training on a particular problem before they are able to offer solutions."},{"term":"Know that the waterfall model describes a sequential development process that results in the development of a finished product.","gloss":"Developers may step back only one phase in the process if errors are discovered. The spiral model uses several iterations of the waterfall model to produce a number of fully specified and tested prototypes. Agile development models place an emphasis on the needs of the customer and quickly developing new functionality that meets those needs in an iterative fashion."},{"term":"Explain the Scrum approach to Agile software development.","gloss":"Scrum is an organized approach to implementing the Agile philosophy. It relies on daily scrum meetings to organize and review work. Development focuses on short sprints of activity that deliver finished products. Integrated product teams (IPTs) are an early effort at this approach that was used by the U.S. Department of Defense."},{"term":"Describe software development maturity models.","gloss":"Know that maturity models help software organizations improve the maturity and quality of their software processes by implementing an evolutionary path from ad hoc, chaotic processes to mature, disciplined software processes."},{"term":"Understand the importance of testing.","gloss":"Software testing should be designed as part of the development process. Testing should be used as a management tool to improve the design, development, and production processes."},{"term":"Explain the role of DevOps and DevSecOps in the modern enterprise.","gloss":"DevOps approaches seek to integrate software development and operations activities by embracing automation and collaboration between teams. DevSecOps approaches expand on the DevOps model by introducing security operations activities into the integrated model. Continuous integration and delivery (CI/CD) techniques automate the DevOps and DevSecOps pipelines."},{"term":"Know the role of different coding tools in software development ecosystems.","gloss":"Developers write code in different programming languages, which is then either compiled into machine language or executed through an interpreter. Developers may make use of software development tool sets and integrated development environments to facilitate the code writing process. Software libraries create shared and reusable code, whereas code repositories provide a management platform for the software development process."},{"term":"Explain the impact of acquired software on the organization.","gloss":"Organizations may purchase commercial off- the-shelf (COTS) software to meet their requirements, and they may also rely on free open-source software (OSS). All of this software expands the potential attack surface and requires security review and testing."}]},{"chapter_number":21,"chapter_title":"Malicious Code and Application Attacks","page":2620,"domain":8,"summary":"Applications developers have a lot to worry about. Malicious actors are always becoming more sophisticated in their tools and techniques. Viruses, worms, Trojan horses, logic bombs, and other malicious code exploit vulnerabilities in applications and operating systems or use social engineering to infect systems and gain access to their resources and confidential information. Ransomware combines malware with encryption technology to deny users access to their data until they pay a substantial ransom. Applications themselves also may contain a number of vulnerabilities. Buffer overflow attacks exploit code that lacks proper input validation to affect the contents of a system's memory. Backdoors provide former developers and malicious code authors with the ability to bypass normal authentication mechanisms. Rootkits provide attackers with an easy way to conduct privilege escalation attacks.\n\nMany applications are moving to the web, creating a new level of exposure and vulnerability. Cross-site scripting attacks allow attackers to trick users into providing sensitive information to insecure sites. SQL injection attacks allow the bypassing of application controls to directly access and manipulate the underlying database. Study Essentials Understand the propagation techniques used by viruses. Viruses use four main propagation techniques\u2014file infection, service injection, boot sector infection, and macro infection\u2014to penetrate systems and spread their malicious payloads. You need to understand these techniques to effectively protect systems on your network from malicious code. Explain the threat posed by ransomware. Ransomware uses traditional malware techniques to infect a system and then encrypts data on that system using a key known only to the attacker. The attacker then demands payment of a ransom from the victim in exchange for providing the decryption key. Know how antivirus software packages detect known viruses. Most antivirus programs use signature-based detection algorithms to look for telltale patterns of known\n\nviruses. This makes it essential to periodically update virus definition files in order to maintain protection against newly authored viruses as they emerge. Behavior-based detection monitors target users and systems for unusual activity and either blocks it or flags it for investigation. Explain how user and entity behavior analytics (UEBA) functions. UEBA tools develop profiles of individual behavior and then monitor users for deviations from those profiles that may indicate malicious activity and/or compromised accounts. Be familiar with the various types of application attacks attackers use to exploit poorly written software. Application attacks are one of the greatest threats to modern computing. Attackers exploit buffer overflows, backdoors, time- of-check-to-time-of-use vulnerabilities, and rootkits to gain illegitimate access to a system. Security professionals must have a clear understanding of each of these attacks and associated countermeasures. Understand common web application vulnerabilities and countermeasures. As many applications move to the web, developers and security professionals must understand the new types of attacks that exist in this environment and how to\n\nprotect against them. The two most common examples are cross-site scripting (XSS) and SQL injection attacks.","exam_essentials":[{"term":"Understand the propagation techniques used by viruses.","gloss":"Viruses use four main propagation techniques\u2014file infection, service injection, boot sector infection, and macro infection\u2014to penetrate systems and spread their malicious payloads. You need to understand these techniques to effectively protect systems on your network from malicious code."},{"term":"Explain the threat posed by ransomware.","gloss":"Ransomware uses traditional malware techniques to infect a system and then encrypts data on that system using a key known only to the attacker. The attacker then demands payment of a ransom from the victim in exchange for providing the decryption key."},{"term":"Know how antivirus software packages detect known viruses.","gloss":"Most antivirus programs use signature-based detection algorithms to look for telltale patterns of known viruses. This makes it essential to periodically update virus definition files in order to maintain protection against newly authored viruses as they emerge. Behavior-based detection monitors target users and systems for unusual activity and either blocks it or flags it for investigation."},{"term":"Explain how user and entity behavior analytics (UEBA) functions.","gloss":"UEBA tools develop profiles of individual behavior and then monitor users for deviations from those profiles that may indicate malicious activity and/or compromised accounts."},{"term":"Be familiar with the various types of application attacks attackers use to exploit poorly written software.","gloss":"Application attacks are one of the greatest threats to modern computing. Attackers exploit buffer overflows, backdoors, time- of-check-to-time-of-use vulnerabilities, and rootkits to gain illegitimate access to a system. Security professionals must have a clear understanding of each of these attacks and associated countermeasures."},{"term":"Understand common web application vulnerabilities and countermeasures.","gloss":"As many applications move to the web, developers and security professionals must understand the new types of attacks that exist in this environment and how to protect against them. The two most common examples are cross-site scripting (XSS) and SQL injection attacks."}]}];
window.__TABLES__ = [{"id":"raid_levels","name":"RAID levels \u2014 performance vs redundancy","domain":7,"headers":["Level","Min disks","Fault tolerance","Storage efficiency","When to choose"],"rows":[["RAID 0","2","None (any drive lost = data lost)","100%","High-performance scratch / cache only"],["RAID 1","2","1 drive (mirror)","50%","OS boot, small critical volumes"],["RAID 5","3","1 drive","(N-1)/N","General file servers (legacy \u2014 write penalty)"],["RAID 6","4","2 drives","(N-2)/N","Large archives, high resilience"],["RAID 10 (1+0)","4","1 per mirror pair","50%","Databases, latency-sensitive workloads"],["RAID 01 (0+1)","4","1 drive total","50%","Rare \u2014 RAID 10 is preferred"]],"tip":"RAID is for AVAILABILITY, not BACKUP. A delete still propagates. Always pair with backups."},{"id":"recovery_sites","name":"Recovery site types \u2014 RTO vs cost","domain":7,"headers":["Type","RTO","Data freshness","Cost","When to choose"],"rows":[["Hot","Minutes \u2013 hours","Real-time replication","$$$$","Tier-0, regulated, ~zero downtime"],["Warm","12 \u2013 24 hours","Daily/hourly sync","$$$","Critical but tolerant of brief outage"],["Cold","Days \u2013 weeks","Manual restore","$","Non-critical, budget-constrained"],["Cloud","Variable (provisionable)","Configurable","$ \u2013 $$$","Modern default; pay-as-you-recover"],["Mobile","Hours \u2013 days","Manual","$$","Field operations, regional disaster"],["Reciprocal","Variable","Manual","$","Avoid \u2014 same-disaster failure mode"]],"tip":"Pick the cheapest site whose RTO meets your BIA. Hot sites are luxury for critical-only systems."},{"id":"osi_tcp","name":"OSI vs TCP/IP \u2014 layer mapping","domain":4,"headers":["OSI #","OSI layer","TCP/IP layer","Example protocols / units"],"rows":[["7","Application","Application","HTTP, FTP, SMTP, DNS \u2014 data"],["6","Presentation","Application","TLS encoding, JPEG, ASCII"],["5","Session","Application","TLS sessions, RPC, NetBIOS"],["4","Transport","Transport","TCP, UDP \u2014 segments / datagrams"],["3","Network","Internet","IP, ICMP, IPsec \u2014 packets"],["2","Data Link","Link","Ethernet, ARP, MAC, PPP \u2014 frames"],["1","Physical","Link","Cables, hubs, electrical signaling \u2014 bits"]],"tip":"Mnemonic: 'Please Do Not Throw Sausage Pizza Away' (L1\u2192L7). TLS = L5 per ISC2."},{"id":"evidence_types","name":"Evidence types \u2014 admissibility ranking","domain":7,"headers":["Type","Definition","Admissibility"],"rows":[["Best (primary)","Original document or media (or its forensic image)","Strongest"],["Secondary","Copies, transcripts, summaries","Weaker \u2014 best only if original unavailable"],["Direct","Eyewitness testimony of the event itself","Strong if witness credible"],["Circumstantial","Inference from facts (e.g., login + timestamp pattern)","Variable \u2014 needs corroboration"],["Demonstrative","Charts, models, simulations to explain","Supporting only \u2014 not standalone"],["Corroborative","Reinforces existing evidence","Adds weight to other evidence"],["Hearsay","Out-of-court statement to prove the matter asserted","Generally INADMISSIBLE (with exceptions)"]],"tip":"Logs are typically hearsay UNLESS they qualify as business records (Federal Rules of Evidence 803(6))."},{"id":"fire_classes","name":"Fire classes \u2014 agent compatibility","domain":3,"headers":["Class","Fuel","Acceptable agent","Datacenter use"],"rows":[["A","Ordinary combustibles (wood, paper, cloth)","Water, foam, dry chem","Avoid water near electronics"],["B","Flammable liquids/gases (oil, gasoline)","CO\u2082, dry chem, foam","CO\u2082 unsafe for occupied space"],["C","Energized electrical equipment","Clean agent (FM-200, Novec 1230, Inergen)","PRIMARY for datacenters"],["D","Combustible metals (Mg, Na, Ti)","Specialized dry powder","Rare in IT environments"],["K","Cooking oils, fats","Wet chemical (saponification)","Kitchens only"]],"tip":"Wet pipe = always charged (water in pipes). Dry pipe = water released on alarm. Pre-action = two-trigger to avoid accidental discharge \u2014 preferred for datacenters."},{"id":"ipsec_modes","name":"IPsec \u2014 protocols \u00d7 modes","domain":4,"headers":["","AH (Authentication Header)","ESP (Encapsulating Security Payload)"],"rows":[["Confidentiality","\u2717 (integrity-only)","\u2713 (encrypts payload)"],["Integrity","\u2713 (whole packet incl. immutable IP hdr)","\u2713 (payload + optionally header)"],["NAT-friendly","\u2717 (NAT mutates IP hdr \u2192 integrity break)","\u2713 with NAT-T (UDP/4500)"],["Transport mode","Host-to-host, IP hdr in clear","Host-to-host, payload encrypted"],["Tunnel mode","Gateway-to-gateway, original IP wrapped","Site-to-site VPN, full encapsulation"],["Protocol number","51","50"]],"tip":"Modern site-to-site VPNs use ESP in tunnel mode with NAT-T. AH is rarely deployed."},{"id":"backup_types","name":"Backup types \u2014 speed vs restore","domain":7,"headers":["Type","What's backed up","Backup time","Restore complexity","Archive bit"],"rows":[["Full","Everything","Slowest","Simplest (1 set)","Cleared"],["Incremental","Changes since last backup of any type","Fastest","Hardest (full + every incr in chain)","Cleared"],["Differential","Changes since last FULL backup","Mid","Easy (full + most-recent diff)","Not cleared"],["Snapshot","Point-in-time copy (CoW)","Instant","Easy (revert)","n/a"],["Synthetic full","Server constructs full from prior incrementals","Variable","As easy as a full","Cleared"]],"tip":"3-2-1 rule: 3 copies, 2 different media types, 1 offsite. Modern: 3-2-1-1-0 adds 1 immutable + 0 errors after verification."},{"id":"access_models","name":"Access control models \u2014 DAC / MAC / RBAC / ABAC","domain":5,"headers":["Model","Decision authority","Granularity","Typical example"],"rows":[["DAC","Data owner (discretionary)","Per object","Unix file permissions, Windows NTFS ACLs"],["MAC","System policy (mandatory, labels)","Subject clearance vs object label","Government Bell-LaPadula systems"],["RBAC","Role assignments","Per role","Active Directory groups, AWS IAM roles"],["ABAC","Multi-attribute policy engine","Fine-grained (user \u00d7 resource \u00d7 env)","AWS IAM policies, Azure Conditional Access, XACML"],["RuBAC","System-wide rules (often IF/THEN)","Identity-independent","Firewall ACLs, time-of-day restrictions"]],"tip":"Production systems usually layer RBAC (coarse) + ABAC (fine). MAC appears in classified environments."},{"id":"control_grid","name":"Controls \u2014 type \u00d7 function","domain":1,"headers":["","Preventive","Detective","Corrective"],"rows":[["Administrative","Policies, training, hiring/screening","Audits, performance reviews","Termination, retraining"],["Technical","Firewall, encryption, MFA","IDS, SIEM, log monitoring","Patching, IPS auto-block"],["Physical","Locks, fences, mantraps, bollards","CCTV, motion sensors, guards","Fire suppression, repair"]],"tip":"Also: Deterrent (warning signs, login banners), Compensating (substitute when primary infeasible), Recovery (BCP/DRP)."},{"id":"kerberos_flow","name":"Kerberos \u2014 message flow","domain":5,"headers":["Step","Message","From \u2192 To","Contains"],"rows":[["1","AS-REQ","Client \u2192 AS","Username, requested realm, timestamp"],["2","AS-REP","AS \u2192 Client","TGT (encrypted with KRBTGT secret) + session key (encrypted with user's hash)"],["3","TGS-REQ","Client \u2192 TGS","TGT + service principal name + authenticator (encrypted with session key)"],["4","TGS-REP","TGS \u2192 Client","Service ticket (encrypted with service's secret) + new session key"],["5","AP-REQ","Client \u2192 Service","Service ticket + new authenticator"],["6","AP-REP","Service \u2192 Client","Mutual auth confirmation (optional)"]],"tip":"KDC = AS + TGS. Time sync within ~5 min required (NTP). Golden Ticket forges step 2 from KRBTGT hash."},{"id":"biometric_errors","name":"Biometric error rates","domain":5,"headers":["Term","Meaning","What you minimize for\u2026"],"rows":[["FAR / Type II","False acceptance \u2014 unauthorized user admitted","HIGH security (worse failure mode)"],["FRR / Type I","False rejection \u2014 legitimate user denied","Usability / throughput"],["CER (EER)","Crossover error rate \u2014 point where FAR = FRR","Comparing systems (lower is better)"]],"tip":"High-security: tune for low FAR even at the cost of higher FRR. Convenience apps: opposite trade."},{"id":"bia_metrics","name":"BIA time metrics","domain":1,"headers":["Metric","Stands for","Meaning","Constraint"],"rows":[["MTD","Maximum Tolerable Downtime","Outer bound \u2014 exceeding kills the business","Driven by impact tolerance"],["RTO","Recovery Time Objective","Target time to restore operations","RTO \u2264 MTD"],["RPO","Recovery Point Objective","Acceptable data-loss window (backwards)","Drives backup frequency"],["WRT","Work Recovery Time","Time to validate / cleanse / resume after restore","RTO + WRT \u2264 MTD"],["MTBF","Mean Time Between Failures","Reliability metric (hardware)","Higher is better"],["MTTR","Mean Time To Repair","Recoverability metric","Lower is better"]],"tip":"Mnemonic: 'MOMENT' is wrong \u2014 there's no single mnemonic. Just remember RTO+WRT \u2264 MTD and RPO drives backup frequency."},{"id":"cloud_responsibility","name":"Cloud shared responsibility \u2014 who patches what","domain":3,"headers":["Layer","On-prem","IaaS","PaaS","SaaS"],"rows":[["Data classification + IAM","You","You","You","You"],["Application code","You","You","You","Provider"],["Application config","You","You","You","Shared"],["Runtime / middleware","You","You","Provider","Provider"],["Operating system","You","You","Provider","Provider"],["Hypervisor / virtualisation","You","Provider","Provider","Provider"],["Servers / hardware","You","Provider","Provider","Provider"],["Network / storage","You","Provider","Provider","Provider"],["Physical datacenter","You","Provider","Provider","Provider"]],"tip":"You ALWAYS own data classification, identity, and access \u2014 even in SaaS. Provider always owns physical."},{"id":"threat_actor_types","name":"Threat actor types \u2014 motivation \u00d7 resource \u00d7 sophistication","domain":1,"headers":["Actor","Motivation","Resources","Typical TTPs"],"rows":[["Script kiddie","Bragging rights, curiosity","Minimal","Off-the-shelf tools (Metasploit modules), known CVEs"],["Hacktivist","Political / ideological","Variable","DDoS, defacement, leaks (Anonymous, LulzSec patterns)"],["Organised crime","Financial","High","Ransomware, BEC, banking trojans, fraud (Conti, LockBit)"],["Nation-state / APT","Espionage, sabotage, IP theft","Very high","Custom malware, 0-days, long dwell time (APT29, Lazarus)"],["Insider \u2014 malicious","Revenge, financial","Privileged access","Data exfiltration, sabotage from within trusted boundary"],["Insider \u2014 accidental","None (negligence)","n/a","Misconfigured S3 buckets, lost laptops, phishing victims"],["Cyber-terrorist","Disruption, fear","Moderate-high","Critical infrastructure attacks (ICS), high-impact targets"],["Competitor","Industrial espionage","High","Targeted intrusion via insiders or supply chain"]],"tip":"The exam frames threats by motivation more than tool sophistication. Manager-mindset answer: assess threat-actor likelihood \u00d7 impact in your sector."},{"id":"modern_auth","name":"Modern authentication protocols compared","domain":5,"headers":["Protocol","Type","Token","Best for"],"rows":[["SAML 2.0","Federation (XML)","Assertion (XML)","Enterprise B2B SSO, government, legacy apps"],["OAuth 2.0","Authorisation","Access token (opaque or JWT)","API access delegation, third-party integrations"],["OIDC","Authentication on OAuth","ID token (JWT)","Modern web/mobile login, social sign-in"],["FIDO2 / WebAuthn","Phishing-resistant authn","Public-key signature","Strong MFA / passwordless (AAL3 capable)"],["Kerberos","Network authentication","Ticket (encrypted)","AD/Windows domain authentication"],["Passkeys","Synced FIDO2 credential","Public-key signature","Consumer passwordless (sync trade-off)"],["LDAP","Directory protocol","n/a (binds with creds)","Identity store / directory queries"],["RADIUS","Network AAA (UDP)","n/a","Wi-Fi (802.1X), VPN concentrators, ISP dial-in"],["TACACS+","Network device AAA (TCP)","n/a","Router/switch admin, per-command authorisation"]],"tip":"OAuth \u2260 authentication on its own. OIDC adds the auth layer. SAML is enterprise-historical; OIDC is modern-default."},{"id":"incident_evidence_priorities","name":"Incident response \u2014 life-safety priority order","domain":7,"headers":["Rank","Priority","Why"],"rows":[["1","Life safety","Always wins over assets and data \u2014 evacuate, shelter, call emergency services"],["2","Stop ongoing damage","Containment to prevent further harm (isolate, block egress, take systems offline if needed)"],["3","Preserve evidence","Forensic image, memory capture, log preservation BEFORE eradication"],["4","Eradicate root cause","Remove malware, attacker access, vulnerable configs"],["5","Restore operations","Recovery from clean state, verify integrity"],["6","Lessons learned","Document, improve detections, update playbooks"],["7","Communications","Internal comms throughout; external (customers, regulators) per legal requirements and IR plan"]],"tip":"When in doubt: people > property > data. Asking 'what happens to humans?' before 'what happens to systems?' is a recurring CISSP exam pattern."}];
window.__QUESTIONS__ = JSON.parse("[{\"id\":\"D1-001\",\"domain\":1,\"subdomain\":\"1.1 Professional Ethics\",\"difficulty\":\"medium\",\"stem\":\"A CISSP discovers that a colleague is misrepresenting credentials on social media. According to the ISC2 Code of Ethics canon ordering, which obligation MUST be considered FIRST?\",\"choices\":[\"Provide diligent and competent service to principals\",\"Act honorably, honestly, justly, responsibly, and legally\",\"Advance and protect the profession\",\"Protect society, the common good, public trust and the infrastructure\"],\"correct\":3,\"explanation\":\"The ISC2 canons are ordered: (1) protect society, the common good, the necessary public trust and confidence, and the infrastructure; (2) act honorably; (3) provide diligent service; (4) advance the profession. When canons conflict, higher-ordered canons take precedence. Society protection beats personal duty to a colleague. The other choices are real canons but rank lower; choice C is the lowest-ordered canon and is never primary.\",\"source\":\"guide\",\"guide_pages\":[143,144],\"guide_section\":\"Chapter 1 \\u2014 Security Governance Through Principles and Policies\",\"web_sources\":[{\"url\":\"https://www.isc2.org/Ethics\",\"title\":\"ISC2 Code of Ethics\",\"captured\":\"2026-04-26\"},{\"url\":\"https://cissprep.net/domain-1-security-and-risk-management/\",\"title\":\"CISSPrep: Domain 1 \\u2014 Security and Risk Management\",\"captured\":\"2026-04-26\"}],\"references\":[\"ISC2 Code of Ethics\",\"CBK Domain 1\"],\"tags\":[\"ethics\",\"isc2-canons\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D1-002\",\"domain\":1,\"subdomain\":\"1.2 Security Concepts\",\"difficulty\":\"medium\",\"stem\":\"Which property of the CIA triad is MOST directly violated when an attacker performs an SQL injection that modifies records in a customer database without authorisation?\",\"choices\":[\"Confidentiality\",\"Integrity\",\"Availability\",\"Authenticity\"],\"correct\":1,\"explanation\":\"Unauthorised modification of records is an integrity violation \\u2014 the data no longer reflects truth. Confidentiality would be violated by reading the records; availability would require denial of access. Authenticity belongs to the Parkerian Hexad (not CIA), and is closer in spirit to integrity but is not the canonical CIA answer.\",\"source\":\"guide\",\"guide_pages\":[150,151],\"guide_section\":\"Chapter 1 \\u2014 Security Concepts\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-1-security-and-risk-management/\",\"title\":\"DestCert: Unraveling CISSP Domain 1 \\u2014 Security and Risk Management\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"cia\",\"integrity\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D1-003\",\"domain\":1,\"subdomain\":\"1.4 Risk Management\",\"difficulty\":\"hard\",\"stem\":\"An organisation experiences a fire roughly once every 25 years. Each fire causes approximately $2,000,000 in losses to a $10,000,000 facility. What is the annualised loss expectancy (ALE)?\",\"choices\":[\"$80,000\",\"$100,000\",\"$200,000\",\"$400,000\"],\"correct\":0,\"explanation\":\"ALE = SLE \\u00d7 ARO. SLE (single loss expectancy) is the cost of one event = $2,000,000. ARO (annualised rate of occurrence) = 1/25 = 0.04. ALE = $2,000,000 \\u00d7 0.04 = $80,000. The other choices come from common arithmetic mistakes (using the asset value instead of SLE, or using 0.05/0.1/0.2 for ARO).\",\"source\":\"guide\",\"guide_pages\":[300,305],\"guide_section\":\"Chapter 2 \\u2014 Risk Management\",\"web_sources\":[{\"url\":\"https://wentzwu.com/2021/10/03/cissp-practice-questions-20211002/\",\"title\":\"Wentz Wu: CISSP Practice Questions 20211002\",\"captured\":\"2026-04-26\"},{\"url\":\"https://wentzwu.com/2020/04/05/common-bia-terminologies/\",\"title\":\"Wentz Wu: Common BIA Terminologies\",\"captured\":\"2026-04-26\"}],\"references\":[\"NIST SP 800-30\"],\"tags\":[\"risk\",\"ale\",\"quantitative\"],\"notes\":\"\",\"chapter\":1},{\"id\":\"D1-004\",\"domain\":1,\"subdomain\":\"1.4 Risk Management\",\"difficulty\":\"hard\",\"stem\":\"A risk register lists a $500,000 SLE event with an ARO of 0.2. Management is considering a $30,000-per-year control that would cut the ARO in half. What is the BEST justification for purchasing the control?\",\"choices\":[\"The control eliminates the risk entirely\",\"ALE drops from $100,000 to $50,000 \\u2014 a $50,000 annual benefit exceeds the $30,000 cost\",\"ALE drops from $50,000 to $25,000 \\u2014 a $25,000 benefit is still worth $30,000\",\"Quantitative analysis cannot justify spending decisions; only qualitative analysis can\"],\"correct\":1,\"explanation\":\"Pre-control ALE = $500,000 \\u00d7 0.2 = $100,000. Post-control ALE = $500,000 \\u00d7 0.1 = $50,000. Annual loss reduction = $50,000, which exceeds the $30,000 control cost, yielding a $20,000 net benefit. Choice A overstates: controls reduce, rarely eliminate. Choice C miscalculates the SLE. Choice D is false \\u2014 quantitative analysis directly supports cost/benefit decisions.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://wentzwu.com/2021/10/03/cissp-practice-questions-20211002/\",\"title\":\"Wentz Wu: CISSP Practice Questions 20211002\",\"captured\":\"2026-04-26\"},{\"url\":\"https://wentzwu.com/2020/04/05/common-bia-terminologies/\",\"title\":\"Wentz Wu: Common BIA Terminologies\",\"captured\":\"2026-04-26\"},{\"url\":\"https://destcert.com/resources/domain-1-security-and-risk-management/\",\"title\":\"DestCert: Unraveling CISSP Domain 1 \\u2014 Security and Risk Management\",\"captured\":\"2026-04-26\"}],\"references\":[\"NIST SP 800-30\"],\"tags\":[\"risk\",\"ale\",\"cost-benefit\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D1-005\",\"domain\":1,\"subdomain\":\"1.4 Risk Management\",\"difficulty\":\"medium\",\"stem\":\"After implementing all reasonable controls, what BEST describes the risk that remains?\",\"choices\":[\"Inherent risk\",\"Residual risk\",\"Total risk\",\"Secondary risk\"],\"correct\":1,\"explanation\":\"Residual risk is the risk left after controls have been applied. Inherent risk is the risk before any controls are applied. Total risk is the full exposure absent any mitigation. Secondary risk is a risk introduced by a control itself. Management must formally accept residual risk in writing to satisfy due diligence.\",\"source\":\"guide\",\"guide_pages\":[306,307],\"guide_section\":\"Chapter 2 \\u2014 Risk Management\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-1-security-and-risk-management/\",\"title\":\"DestCert: Unraveling CISSP Domain 1 \\u2014 Security and Risk Management\",\"captured\":\"2026-04-26\"},{\"url\":\"https://cissprep.net/domain-1-security-and-risk-management/\",\"title\":\"CISSPrep: Domain 1 \\u2014 Security and Risk Management\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"risk\",\"residual\"],\"notes\":\"\",\"chapter\":1},{\"id\":\"D1-006\",\"domain\":1,\"subdomain\":\"1.4 Risk Management\",\"difficulty\":\"hard\",\"stem\":\"A CISO documents that residual risk exceeds the organisation's risk appetite and recommends an additional control. The CFO refuses funding. What MUST the CISO do FIRST?\",\"choices\":[\"Implement the control anyway, citing professional duty in most enterprise deployments\",\"Resign and report to ISC2 as a baseline configuration when properly implemented\",\"Obtain formal written acceptance of the residual risk by an authorised business owner\",\"Escalate immediately to external regulators in most enterprise deployments\"],\"correct\":2,\"explanation\":\"When risk exceeds appetite and treatment is declined, the CISO's manager-level duty is to obtain formal written risk acceptance from a business owner with the authority to accept it. That documents the decision and shifts accountability appropriately. Implementing controls without authorisation oversteps; resignation skips proper escalation; external reporting is premature without an actual legal/regulatory violation.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-1-security-and-risk-management/\",\"title\":\"DestCert: Unraveling CISSP Domain 1 \\u2014 Security and Risk Management\",\"captured\":\"2026-04-26\"},{\"url\":\"https://wentzwu.com/2021/10/03/cissp-practice-questions-20211002/\",\"title\":\"Wentz Wu: CISSP Practice Questions 20211002\",\"captured\":\"2026-04-26\"},{\"url\":\"https://www.isc2.org/Ethics\",\"title\":\"ISC2 Code of Ethics\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"risk-acceptance\",\"manager-mindset\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D1-007\",\"domain\":1,\"subdomain\":\"1.7 Threat Modeling\",\"difficulty\":\"medium\",\"stem\":\"STRIDE classifies a phishing email that tricks a user into entering credentials on a fake page as which threat type?\",\"choices\":[\"Tampering\",\"Repudiation\",\"Spoofing\",\"Elevation of Privilege\"],\"correct\":2,\"explanation\":\"Phishing relies on impersonating a trusted entity \\u2014 that is spoofing. Tampering involves modifying data; repudiation is denying an action; elevation of privilege is gaining higher rights than authorised. Although the eventual outcome may be EoP if the harvested credentials are admin, the initial attack vector being modeled is spoofing.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/threat-modeling-methodologies/\",\"title\":\"DestCert: Threat Modeling Methodologies \\u2014 STRIDE, PASTA, DREAD\",\"captured\":\"2026-04-26\"},{\"url\":\"https://www.softwaresecured.com/post/comparison-of-stride-dread-pasta\",\"title\":\"SoftwareSecured: Comparison of STRIDE, DREAD & PASTA\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"stride\",\"threat-modeling\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D1-008\",\"domain\":1,\"subdomain\":\"1.7 Threat Modeling\",\"difficulty\":\"medium\",\"stem\":\"Which threat-modeling methodology is described as risk-centric and explicitly aligned to business objectives, taking an attacker-centric view across seven stages?\",\"choices\":[\"STRIDE\",\"DREAD\",\"PASTA\",\"VAST\"],\"correct\":2,\"explanation\":\"PASTA (Process for Attack Simulation and Threat Analysis) is a seven-stage, risk-centric, business-aligned methodology. STRIDE is threat-categorisation. DREAD is severity-scoring. VAST (Visual, Agile, Simple Threat) targets large-scale Agile development with two distinct flow diagrams (application/operational).\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/threat-modeling-methodologies/\",\"title\":\"DestCert: Threat Modeling Methodologies \\u2014 STRIDE, PASTA, DREAD\",\"captured\":\"2026-04-26\"},{\"url\":\"https://www.softwaresecured.com/post/comparison-of-stride-dread-pasta\",\"title\":\"SoftwareSecured: Comparison of STRIDE, DREAD & PASTA\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"pasta\",\"threat-modeling\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D1-009\",\"domain\":1,\"subdomain\":\"1.3 Compliance\",\"difficulty\":\"medium\",\"stem\":\"Under GDPR, the role with the LEGAL obligation to determine the purposes and means of processing personal data is the:\",\"choices\":[\"Data Processor\",\"Data Controller\",\"Data Protection Officer\",\"Data Subject\"],\"correct\":1,\"explanation\":\"GDPR Article 4(7) defines the controller as the entity that determines the purposes and means of processing \\u2014 that is the locus of legal accountability. Processors act on the controller's instructions. The DPO advises and monitors. The data subject is the individual whose data is processed. CISSP routinely tests this controller-vs-processor distinction.\",\"source\":\"guide\",\"guide_pages\":[270,275],\"guide_section\":\"Chapter 4 \\u2014 Laws, Regulations, and Compliance\",\"web_sources\":[{\"url\":\"https://cissprep.net/domain-1-security-and-risk-management/\",\"title\":\"CISSPrep: Domain 1 \\u2014 Security and Risk Management\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"gdpr\",\"controller\",\"privacy\"],\"notes\":\"\",\"chapter\":1},{\"id\":\"D1-010\",\"domain\":1,\"subdomain\":\"1.3 Compliance\",\"difficulty\":\"easy\",\"stem\":\"Which regulation specifically governs the protection of cardholder data?\",\"choices\":[\"HIPAA\",\"SOX\",\"PCI-DSS\",\"GLBA\"],\"correct\":2,\"explanation\":\"PCI-DSS (Payment Card Industry Data Security Standard) is the contractual framework imposed by the major card brands to protect cardholder data. HIPAA covers protected health information; SOX governs financial reporting controls for public companies; GLBA covers financial institution privacy. Note PCI-DSS is contractual, not statutory.\",\"source\":\"guide\",\"guide_pages\":[265,270],\"guide_section\":\"Chapter 4 \\u2014 Compliance\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-1-security-and-risk-management/\",\"title\":\"DestCert: Unraveling CISSP Domain 1 \\u2014 Security and Risk Management\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"pci-dss\",\"compliance\"],\"notes\":\"\",\"chapter\":1},{\"id\":\"D1-011\",\"domain\":1,\"subdomain\":\"1.10 BCP\",\"difficulty\":\"medium\",\"stem\":\"Which Business Impact Analysis (BIA) metric represents the LONGEST time a business process can be inoperative before the organisation's survival is threatened?\",\"choices\":[\"Recovery Time Objective (RTO)\",\"Recovery Point Objective (RPO)\",\"Maximum Tolerable Downtime (MTD)\",\"Work Recovery Time (WRT)\"],\"correct\":2,\"explanation\":\"MTD (also called Maximum Allowable Downtime) is the absolute outer bound \\u2014 exceeding it threatens the business. RTO is the target restoration time and must be \\u2264 MTD. RPO is the data-loss tolerance measured backward from incident time. WRT is post-restoration work needed before the system is production-ready (RTO + WRT \\u2264 MTD).\",\"source\":\"guide\",\"guide_pages\":[330,335],\"guide_section\":\"Chapter 3 \\u2014 Business Continuity Planning\",\"web_sources\":[{\"url\":\"https://wentzwu.com/2020/04/05/common-bia-terminologies/\",\"title\":\"Wentz Wu: Common BIA Terminologies\",\"captured\":\"2026-04-26\"},{\"url\":\"https://destcert.com/resources/domain-1-security-and-risk-management/\",\"title\":\"DestCert: Unraveling CISSP Domain 1 \\u2014 Security and Risk Management\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"bia\",\"mtd\",\"rto\",\"rpo\"],\"notes\":\"\",\"chapter\":1},{\"id\":\"D1-012\",\"domain\":1,\"subdomain\":\"1.10 BCP\",\"difficulty\":\"medium\",\"stem\":\"An organisation declares an RPO of 4 hours for a customer-facing transactional database. Which backup strategy BEST satisfies this objective?\",\"choices\":[\"Daily full backups stored offsite\",\"Continuous transaction log shipping with replay every 30 minutes\",\"Weekly full + nightly differential\",\"Snapshots taken every 8 hours for general production deployments\"],\"correct\":1,\"explanation\":\"RPO = 4 hours bounds maximum acceptable data loss. Continuous log shipping with frequent replay (every 30 minutes) keeps the recovery point well within 4 hours. Daily backups risk up to 24 hours of loss; weekly+nightly risks 24+ hours; 8-hour snapshots exceed the RPO budget under worst-case timing.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://wentzwu.com/2020/04/05/common-bia-terminologies/\",\"title\":\"Wentz Wu: Common BIA Terminologies\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"rpo\",\"backup\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D1-013\",\"domain\":1,\"subdomain\":\"1.10 BCP\",\"difficulty\":\"medium\",\"stem\":\"What is the PRIMARY purpose of a Business Impact Analysis (BIA)?\",\"choices\":[\"Identify the cost of all possible threats\",\"Identify critical processes and the impact of their disruption\",\"Define recovery procedures across the relevant policy framework\",\"Test the disaster recovery plan\"],\"correct\":1,\"explanation\":\"A BIA identifies critical functions, the impact of their disruption, and the time-based metrics (MTD, RTO, RPO, WRT) that drive the rest of BCP/DRP. Threat enumeration is part of risk assessment, recovery procedures are produced after the BIA, and DR testing comes after recovery procedures exist.\",\"source\":\"guide\",\"guide_pages\":[330,332],\"guide_section\":\"Chapter 3 \\u2014 BIA\",\"web_sources\":[{\"url\":\"https://wentzwu.com/2020/04/05/common-bia-terminologies/\",\"title\":\"Wentz Wu: Common BIA Terminologies\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"bia\"],\"notes\":\"\",\"chapter\":1},{\"id\":\"D1-014\",\"domain\":1,\"subdomain\":\"1.4 Risk Treatment\",\"difficulty\":\"easy\",\"stem\":\"Insuring against a risk is an example of which risk treatment?\",\"choices\":[\"Mitigation\",\"Avoidance\",\"Acceptance\",\"Transference\"],\"correct\":3,\"explanation\":\"Buying insurance transfers (shares) the financial impact to a third party \\u2014 that is risk transference. Mitigation reduces likelihood or impact. Avoidance changes the activity to remove the risk. Acceptance means continuing the activity and absorbing the loss. Note: insurance does not transfer reputational or regulatory consequences.\",\"source\":\"guide\",\"guide_pages\":[310,312],\"guide_section\":\"Chapter 2 \\u2014 Risk Treatment\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-1-security-and-risk-management/\",\"title\":\"DestCert: Unraveling CISSP Domain 1 \\u2014 Security and Risk Management\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"risk-treatment\",\"transference\"],\"notes\":\"\",\"chapter\":1},{\"id\":\"D1-015\",\"domain\":1,\"subdomain\":\"1.5 Documentation Hierarchy\",\"difficulty\":\"medium\",\"stem\":\"Which document type is a HIGH-LEVEL, mandatory statement of management intent that other security documents derive from?\",\"choices\":[\"Procedure\",\"Standard\",\"Policy\",\"Guideline\"],\"correct\":2,\"explanation\":\"A policy is the high-level mandatory statement from management. Standards specify mandatory technical/configuration choices that implement policy. Procedures are step-by-step instructions. Guidelines are recommended (not mandatory). The CISSP exam frequently tests this hierarchy: Policy \\u2192 Standard \\u2192 Procedure / Guideline.\",\"source\":\"guide\",\"guide_pages\":[183,188],\"guide_section\":\"Chapter 1 \\u2014 Security Documentation\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-1-security-and-risk-management/\",\"title\":\"DestCert: Unraveling CISSP Domain 1 \\u2014 Security and Risk Management\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"policy\",\"standards\",\"documentation\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D1-016\",\"domain\":1,\"subdomain\":\"1.6 Personnel Security\",\"difficulty\":\"easy\",\"stem\":\"Why is mandatory vacation an effective security control?\",\"choices\":[\"It increases morale for general production deployments under typical operating conditions\",\"It allows independent personnel to detect fraud or hidden errors during the absence\",\"It reduces payroll costs in standard practice\",\"It satisfies labor laws in most enterprise deployments\"],\"correct\":1,\"explanation\":\"Mandatory vacation forces a substitute to perform the absent person's duties, which exposes ongoing fraud, embezzlement, or unsafe practices that depend on continual control by one individual. The other answers are tangential or incorrect \\u2014 payroll is not reduced and labor laws are not the security driver.\",\"source\":\"guide\",\"guide_pages\":[290,293],\"guide_section\":\"Chapter 2 \\u2014 Personnel Security\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-1-security-and-risk-management/\",\"title\":\"DestCert: Unraveling CISSP Domain 1 \\u2014 Security and Risk Management\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"personnel-security\",\"fraud-detection\"],\"notes\":\"\",\"chapter\":1},{\"id\":\"D1-017\",\"domain\":1,\"subdomain\":\"1.6 Personnel Security\",\"difficulty\":\"medium\",\"stem\":\"The PRIMARY reason to enforce separation of duties is to:\",\"choices\":[\"Improve operational efficiency when properly implemented\",\"Ensure no single individual can complete a sensitive transaction unilaterally\",\"Comply with HR policy in most operational contexts for the purposes of this question\",\"Provide career development opportunities under typical operating conditions\"],\"correct\":1,\"explanation\":\"Separation of duties prevents fraud and error by requiring collusion among multiple people to complete sensitive workflows (e.g., requesting + approving payments). It is a manager-mindset preventive control. Efficiency, HR policy, and career development are not the primary security drivers and may even be hindered by SoD.\",\"source\":\"guide\",\"guide_pages\":[290,295],\"guide_section\":\"Chapter 2 \\u2014 Personnel Security\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-1-security-and-risk-management/\",\"title\":\"DestCert: Unraveling CISSP Domain 1 \\u2014 Security and Risk Management\",\"captured\":\"2026-04-26\"},{\"url\":\"https://cissprep.net/domain-1-security-and-risk-management/\",\"title\":\"CISSPrep: Domain 1 \\u2014 Security and Risk Management\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"separation-of-duties\"],\"notes\":\"\",\"chapter\":1},{\"id\":\"D1-018\",\"domain\":1,\"subdomain\":\"1.5 Governance\",\"difficulty\":\"medium\",\"stem\":\"Which statement BEST distinguishes due care from due diligence?\",\"choices\":[\"Due care is annual; due diligence is monthly\",\"Due care is the continuous monitoring; due diligence is the implementation of controls\",\"Due care is implementing reasonable controls; due diligence is the ongoing investigation and verification\",\"They are synonymous in CISSP usage\"],\"correct\":2,\"explanation\":\"Due care = doing what a reasonable person would do (implementing the controls). Due diligence = the ongoing investigation, validation, and verification that controls remain appropriate (think: the homework). The CBK frames the two as paired managerial obligations. Choices A, B, and D either reverse the meaning or trivialise the distinction.\",\"source\":\"guide\",\"guide_pages\":[180,184],\"guide_section\":\"Chapter 1 \\u2014 Due Care vs Due Diligence\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/threat-modeling-methodologies/\",\"title\":\"DestCert: Threat Modeling Methodologies \\u2014 STRIDE, PASTA, DREAD\",\"captured\":\"2026-04-26\"},{\"url\":\"https://destcert.com/resources/domain-1-security-and-risk-management/\",\"title\":\"DestCert: Unraveling CISSP Domain 1 \\u2014 Security and Risk Management\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"due-care\",\"due-diligence\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D1-019\",\"domain\":1,\"subdomain\":\"1.7 Supply Chain\",\"difficulty\":\"medium\",\"stem\":\"Which document is MOST appropriate to require a third-party processor to commit to specific service-level metrics with measurable penalties?\",\"choices\":[\"Memorandum of Understanding (MOU)\",\"Service Level Agreement (SLA)\",\"Interconnection Security Agreement (ISA)\",\"Non-Disclosure Agreement (NDA)\"],\"correct\":1,\"explanation\":\"An SLA is the binding agreement that codifies measurable service metrics (uptime, response time, etc.) and penalties for non-conformance. An MOU is informal and typically lacks penalties. An ISA governs the technical interconnection between systems. An NDA addresses confidentiality only.\",\"source\":\"guide\",\"guide_pages\":[285,290],\"guide_section\":\"Chapter 2 \\u2014 Third-Party Risk\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-1-security-and-risk-management/\",\"title\":\"DestCert: Unraveling CISSP Domain 1 \\u2014 Security and Risk Management\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"sla\",\"third-party\"],\"notes\":\"\",\"chapter\":1},{\"id\":\"D1-020\",\"domain\":1,\"subdomain\":\"1.5 Frameworks\",\"difficulty\":\"medium\",\"stem\":\"Which framework provides a structured six-step Risk Management Framework process: Categorise \\u2192 Select \\u2192 Implement \\u2192 Assess \\u2192 Authorise \\u2192 Monitor?\",\"choices\":[\"ISO 27001\",\"NIST SP 800-37\",\"COBIT 2019\",\"ITIL 4\"],\"correct\":1,\"explanation\":\"NIST SP 800-37 defines the RMF six-step process used by federal information systems and widely adopted commercially. ISO 27001 establishes an ISMS using a Plan-Do-Check-Act cycle (or the simplified ISO Annex SL structure). COBIT focuses on IT governance; ITIL on service management.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://csrc.nist.gov/pubs/sp/800/37/r2/final\",\"title\":\"NIST SP 800-37 Rev 2: Risk Management Framework (RMF)\",\"captured\":\"2026-04-26\"},{\"url\":\"https://csrc.nist.gov/pubs/sp/800/30/r1/final\",\"title\":\"NIST SP 800-30 Rev 1: Guide for Conducting Risk Assessments\",\"captured\":\"2026-04-26\"}],\"references\":[\"NIST SP 800-37 Rev 2\"],\"tags\":[\"nist-rmf\",\"frameworks\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D1-021\",\"domain\":1,\"subdomain\":\"1.4 Qualitative\",\"difficulty\":\"medium\",\"stem\":\"When quantitative data are unavailable, which technique BEST captures expert judgment about risk likelihood and impact?\",\"choices\":[\"Monte Carlo simulation\",\"Delphi technique with structured anonymous expert input\",\"Net present value analysis\",\"Failure Mode and Effects Analysis (FMEA)\"],\"correct\":1,\"explanation\":\"The Delphi technique iteratively gathers anonymous expert opinions to converge on a qualitative risk view, deliberately avoiding groupthink. Monte Carlo and NPV are quantitative. FMEA is structured but more focused on individual failure modes than qualitative risk synthesis.\",\"source\":\"guide\",\"guide_pages\":[315,318],\"guide_section\":\"Chapter 2 \\u2014 Qualitative Risk\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-1-security-and-risk-management/\",\"title\":\"DestCert: Unraveling CISSP Domain 1 \\u2014 Security and Risk Management\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"qualitative\",\"delphi\"],\"notes\":\"\",\"chapter\":1},{\"id\":\"D1-022\",\"domain\":1,\"subdomain\":\"1.6 Awareness\",\"difficulty\":\"medium\",\"stem\":\"What is the BEST way to ensure that security policies actually change user behaviour?\",\"choices\":[\"Publishing policies on the intranet\",\"Annual e-learning module followed by acknowledgement\",\"Continuous, role-targeted security awareness with reinforcement\",\"Posting reminder posters in break rooms\"],\"correct\":2,\"explanation\":\"Continuous, role-targeted training reinforced over time changes behaviour and is the manager-mindset best practice. Publishing on intranet alone is passive. Annual e-learning is a baseline minimum but not enough on its own. Posters are awareness reminders, not training.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://cissprep.net/domain-1-security-and-risk-management/\",\"title\":\"CISSPrep: Domain 1 \\u2014 Security and Risk Management\",\"captured\":\"2026-04-26\"},{\"url\":\"https://destcert.com/resources/domain-1-security-and-risk-management/\",\"title\":\"DestCert: Unraveling CISSP Domain 1 \\u2014 Security and Risk Management\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"awareness\",\"training\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D1-023\",\"domain\":1,\"subdomain\":\"1.4 Risk Assessment\",\"difficulty\":\"hard\",\"stem\":\"An organisation faces a $1M loss event with an estimated 15% annual probability. A vendor proposes a $100K-per-year managed service that would reduce that probability to 2%. From a pure cost-benefit perspective, what is the BEST decision?\",\"choices\":[\"Reject \\u2014 control cost exceeds residual ALE reduction\",\"Accept \\u2014 net annual benefit is approximately $30,000\",\"Defer \\u2014 additional qualitative analysis is required first\",\"Reject \\u2014 controls cannot reduce probability below 5%\"],\"correct\":1,\"explanation\":\"Pre-control ALE = $1,000,000 \\u00d7 0.15 = $150,000. Post-control ALE = $1,000,000 \\u00d7 0.02 = $20,000. Annual benefit = $130,000. Net benefit after $100,000 cost = $30,000 \\u2014 accept the control. Choice A miscalculates; choice C is unnecessary when the math is clear; choice D is fictional.\",\"source\":\"canonical\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://wentzwu.com/2021/10/03/cissp-practice-questions-20211002/\",\"title\":\"Wentz Wu: CISSP Practice Questions 20211002\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"risk\",\"ale\",\"manager-mindset\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D1-024\",\"domain\":1,\"subdomain\":\"1.5 Governance\",\"difficulty\":\"medium\",\"stem\":\"Which body should ULTIMATELY be accountable for an organisation's information security strategy?\",\"choices\":[\"Chief Information Security Officer\",\"IT Operations team\",\"Board of Directors / executive leadership\",\"Internal audit function\"],\"correct\":2,\"explanation\":\"Information security is a governance function \\u2014 accountability rests with the board / executive leadership. The CISO is responsible for execution, but accountability cannot be delegated. IT Operations runs systems; internal audit validates but does not own the strategy. The exam consistently picks the most senior business-leadership answer.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-1-security-and-risk-management/\",\"title\":\"DestCert: Unraveling CISSP Domain 1 \\u2014 Security and Risk Management\",\"captured\":\"2026-04-26\"},{\"url\":\"https://www.isc2.org/Insights/2023/11/Changes-to-CISSP-Exam-Weighting\",\"title\":\"ISC2 Insights: Changes to the CISSP Exam Weighting\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"governance\",\"accountability\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D1-025\",\"domain\":1,\"subdomain\":\"1.3 Privacy\",\"difficulty\":\"medium\",\"stem\":\"Under GDPR, what is the maximum administrative fine for the MOST serious infringements (e.g., violations of basic principles for processing)?\",\"choices\":[\"\\u20ac10 million or 2% of global annual turnover (whichever is higher)\",\"\\u20ac20 million or 4% of global annual turnover (whichever is higher)\",\"$1 million flat fine\",\"Equal to the harm caused\"],\"correct\":1,\"explanation\":\"GDPR's higher tier is up to \\u20ac20M or 4% of global annual turnover, whichever is higher. The lower tier (10M / 2%) applies to certain administrative infringements such as failing to maintain records. Choices C and D do not match GDPR. CISSP candidates should remember both tiers and which violations trigger each.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-1-security-and-risk-management/\",\"title\":\"DestCert: Unraveling CISSP Domain 1 \\u2014 Security and Risk Management\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"gdpr\",\"fines\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D1-026\",\"domain\":1,\"subdomain\":\"1.10 DRP\",\"difficulty\":\"medium\",\"stem\":\"An IT manager wants to validate the DR plan with the LEAST disruption to production. Which test type is MOST appropriate?\",\"choices\":[\"Full interruption test\",\"Parallel test\",\"Simulation test\",\"Tabletop / structured walkthrough\"],\"correct\":3,\"explanation\":\"Tabletop (structured walkthrough) is the lowest-disruption test \\u2014 participants discuss the plan against scenarios, no systems are touched. Simulation is more involved. Parallel runs DR systems alongside production. Full interruption shifts production to the DR site and is the most disruptive but most thorough.\",\"source\":\"guide\",\"guide_pages\":[355,360],\"guide_section\":\"Chapter 3 \\u2014 DR Testing\",\"web_sources\":[],\"references\":[],\"tags\":[\"drp\",\"testing\"],\"notes\":\"\",\"chapter\":1},{\"id\":\"D1-027\",\"domain\":1,\"subdomain\":\"1.10 BCP\",\"difficulty\":\"medium\",\"stem\":\"Which is the FIRST step a BCP coordinator should take when starting a new BCP program?\",\"choices\":[\"Conduct the BIA for general production deployments\",\"Obtain senior management commitment and a written project mandate\",\"Identify recovery sites\",\"Run a tabletop exercise\"],\"correct\":1,\"explanation\":\"Without senior management sponsorship, BCP cannot succeed \\u2014 funding, authority, and scope all depend on it. Senior commitment must come before the BIA, recovery strategies, and testing. This is a recurring CISSP pattern: 'Get management buy-in first.'\",\"source\":\"guide\",\"guide_pages\":[325,327],\"guide_section\":\"Chapter 3 \\u2014 BCP Initiation\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-1-security-and-risk-management/\",\"title\":\"DestCert: Unraveling CISSP Domain 1 \\u2014 Security and Risk Management\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"bcp\",\"manager-mindset\"],\"notes\":\"\",\"chapter\":1},{\"id\":\"D1-028\",\"domain\":1,\"subdomain\":\"1.9 Risk Frameworks\",\"difficulty\":\"medium\",\"stem\":\"Which risk framework consists of three lines of defence: operational management, risk/compliance functions, and internal audit?\",\"choices\":[\"ISO 31000\",\"COSO ERM\",\"Three Lines Model (IIA)\",\"FAIR\"],\"correct\":2,\"explanation\":\"The IIA's Three Lines Model formalises three lines: management (1st), risk and compliance (2nd), internal audit (3rd) reporting to the governing body. ISO 31000 is risk management principles. COSO ERM is enterprise risk management framework. FAIR is a quantitative risk-analysis methodology.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-1-security-and-risk-management/\",\"title\":\"DestCert: Unraveling CISSP Domain 1 \\u2014 Security and Risk Management\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"governance\",\"three-lines\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D1-029\",\"domain\":1,\"subdomain\":\"1.4 Quantitative\",\"difficulty\":\"hard\",\"stem\":\"An organisation calculates that a $200,000 asset will lose 25% of its value if a flood occurs, and floods occur with an annual probability of 0.05. What is the SLE?\",\"choices\":[\"$2,500\",\"$10,000\",\"$50,000\",\"$200,000\"],\"correct\":2,\"explanation\":\"SLE = AV \\u00d7 EF = $200,000 \\u00d7 0.25 = $50,000. ALE would be SLE \\u00d7 ARO = $50,000 \\u00d7 0.05 = $2,500. Choice A confuses SLE with ALE; choice B is a partial computation; choice D is the asset value itself.\",\"source\":\"guide\",\"guide_pages\":[300,305],\"guide_section\":\"Chapter 2 \\u2014 Quantitative Risk\",\"web_sources\":[{\"url\":\"https://wentzwu.com/2021/10/03/cissp-practice-questions-20211002/\",\"title\":\"Wentz Wu: CISSP Practice Questions 20211002\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"sle\",\"ef\",\"quantitative\"],\"notes\":\"\",\"chapter\":1},{\"id\":\"D1-030\",\"domain\":1,\"subdomain\":\"1.5 Frameworks\",\"difficulty\":\"medium\",\"stem\":\"Which framework's six core functions are Govern, Identify, Protect, Detect, Respond, and Recover?\",\"choices\":[\"ISO 27001\",\"NIST CSF 2.0\",\"COBIT 2019\",\"PCI-DSS\"],\"correct\":1,\"explanation\":\"NIST CSF 2.0 (Feb 2024) defines six core functions: Govern (NEW in 2.0), Identify, Protect, Detect, Respond, Recover. CSF 1.1's five functions (IPDRR) were extended with Govern to formalise leadership/oversight responsibilities including supply chain risk management. ISO 27001 uses ISMS clauses + Annex A controls. COBIT uses governance/management objectives. PCI-DSS uses 12 requirements.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://www.nist.gov/cyberframework\",\"title\":\"NIST Cybersecurity Framework (CSF) 2.0\",\"captured\":\"2026-04-26\"}],\"references\":[\"NIST CSF 2.0\"],\"tags\":[\"nist-csf\",\"frameworks\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D1-031\",\"domain\":1,\"subdomain\":\"1.7 Threat Modeling\",\"difficulty\":\"easy\",\"stem\":\"DREAD scores threats on five attributes. Which set of attributes is correct?\",\"choices\":[\"Damage, Reproducibility, Exploitability, Affected users, Discoverability\",\"Damage, Reach, Exposure, Awareness, Detection\",\"Detect, Recover, Eradicate, Analyze, Document\",\"Damage, Risk, Effect, Asset, Defence under typical compliance requirements\"],\"correct\":0,\"explanation\":\"DREAD = Damage, Reproducibility, Exploitability, Affected users, Discoverability \\u2014 Microsoft's threat-severity SCORING method, often paired with STRIDE (which categorises) for end-to-end threat modeling. Choice B invents 'Reach/Exposure/Awareness/Detection'. Choice C is a generic incident-response acronym. Choice D blends real and invented words. Mnemonic: Damage you do, can it be Reproduced, Exploited, who's Affected, and how Discoverable is it?\",\"source\":\"guide\",\"guide_pages\":[392,397],\"guide_section\":\"Chapter 1 \\u2014 STRIDE / DREAD / PASTA\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/threat-modeling-methodologies/\",\"title\":\"DestCert: Threat Modeling Methodologies \\u2014 STRIDE, PASTA, DREAD\",\"captured\":\"2026-04-26\"},{\"url\":\"https://www.softwaresecured.com/post/comparison-of-stride-dread-pasta\",\"title\":\"SoftwareSecured: Comparison of STRIDE, DREAD & PASTA\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"dread\",\"threat-modeling\"],\"notes\":\"\",\"chapter\":1},{\"id\":\"D1-032\",\"domain\":1,\"subdomain\":\"1.7 Threat Modeling\",\"difficulty\":\"medium\",\"stem\":\"Which threat modeling methodology focuses on creating a separate application threat model and an operational threat model that work together?\",\"choices\":[\"STRIDE\",\"PASTA\",\"VAST\",\"Trike\"],\"correct\":2,\"explanation\":\"VAST (Visual, Agile, Simple Threat) deliberately produces both an application threat model (application flow diagrams) and an operational threat model (process flow diagrams). STRIDE/PASTA do not enforce that two-diagram split. Trike is a risk-based approach focused on stakeholder acceptance.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/threat-modeling-methodologies/\",\"title\":\"DestCert: Threat Modeling Methodologies \\u2014 STRIDE, PASTA, DREAD\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"vast\",\"threat-modeling\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D1-033\",\"domain\":1,\"subdomain\":\"1.3 Compliance\",\"difficulty\":\"medium\",\"stem\":\"Which US regulation imposes financial-reporting internal-control requirements on PUBLIC companies and led to widespread Section 302/404 attestations?\",\"choices\":[\"HIPAA\",\"GLBA\",\"SOX\",\"FERPA\"],\"correct\":2,\"explanation\":\"Sarbanes-Oxley (SOX) imposed CEO/CFO attestations and ICFR requirements on US public companies after Enron/WorldCom. HIPAA = healthcare privacy; GLBA = financial privacy; FERPA = student records. CISSP candidates should associate SOX with internal controls over financial reporting.\",\"source\":\"guide\",\"guide_pages\":[268,273],\"guide_section\":\"Chapter 4 \\u2014 US Compliance\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-1-security-and-risk-management/\",\"title\":\"DestCert: Unraveling CISSP Domain 1 \\u2014 Security and Risk Management\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"sox\",\"compliance\"],\"notes\":\"\",\"chapter\":1},{\"id\":\"D1-034\",\"domain\":1,\"subdomain\":\"1.10 BCP\",\"difficulty\":\"hard\",\"stem\":\"Which BIA output is calculated as the sum of an asset's RTO plus the time required to restore data and resume normal operations?\",\"choices\":[\"MTD\",\"MTBF\",\"WRT\",\"RPO\"],\"correct\":2,\"explanation\":\"WRT (Work Recovery Time) is the additional time after RTO to restore data, validate, and bring the function back to normal. MTD \\u2265 RTO + WRT. MTBF measures hardware reliability. RPO bounds data-loss tolerance backward from the incident.\",\"source\":\"guide\",\"guide_pages\":[332,335],\"guide_section\":\"Chapter 3 \\u2014 BIA Time Metrics\",\"web_sources\":[{\"url\":\"https://wentzwu.com/2020/04/05/common-bia-terminologies/\",\"title\":\"Wentz Wu: Common BIA Terminologies\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"wrt\",\"bia\"],\"notes\":\"\",\"chapter\":1},{\"id\":\"D1-035\",\"domain\":1,\"subdomain\":\"1.6 Personnel Security\",\"difficulty\":\"medium\",\"stem\":\"What is the PRIMARY purpose of job rotation as a security control?\",\"choices\":[\"Reduce employee turnover when applied to standard enterprise environments\",\"Cross-train staff and detect malicious or fraudulent activity\",\"Equalise compensation across functions\",\"Reduce the need for separation of duties\"],\"correct\":1,\"explanation\":\"Job rotation cross-trains staff (resilience benefit) AND surfaces ongoing fraud or shortcuts when a substitute takes the role \\u2014 that's the security purpose. Choice A (turnover) is HR. Choice C (compensation) is HR. Choice D is wrong \\u2014 rotation COMPLEMENTS separation of duties, never replaces it. The exam pattern: rotation + SoD + mandatory vacation form a triad of fraud-detection personnel controls.\",\"source\":\"guide\",\"guide_pages\":[291,295],\"guide_section\":\"Chapter 2 \\u2014 Personnel Security\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-1-security-and-risk-management/\",\"title\":\"DestCert: Unraveling CISSP Domain 1 \\u2014 Security and Risk Management\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"job-rotation\",\"personnel\"],\"notes\":\"\",\"chapter\":1},{\"id\":\"D1-036\",\"domain\":1,\"subdomain\":\"1.7 Supply Chain\",\"difficulty\":\"medium\",\"stem\":\"Which document type formalises the security and technical requirements for two organisations whose systems will exchange data?\",\"choices\":[\"MOU\",\"ISA\",\"SLA\",\"BPA\"],\"correct\":1,\"explanation\":\"An Interconnection Security Agreement (ISA) governs the technical and security details of interconnected systems between organisations (NIST SP 800-47 introduced this). MOU is a high-level intent statement, SLA is metric-driven, BPA is a business partnership agreement.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-1-security-and-risk-management/\",\"title\":\"DestCert: Unraveling CISSP Domain 1 \\u2014 Security and Risk Management\",\"captured\":\"2026-04-26\"}],\"references\":[\"NIST SP 800-47\"],\"tags\":[\"isa\",\"third-party\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D1-037\",\"domain\":1,\"subdomain\":\"1.4 Risk\",\"difficulty\":\"hard\",\"stem\":\"An organisation discovers a vulnerability with a high impact but no known exploit and no compensating controls. The cost of remediation is low. The BEST course of action is to:\",\"choices\":[\"Accept the risk\",\"Mitigate by remediating\",\"Avoid by retiring the system\",\"Transfer by purchasing insurance\"],\"correct\":1,\"explanation\":\"When remediation is cheap and impact is high, mitigation is the rational choice \\u2014 accepting needlessly leaves exposure, avoidance is excessive, and insurance does not eliminate the underlying flaw. The exam tests cost/impact judgment routinely.\",\"source\":\"canonical\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://wentzwu.com/2021/10/03/cissp-practice-questions-20211002/\",\"title\":\"Wentz Wu: CISSP Practice Questions 20211002\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"risk-treatment\",\"manager-mindset\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D1-038\",\"domain\":1,\"subdomain\":\"1.4 Risk\",\"difficulty\":\"medium\",\"stem\":\"Which statement BEST describes the relationship between qualitative and quantitative risk analysis?\",\"choices\":[\"Qualitative is always preferred for executive presentations when properly implemented\",\"Quantitative is always more accurate in most operational contexts in commonly cited frameworks\",\"Both have value; qualitative captures intangibles while quantitative supports cost-benefit calculation\",\"They produce identical results when properly applied in commonly cited frameworks\"],\"correct\":2,\"explanation\":\"Quantitative analysis enables cost-benefit decisions through hard numbers; qualitative captures intangibles like reputation that resist monetisation. Mature programs use both. Choice A overstates qualitative; choice B ignores GIGO problems with bad inputs; choice D is false.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-1-security-and-risk-management/\",\"title\":\"DestCert: Unraveling CISSP Domain 1 \\u2014 Security and Risk Management\",\"captured\":\"2026-04-26\"},{\"url\":\"https://wentzwu.com/2021/10/03/cissp-practice-questions-20211002/\",\"title\":\"Wentz Wu: CISSP Practice Questions 20211002\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"risk\",\"qualitative\",\"quantitative\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D1-039\",\"domain\":1,\"subdomain\":\"1.10 BCP Sites\",\"difficulty\":\"medium\",\"stem\":\"When picking a recovery site, which factor MOST argues against choosing a hot site?\",\"choices\":[\"Recovery time\",\"Cost\",\"Geographic resilience\",\"Data freshness\"],\"correct\":1,\"explanation\":\"Hot sites have the highest cost (always-on infrastructure, licensed software, near-real-time data sync). They deliver the fastest recovery and freshest data, both of which are advantages, not arguments against. Geographic resilience is a property of any well-sited recovery facility.\",\"source\":\"guide\",\"guide_pages\":[345,350],\"guide_section\":\"Chapter 3 \\u2014 Recovery Sites\",\"web_sources\":[],\"references\":[],\"tags\":[\"recovery-sites\",\"hot-site\"],\"notes\":\"\",\"chapter\":1},{\"id\":\"D1-040\",\"domain\":1,\"subdomain\":\"1.5 Governance\",\"difficulty\":\"medium\",\"stem\":\"Which is the BEST description of a security policy exception?\",\"choices\":[\"A formally approved deviation with documented compensating controls and time bound\",\"An undocumented manager override\",\"An informal verbal agreement in most operational contexts\",\"A standing exemption granted at hire\"],\"correct\":0,\"explanation\":\"Policy exceptions must be FORMALLY APPROVED, TIME-BOUND, DOCUMENTED, and carry COMPENSATING CONTROLS \\u2014 anything less and the auditor flags the policy as unenforceable. Choice B (undocumented override) destroys auditability. Choice C (verbal agreement) leaves no record. Choice D (standing exemption) creates a permanent gap. The exam tests this: exceptions are not policy violations IF properly documented.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-1-security-and-risk-management/\",\"title\":\"DestCert: Unraveling CISSP Domain 1 \\u2014 Security and Risk Management\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"policy-exception\",\"governance\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D1-041\",\"domain\":1,\"subdomain\":\"1.7 Threat Intelligence\",\"difficulty\":\"medium\",\"stem\":\"What is the BEST source of threat intelligence for a financial services firm wanting industry-specific indicators of compromise?\",\"choices\":[\"Vendor-supplied threat feeds with no industry filter\",\"Sector-specific ISAC (e.g., FS-ISAC for financial services)\",\"Public CVE database only\",\"Internal SIEM telemetry alone\"],\"correct\":1,\"explanation\":\"An ISAC (Information Sharing and Analysis Center) provides peer-validated, industry-specific indicators and tradecraft. Vendor feeds vary; CVE alone is generic vulnerability data, not threat intel; internal SIEM is necessary but not industry intel.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://destcert.com/resources/domain-1-security-and-risk-management/\",\"title\":\"DestCert: Unraveling CISSP Domain 1 \\u2014 Security and Risk Management\",\"captured\":\"2026-04-26\"}],\"references\":[],\"tags\":[\"threat-intel\",\"isac\"],\"notes\":\"\",\"chapter\":null},{\"id\":\"D1-042\",\"domain\":1,\"subdomain\":\"1.6 Awareness\",\"difficulty\":\"medium\",\"stem\":\"Which is the PRIMARY benefit of role-based security training over generic security awareness?\",\"choices\":[\"It satisfies fewer compliance requirements\",\"It targets the specific threats and obligations the role faces, improving relevance and retention\",\"It can be delivered less frequently when applied to standard enterprise environments\",\"It removes the need for executive training\"],\"correct\":1,\"explanation\":\"Role-based training (developer-secure-coding, finance-wire-fraud, executive-whaling) targets the threats most relevant to each audience, materially improving retention and behaviour change. The other choices either oversell or invent benefits.\",\"source\":\"web\",\"guide_pages\":[],\"guide_section\":\"\",\"web_sources\":[{\"url\":\"https://www.isc2.org/Insights/2023/11/Changes-to-CISSP-Exam-Weighting\",\"title\":\"ISC2 Insights: Changes to the CISSP Exam Weighting\",\"captured\":\"2026-04-26\"},{\"url\":\"https://destcert.com/resources/domain-1-security-and-risk-management/\",\"title\":\"DestCert: Unraveling CISSP Domain 1 \\u2014 Security and Risk Management\",\"captured\":\"2026

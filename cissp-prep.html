II: design + operating effectiveness over period (typically 6-12 months). Type II preferred by relying parties.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F6-009\",\"domain\":6,\"term\":\"Vulnerability Scan vs Pen Test\",\"back\":\"Scans identify potential weaknesses (breadth). Pen tests exploit them to demonstrate impact (depth).\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F6-010\",\"domain\":6,\"term\":\"Authenticated vs Unauthenticated Scan\",\"back\":\"Authenticated logs in to reveal host-level patches/configs. Unauthenticated sees only externally exposed surfaces.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F6-011\",\"domain\":6,\"term\":\"KPI vs KRI\",\"back\":\"KPI: performance metric (mean time to patch). KRI: risk-exposure metric (count of overdue critical vulnerabilities).\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F6-012\",\"domain\":6,\"term\":\"SIEM\",\"back\":\"Security Information and Event Management \\u2014 correlate cross-source events to detect attacks; produces alerts.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F6-013\",\"domain\":6,\"term\":\"SOAR\",\"back\":\"Security Orchestration, Automation, Response \\u2014 playbook automation across tools (containment, enrichment, ticketing).\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F6-014\",\"domain\":6,\"term\":\"Red / Blue / Purple Team\",\"back\":\"Red: offensive. Blue: defensive. Purple: collaborative \\u2014 share red techniques to improve blue detection/response.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F6-015\",\"domain\":6,\"term\":\"CVSS\",\"back\":\"Common Vulnerability Scoring System \\u2014 0-10 severity (Base, Temporal, Environmental). Current v4.0.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F6-016\",\"domain\":6,\"term\":\"MITRE ATT&CK\",\"back\":\"Knowledge base of adversary tactics (TA), techniques (T), and procedures used in real attacks; standard for detection engineering.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F6-017\",\"domain\":6,\"term\":\"BAS\",\"back\":\"Breach and Attack Simulation \\u2014 automated execution of attacker techniques to validate detection/prevention controls continuously.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F6-018\",\"domain\":6,\"term\":\"Synthetic Transaction\",\"back\":\"Scripted requests simulating user actions to monitor availability and correctness.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F6-019\",\"domain\":6,\"term\":\"Code Review\",\"back\":\"Manual peer review excels at logic/business-rule defects automated SAST misses; combine both.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F6-020\",\"domain\":6,\"term\":\"Pen Test Authorisation\",\"back\":\"Signed authorisation letter + rules of engagement before starting \\u2014 without it, the test is unauthorised intrusion.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F7-001\",\"domain\":7,\"term\":\"NIST 800-61 IR Phases (Rev 2)\",\"back\":\"Preparation \\u2192 Detection & Analysis \\u2192 Containment, Eradication & Recovery \\u2192 Post-Incident Activity.\",\"source\":\"web\",\"guide_pages\":[],\"web_url\":\"https://nvlpubs.nist.gov/nistpubs/specialpublications/nist.sp.800-61r2.pdf\",\"tags\":[]},{\"id\":\"F7-002\",\"domain\":7,\"term\":\"Order of Volatility (RFC 3227)\",\"back\":\"CPU registers/cache \\u2192 System memory \\u2192 Network state \\u2192 Disk \\u2192 Remote logs \\u2192 Backup tapes (most \\u2192 least volatile).\",\"source\":\"guide\",\"guide_pages\":[2210,2215],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F7-003\",\"domain\":7,\"term\":\"Chain of Custody\",\"back\":\"Documented record of evidence from collection through court \\u2014 every transfer, location, access logged. Required for admissibility.\",\"source\":\"guide\",\"guide_pages\":[2215,2220],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F7-004\",\"domain\":7,\"term\":\"Evidence Types\",\"back\":\"Best (original/primary), Secondary (copies), Hearsay (out-of-court statement), Demonstrative (charts/models), Circumstantial.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F7-005\",\"domain\":7,\"term\":\"RAID 0\",\"back\":\"Stripe across drives \\u2014 performance boost, NO redundancy.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F7-006\",\"domain\":7,\"term\":\"RAID 1\",\"back\":\"Mirror \\u2014 identical copies on two drives, survives one failure, 50% storage efficiency.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F7-007\",\"domain\":7,\"term\":\"RAID 5\",\"back\":\"Stripe with distributed parity \\u2014 survives one failure, write penalty.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F7-008\",\"domain\":7,\"term\":\"RAID 6\",\"back\":\"Stripe with dual parity \\u2014 survives TWO simultaneous failures.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F7-009\",\"domain\":7,\"term\":\"RAID 10 (1+0)\",\"back\":\"Mirror then stripe \\u2014 fast and resilient; survives multiple failures if not in same mirror pair.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F7-010\",\"domain\":7,\"term\":\"Hot Site\",\"back\":\"Fully equipped, near-real-time data, ready in minutes/hours; highest cost, lowest RTO.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F7-011\",\"domain\":7,\"term\":\"Warm Site\",\"back\":\"Hardware ready, stale data, ~12-hour activation. Mid cost / mid RTO.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F7-012\",\"domain\":7,\"term\":\"Cold Site\",\"back\":\"Space and utilities only; equipment + data must be brought in. Cheapest, longest RTO.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F7-013\",\"domain\":7,\"term\":\"Mobile Site\",\"back\":\"Trailer with equipment driven to needed location.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F7-014\",\"domain\":7,\"term\":\"Reciprocal Agreement\",\"back\":\"Mutual aid pact between organisations \\u2014 cheap but problematic (capacity, regional disasters, confidentiality).\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F7-015\",\"domain\":7,\"term\":\"Backup Types\",\"back\":\"Full (everything), Differential (since last full \\u2014 slower backup, faster restore), Incremental (since last backup \\u2014 faster backup, slower restore).\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F7-016\",\"domain\":7,\"term\":\"3-2-1 Backup Rule\",\"back\":\"3 copies, on 2 different media types, with 1 offsite. Modern variants add immutability (3-2-1-1-0).\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F7-017\",\"domain\":7,\"term\":\"MTBF vs MTTR\",\"back\":\"MTBF: Mean Time Between Failures \\u2014 reliability. MTTR: Mean Time To Repair \\u2014 recoverability. Lower MTTR is better.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F7-018\",\"domain\":7,\"term\":\"Change Advisory Board (CAB)\",\"back\":\"Body that authorises changes balancing risk, business impact, security. Emergency CAB (eCAB) handles urgent changes.\",\"source\":\"guide\",\"guide_pages\":[2270,2275],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F7-019\",\"domain\":7,\"term\":\"EDR vs Antivirus\",\"back\":\"EDR provides continuous endpoint telemetry, behavioural detection, response (isolate/kill/retrieve), and forensic data \\u2014 beyond static AV.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F7-020\",\"domain\":7,\"term\":\"UEBA\",\"back\":\"User & Entity Behaviour Analytics \\u2014 baselines normal behaviour, alerts on deviations (impossible travel, unusual data access).\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F7-021\",\"domain\":7,\"term\":\"Honeypot\",\"back\":\"Decoy system to attract, detect, and study attackers. Honeynet = whole network of decoys.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F7-022\",\"domain\":7,\"term\":\"Standards of Proof\",\"back\":\"Civil: preponderance (>50%). Criminal: beyond reasonable doubt. Administrative: clear and convincing. Warrants: probable cause.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F7-023\",\"domain\":7,\"term\":\"Need-to-Know\",\"back\":\"Restrict access by job-justified need, even when general clearance/role allows broader access.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F7-024\",\"domain\":7,\"term\":\"Clipping Level\",\"back\":\"Threshold below which monitoring suppresses alerts to reduce noise (e.g., ignore <5 failed logins).\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F8-001\",\"domain\":8,\"term\":\"Waterfall\",\"back\":\"Linear SDLC \\u2014 requirements \\u2192 design \\u2192 implementation \\u2192 testing \\u2192 deployment. No phase backtracking.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F8-002\",\"domain\":8,\"term\":\"Agile\",\"back\":\"Iterative SDLC \\u2014 short cycles, customer feedback, working software each iteration (Scrum, Kanban, XP).\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F8-003\",\"domain\":8,\"term\":\"Spiral\",\"back\":\"Risk-driven iterative SDLC \\u2014 each cycle includes risk assessment.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F8-004\",\"domain\":8,\"term\":\"DevSecOps\",\"back\":\"Security embedded continuously across CI/CD with automation (SAST, DAST, SCA, IaC scan, secrets detection).\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F8-005\",\"domain\":8,\"term\":\"CMMI\",\"back\":\"Capability Maturity Model Integration \\u2014 five process maturity levels: Initial \\u2192 Managed \\u2192 Defined \\u2192 Quantitatively Managed \\u2192 Optimising.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F8-006\",\"domain\":8,\"term\":\"OWASP SAMM\",\"back\":\"Prescriptive software-security maturity framework: Governance, Design, Implementation, Verification, Operations \\u00d7 four levels.\",\"source\":\"web\",\"guide_pages\":[],\"web_url\":\"https://owasp.org/www-project-samm/\",\"tags\":[]},{\"id\":\"F8-007\",\"domain\":8,\"term\":\"BSIMM\",\"back\":\"Descriptive maturity model based on observed activities at member organisations (not prescriptive).\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F8-008\",\"domain\":8,\"term\":\"OWASP Top 10:2021 (selected)\",\"back\":\"A01 Broken Access Control, A02 Cryptographic Failures, A03 Injection, A04 Insecure Design, A06 Vulnerable Components, A10 SSRF.\",\"source\":\"web\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F8-009\",\"domain\":8,\"term\":\"TOCTOU\",\"back\":\"Time-of-Check to Time-of-Use race condition \\u2014 state changes between authorisation check and use (CWE-367).\",\"source\":\"web\",\"guide_pages\":[],\"web_url\":\"https://cqr.company/web-vulnerabilities/time-of-check-to-time-of-use-tocttou-race-conditions/\",\"tags\":[]},{\"id\":\"F8-010\",\"domain\":8,\"term\":\"Buffer Overflow Defenses\",\"back\":\"Memory-safe languages (Rust, Go); bounds checking; ASLR + DEP/NX; stack canaries; safer APIs (snprintf vs strcpy).\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F8-011\",\"domain\":8,\"term\":\"SQL Injection Defense\",\"back\":\"Parameterised queries / prepared statements treat input as data, not code \\u2014 structurally prevents injection.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F8-012\",\"domain\":8,\"term\":\"XSS Defense\",\"back\":\"Context-aware output encoding (HTML body vs attribute vs JS) plus a strict Content Security Policy.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F8-013\",\"domain\":8,\"term\":\"CSRF Defense\",\"back\":\"Anti-CSRF tokens (synchroniser pattern) + SameSite cookies (Lax/Strict).\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F8-014\",\"domain\":8,\"term\":\"SSRF Defense\",\"back\":\"Allow-list destinations, block private/metadata endpoints (169.254.169.254), use a controlled egress proxy.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F8-015\",\"domain\":8,\"term\":\"ACID\",\"back\":\"Database transaction properties: Atomicity, Consistency, Isolation, Durability.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F8-016\",\"domain\":8,\"term\":\"Inference Attack\",\"back\":\"Combine individually authorised queries to deduce unauthorised information.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F8-017\",\"domain\":8,\"term\":\"Aggregation\",\"back\":\"Combining individually low-classification data into a higher-classification whole.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F8-018\",\"domain\":8,\"term\":\"Polyinstantiation\",\"back\":\"Multiple records with the same primary key at different security levels \\u2014 defends against inference via existence.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F8-019\",\"domain\":8,\"term\":\"SBOM\",\"back\":\"Software Bill of Materials \\u2014 structured component inventory (SPDX or CycloneDX). Required by US EO 14028.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F8-020\",\"domain\":8,\"term\":\"SCA\",\"back\":\"Software Composition Analysis \\u2014 scan dependencies for known CVEs and licence issues.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F8-021\",\"domain\":8,\"term\":\"NIST SSDF (SP 800-218)\",\"back\":\"Secure Software Development Framework: Prepare the Org, Protect the Software, Produce Well-Secured Software, Respond to Vulnerabilities.\",\"source\":\"web\",\"guide_pages\":[],\"web_url\":\"https://csrc.nist.gov/pubs/sp/800/218/final\",\"tags\":[]},{\"id\":\"F8-022\",\"domain\":8,\"term\":\"OWASP ASVS\",\"back\":\"Application Security Verification Standard \\u2014 three verification levels (1-3) of security requirements.\",\"source\":\"web\",\"guide_pages\":[],\"web_url\":\"https://owasp.org/www-project-application-security-verification-standard/\",\"tags\":[]},{\"id\":\"F8-023\",\"domain\":8,\"term\":\"Privacy by Design\",\"back\":\"Embed privacy from inception \\u2014 minimisation, purpose limitation, default-private, transparency. Codified in GDPR Article 25.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F8-024\",\"domain\":8,\"term\":\"API Authentication\",\"back\":\"Service-to-service: OAuth 2.0 client_credentials with short-lived tokens, or mTLS for workload identity.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F1-031\",\"domain\":1,\"term\":\"ISC2 Code of Ethics \\u2014 canon ordering\",\"back\":\"(1) Protect society, the common good, the necessary public trust and confidence, and the infrastructure. (2) Act honourably, honestly, justly, responsibly, and legally. (3) Provide diligent and competent service to principals. (4) Advance and protect the profession. Higher-ordered canons take precedence when canons conflict.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F1-032\",\"domain\":1,\"term\":\"Risk Treatment Verb List\",\"back\":\"Mitigate (apply controls), Avoid (stop the activity), Transfer (insure / share), Accept (decision-maker signs off).\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F1-033\",\"domain\":1,\"term\":\"Mandatory Vacation\",\"back\":\"Force absence so a substitute can detect ongoing fraud, embezzlement, or unsafe practices that depend on continuous control by one individual.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F1-034\",\"domain\":1,\"term\":\"Job Rotation\",\"back\":\"Cross-train staff (resilience) AND surface long-running fraud or shortcuts when a substitute takes the role. Complements separation of duties.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F1-035\",\"domain\":1,\"term\":\"Annualised Loss Expectancy (ALE) shortcut\",\"back\":\"ALE = SLE \\u00d7 ARO. SLE = AV \\u00d7 EF. So ALE = AV \\u00d7 EF \\u00d7 ARO. Quick check: dollars per year.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F1-036\",\"domain\":1,\"term\":\"Risk Appetite vs Tolerance\",\"back\":\"Appetite = the risk an organisation is willing to ACCEPT in pursuit of its objectives. Tolerance = the variance from appetite that's still acceptable. Appetite is strategic; tolerance is operational.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F1-037\",\"domain\":1,\"term\":\"Three-Lines Model (IIA)\",\"back\":\"1st line: operational management owns and manages risk. 2nd line: risk and compliance functions monitor and challenge. 3rd line: internal audit provides independent assurance to the governing body.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F1-038\",\"domain\":1,\"term\":\"ISA vs MOU vs SLA vs BPA\",\"back\":\"ISA = interconnection security agreement (technical). MOU = memorandum of understanding (intent, no penalties). SLA = service level agreement (metrics + penalties). BPA = business partnership agreement.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F1-039\",\"domain\":1,\"term\":\"Mandatory vs Voluntary Standards\",\"back\":\"Mandatory: PCI-DSS (contractual), HIPAA (regulatory), SOX (regulatory), GDPR (regulatory). Voluntary: ISO 27001, NIST CSF, COBIT, ITIL.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F1-040\",\"domain\":1,\"term\":\"Personal Privacy Standards\",\"back\":\"GDPR (EU/UK), CCPA/CPRA (California), HIPAA (US healthcare), GLBA (US financial), FERPA (US education), PIPEDA (Canada), LGPD (Brazil), POPIA (South Africa).\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F2-021\",\"domain\":2,\"term\":\"FIPS 199 categorisation\",\"back\":\"Categorise each information type by impact (Low / Moderate / High) for each of Confidentiality, Integrity, Availability \\u2014 independently. The system inherits the HIGH-WATER MARK across information types per dimension.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F2-022\",\"domain\":2,\"term\":\"Data Lifecycle (CRUD-S)\",\"back\":\"Create \\u2192 Read \\u2192 Use/Process \\u2192 Share \\u2192 Store \\u2192 Archive \\u2192 Destroy. Each phase has distinct controls (e.g., classification at Create, encryption at Store, sanitisation at Destroy).\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F2-023\",\"domain\":2,\"term\":\"DLP Discovery vs Inline\",\"back\":\"Discovery DLP scans existing repositories for sensitive data at rest. Inline DLP intercepts data in motion (network, email, endpoint) \\u2014 preventing exfiltration in real time.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F2-024\",\"domain\":2,\"term\":\"Confidential Computing\",\"back\":\"Protects data IN USE via hardware-backed enclaves (Intel SGX, AMD SEV, ARM TrustZone, AWS Nitro Enclaves). The historically weakest of the three data states.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F2-025\",\"domain\":2,\"term\":\"GDPR Article 5 Principles\",\"back\":\"Lawfulness/fairness/transparency, Purpose limitation, Data minimisation, Accuracy, Storage limitation, Integrity/confidentiality (security), Accountability.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F2-026\",\"domain\":2,\"term\":\"Data Maskingrap vs Tokenisation vs Encryption\",\"back\":\"Masking = irreversibly redact for non-prod use (analytics-friendly). Tokenisation = surrogate value, vault lookup to reverse. Encryption = mathematically reversible with the key.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F3-026\",\"domain\":3,\"term\":\"Saltzer & Schroeder \\u2014 eight design principles\",\"back\":\"Economy of mechanism, Fail-safe defaults, Complete mediation, Open design, Separation of privilege, Least privilege, Least common mechanism, Psychological acceptability.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F3-027\",\"domain\":3,\"term\":\"Common Criteria EALs\",\"back\":\"EAL1 functionally tested \\u2192 EAL2 structurally tested \\u2192 EAL3 methodically tested \\u2192 EAL4 designed/tested/reviewed (commercial sweet spot) \\u2192 EAL5 semiformally designed \\u2192 EAL6 semiformally verified \\u2192 EAL7 formally verified.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F3-028\",\"domain\":3,\"term\":\"Symmetric Key Sizes (Recommended)\",\"back\":\"AES-128 = 128-bit security (acceptable). AES-256 = 256-bit (recommended for long-lived data; halved by Grover to 128-bit post-quantum). 3DES is deprecated. DES is broken (56-bit).\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F3-029\",\"domain\":3,\"term\":\"Asymmetric Key Sizes (Equivalent Strength)\",\"back\":\"RSA-2048 \\u2248 ECC-224 \\u2248 AES-112 (~112-bit security). RSA-3072 \\u2248 ECC-256 \\u2248 AES-128. RSA-15360 \\u2248 ECC-512 \\u2248 AES-256. ECC achieves equivalent security with much smaller keys.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F3-030\",\"domain\":3,\"term\":\"Post-Quantum Standards (FIPS 2024)\",\"back\":\"FIPS 203 = ML-KEM (Kyber) \\u2014 key encapsulation. FIPS 204 = ML-DSA (Dilithium) \\u2014 digital signatures. FIPS 205 = SLH-DSA (SPHINCS+) \\u2014 hash-based signatures, conservative backup.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F3-031\",\"domain\":3,\"term\":\"Diffie-Hellman vs RSA Key Exchange\",\"back\":\"DH/ECDH provides forward secrecy through ephemeral keys (PFS). RSA key transport does NOT provide PFS \\u2014 long-term key compromise reveals all past sessions. TLS 1.3 removed RSA key transport for this reason.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F3-032\",\"domain\":3,\"term\":\"TPM vs HSM vs Secure Enclave\",\"back\":\"TPM: motherboard chip for platform integrity / sealed storage. HSM: standalone appliance for high-volume crypto + key management. Secure Enclave: CPU-integrated isolated memory (Apple SE, Intel SGX).\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F3-033\",\"domain\":3,\"term\":\"Datacenter Temperature/Humidity (ASHRAE)\",\"back\":\"Recommended: 64-81\\u00b0F (18-27\\u00b0C), 40-60% RH. Excess humidity \\u2192 corrosion. Low humidity \\u2192 ESD damage.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F3-034\",\"domain\":3,\"term\":\"Datacenter Tier Classifications (Uptime Institute)\",\"back\":\"Tier I: 99.671% uptime (basic). Tier II: 99.741% (redundant capacity). Tier III: 99.982% (concurrently maintainable, N+1). Tier IV: 99.995% (fault-tolerant, 2N+1).\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F4-025\",\"domain\":4,\"term\":\"Common Port Numbers (high-yield)\",\"back\":\"FTP 20/21, SSH 22, Telnet 23, SMTP 25, DNS 53, DHCP 67/68, HTTP 80, POP3 110, NTP 123, IMAP 143, HTTPS 443, SMB 445, RDP 3389, MySQL 3306, PostgreSQL 5432.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F4-026\",\"domain\":4,\"term\":\"Wireless Protocol Generations\",\"back\":\"WEP (broken). WPA (TKIP). WPA2 (CCMP/AES, but PSK 4-way handshake brute-forceable offline). WPA3 (SAE/Dragonfly handshake \\u2014 defeats offline dictionary attacks; 192-bit option for enterprise).\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F4-027\",\"domain\":4,\"term\":\"VPN Protocols Ranked\",\"back\":\"Modern: WireGuard (lean, fast, audited), IPsec/IKEv2 (mature, NAT-T capable). Legacy: OpenVPN (TLS-based), SSL/TLS VPN (browser). Avoid: PPTP (broken), L2TP without IPsec (no encryption).\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F4-028\",\"domain\":4,\"term\":\"Firewall Generations\",\"back\":\"Gen 1: packet filter (stateless). Gen 2: stateful inspection. Gen 3: application proxy. Gen 4: NGFW (app-aware, integrated IPS, threat intel). Modern: cloud-native + WAF + API gateway.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F4-029\",\"domain\":4,\"term\":\"Network Attack Quick Identification\",\"back\":\"ARP spoofing (L2 mismap). DNS poisoning (corrupt resolution). MAC flood (CAM exhaustion). SYN flood (half-open exhaustion). Smurf (ICMP broadcast amplification). Fraggle (UDP amplification). Teardrop (overlapping fragments). MITM (intercept + alter).\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F4-030\",\"domain\":4,\"term\":\"Zero Trust Pillars (NIST 800-207)\",\"back\":\"All resources are protected. Communication secured regardless of network. Per-session access. Dynamic policy from observable state. Continuous monitoring. Strict authentication for every access. (Pre-condition: verify everything, trust nothing.)\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F5-025\",\"domain\":5,\"term\":\"Federation Roles\",\"back\":\"User \\u2192 Identity Provider (IdP, holds identity) \\u2192 assertion \\u2192 Service Provider (SP / Relying Party, accepts assertion). User authenticates ONCE at the IdP for many SPs.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F5-026\",\"domain\":5,\"term\":\"OAuth 2.0 Grant Types\",\"back\":\"Authorization Code (web apps with backend), PKCE (public clients \\u2014 SPAs, mobile), Client Credentials (service-to-service), Device Code (TVs, IoT). Avoid: Implicit (deprecated), Resource Owner Password Credentials (anti-pattern).\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F5-027\",\"domain\":5,\"term\":\"Kerberos Attack Quick-Reference\",\"back\":\"Pass-the-Hash: NTLM hash replay. Pass-the-Ticket: Kerberos ticket replay. Kerberoasting: offline-crack service ticket ciphertext. AS-REP Roasting: target accounts without preauth. Golden Ticket: forge TGTs from KRBTGT hash. Silver Ticket: forge service tickets from service hash.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F5-028\",\"domain\":5,\"term\":\"FIDO2 / WebAuthn / CTAP\",\"back\":\"FIDO2 = umbrella (WebAuthn + CTAP). WebAuthn = browser API for relying parties. CTAP = client-to-authenticator protocol. Together: phishing-resistant, AAL3-eligible authentication.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F5-029\",\"domain\":5,\"term\":\"RBAC vs ABAC vs ReBAC vs PBAC\",\"back\":\"RBAC: roles. ABAC: attributes (user \\u00d7 resource \\u00d7 env). ReBAC: relationships (Google Zanzibar style). PBAC: policy-based (often XACML/OPA). Modern stacks layer RBAC + ABAC.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F5-030\",\"domain\":5,\"term\":\"Account Lockout Recommendations (NIST 800-63B)\",\"back\":\"Rate-limit failed attempts; do NOT use overly aggressive lockouts (DoS risk); pair with breached-password blocklist; allow user-initiated unlock with strong recovery; capture and alert on lockout patterns.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F5-031\",\"domain\":5,\"term\":\"SSO Risk Concentration\",\"back\":\"One credential = many systems. Mitigations: MFA always, conditional access, anomaly detection, short session lifetimes, step-up auth for sensitive actions, monitoring for unusual SSO sign-ins.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F6-021\",\"domain\":6,\"term\":\"SAST vs DAST vs IAST vs SCA\",\"back\":\"SAST: static source-code analysis. DAST: dynamic external runtime testing. IAST: instrumented runtime (combines source visibility + runtime data). SCA: scans dependencies for known CVEs and licence issues.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F6-022\",\"domain\":6,\"term\":\"Pen Test Box Quick Map\",\"back\":\"Black box: no info (external attacker). Gray box: partial info (insider, compromised user). White box: full info (everything available).\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F6-023\",\"domain\":6,\"term\":\"SOC Report Quick Map\",\"back\":\"SOC 1: financial-reporting controls (audit trail). SOC 2: AICPA TSC (security required + availability/confidentiality/processing-integrity/privacy elective). SOC 3: SOC 2 public summary. ISAE 3402 \\u2248 SOC 1; ISAE 3000 \\u2248 SOC 2.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F6-024\",\"domain\":6,\"term\":\"Audit Opinion Hierarchy\",\"back\":\"Unqualified (clean) > Qualified (issues but mostly OK) > Adverse (controls did NOT operate effectively) > Disclaimer (auditor couldn't opine). Customers want unqualified.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F6-025\",\"domain\":6,\"term\":\"MITRE ATT&CK Tactic Sequence\",\"back\":\"Reconnaissance \\u2192 Resource Development \\u2192 Initial Access \\u2192 Execution \\u2192 Persistence \\u2192 Privilege Escalation \\u2192 Defense Evasion \\u2192 Credential Access \\u2192 Discovery \\u2192 Lateral Movement \\u2192 Collection \\u2192 Command & Control \\u2192 Exfiltration \\u2192 Impact.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F6-026\",\"domain\":6,\"term\":\"Vulnerability Mgmt Cycle\",\"back\":\"Identify (scan, threat intel) \\u2192 Prioritise (CVSS + KEV + exposure) \\u2192 Remediate (patch, mitigate, accept) \\u2192 Verify (re-scan) \\u2192 Report. Continuous, not annual.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F7-025\",\"domain\":7,\"term\":\"RAID Level Quick Map\",\"back\":\"RAID 0: stripe (perf, no redundancy). RAID 1: mirror (50% efficient). RAID 5: stripe + parity, 1-drive tolerance. RAID 6: dual parity, 2-drive tolerance. RAID 10: mirror + stripe (databases).\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F7-026\",\"domain\":7,\"term\":\"Backup Window Math\",\"back\":\"RPO = 4h \\u2194 replicate or snapshot every \\u22644h. RPO = 15min \\u2194 continuous log shipping. RPO = 24h \\u2194 daily backup. RPO drives BACKUP FREQUENCY.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F7-027\",\"domain\":7,\"term\":\"Eradication vs Recovery (NIST 800-61)\",\"back\":\"Eradicate: remove the cause (malware, attacker access, vulnerable configurations). Recovery: restore systems and data, verify integrity, return to operations. Eradication BEFORE recovery \\u2014 otherwise you restore the compromise.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F7-028\",\"domain\":7,\"term\":\"Forensic Toolkit Triad\",\"back\":\"FTK / EnCase / X-Ways for disk imaging and analysis. Volatility for memory analysis. Wireshark / NetworkMiner for network capture. Always work on a forensic IMAGE, never the original \\u2014 and always hash both.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F7-029\",\"domain\":7,\"term\":\"Incident Severity Classifications\",\"back\":\"Low: minimal impact, single user. Medium: business impact, multiple users. High: significant impact, customer-facing. Critical: organisation-wide, public/regulator-facing. Severity drives escalation path and team mobilisation.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F7-030\",\"domain\":7,\"term\":\"BCP Doc Family\",\"back\":\"BCP (overarching). DRP (technology recovery \\u2014 subset). BIA (drives RTO/RPO). COOP (federal continuity). Crisis Comms Plan (messaging). Occupant Emergency Plan (life safety in the building).\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F7-031\",\"domain\":7,\"term\":\"Standards of Proof (Civil \\u2192 Criminal)\",\"back\":\"Probable cause (warrants/arrests). Preponderance of evidence (>50% \\u2014 civil). Clear and convincing (administrative, some civil). Beyond reasonable doubt (criminal).\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F8-025\",\"domain\":8,\"term\":\"OWASP Top 10:2021 Memorisation Aid\",\"back\":\"A01 Broken Access Control. A02 Cryptographic Failures. A03 Injection. A04 Insecure Design. A05 Security Misconfiguration. A06 Vulnerable Components. A07 Auth Failures. A08 Software/Data Integrity Failures. A09 Logging/Monitoring Failures. A10 SSRF.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F8-026\",\"domain\":8,\"term\":\"Database Security Threats Quick Map\",\"back\":\"Inference: deduce unauthorised info from authorised queries. Aggregation: combine low-classification records into high-classification whole. Polyinstantiation: same key, different value per classification. Bypass attack: skip the application, hit the DB directly.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F8-027\",\"domain\":8,\"term\":\"Secure SDLC Phases\",\"back\":\"Requirements (security reqs, threat model). Design (DFDs with trust boundaries, STRIDE/PASTA). Implementation (secure coding, SAST). Testing (DAST, fuzz, pen test). Deployment (config hardening, gates). Operations (monitoring, IR, patch).\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F8-028\",\"domain\":8,\"term\":\"API Security Top Risks (OWASP API Top 10)\",\"back\":\"Broken object-level auth (BOLA), Broken auth, Excessive data exposure, Lack of rate limiting, Broken function-level auth, Mass assignment, Misconfiguration, Injection, Improper assets management, Insufficient logging.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F8-029\",\"domain\":8,\"term\":\"Code Repository Hygiene Checklist\",\"back\":\"Branch protection on main. Required reviews + CODEOWNERS. Signed commits. Pre-commit + CI secret scanning. SCA on every PR. Pinned dependencies. SBOM generation. Cosign-signed artefacts.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F8-030\",\"domain\":8,\"term\":\"Container Security Layers\",\"back\":\"Image: scan + sign + minimal base + non-root. Registry: private + auth + integrity. Runtime: policy enforcement (OPA Gatekeeper, Kyverno), capability dropping, read-only FS, no-host-network. Cluster: RBAC, network policies, secrets via vault.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F8-031\",\"domain\":8,\"term\":\"Modern Authn for Apps\",\"back\":\"Passwords: NIST 800-63B (no rotation, breach check, \\u22658 chars). MFA: TOTP / FIDO2 / passkeys (avoid SMS where possible). Federation: OIDC for new apps, SAML for enterprise. Session: short-lived JWT + refresh + revocation list.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]},{\"id\":\"F8-032\",\"domain\":8,\"term\":\"DevSecOps Toolchain Sample\",\"back\":\"SCM: GitHub/GitLab. CI: GitHub Actions/GitLab CI. SAST: Semgrep/SonarQube. SCA: Snyk/Dependabot/Trivy. Secret scan: Gitleaks/Trufflehog. IaC scan: Checkov/tfsec/KICS. Container: Trivy/Grype + Cosign sign. Runtime: Falco/Sysdig.\",\"source\":\"canonical\",\"guide_pages\":[],\"web_url\":\"\",\"tags\":[]}]");
</script>
<script>
(function(){

  examHistory: 'cissp.exam.history',
  flashState: 'cissp.flash.state',
  bookmarks: 'cissp.bookmarks',
  streak: 'cissp.streak',
  syncId: 'cissp.sync.id',     // SHA-256(passphrase) — opaque, no plaintext stored
  syncLast: 'cissp.sync.last', // ISO timestamp of last successful sync
};
const SUPABASE_URL = 'https://qoxgjjynjialntkvcdqn.supabase.co';
const SUPABASE_KEY = 'sb_publishable_OMBTOFMdT_XD1-6cj-MPSA_69RCAfD2';
const SYNC_TABLE = 'cissp_progress';
const PW_HASH = window.__PW_HASH__;
const QUESTIONS = window.__QUESTIONS__;
const FLASHCARDS = window.__FLASHCARDS__;
const TOPICS = window.__TOPICS__;
const TABLES = window.__TABLES__;

const state = {
  prefs: {theme:'dark', timerInPractice:false},

};

// ============================================================================
// HELPERS
// ============================================================================
function $(sel, ctx){return (ctx||document).querySelector(sel)}
function $$(sel, ctx){return Array.from((ctx||document).querySelectorAll(sel))}
function el(tag, attrs, kids){
  const e = document.createElement(tag);
  if (attrs){for (const k in attrs){
    if (k === 'class') e.className = attrs[k];
    else if (k === 'html') e.innerHTML = attrs[k];
    else if (k.startsWith('on') && typeof attrs[k] === 'function') e.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] !== false && attrs[k] != null) e.setAttribute(k, attrs[k]);
  }}
  if (kids){
    if (!Array.isArray(kids)) kids = [kids];
    for (const k of kids){if (k == null) continue; e.appendChild(typeof k === 'string' ? document.createTextNode(k) : k);}
  }
  return e;
}
function todayStr(){return new Date().toISOString().slice(0,10)}
function load(){
  state.prefs = JSON.parse(localStorage.getItem(LS.prefs) || '{"theme":"dark","timerInPractice":false}');
  state.progress = JSON.parse(localStorage.getItem(LS.progress) || '{}');
  state.bookmarks = JSON.parse(localStorage.getItem(LS.bookmarks) || '{}');
  state.flash = JSON.parse(localStorage.getItem(LS.flashState) || '{}');
  state.examHistory = JSON.parse(localStorage.getItem(LS.examHistory) || '[]');
  state.streak = JSON.parse(localStorage.getItem(LS.streak) || '{"last":null,"count":0}');
  state.exam = JSON.parse(localStorage.getItem(LS.exam) || 'null');
  if (state.prefs.theme === 'light') document.body.classList.add('light');
}
function save(key, value){localStorage.setItem(key, JSON.stringify(value))}
function saveAll(){
  save(LS.prefs, state.prefs);
  save(LS.progress, state.progress);
  save(LS.bookmarks, state.bookmarks);
  save(LS.flashState, state.flash);
  save(LS.examHistory, state.examHistory);
  save(LS.streak, state.streak);
  if (state.exam) save(LS.exam, state.exam); else localStorage.removeItem(LS.exam);
}
function shuffle(a){const arr=[...a]; for (let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]];} return arr;}
function fmtTime(sec){
  if (sec < 0) sec = 0;
  const h = Math.floor(sec/3600);
  const m = Math.floor((sec%3600)/60);
  const s = Math.floor(sec%60);
  return (h?h+':':'') + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

// ============================================================================
// TOASTS
// ============================================================================
let __lastToastMsg = '';
let __lastToastT = 0;
function toast(msg, type){
  // Suppress consecutive identical toasts within 1.5s
  const now = Date.now();
  if (msg === __lastToastMsg && (now - __lastToastT) < 1500) return;
  __lastToastMsg = msg; __lastToastT = now;
  const t = el('div', {class:'toast'+(type?' '+type:''), role:'status', 'aria-live':'polite'}, msg);
  $('#toasts').appendChild(t);
  // Cap visible stack at 3
  while ($('#toasts').children.length > 3) $('#toasts').firstChild.remove();
  setTimeout(()=>{t.style.opacity='0'; setTimeout(()=>t.remove(), 250);}, 2800);
}

// ============================================================================
// AUTH GATE
// ============================================================================
async function sha256(str){
  const buf = new TextEncoder().encode(str);
  const hash = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,'0')).join('');
}
async function tryUnlock(){
  const pw = $('#pw').value;
  const hash = await sha256(pw);
  if (hash === PW_HASH){
    localStorage.setItem(LS.unlocked, '1');
    boot();
  } else {

  }
}

// STREAK
// ============================================================================
function tickStreak(){
  const today = todayStr();
  if (state.streak.last === today) return;
  const yesterday = new Date(); yesterday.setDate(yesterday.getDate()-1);
  if (state.streak.last === yesterday.toISOString().slice(0,10)) state.streak.count += 1;
  else state.streak.count = 1;
  state.streak.last = today;
  save(LS.streak, state.streak);
}
function checkStreakWarning(){
  // If streak is alive, today not yet credited, and it's the user's last
  // window of the day (after 6pm local), nudge them.
  if (!state.streak.last || state.streak.count < 2) return;
  const today = todayStr();
  if (state.streak.last === today) return;  // already studied today
  const yesterday = new Date(); yesterday.setDate(yesterday.getDate()-1);
  if (state.streak.last !== yesterday.toISOString().slice(0,10)) return;  // already broken
  const hour = new Date().getHours();
  if (hour < 18) return;  // earlier in the day, no nudge
  const sessionFlag = 'cissp.streak.warned.' + today;
  if (sessionStorage.getItem(sessionFlag)) return;
  sessionStorage.setItem(sessionFlag, '1');
  toast('⏰ Quick review keeps your ' + state.streak.count + '-day streak alive.', 'warn');
}

// ============================================================================
// PROGRESS
// ============================================================================
function recordAnswer(qid, correct){
  const p = state.progress[qid] || {seen:0, correct:0, lastSeen:null};
  p.seen += 1;
  if (correct) p.correct += 1;
  p.lastSeen = Date.now();
  state.progress[qid] = p;
  save(LS.progress, state.progress);
}
function masteryByDomain(){
  const totals = {};
  for (const d of DOMAINS) totals[d.id] = {seen:0, correct:0, total:0};
  for (const q of QUESTIONS) totals[q.domain].total += 1;
  for (const qid in state.progress){
    const q = QUESTIONS.find(qq => qq.id === qid); if (!q) continue;
    totals[q.domain].seen += state.progress[qid].seen;
    totals[q.domain].correct += state.progress[qid].correct;
  }
  return totals;
}
function overallStats(){
  let seen=0, correct=0;
  for (const qid in state.progress){
    seen += state.progress[qid].seen;
    correct += state.progress[qid].correct;
  }
  return {seen, correct};
}
function weakestSubdomains(n){
  const map = {};
  for (const qid in state.progress){
    const q = QUESTIONS.find(qq => qq.id === qid); if (!q) continue;
    const k = 'D'+q.domain+' '+q.subdomain;
    map[k] = map[k] || {tried:0, correct:0};
    map[k].tried += state.progress[qid].seen;
    map[k].correct += state.progress[qid].correct;
  }
  const arr = Object.entries(map).map(([k,v]) => ({k, acc: v.tried ? v.correct/v.tried : 0, tried:v.tried}))
    .filter(x => x.tried >= 3)
    .sort((a,b)=>a.acc-b.acc);
  return arr.slice(0, n);
}

// ============================================================================
// RADAR SVG (hand-rolled, no library)
// ============================================================================
function buildRadarSvg(domainStats){
  const W = 360, H = 360, cx = W/2, cy = H/2 + 6, R = 130;
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', '0 0 '+W+' '+H);
  svg.setAttribute('class', 'radar');
  const N = DOMAINS.length;
  // grid rings
  for (let r=1; r<=4; r++){
    const pts = [];
    for (let i=0;i<N;i++){
      const ang = -Math.PI/2 + i*2*Math.PI/N;
      pts.push((cx + Math.cos(ang)*R*r/4) + ',' + (cy + Math.sin(ang)*R*r/4));
    }
    const poly = document.createElementNS(ns, 'polygon');
    poly.setAttribute('points', pts.join(' '));
    poly.setAttribute('fill', 'none');
    poly.setAttribute('stroke', 'rgba(255,255,255,.07)');
    svg.appendChild(poly);
  }
  // spokes + labels
  for (let i=0;i<N;i++){
    const ang = -Math.PI/2 + i*2*Math.PI/N;
    const x = cx + Math.cos(ang)*R, y = cy + Math.sin(ang)*R;
    const ln = document.createElementNS(ns, 'line');
    ln.setAttribute('x1', cx); ln.setAttribute('y1', cy);
    ln.setAttribute('x2', x); ln.setAttribute('y2', y);
    ln.setAttribute('stroke', 'rgba(255,255,255,.07)');
    svg.appendChild(ln);
    const lx = cx + Math.cos(ang)*(R+18), ly = cy + Math.sin(ang)*(R+18);
    const lbl = document.createElementNS(ns, 'text');
    lbl.setAttribute('x', lx); lbl.setAttribute('y', ly);
    lbl.setAttribute('text-anchor', 'middle');
    lbl.setAttribute('dominant-baseline', 'middle');
    lbl.setAttribute('font-size', '11');
    lbl.setAttribute('font-family', 'ui-monospace,monospace');
    lbl.setAttribute('fill', '#9ca3af');
    lbl.textContent = 'D' + DOMAINS[i].id;
    svg.appendChild(lbl);
  }
  // data polygon
  const pts = [];
  for (let i=0;i<N;i++){
    const d = DOMAINS[i];
    const ds = domainStats[d.id];
    const acc = ds.seen ? ds.correct/ds.seen : 0;
    const ang = -Math.PI/2 + i*2*Math.PI/N;
    pts.push((cx + Math.cos(ang)*R*acc) + ',' + (cy + Math.sin(ang)*R*acc));
  }
  const data = document.createElementNS(ns, 'polygon');
  data.setAttribute('points', pts.join(' '));
  data.setAttribute('fill', 'rgba(0,212,255,.25)');
  data.setAttribute('stroke', '#00d4ff');
  data.setAttribute('stroke-width', '2');
  svg.appendChild(data);
  return svg;
}

function kickPracticeSession(){
  const pickedDomains = $$('#pf-domains input').filter(c=>c.checked).map(c=>parseInt(c.value));
  const length = parseInt($('#pf-length') ? $('#pf-length').value : 25);
  const diff = $('#pf-diff') ? $('#pf-diff').value : '';
  const sourceFilt = $('#pf-source') ? $('#pf-source').value : '';
  const onlyBm = $('#pf-bm') && $('#pf-bm').checked;
  const onlyWrong = $('#pf-wrong') && $('#pf-wrong').checked;
  state.prefs.timerInPractice = $('#pf-timer') ? $('#pf-timer').checked : false;
  save(LS.prefs, state.prefs);
  let pool = QUESTIONS.filter(q => pickedDomains.includes(q.domain));
  if (diff) pool = pool.filter(q => q.difficulty === diff);
  if (sourceFilt) pool = pool.filter(q => q.source === sourceFilt);
  if (onlyBm) pool = pool.filter(q => state.bookmarks[q.id]);
  if (onlyWrong) pool = pool.filter(q => state.progress[q.id] && state.progress[q.id].correct < state.progress[q.id].seen);
  if (state.practice && state.practice.filter && state.practice.filter.onlyIncorrect) {
    pool = pool.filter(q => state.progress[q.id] && state.progress[q.id].correct < state.progress[q.id].seen);
  }
  if (!pool.length){toast('No questions match those filters.','warn'); return;}
  const questions = shuffle(pool).slice(0, length);
  state.practice = {questions, idx:0, picks:{}, eliminated:{}, started:Date.now()};
  renderPracticeSession();
}

function buildQuestionCard(q, pick, answered, eliminated, onPick, onEliminate, hideExplanation){
  const card = el('div', {class:'qcard'});
  const head = el('div', {class:'qhead'}, [
    el('div', null, [
      el('span', {class:'mono badge'}, q.id),
      ' ',
      el('span', {class:'badge'}, 'D'+q.domain),
      ' ',
      el('span', {class:'badge ' + q.source}, q.source),
      ' ',
      el('span', {class:'muted', style:'font-size:.8rem'}, q.subdomain),
    ]),
    el('button', {class:'ghost', style:'font-size:1.1rem;padding:.2rem .5rem',
      onclick:()=>{state.bookmarks[q.id]=!state.bookmarks[q.id]; save(LS.bookmarks, state.bookmarks);
        toast(state.bookmarks[q.id]?'Bookmarked':'Unbookmarked');
        const view = $$('.view.active')[0]; if (view && view.id === 'view-practice') renderPracticeSession();
      }}, state.bookmarks[q.id] ? '★' : '☆'),
  ]);
  card.appendChild(head);
  card.appendChild(el('div', {class:'qstem'}, q.stem));
  for (let i=0; i<q.choices.length; i++){
    const letter = String.fromCharCode(65+i);
    let cls = 'choice';
    if (eliminated && eliminated[i]) cls += ' eliminated';
    if (answered){
      if (i === q.correct) cls += ' correct';
      else if (i === pick) cls += ' incorrect';
    } else if (pick === i) cls += ' selected';
    const c = el('div', {class:cls},
      [el('div',{class:'letter'}, letter), el('div', null, q.choices[i])]);
    c.addEventListener('click', ev => {
      if (answered) return;
      onPick(i);
    });
    c.addEventListener('contextmenu', ev => {
      ev.preventDefault();
      if (!answered && onEliminate) onEliminate(i);
    });
    let pressTimer;
    c.addEventListener('touchstart', ()=> {pressTimer = setTimeout(()=>{if (!answered && onEliminate) onEliminate(i);}, 600);}, {passive:true});
    c.addEventListener('touchend', ()=> clearTimeout(pressTimer));
    c.addEventListener('touchmove', ()=> clearTimeout(pressTimer));

      if (t){
        refs.appendChild(el('button', {class:'badge guide', style:'cursor:pointer;border:none;font:inherit',

              if (det){det.open = true; det.scrollIntoView({behavior:'smooth', block:'start'});}}, 50);}},

    if (q.web_sources && q.web_sources.length){
      for (const w of q.web_sources){
        refs.appendChild(el('a', {href:w.url, target:'_blank', rel:'noopener', class:'badge web', title:w.title}, '🔗 ' + (w.title.length>40?w.title.slice(0,40)+'…':w.title)));

    if (q.notes) exp.appendChild(el('div', {class:'muted', style:'margin-top:.3rem;font-size:.85rem'}, q.notes));
    exp.appendChild(refs);
    card.appendChild(exp);
  }
  return card;
}

const EXAM_DURATION_SEC = 3 * 60 * 60;
const EXAM_LENGTH_DEFAULT = 100;

function renderExam(){
  const root = $('#view-exam'); root.innerHTML = '';
  if (!state.exam){
    root.appendChild(el('h2', null, 'Full Exam Simulation'));
    root.appendChild(el('div', {class:'card'}, [
      el('h3', null, 'Rules'),
      el('ul', null, [
        el('li', null, '3-hour countdown timer.'),
        el('li', null, '100 questions, weighted by domain. Difficulty adapts to your performance.'),
        el('li', null, 'No feedback until exam ends.'),
        el('li', null, 'Pass = 700 / 1000.'),
        el('li', null, 'Refresh-safe — your in-progress exam is saved automatically.'),
      ]),
      el('button', {class:'primary', onclick:startExam}, 'Begin exam'),
    ]));
    if (state.examHistory.length){
      const card = el('div', {class:'card'}, [el('h3', null, 'Recent attempts')]);
      for (const h of state.examHistory.slice(-5).reverse()){
        card.appendChild(el('div', {class:'row spread'}, [
          el('span', null, [el('span',{class:'badge ' + (h.pass?'guide':'web')}, h.pass?'PASS':'FAIL'), ' ', h.score+' / 1000']),
          el('span', {class:'muted'}, new Date(h.timestamp).toLocaleString() + ' • ' + fmtTime(h.duration)),
        ]));
      }
      root.appendChild(card);
    }
    return;
  }
  // Active exam
  const ex = state.exam;
  const elapsed = Math.floor((Date.now() - ex.started)/1000);
  const remaining = EXAM_DURATION_SEC - elapsed;
  if (remaining <= 0 || ex.finished){return finishExam();}
  const q = ex.questions[ex.idx];
  const pick = ex.picks[q.id];
  const answeredFlag = q.id in ex.picks;
  // Header line
  root.appendChild(el('div', {class:'row spread'}, [
    el('h2', {style:'margin:0'}, 'Exam'),
    el('div', {class:'row'}, [
      el('span', {class:'muted'}, 'Q ' + (ex.idx+1) + '/' + ex.questions.length),
      el('span', {class:'timer ' + (remaining<300?'danger':remaining<900?'warn':''),
        'aria-label':'Time remaining'}, fmtTime(remaining)),
    ]),
  ]));
  // Progress bar — current position (cyan) overlaid on answered count (green)
  const answeredCount = Object.keys(ex.picks).length;
  const flaggedCount = Object.keys(ex.flagged).filter(k => ex.flagged[k]).length;
  const posPct = (ex.idx + 1) / ex.questions.length * 100;
  const ansPct = answeredCount / ex.questions.length * 100;
  root.appendChild(el('div', {style:'margin:.4rem 0 .8rem'}, [
    el('div', {style:'height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;position:relative',
      role:'progressbar', 'aria-valuemin':'0', 'aria-valuemax':'100', 'aria-valuenow':String(Math.round(ansPct)),
      'aria-label':'Exam progress'}, [
      el('div', {style:'position:absolute;top:0;left:0;height:100%;background:var(--success);width:'+ansPct+'%;transition:width 200ms'}),
      el('div', {style:'position:absolute;top:0;left:0;height:100%;background:linear-gradient(90deg,transparent 0%,var(--accent) 100%);width:'+posPct+'%;mix-blend-mode:screen'}),
    ]),
    el('div', {class:'muted', style:'font-size:.75rem;margin-top:.25rem;display:flex;justify-content:space-between'}, [
      el('span', null, Math.round(ansPct) + '% answered (' + answeredCount + '/' + ex.questions.length + ')'),
      el('span', null, flaggedCount ? '★ ' + flaggedCount + ' flagged' : ''),
    ]),
  ]));
  // Question (no immediate feedback — we hide explanation)
  root.appendChild(buildQuestionCard(q, pick, false, ex.eliminated[q.id]||{},
    (i)=>{ ex.picks[q.id] = i; saveAll(); renderExam(); },
    (i)=>{ ex.eliminated[q.id] = ex.eliminated[q.id] || {}; ex.eliminated[q.id][i] = !ex.eliminated[q.id][i]; saveAll(); renderExam(); },
    true));
  // Controls
  root.appendChild(el('div', {class:'row spread'}, [
    el('button', {disabled: ex.idx===0?'true':false, onclick:()=>{ex.idx--; saveAll(); renderExam();}}, '◀ Prev'),
    el('div', {class:'row'}, [
      el('button', {class:ex.flagged[q.id]?'warn':'ghost',
        onclick:()=>{ex.flagged[q.id]=!ex.flagged[q.id]; saveAll(); renderExam();}}, ex.flagged[q.id]?'★ Flagged':'☆ Flag'),
      el('button', {class:'danger', onclick:()=>{ if (confirm('End the exam now?')) finishExam();}}, 'End exam'),
    ]),
    el('button', {class:'primary', disabled: ex.idx>=ex.questions.length-1?'true':false, onclick:()=>{ex.idx++; saveAll(); renderExam();}}, 'Next ▶'),
  ]));
  // Navigator
  const nav = el('div', {class:'qnav'});
  for (let i=0; i<ex.questions.length; i++){
    const qq = ex.questions[i];
    let cls = '';
    if (qq.id in ex.picks) cls += ' answered';
    if (ex.flagged[qq.id]) cls += ' flagged';
    if (i === ex.idx) cls += ' current';
    const b = el('button', {class:cls.trim(), onclick:()=>{ex.idx=i; saveAll(); renderExam();}}, String(i+1));
    nav.appendChild(b);
  }
  root.appendChild(nav);
  // Adaptive notice
  root.appendChild(el('div', {class:'muted', style:'margin-top:.5rem;font-size:.8rem'},
    'Difficulty adapts as you go (CAT). Refreshing the page resumes this attempt.'));
}

function startExam(){
  // Build adaptive question list weighted by domain percentage
  const total = EXAM_LENGTH_DEFAULT;
  const weights = DOMAINS.map(d => d.weight);
  const sumW = weights.reduce((a,b)=>a+b,0);
  const counts = DOMAINS.map((d,i) => Math.round(weights[i]/sumW * total));
  // adjust to exact total
  let diff = total - counts.reduce((a,b)=>a+b,0);
  for (let i=0; diff !== 0 && i < DOMAINS.length; i++){counts[i] += Math.sign(diff); diff -= Math.sign(diff);}
  let pool = [];
  for (let i=0; i<DOMAINS.length; i++){
    const dq = QUESTIONS.filter(q => q.domain === DOMAINS[i].id);
    pool = pool.concat(shuffle(dq).slice(0, Math.min(counts[i], dq.length)));
  }
  pool = shuffle(pool);
  state.exam = {
    started: Date.now(),
    questions: pool,
    picks: {},
    flagged: {},
    eliminated: {},
    idx: 0,
    finished: false,
    streak: 0,  // for adaptive logic (display only; bank already balanced)
  };
  saveAll();
  renderExam();
  // Per-second timer
  if (window.__examTick) clearInterval(window.__examTick);
  window.__examTick = setInterval(()=>{
    if (!state.exam || state.exam.finished){clearInterval(window.__examTick); return;}
    const v = $$('.view.active')[0];
    if (v && v.id === 'view-exam'){
      const elapsed = Math.floor((Date.now() - state.exam.started)/1000);
      const remaining = EXAM_DURATION_SEC - elapsed;
      const t = $('.timer'); if (t){t.textContent = fmtTime(remaining); t.className = 'timer ' + (remaining<300?'danger':remaining<900?'warn':'');}
      if (remaining <= 0) finishExam();
    }
  }, 1000);
}

function finishExam(){
  if (!state.exam) return;
  const ex = state.exam;
  ex.finished = true;
  let correct = 0;
  const perDomain = {}; for (const d of DOMAINS) perDomain[d.id] = {n:0, c:0};
  for (const q of ex.questions){
    perDomain[q.domain].n += 1;
    if (ex.picks[q.id] === q.correct){correct += 1; perDomain[q.domain].c += 1;}
    recordAnswer(q.id, ex.picks[q.id] === q.correct);
  }
  // Score: weighted-correct fraction × 1000, rounded.
  let weightedScore = 0; let weightSum = 0;
  for (const d of DOMAINS){
    const r = perDomain[d.id].n ? perDomain[d.id].c / perDomain[d.id].n : 0;
    weightedScore += r * d.weight;
    weightSum += d.weight;
  }
  const score = Math.round(weightedScore / weightSum * 1000);
  const pass = score >= 700;
  const duration = Math.floor((Date.now() - ex.started)/1000);
  const result = {timestamp: Date.now(), score, pass, duration, perDomain, qCount: ex.questions.length, correct};
  state.examHistory.push(result);
  state.exam = null;
  saveAll();
  if (window.__examTick){clearInterval(window.__examTick); window.__examTick = null;}
  showExamResult(result);
}

function highlightMatch(text, q){
  if (!q) return text;
  // Simple HTML-safe highlight
  const idx = text.toLowerCase().indexOf(q);
  if (idx < 0) return text;
  const span = el('span');
  span.appendChild(document.createTextNode(text.slice(0, idx)));
  const mark = el('mark', {style:'background:#ffd86b;color:#1a1100;padding:0 .15rem;border-radius:.15rem'},
    text.slice(idx, idx + q.length));
  span.appendChild(mark);
  span.appendChild(document.createTextNode(text.slice(idx + q.length)));
  return span;
}
function kickPracticeSessionForChapter(chNum, domain){
  // Build a session of questions whose chapter matches, falling back to domain
  let pool = QUESTIONS.filter(q => q.chapter === chNum);
  if (pool.length < 5) pool = QUESTIONS.filter(q => q.domain === domain);
  if (!pool.length){toast('No questions for this chapter','warn'); return;}
  const questions = shuffle(pool).slice(0, Math.min(20, pool.length));
  state.practice = {questions, idx:0, picks:{}, eliminated:{}, started:Date.now()};
  renderPracticeSession();
}

function flashState(id){
  return state.flash[id] || {ef:2.5, interval:0, reps:0, due: Date.now()};
}
function flashDueCount(){
  const now = Date.now();
  let n = 0;
  for (const card of FLASHCARDS){
    const s = flashState(card.id);
    if (s.due <= now) n += 1;
  }
  return n;
}
function gradeFlash(id, grade){
  // grade: 0=Again, 3=Hard, 4=Good, 5=Easy (SM-2 quality 0-5)
  const s = flashState(id);
  if (grade < 3){
    s.reps = 0; s.interval = 1;
  } else {
    if (s.reps === 0) s.interval = 1;
    else if (s.reps === 1) s.interval = 6;
    else s.interval = Math.round(s.interval * s.ef);
    s.reps += 1;
  }
  // Update easiness factor
  s.ef = Math.max(1.3, s.ef + (0.1 - (5-grade)*(0.08 + (5-grade)*0.02)));
  s.due = Date.now() + s.interval * 24 * 60 * 60 * 1000;
  state.flash[id] = s;
  save(LS.flashState, state.flash);
}

function buildFlashQueue(){
  const now = Date.now();
  __flashQueue = FLASHCARDS.filter(c => flashState(c.id).due <= now);
  __flashQueue = shuffle(__flashQueue);
  __flashIdx = 0; __flashRevealed = false;
}
function renderFlash(){
  const root = $('#view-flash'); root.innerHTML = '';
  if (!__flashQueue.length || __flashIdx >= __flashQueue.length) buildFlashQueue();
  const due = flashDueCount();
  const total = FLASHCARDS.length;
  root.appendChild(el('div', {class:'row spread'}, [
    el('h2', {style:'margin:0'}, 'Flashcards'),
    el('span', {class:'muted'}, due + ' due • ' + total + ' total'),
  ]));
  if (!__flashQueue.length){
    root.appendChild(el('div', {class:'card'}, [
      el('h3', null, 'No cards due'),
      el('div', null, 'Come back tomorrow for the next batch — or use the buttons below to study any card.'),
      el('button', {class:'primary', style:'margin-top:.6rem', onclick:()=>{__flashQueue = shuffle(FLASHCARDS); __flashIdx=0; __flashRevealed=false; renderFlash();}}, 'Browse all cards'),
    ]));
    return;
  }
  const card = __flashQueue[__flashIdx];
  const fc = el('div', {class:'flashcard', onclick:()=>{__flashRevealed = !__flashRevealed; renderFlash();}}, [
    el('div', {class:'muted mono', style:'font-size:.75rem'}, card.id + ' • D' + card.domain),
    el('div', {class:'term'}, card.term),
    __flashRevealed ? el('div', {class:'back'}, card.back) : el('div', {class:'muted'}, 'Tap to reveal'),
  ]);
  if (__flashRevealed){
    if (card.guide_pages && card.guide_pages.length){
      fc.appendChild(el('div', {class:'src-line'}, '📖 p. ' + card.guide_pages.join(', p. ')));
    } else if (card.web_url){
      fc.appendChild(el('div', {class:'src-line'}, [el('a', {href:card.web_url, target:'_blank', rel:'noopener'}, '🔗 source')]));
    } else {
      fc.appendChild(el('div', {class:'src-line'}, '📚 canonical CISSP topic'));
    }
  }
  root.appendChild(fc);
  if (__flashRevealed){
    root.appendChild(el('div', {class:'fc-actions'}, [
      el('button', {class:'again', onclick:()=>{gradeFlash(card.id, 0); __flashIdx++; __flashRevealed=false; renderFlash();}}, 'Again'),
      el('button', {class:'hard', onclick:()=>{gradeFlash(card.id, 3); __flashIdx++; __flashRevealed=false; renderFlash();}}, 'Hard'),
      el('button', {class:'good', onclick:()=>{gradeFlash(card.id, 4); __flashIdx++; __flashRevealed=false; renderFlash();}}, 'Good'),
      el('button', {class:'easy', onclick:()=>{gradeFlash(card.id, 5); __flashIdx++; __flashRevealed=false; renderFlash();}}, 'Easy'),
    ]));
  } else {
    root.appendChild(el('div', {style:'margin-top:.7rem'}, [
      el('button', {class:'primary', onclick:()=>{__flashRevealed = true; renderFlash();}}, 'Reveal answer'),
    ]));
  }
  root.appendChild(el('div', {class:'muted', style:'margin-top:.5rem;font-size:.8rem;text-align:center'},
    'Card ' + (__flashIdx+1) + ' of ' + __flashQueue.length + ' in this session'));
}

function renderCheat(){
  const root = $('#view-cheat'); root.innerHTML = '';
  root.appendChild(el('h2', null, 'Cheat Sheets'));
  root.appendChild(el('div', {class:'search-bar'}, [
    el('input', {id:'cheat-q', placeholder:'Search across cheat sheets and flashcards…', oninput:filterCheat}),
    el('button', {onclick:()=>{$('#cheat-q').value=''; filterCheat();}}, 'Clear'),
  ]));
  const container = el('div', {id:'cheat-container'});
  for (const c of CHEAT){
    const sheet = buildCheatSheet(c);
    container.appendChild(sheet);
  }
  root.appendChild(container);
}
function buildCheatSheet(c){
  const det = el('details', {class:'cheat'}, [
    el('summary', null, [
      el('span', null, [el('span',{class:'mono badge'}, 'D'+c.domain), ' ', c.name]),
      el('span', {class:'muted'}, c.weight + '%'),
    ]),
  ]);
  const body = el('div', {class:'body'});
  // Show domain-relevant flashcards (abbreviated content) for the cheat sheet
  const rel = FLASHCARDS.filter(f => f.domain === c.domain);
  for (const f of rel){
    const row = el('div', {style:'margin:.4rem 0;padding-bottom:.4rem;border-bottom:1px solid var(--border)'}, [
      el('div', {style:'font-weight:600'}, f.term),
      el('div', {class:'muted', style:'font-size:.92rem'}, f.back),
    ]);
    if (f.guide_pages && f.guide_pages.length){
      row.appendChild(el('span', {class:'badge guide', style:'margin-right:.3rem',
        onclick:()=>showSourceModal('Guide reference', '📖 p. ' + f.guide_pages.join(', p. ') + ' — ' + f.term, '')},
        '📖 p. ' + f.guide_pages.join(', p. ')));
    }
    if (f.web_url){
      row.appendChild(el('a', {class:'badge web', href:f.web_url, target:'_blank', rel:'noopener'}, '🔗 source'));
    }
    body.appendChild(row);
  }
  // Sources
  const srcdiv = el('div', {style:'margin-top:.6rem'}, [el('div', {class:'kpi-label'}, 'Top web sources')]);
  for (const s of c.sources){
    srcdiv.appendChild(el('div', null, [el('a', {href:s.url, target:'_blank', rel:'noopener'}, '🔗 ' + s.title)]));
  }
  body.appendChild(srcdiv);
  det.appendChild(body);
  return det;
}
function filterCheat(){
  const q = ($('#cheat-q').value || '').toLowerCase();
  const cont = $('#cheat-container'); cont.innerHTML = '';
  for (const c of CHEAT){
    let any = !q;
    const sheet = buildCheatSheet(c);
    if (q){
      const text = sheet.textContent.toLowerCase();
      if (text.includes(q)){any = true; sheet.open = true;}
    }
    if (any) cont.appendChild(sheet);
  }
}
function showSourceModal(title, body, url){
  $('#modal-body').innerHTML = '';
  $('#modal-body').appendChild(el('h3', null, title));
  $('#modal-body').appendChild(el('div', null, body));
  if (url) $('#modal-body').appendChild(el('a', {href:url, target:'_blank', rel:'noopener'}, '🔗 Open source'));
  $('#modal').classList.add('show');
}

function renderStats(){
  const root = $('#view-stats'); root.innerHTML = '';
  root.appendChild(el('h2', null, 'Stats / History'));
  // Accuracy over time (line chart from exam history)
  if (state.examHistory.length){
    const card = el('div', {class:'card'}, [el('h3', null, 'Exam scores over time')]);
    card.appendChild(buildLineSvg(state.examHistory.map(h=>h.score), 0, 1000));
    root.appendChild(card);
  }
  // Heatmap by domain
  const m = masteryByDomain();
  const heatCard = el('div', {class:'card'}, [el('h3', null, 'Per-domain accuracy heatmap')]);
  const grid = el('div', {class:'heatmap'});
  for (const d of DOMAINS){
    const dm = m[d.id];
    const acc = dm.seen ? dm.correct/dm.seen : 0;
    const hue = Math.round(acc * 130); // red→green
    const cell = el('div', {class:'cell', style:'background:hsl('+hue+',60%,'+(20+acc*25)+'%)'},
      'D'+d.id+' '+(dm.seen?Math.round(100*acc)+'%':'—'));
    grid.appendChild(cell);
  }
  heatCard.appendChild(grid);
  root.appendChild(heatCard);
  // Exam history table
  const histCard = el('div', {class:'card'}, [el('h3', null, 'Exam history')]);
  if (!state.examHistory.length){
    histCard.appendChild(el('div', {class:'muted'}, 'No exam attempts yet.'));
  } else {
    for (const h of [...state.examHistory].reverse()){
      histCard.appendChild(el('div', {class:'row spread', style:'margin:.3rem 0'}, [
        el('span', null, [
          el('span', {class:'badge ' + (h.pass?'guide':'web')}, h.pass?'PASS':'FAIL'),
          ' ', h.score+' / 1000 ',
          el('span', {class:'muted'}, '• ' + h.correct + '/' + h.qCount),
        ]),
        el('span', {class:'muted'}, new Date(h.timestamp).toLocaleString() + ' • ' + fmtTime(h.duration)),
      ]));
    }
  }
  root.appendChild(histCard);
  // Cloud sync (Supabase)
  const syncCard = el('div', {class:'card'}, [el('h3', null, 'Cloud sync')]);
  const syncId = localStorage.getItem(LS.syncId);
  const syncLast = localStorage.getItem(LS.syncLast);
  if (!syncId){
    syncCard.appendChild(el('div', {class:'muted', style:'margin-bottom:.5rem'},
      'Set a passphrase (8+ chars) to back up progress to Supabase. Use the same passphrase on other devices to sync. The passphrase never leaves the device — only its SHA-256 hash is stored.'));
    syncCard.appendChild(el('input', {type:'password', placeholder:'Sync passphrase (8+ chars, memorable)', id:'sync-pw', autocomplete:'new-password'}));
    syncCard.appendChild(el('button', {class:'primary', style:'margin-top:.5rem', id:'sync-enable',
      onclick:async()=>{
        const v = ($('#sync-pw').value || '').trim();
        if (v.length < 8){toast('Use at least 8 characters', 'warn'); return;}
        $('#sync-enable').disabled = true;
        try {await setupSync(v);} catch(e){toast('Setup failed: '+e.message, 'danger');}
      }}, '☁ Enable sync (pulls existing data first)'));
  } else {
    syncCard.appendChild(el('div', {class:'muted mono', style:'font-size:.78rem;word-break:break-all'},
      'Sync ID: ' + syncId.slice(0,16) + '…'));
    if (syncLast){
      syncCard.appendChild(el('div', {class:'muted', style:'font-size:.85rem;margin-top:.2rem'},
        'Last sync: ' + new Date(syncLast).toLocaleString()));
    } else {
      syncCard.appendChild(el('div', {class:'muted', style:'font-size:.85rem;margin-top:.2rem'},
        'Not yet synced.'));
    }
    syncCard.appendChild(el('div', {class:'row', style:'margin-top:.6rem'}, [
      el('button', {class:'primary', id:'sync-btn', onclick:()=>syncNow(false)}, '⟳ Sync now (pull → merge → push)'),
      el('button', {class:'ghost', onclick:()=>{
        if (!confirm('Forget local sync passphrase? Cloud data is unaffected; you can re-enable sync with the same passphrase later.')) return;
        localStorage.removeItem(LS.syncId); localStorage.removeItem(LS.syncLast);
        toast('Disconnected from cloud sync.','warn');
        renderStats();
      }}, 'Disconnect'),
    ]));
  }
  root.appendChild(syncCard);
  // Data management
  root.appendChild(el('div', {class:'card'}, [

          document.body.classList.toggle('light', e.target.checked); save(LS.prefs, state.prefs);}}),
      'Light mode',
    ]),
  ]));
}

function buildLineSvg(values, ymin, ymax){
  const W = 600, H = 220, P = 30;
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', '0 0 '+W+' '+H);
  svg.setAttribute('class', 'line-chart');
  // axes
  const ax = document.createElementNS(ns, 'g');
  for (let i=0; i<=4; i++){
    const y = P + (H-2*P) * i/4;
    const v = Math.round(ymax - (ymax-ymin)*i/4);
    const ln = document.createElementNS(ns, 'line');
    ln.setAttribute('x1', P); ln.setAttribute('x2', W-P/2);
    ln.setAttribute('y1', y); ln.setAttribute('y2', y);
    ln.setAttribute('stroke', 'rgba(255,255,255,.07)');
    ax.appendChild(ln);
    const t = document.createElementNS(ns, 'text');
    t.setAttribute('x', P-4); t.setAttribute('y', y+3);
    t.setAttribute('text-anchor', 'end'); t.setAttribute('font-size', '10');
    t.setAttribute('fill', '#9ca3af'); t.textContent = String(v);
    ax.appendChild(t);
  }
  svg.appendChild(ax);
  // pass line
  const passY = P + (H-2*P) * (1 - (700-ymin)/(ymax-ymin));
  const passLn = document.createElementNS(ns, 'line');
  passLn.setAttribute('x1', P); passLn.setAttribute('x2', W-P/2);
  passLn.setAttribute('y1', passY); passLn.setAttribute('y2', passY);
  passLn.setAttribute('stroke', '#10b981'); passLn.setAttribute('stroke-dasharray', '3 4');
  svg.appendChild(passLn);
  // line
  if (values.length > 0){
    const xs = values.length > 1 ? (W - 2*P) / (values.length - 1) : 0;
    let path = '';
    for (let i=0; i<values.length; i++){
      const x = P + i*xs;
      const y = P + (H - 2*P) * (1 - (values[i] - ymin)/(ymax - ymin));
      path += (i===0?'M':'L') + x + ' ' + y + ' ';
      const c = document.createElementNS(ns, 'circle');
      c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', '3.5');
      c.setAttribute('fill', '#00d4ff');
      svg.appendChild(c);
    }
    const pl = document.createElementNS(ns, 'path');
    pl.setAttribute('d', path);
    pl.setAttribute('fill', 'none'); pl.setAttribute('stroke', '#00d4ff'); pl.setAttribute('stroke-width', '2');
    svg.appendChild(pl);
  } else {
    const t = document.createElementNS(ns, 'text');
    t.setAttribute('x', W/2); t.setAttribute('y', H/2);
    t.setAttribute('text-anchor', 'middle'); t.setAttribute('fill', '#9ca3af');
    t.textContent = 'No exam data yet';
    svg.appendChild(t);
  }
  return svg;
}

function exportData(){
  const blob = {
    exported: new Date().toISOString(),
    progress: state.progress,
    bookmarks: state.bookmarks,
    flash: state.flash,
    examHistory: state.examHistory,
    streak: state.streak,
    prefs: state.prefs,
  };
  const data = new Blob([JSON.stringify(blob, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(data);
  a.download = 'cissp-progress-' + todayStr().replace(/-/g,'') + '.json';
  a.click();
}
function importData(ev){
  const f = ev.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = e => {
    try {
      const obj = JSON.parse(e.target.result);
      if (!confirm('Replace ALL local data with imported data?')) return;
      state.progress = obj.progress || {};
      state.bookmarks = obj.bookmarks || {};
      state.flash = obj.flash || {};
      state.examHistory = obj.examHistory || [];
      state.streak = obj.streak || {last:null,count:0};
      state.prefs = obj.prefs || state.prefs;
      saveAll();
      toast('Imported.','success');
      renderStats();
    } catch (e){ alert('Invalid JSON: ' + e.message); }
  };
  r.readAsText(f);
}
function resetData(){
  if (!confirm('Wipe ALL local progress, bookmarks, flashcard state, and exam history?')) return;
  if (!confirm('Are you SURE? This cannot be undone.')) return;
  for (const k of Object.values(LS)){if (k !== LS.unlocked) localStorage.removeItem(k);}
  state.progress = {}; state.bookmarks = {}; state.flash = {};
  state.examHistory = []; state.streak = {last:null,count:0}; state.exam = null;
  toast('All data reset.','warn');
  go('dashboard');
}

// ============================================================================
// SUPABASE SYNC (pull → merge → push)
// ============================================================================
function snapshotLocal(){
  return {
    progress: state.progress,
    bookmarks: state.bookmarks,
    flash: state.flash,
    examHistory: state.examHistory,
    streak: state.streak,
    prefs: state.prefs,
  };
}
function mergeData(local, remote){
  if (!remote) return local;
  if (!local) return remote;
  // Progress: take entry with higher seen count; max counters; later lastSeen
  const progress = {};
  const pids = new Set([...Object.keys(local.progress||{}), ...Object.keys(remote.progress||{})]);
  for (const id of pids){
    const a = local.progress[id], b = remote.progress[id];
    if (!a) progress[id] = b;
    else if (!b) progress[id] = a;
    else progress[id] = {
      seen: Math.max(a.seen||0, b.seen||0),
      correct: Math.max(a.correct||0, b.correct||0),
      lastSeen: Math.max(a.lastSeen||0, b.lastSeen||0),
    };
  }
  // Bookmarks: union (true wins)
  const bookmarks = {};
  for (const id in (local.bookmarks||{})) if (local.bookmarks[id]) bookmarks[id] = true;
  for (const id in (remote.bookmarks||{})) if (remote.bookmarks[id]) bookmarks[id] = true;
  // Flash: take the entry with higher reps (more SM-2 progress); fall back to later due
  const flash = {};
  const fids = new Set([...Object.keys(local.flash||{}), ...Object.keys(remote.flash||{})]);
  for (const id of fids){
    const a = local.flash[id], b = remote.flash[id];
    if (!a) flash[id] = b;
    else if (!b) flash[id] = a;
    else if ((a.reps||0) !== (b.reps||0)) flash[id] = (a.reps > b.reps) ? a : b;
    else flash[id] = ((a.due||0) > (b.due||0)) ? a : b;
  }
  // Exam history: union by timestamp
  const seen = new Set();
  const examHistory = [];
  for (const h of [...(local.examHistory||[]), ...(remote.examHistory||[])]){
    if (h && h.timestamp != null && !seen.has(h.timestamp)){
      seen.add(h.timestamp);
      examHistory.push(h);
    }
  }
  examHistory.sort((a,b) => a.timestamp - b.timestamp);
  // Streak: max count, take latest 'last' date string
  const a = local.streak||{last:null,count:0}, b = remote.streak||{last:null,count:0};
  const streak = {
    last: ((a.last||'') > (b.last||'')) ? a.last : b.last,
    count: Math.max(a.count||0, b.count||0),
  };
  // Prefs: shallow merge, local wins for keys it has
  const prefs = Object.assign({}, remote.prefs||{}, local.prefs||{});
  return {progress, bookmarks, flash, examHistory, streak, prefs};
}
async function pullRemote(){
  const id = localStorage.getItem(LS.syncId);
  if (!id) throw new Error('Sync not set up');
  const url = SUPABASE_URL + '/rest/v1/' + SYNC_TABLE + '?sync_id=eq.' + id + '&select=data,updated_at';
  const r = await fetch(url, {
    headers: {apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY},
  });
  if (!r.ok){
    const txt = await r.text();
    throw new Error('Pull HTTP ' + r.status + ': ' + txt.slice(0,200));
  }
  const rows = await r.json();
  return rows.length ? rows[0] : null;
}
async function pushRemote(merged){
  const id = localStorage.getItem(LS.syncId);
  if (!id) throw new Error('Sync not set up');
  const url = SUPABASE_URL + '/rest/v1/' + SYNC_TABLE + '?on_conflict=sync_id';
  const body = JSON.stringify({sync_id: id, data: merged, updated_at: new Date().toISOString()});
  const r = await fetch(url, {
    method: 'POST',
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json',
      Prefer: 'resolution=merge-duplicates,return=minimal',
    },
    body,
  });
  if (!r.ok){
    const txt = await r.text();
    throw new Error('Push HTTP ' + r.status + ': ' + txt.slice(0,200));
  }
}
async function setupSync(plaintextId){
  if (!plaintextId || plaintextId.length < 8) throw new Error('Pick a passphrase of 8+ characters');
  const id = await sha256(plaintextId);
  localStorage.setItem(LS.syncId, id);
  await syncNow(true);
}
let __syncInFlight = false;
async function syncNow(initial){
  if (__syncInFlight) return;
  if (!localStorage.getItem(LS.syncId)){toast('Set up sync first','warn'); return;}
  __syncInFlight = true;
  const btn = $('#sync-btn'); if (btn) btn.disabled = true;
  try {
    toast('Pulling remote…');
    const remote = await pullRemote();
    const local = snapshotLocal();
    const merged = mergeData(local, remote ? remote.data : null);
    state.progress = merged.progress;
    state.bookmarks = merged.bookmarks;
    state.flash = merged.flash;
    state.examHistory = merged.examHistory;
    state.streak = merged.streak;
    state.prefs = Object.assign({}, state.prefs, merged.prefs);
    saveAll();
    toast('Pushing merged data…');
    await pushRemote(merged);
    localStorage.setItem(LS.syncLast, new Date().toISOString());
    toast(initial ? 'Sync enabled — data merged' : 'Sync complete', 'success');
  } catch (e) {
    toast('Sync failed: ' + e.message, 'danger');
    console.error(e);
  } finally {
    __syncInFlight = false;
    if (btn) btn.disabled = false;
    renderStats();
  }
}

// KEYBOARD
// ============================================================================
function onKey(e){
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT')) return;
  const v = $$('.view.active')[0]; if (!v) return;
  if (v.id === 'view-practice' && state.practice && state.practice.questions){
    const s = state.practice;
    const q = s.questions[s.idx];
    if (e.key >= '1' && e.key <= '4'){
      const idx = parseInt(e.key) - 1;
      if (!(q.id in s.picks)){
        s.picks[q.id] = idx; recordAnswer(q.id, idx === q.correct); tickStreak(); saveAll(); renderPracticeSession();
      }
    } else if (e.key === 'ArrowRight' || e.key === 'Enter'){
      if (s.idx < s.questions.length-1){s.idx++; renderPracticeSession();}
    } else if (e.key === 'ArrowLeft'){
      if (s.idx > 0){s.idx--; renderPracticeSession();}
    } else if (e.key === 'b' || e.key === 'B'){
      state.bookmarks[q.id] = !state.bookmarks[q.id]; save(LS.bookmarks, state.bookmarks); renderPracticeSession();
    } else if (e.key === '?'){
      showSourceModal('Practice shortcuts', '1-4 select choice • Enter / → next • ← prev • B bookmark • ? this help');
    }
  } else if (v.id === 'view-exam' && state.exam){
    const ex = state.exam;
    const q = ex.questions[ex.idx];
    if (e.key >= '1' && e.key <= '4'){
      const idx = parseInt(e.key) - 1;
      ex.picks[q.id] = idx; saveAll(); renderExam();
    } else if (e.key === 'ArrowRight' || e.key === 'Enter'){
      if (ex.idx < ex.questions.length-1){ex.idx++; saveAll(); renderExam();}
    } else if (e.key === 'ArrowLeft'){
      if (ex.idx > 0){ex.idx--; saveAll(); renderExam();}
    } else if (e.key === 'f' || e.key === 'F'){
      ex.flagged[q.id] = !ex.flagged[q.id]; saveAll(); renderExam();
    }
  }
}

function bindSwipe(){
  let sx=0, sy=0, t=0;
  document.addEventListener('touchstart', e=>{const t0 = e.changedTouches[0]; sx=t0.clientX; sy=t0.clientY; t=Date.now();}, {passive:true});
  document.addEventListener('touchend', e=>{
    const t0 = e.changedTouches[0];
    const dx = t0.clientX - sx, dy = t0.clientY - sy, dt = Date.now()-t;
    if (dt > 700 || Math.abs(dy) > 80) return;
    if (Math.abs(dx) < 60) return;
    const v = $$('.view.active')[0]; if (!v) return;
    if (v.id === 'view-practice' && state.practice){
      const s = state.practice;
      if (dx < 0 && s.idx < s.questions.length-1){s.idx++; renderPracticeSession();}
      else if (dx > 0 && s.idx > 0){s.idx--; renderPracticeSession();}
    }
  }, {passive:true});
}

// ============================================================================
// BOOT
// ============================================================================
function boot(){
  $('#gate').style.display = 'none';
  $('#app').style.display = 'flex';
  load();
  // Wire nav
  $$('nav.bottom button').forEach(b => b.addEventListener('click', ()=>go(b.dataset.view)));
  // Wire modal close
  $('#modal').addEventListener('click', e=>{if (e.target.id === 'modal') $('#modal').classList.remove('show');});
  // Resume in-progress exam timer
  if (state.exam && !state.exam.finished){
    if (window.__examTick) clearInterval(window.__examTick);
    window.__examTick = setInterval(()=>{
      if (!state.exam || state.exam.finished){clearInterval(window.__examTick); return;}
      const v = $$('.view.active')[0];
      if (v && v.id === 'view-exam') renderExam();
    }, 1000);
  }
  go('dashboard');
  document.addEventListener('keydown', onKey);
  bindSwipe();
  checkStreakWarning();
}

// ============================================================================
// INIT
// ============================================================================
window.addEventListener('DOMContentLoaded', ()=>{
  if (localStorage.getItem(LS.unlocked) === '1'){boot(); return;}
  $('#pw-form').addEventListener('submit', e=>{e.preventDefault(); tryUnlock();});
  $('#pw').focus();
});

})();
</script>
</body>
</html>
